                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({con_PopupConfirmSubmit:false})
                  varConfirmDialogAction: "=// ============================================================\n// 1. Tắt popup xác nhận, hiện popup loading\n// ============================================================\nUpdateContext({con_PopupConfirmSubmit: false});\nUpdateContext({varShowPopupProcessing: true});\n\n\n// ============================================================\n// 2. Khởi tạo collection chứa ID cần reset cho từng bảng\n//    - col_ResetStockCountIDs      : payload cho 'QLK List Stock Count Details'\n//    - col_ResetInventoryDetailIDs : payload cho 'QLK List Inventory Details'\n// ============================================================\nConcurrent(\n    Clear(col_ResetStockCountIDs),\n    Clear(col_ResetInventoryDetailIDs)\n);\n\n\n// ============================================================\n// 3. Build payload reset\n//    Chỉ xử lý các dòng được chọn có NeedRecount = true\n//    (các dòng cần kiểm kê lại)\n// ============================================================\nForAll(\n    Filter(col_SelectedItems, NeedRecount) As selected,\n    Concurrent(\n\n        // 3.1 Reset bản ghi kiểm kê:\n        //     - Bỏ đánh dấu đã tổng hợp (IsSummarized = false)\n        //     - Đưa trạng thái về bước đầu của workflow (Index 1)\n        ForAll(\n            Split(selected.IDStockCountDetails, \";\") As idItem,\n            If(\n                !IsBlank(idItem.Value),\n                 Collect(\n                            col_ResetStockCountIDs,\n                            {\n                                ID: Value(idItem.Value),\n                                IsSummarized: false,\n                                StatusCode: Index(col_WorkflowStatus, 1).StatusCode\n                            }\n                        )\n            )\n        )\n        \n        ,\n\n        // 3.2 Reset bản ghi tồn kho:\n        //     - Bỏ đánh dấu đã tổng hợp (IsSummarized = false)\n        //     - Bỏ cờ isFlag để có thể được tổng hợp lại\n        Collect(\n            col_ResetInventoryDetailIDs,\n            {\n                ID: selected.IDInventoryDetails,\n                IsSummarized: false,\n                isFlag: false\n            }\n        )\n    )\n);\n\n\n// ============================================================\n// 4. Ghi dữ liệu lên SharePoint\n//    Bulk update IsSummarized = false (2 calls cố định,\n//    chạy song song thay vì Patch từng record)\n// ============================================================\nConcurrent(\n    Patch('QLK List Stock Count Details', col_ResetStockCountIDs),\n    Patch('QLK List Inventory Details', col_ResetInventoryDetailIDs)\n);\n\n\n// ============================================================\n// 5. Xóa các dòng cần kiểm lại khỏi bảng tổng hợp Variance\n//    (chỉ xóa những dòng NeedRecount = true)\n// ============================================================\nRemove(\n    'QLK List Stock Count Variance',\n    Filter(col_SelectedItems, NeedRecount)\n);\n\n\n// ============================================================\n// 6. Dọn dẹp sau khi hoàn tất\n// ============================================================\nUpdateContext({varShowPopupProcessing: false});   // Ẩn loading\nClear(col_SelectedItems);                         // Xóa danh sách đã chọn"
                  varLabel: ="Bạn có chắc muốn yêu cầu người kiểm kê kiểm lại phiếu này không?"
                  varTitle: ="Yêu cầu kiểm lại"
      - con_PopupGuiDuyetDanhMucChenhLech:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowPopupSubmitDifferenceApproval
            Width: =Parent.Width
          Children:
            - DialogAlertGuiDuyetDanhMucChenhLech:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowPopupSubmitDifferenceApproval:false})
                  varConfirmDialogAction: |
                    =// Tắt popup xác nhận, hiện loading
                    UpdateContext({varShowPopupSubmitDifferenceApproval: false});
                    UpdateContext({varShowPopupProcessing: true});

                    // Xóa collection trước khi build để tránh dữ liệu cũ
                    Clear(col_UpdateStockCountVariance);
                    // Lấy các dòng được chọn có NeedRecount = false → cập nhật StatusCode sang bước tiếp theo
                    ForAll(
                        col_SelectedItems As selected,
                        Collect(
                            col_UpdateStockCountVariance,
                            {
                                ID:         selected.ID,
                                StatusCode: Index(col_WorkflowStatus, 2).StatusCode   // Trạng thái bước 2 trong workflow
                            }
                        );

                    );

                    // Bulk update 1 lần thay vì patch từng record
                    Patch('QLK List Stock Count Variance', col_UpdateStockCountVariance);

                    //send mail 
                    'QLK|SendVarianceApprovalNotification'.Run(varUserInPlant.PlantCode,varUserInPlant.PlantName,"",Text(dp_FilterNgayKiemNXTDanhMucChenhLech.SelectedDate, "yyyy-mm-dd"));

                    // Ẩn loading sau khi hoàn tất
                    UpdateContext({varShowPopupProcessing: false});

                    Clear(col_SelectedItems);
                  varLabel: ="Bạn có chắc chắn muốn gửi duyệt danh mục chênh lệch này không?"
                  varTitle: ="Xác nhận gửi duyệt"
      - con_PopupDuyetDanhMucChenhLech:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowPopupApproveDifference
            Width: =Parent.Width
          Children:
            - DialogAlertDuyetDanhMucChenhLech:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowPopupApproveDifference:false})
                  varConfirmDialogAction: |-
                    =// ── Đóng popup xác nhận, hiện popup loading ──────────────────────────────────
                    UpdateContext({varShowPopupApproveDifference: false});
                    UpdateContext({varShowPopupProcessing: true});


                    // ── Chuẩn bị collection payload để bulk update Variance ──────────────────────
                    Concurrent(
                        Clear(col_UpdateStockCountVariance),   // Xóa dữ liệu cũ trước khi build lại
                        Clear(col_UpdateItemsInventoryDetail),
                        Clear(col_updateStatusInventory),
                        Clear(col_updateStatusInventoryDistinct)
                    );


                    // Chỉ duyệt các dòng KHÔNG cần kiểm lại (NeedRecount = false)
                    // → chuyển StatusCode sang "Đã phê duyệt"
                    ForAll(
                        col_SelectedItems As selected,
                        Concurrent(
                            Collect(
                                col_UpdateStockCountVariance,
                                {
                                    ID: selected.ID,
                                    StatusCode: Index(col_WorkflowStatus, 4).StatusCode
                                }
                            ),
                            Collect(
                                col_updateStatusInventory,
                                {
                                    ID: selected.IDInventory
                                }
                            ),
                            Collect(
                                col_UpdateItemsInventoryDetail,
                                {
                                    ID: Value(selected.IDInventoryDetails),
                                    ActualQty: selected.ActualQty,
                                    IsDateVarianceChecked: If(selected.VarianceQty <> 0, true, false),
                                    PlantCode: selected.PlantCode,
                                    InventoryDate: selected.StockCountDate,
                                    ProductCategoryCode: selected.ProductTypeCode,
                                    SAPCode: selected.SAPCode,
                                    BookQty: selected.BookQty
                                }
                            )
                        )
                    );


                    ClearCollect(
                        col_DistinctInventory,
                        Distinct(col_updateStatusInventory, ID)
                    );


                    ForAll(
                        col_DistinctInventory As item,
                        Collect(
                            col_updateStatusInventoryDistinct,
                            {
                                ID: item.Value,
                                IsSubmittedForApproval: true
                            }
                        )
                    );


                    // ── Ghi dữ liệu lên SharePoint ────────────────────────────────────────────────
                    // Bulk update 1 lần thay vì Patch từng record → giảm số lệnh gọi SharePoint
                    Concurrent(
                        Patch('QLK List Stock Count Variance', col_UpdateStockCountVariance),
                        Patch('QLK List Inventory', col_updateStatusInventoryDistinct)
                    );

                    'QLK|UpdateInventoryDetailsonVarianceApproved'.Run(JSON(col_UpdateItemsInventoryDetail),varUserInPlant.PlantCode,varUserInPlant.ProductCategoryCode);


                    // ── Dọn dẹp sau khi hoàn tất ──────────────────────────────────────────────────
                    UpdateContext({varShowPopupProcessing: false});   // Ẩn loading
                    Clear(col_SelectedItems);                         // Xóa danh sách đã chọn
                  varLabel: ="Bạn có chắc chắn muốn duyệt danh mục chênh lệch này không?"
                  varTitle: ="Xác nhận duyệt"
      - con_PopupSendDanhMucChenhLechXNT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =con_PopupConfirmSubmitXNT
            Width: =Parent.Width
          Children:
            - DialogAlertSendDanhMucChenhLech_1:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({con_PopupConfirmSubmitXNT:false})
                  varConfirmDialogAction: |-
                    =// ============================================================
                    // 1. Tắt popup xác nhận, hiện popup loading
                    // ============================================================
                    UpdateContext({con_PopupConfirmSubmitXNT: false});
                    UpdateContext({varShowPopupProcessing: true});


                    // ============================================================
                    // 2. Khởi tạo collection
                    //    - col_ResetInventoryDetailIDs : payload cho 'QLK List Inventory Details'
                    //    - col_RawInventoryIDs         : payload cho 'QLK List Inventory' (ID cha, có thể trùng)
                    // ============================================================
                    Clear(col_ResetInventoryDetailIDs);
                    Clear(col_RawInventoryIDs);


                    // ============================================================
                    // 3. Nạp trước Inventory Details
                    //    Thu hẹp theo PlantCode + ngày tồn kho (hôm qua)
                    //    → giảm số dòng tải về, tránh delegation warning
                    // ============================================================
                    ClearCollect(
                        col_InventoryDetailsLookup,
                        Filter(
                            'QLK List Inventory Details',
                            PlantCode = varUserInPlant.PlantCode,
                            InventoryDate = DateAdd(Today(), -1, TimeUnit.Days)
                        )
                    );


                    // ============================================================
                    // 4. Bước 1: Tách ID chi tiết + ID cha (có thể trùng)
                    //    Chỉ xử lý các dòng được chọn có NeedRecount = true
                    // ============================================================
                    ForAll(
                        Filter(col_SelectedItems, NeedRecount) As selected,
                        Concurrent(

                            // 4.1 Payload reset Inventory Details:
                            //     bỏ đánh dấu đã tổng hợp (IsSummarized = false)
                            Collect(
                                col_ResetInventoryDetailIDs,
                                {
                                    ID: selected.IDInventoryDetails,
                                    IsSummarized: false,
                                    isFlag: true
                                }
                            ),

                            // 4.2 Payload cập nhật Inventory (ID cha):
                            //     đưa StatusCode về bước đầu của workflow (Index 1)
                            Collect(
                                col_RawInventoryIDs,
                                {
                                    ID: selected.IDInventory,
                                    StatusCode: Index(col_WorkflowStatus, 1).StatusCode
                                }
                            )

                            // 4.3 Tách ID kiểm kê từ chuỗi "id1;id2;id3"
                            //     bỏ qua giá trị rỗng, rồi reset IsSummarized = false
                           /* ForAll(
                                Split(selected.IDStockCountDetails, ";") As idItem,
                                If(
                                    !IsBlank(idItem.Value),
                                    Collect(
                                        col_ResetStockCountIDs,
                                        {
                                            ID: Value(idItem.Value),
                                            IsSummarized: false
                                        }
                                    )
                                )
                            )*/
                        )
                    );


                    // ============================================================
                    // 5. Bulk update lên SharePoint
                    //    Ghi song song 3 list bằng Concurrent
                    // ============================================================
                    Concurrent(
                        Patch('QLK List Inventory Details', col_ResetInventoryDetailIDs),
                        //Patch('QLK List Stock Count Details', col_ResetStockCountIDs),
                        Patch('QLK List Inventory', col_RawInventoryIDs)
                    );


                    // ============================================================
                    // 6. Xóa các dòng cần kiểm lại khỏi bảng tổng hợp Variance
                    // ============================================================
                    Remove(
                        'QLK List Stock Count Variance',
                        Filter(col_SelectedItems, NeedRecount)
                    );


                    // ============================================================
                    // 7. Dọn dẹp sau khi hoàn tất
                    // ============================================================
                    UpdateContext({varShowPopupProcessing: false});   // Ẩn loading
                    Clear(col_SelectedItems);                         // Xóa danh sách đã chọn
                  varLabel: ="Bạn có chắc muốn yêu cầu kiểm lại phiếu này không?"
                  varTitle: ="Yêu cầu kiểm lại"
