Screens:
  scrDanhMucChenhLech:
    Properties:
      OnVisible: |-
        =Clear(col_SelectedItems);
        varShowMenuUser && scrDanhMucChenhLech.Size <> 1
    Children:
      - con_MainNXTDanhMucChenhLech:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderNXTDanhMucChenhLech:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderNXTDanhMucChenhLech:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrNXTDanhMucChenhLech.Size
            - con_BodyNXTDanhMucChenhLech:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderNXTDanhMucChenhLech.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_MenuNXTDanhMucChenhLech:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =scrNXTDanhMucChenhLech.Size <> 1
                        Width: =If(varShowMenuUser, 240, 0)
                      Children:
                        - cmp_NavSidebarNXTDanhMucChenhLech:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_ContentNXTDanhMucChenhLech:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: |-
                          =If(
                              scrNXTDanhMucChenhLech.Size = 1,
                              DropShadow.Semibold,
                              DropShadow.None
                          )
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                        RadiusTopRight: =0
                      Children:
                        - con_ActionHeaderNXTDanhMucChenhLech:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - btn_ThemDanhMucChenhLech:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(200, 60, 60, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Add"
                                    OnSelect: |-
                                      =UpdateContext({varShowChenhLechNgay :true});
                                      Reset(dp_CLNNgay);
                                      Reset(cbx_CLNLoaiSP);
                                    Size: =fxFontSizeMD
                                    Text: ="Thêm"
                                    Visible: =varUserInPlant.Role = Index(col_RoleUser,9).RoleCode || varUserInPlant.Role = Index(col_RoleUser,2).RoleCode
                                    Width: =90
                              - btn_RefreshNXTDanhMucChenhLech:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="ArrowSync"
                                    OnSelect: |-
                                      =Refresh('QLK List Stock Count Variance');
                                      Refresh('QLK List Production Receipt Details');
                                      Refresh('QLK List Issue Detail');
                                      Refresh('QLK List Stock Count Details');
                                      Refresh('QLK List Inventory Details');
                                    Size: =fxFontSizeMD
                                    Text: ="Làm mới"
                                    Width: =120
                              - btn_KiemLaiDanhMucChenhLech:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(200, 60, 60, 1)
                                    Font: =fxFontFamily
                                    Icon: ="ArrowUndo"
                                    OnSelect: =UpdateContext({con_PopupConfirmSubmitXNT:true})
                                    Size: =fxFontSizeMD
                                    Text: ="Kiểm lại XNT"
                                    Visible: |+
                                      =CountRows(Filter(col_SelectedItems,NeedRecount,StatusCode = Index(col_WorkflowStatus,1).StatusCode)) > 0
                                    Width: =140
                              - btn_KiemLaiDanhMucChenhLech_1:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(200, 60, 60, 1)
                                    Font: =fxFontFamily
                                    Icon: ="ArrowUndo"
                                    OnSelect: =UpdateContext({con_PopupConfirmSubmit:true})
                                    Size: =fxFontSizeMD
                                    Text: ="Kiểm kê lại"
                                    Visible: =CountRows(Filter(col_SelectedItems,NeedRecount,StatusCode = Index(col_WorkflowStatus,1).StatusCode)) > 0
                                    Width: =140
                              - btn_GuiDuyetDanhMucChenhLech:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(200, 60, 60, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Send"
                                    OnSelect: =UpdateContext({varShowPopupSubmitDifferenceApproval:true})
                                    Size: =fxFontSizeMD
                                    Text: ="Gửi duyệt"
                                    Visible: |-
                                      =// Kiểm tra có dòng nào đang ở trạng thái "nháp" không
                                      //CountRows(Filter(col_SelectedItems, StatusCode = Index(col_WorkflowStatus, 1).StatusCode)) > 0
                                    Width: =120
                              - btn_DuyetDanhMucChenhLech:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(200, 60, 60, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Send"
                                    OnSelect: =UpdateContext({varShowPopupApproveDifference:true})
                                    Size: =fxFontSizeMD
                                    Text: ="Duyệt"
                                    Visible: |-
                                      =// Kiểm tra có dòng nào đang ở trạng thái "chờ phê duyệt" không
                                      CountRows(Filter(col_SelectedItems, StatusCode = Index(col_WorkflowStatus, 1).StatusCode)) > 0
                                    Width: =120
                        - lbl_TitleNXTDanhMucChenhLech:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 128, 40, 1)
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightSemiBold
                              Height: =40
                              PaddingLeft: =10
                              Size: =fxFontSizeXL
                              Text: ="Sai lệch ngày"
                        - con_FilterNXTDanhMucChenhLech:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrNXTDanhMucChenhLech.Size = 1, 80, 45)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =If(scrNXTDanhMucChenhLech.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                            Children:
                              - con_Row1_NXTDanhMucChenhLech:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    Width: =If(scrNXTDanhMucChenhLech.Size = 1, Parent.Width - 10, 260)
                                  Children:
                                    - dp_FilterNgayKiemNXTDanhMucChenhLech:
                                        Control: ModernDatePicker
                                        Properties:
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          DefaultDate: =Today()
                                          Font: =fxFontFamily
                                          FontWeight: =FontWeight.Normal
                                          Format: =DatePickerFormat.Short
                                          Size: =fxFontSizeMD
                                          Width: =If(scrNXTDanhMucChenhLech.Size = 1, Parent.Width/2 - 25, 120)
                                    - cmb_FilterLoaiHangNXTDanhMucChenhLech:
                                        Control: ModernCombobox
                                        Properties:
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          InputTextPlaceholder: ="Loại hàng..."
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ProductTypeNameVI
                                          Items: =col_ProductTypes
                                          SelectMultiple: =false
                                          Size: =fxFontSizeMD
                                          Width: =If(scrNXTDanhMucChenhLech.Size = 1, Parent.Width/2 - 25, 130)
                              - con_Row2_NXTDanhMucChenhLech:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    FillPortions: =If(scrNXTDanhMucChenhLech.Size = 1, 0, 1)
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    Width: =If(scrNXTDanhMucChenhLech.Size = 1, Parent.Width - 10, 400)
                                  Children:
                                    - txt_SearchNXTDanhMucChenhLech:
                                        Control: ModernTextInput
                                        Properties:
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          LayoutMinWidth: =16
                                          Placeholder: ="Tìm mã SAP..."
                                    - cbo_FilterStatusKiemKho_3:
                                        Control: ModernCombobox
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.StatusNameVI
                                          Items: =Filter(col_WorkflowStatus, StatusCode = "DRAFT" || StatusCode = "APPROVED")
                                          SelectMultiple: =false
                                          Width: =If(scrNXTDanhMucChenhLech.Size = 1, 100, 120)
                                    - Button1_3:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="Eraser"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Reset(cmb_FilterLoaiHangNXTDanhMucChenhLech);
                                            Reset(txt_SearchNXTDanhMucChenhLech);
                                            Reset(cbo_FilterStatusKiemKho_3);
                                          Text: =
                                          Width: =40
                        - con_ListNXTDanhMucChenhLech:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderStyle: =BorderStyle.None
                              DropShadow: =If(scrNXTDanhMucChenhLech.Size = 1, DropShadow.None, DropShadow.Semibold)
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =If(scrNXTDanhMucChenhLech.Size = 1, 0, 5)
                              RadiusTopRight: =6
                              Width: =Parent.Width - Parent.PaddingLeft * 2
                            Children:
                              - con_InnerNXTDanhMucChenhLech:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.Height - lbl_TotalRowsNXTDanhMucChenhLech.Height
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: |-
                                      =
                                      If(
                                          scrNXTDanhMucChenhLech.Size = 1,
                                          Parent.Width,
                                          Max(Parent.Width, 1400)
                                      )
                                  Children:
                                    - con_TableHeaderNXTDanhMucChenhLech_1:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =46
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Visible: =scrNXTDanhMucChenhLech.Size = 1
                                          Width: =Parent.Width
                                        Children:
                                          - chk_H_SelectAll_1:
                                              Control: ModernCheckbox
                                              Properties:
                                                Default: =CountRows(col_SelectedItems) > 0
                                                DisplayMode: |-
                                                  =If(
                                                      CountRows(
                                                          Filter(
                                                              gal_NXTDanhMucChenhLech.AllItems,
                                                              chk_SelectRow.DisplayMode = DisplayMode.Edit
                                                          )
                                                      ) > 0,
                                                      DisplayMode.Edit,
                                                      DisplayMode.Disabled
                                                  )
                                                FontWeight: =""
                                                Label: =
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnCheck: |-
                                                  =ClearCollect(
                                                      col_SelectedItems,
                                                      Filter(
                                                          gal_NXTDanhMucChenhLech.AllItems,
                                                          chk_SelectRow.DisplayMode = DisplayMode.Edit
                                                      )
                                                  )
                                                OnUncheck: =Clear(col_SelectedItems)
                                                Width: =40
                                    - con_TableHeaderNXTDanhMucChenhLech:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(250, 250, 250, 1)
                                          FillPortions: =0
                                          Height: =46
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Visible: =scrNXTDanhMucChenhLech.Size <> 1
                                          Width: =Parent.Width
                                        Children:
                                          - chk_H_SelectAll:
                                              Control: ModernCheckbox
                                              Properties:
                                                Default: =CountRows(col_SelectedItems) > 0
                                                DisplayMode: |-
                                                  =If(
                                                      CountRows(
                                                          Filter(
                                                              gal_NXTDanhMucChenhLech.AllItems,
                                                              chk_SelectRow.DisplayMode = DisplayMode.Edit
                                                          )
                                                      ) > 0,
                                                      DisplayMode.Edit,
                                                      DisplayMode.Disabled
                                                  )
                                                FontWeight: =""
                                                Label: =
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnCheck: |-
                                                  =ClearCollect(
                                                      col_SelectedItems,
                                                      Filter(
                                                          gal_NXTDanhMucChenhLech.AllItems,
                                                          chk_SelectRow.DisplayMode = DisplayMode.Edit
                                                      )
                                                  )
                                                OnUncheck: =Clear(col_SelectedItems)
                                                Width: =40
                                          - lbl_H_NgayKiem:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ngày kiểm"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_LoaiHang:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Loại hàng"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_MaHang:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Mã SAP"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_TonSoSach:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Tồn sổ sách"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_TonThucTe:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Tồn thực tế"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_SaiLech:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Sai lệch"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_KiemLai:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Kiểm lại"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_TrangThai:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Trạng thái"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_GiaiTrinh:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Giải trình"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_H_Actions:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Thao tác"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                    - gal_NXTDanhMucChenhLech:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          BorderStyle: =BorderStyle.None
                                          Height: =Parent.Height - con_TableHeaderNXTDanhMucChenhLech.Height
                                          Items: |-
                                            = SortByColumns(
                                                    Filter(
                                                        'QLK List Stock Count Variance',
                                                        PlantCode       = varUserInPlant.PlantCode,
                                                        IsBlank(dp_FilterNgayKiemNXTDanhMucChenhLech.SelectedDate) || StockCountDate = dp_FilterNgayKiemNXTDanhMucChenhLech.SelectedDate,
                                                        IsBlank(cmb_FilterLoaiHangNXTDanhMucChenhLech.Selected.ProductTypeCode) || CountMethodName = cmb_FilterLoaiHangNXTDanhMucChenhLech.Selected.ProductTypeCode,
                                                        IsBlank(txt_SearchNXTDanhMucChenhLech.Text) || StartsWith(SAPCode, txt_SearchNXTDanhMucChenhLech.Text)
                                                    ),
                                                    "Created",
                                                    SortOrder.Descending
                                                )
                                          LayoutMinWidth: =Parent.LayoutMinWidth
                                          ShowScrollbar: =false
                                          TemplateSize: |-
                                            =If(
                                                scrNXTDanhMucChenhLech.Size = 1,
                                                360,
                                                46
                                            )
                                          Width: =Parent.Width
                                        Children:
                                          - con_RowDividerKiemKhoHangBigbag_1:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(229, 231, 235, 1)
                                                Height: =1
                                                Visible: =scrKiemKeBigbag.Size <> 1
                                                Width: =Parent.Width - 10
                                                Y: =gal_NXTDanhMucChenhLech.TemplateHeight
                                          - Container3:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: |-
                                                  =
                                                  If(
                                                      scrNXTDanhMucChenhLech.Size = 1,
                                                      DropShadow.Semibold,
                                                      DropShadow.None
                                                  )
                                                Height: =gal_NXTDanhMucChenhLech.TemplateHeight
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                RadiusTopLeft: |-
                                                  =If(
                                                      scrNXTDanhMucChenhLech.Size = 1,
                                                      5,
                                                      0
                                                  )
                                                Width: =Parent.Width - 10
                                              Children:
                                                - con_RowMasterNXTDanhMucChenhLech:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =gal_NXTDanhMucChenhLech.TemplateHeight
                                                      LayoutAlignItems: |-
                                                        =If(
                                                            scrNXTDanhMucChenhLech.Size = 1,
                                                            LayoutAlignItems.Start,
                                                            LayoutAlignItems.Center
                                                        )
                                                      LayoutDirection: |-
                                                        =If(
                                                            scrNXTDanhMucChenhLech.Size = 1,
                                                            LayoutDirection.Vertical,
                                                            LayoutDirection.Horizontal
                                                        )
                                                      LayoutGap: =5
                                                      LayoutMinHeight: =Parent.Height
                                                      PaddingLeft: |-
                                                        =If(
                                                            scrNXTDanhMucChenhLech.Size = 1,
                                                            10,
                                                            5
                                                        )
                                                      PaddingRight: =10
                                                      PaddingTop: |-
                                                        =If(
                                                            scrNXTDanhMucChenhLech.Size = 1,
                                                            10,
                                                            0
                                                        )
                                                      RadiusTopLeft: =0
                                                      Width: =If(scrDanhMucChenhLech.Size = 1, Parent.Width / 1.2, Parent.Width - Parent.PaddingRight * 2 - Parent.LayoutGap - 10)
                                                    Children:
                                                      - chk_SelectRow:
                                                          Control: ModernCheckbox
                                                          Properties:
                                                            Default: =ThisItem.ID in col_SelectedItems.ID
                                                            FontWeight: =""
                                                            Label: =
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            OnCheck: =Collect(col_SelectedItems, ThisItem)
                                                            OnUncheck: =Remove(col_SelectedItems, LookUp(col_SelectedItems, ID = ThisItem.ID))
                                                            Width: =40
                                                      - lbl_NgayKiem:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =If(
                                                                  scrNXTDanhMucChenhLech.Size = 1,
                                                                  "Ngày nhập : " & Text(ThisItem.StockCountDate, "dd/mm/yyyy"),
                                                                  Text(ThisItem.StockCountDate, "dd/mm/yyyy")
                                                              )
                                                            Width: |-
                                                              =If(
                                                                  scrNXTDanhMucChenhLech.Size = 1,
                                                                  Parent.Width - 10,
                                                                  lbl_H_NgayKiem.Width
                                                              )
                                                            Wrap: =false
                                                      - lbl_LoaiHang:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =If(
                                                                  scrNXTDanhMucChenhLech.Size = 1,
                                                                  "Loại hàng: ",
                                                                  ""
                                                              ) & LookUp(col_ProductTypes, ProductTypeCode = ThisItem.CountMethodName).ProductTypeNameVI
                                                            Width: |-
                                                              =If(
                                                                  scrNXTDanhMucChenhLech.Size = 1,
