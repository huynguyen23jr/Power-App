      - con_OverlayChenhLechNgay:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowChenhLechNgay
            Width: =Parent.Width
          Children:
            - con_ChenhLechNgayBox:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.Regular
                  Fill: =Color.White
                  FillPortions: =0
                  Height: =250
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Width: |-
                    =Switch(
                        App.ActiveScreen.Size,
                        1, App.ActiveScreen.Width - 40,
                        2, 420,
                        400
                    )
                Children:
                  - con_HeaderChenhLechNgay:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =45
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =15
                        PaddingRight: =10
                      Children:
                        - lbl_TitleChenhLechNgay:
                            Control: ModernText
                            Properties:
                              FillPortions: =1
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightBold
                              Size: =fxFontSizeLG
                              Text: ="Chênh lệch ngày"
                        - btn_CloseChenhLechNgay:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Transparent
                              Font: =fxFontFamily
                              Icon: ="Dismiss"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =UpdateContext({varShowChenhLechNgay: false})
                              Width: =32
                  - con_BodyChenhLechNgay:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                      Children:
                        - con_FieldCLNNgay:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =70
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =75
                              PaddingLeft: =10
                              PaddingRight: =10
                            Children:
                              - lbl_CLNNgay:
                                  Control: ModernText
                                  Properties:
                                    Font: =fxFontFamily
                                    Size: =fxFontSizeMD
                                    Text: ="Chọn ngày *"
                              - dp_CLNNgay:
                                  Control: ModernDatePicker
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    DefaultDate: =Today()
                                    Font: =fxFontFamily
                                    Format: =DatePickerFormat.Short
                                    LayoutMinWidth: =Parent.Width-20
                                    Placeholder: ="Chọn ngày ..."
                                    Size: =fxFontSizeMD
                        - con_FieldCLNLoaiSP:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =70
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =75
                              PaddingLeft: =10
                              PaddingRight: =10
                            Children:
                              - lbl_CLNLoaiSP:
                                  Control: ModernText
                                  Properties:
                                    Font: =fxFontFamily
                                    Size: =fxFontSizeMD
                                    Text: ="Loại sản phẩm *"
                              - cbx_CLNLoaiSP:
                                  Control: ModernCombobox
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                    Font: =fxFontFamily
                                    InputTextPlaceholder: ="Chọn loại sản phẩm ..."
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                    Items: =col_ProductCategories
                                    SelectMultiple: =false
                                    Size: =fxFontSizeMD
                                    Width: =Parent.Width -5
                  - con_FooterChenhLechNgay:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        PaddingBottom: =10
                        PaddingLeft: =15
                        PaddingRight: =15
                        PaddingTop: =10
                      Children:
                        - btn_ConfirmChenhLechNgay:
                            Control: ModernButton
                            Properties:
                              DisplayMode: |-
                                =If(
                                    IsBlank(dp_CLNNgay.SelectedDate) || IsBlank(cbx_CLNLoaiSP.Selected),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Font: =fxFontFamily
                              Icon: ="CheckmarkCircle"
                              OnSelect: |
                                =// Đóng popup "chênh lệch ngày" (nếu đang mở) và bật popup "đang xử lý" trong lúc tổng hợp dữ liệu
                                UpdateContext({varShowChenhLechNgay: false});
                                UpdateContext({varShowPopupProcessing: true});

                                // Xóa các collection tạm trước khi nạp lại dữ liệu mới
                                Concurrent(
                                    Clear(col_OpeningQty),
                                    Clear(col_StockCountDetails),
                                    Clear(col_StockSummary),
                                    Clear(col_UniqueSAPCodes)
                                );

                                // Nạp song song 3 nguồn dữ liệu cần thiết: chi tiết kiểm kê, tồn đầu kỳ, và danh mục sản phẩm
                                Concurrent(
                                    // Các dòng kiểm kê đã xác nhận (COUNT_CONFIRMED) trong ngày, chưa được tổng hợp
                                    ClearCollect(
                                        col_StockCountDetails,
                                        Filter(
                                            'QLK List Stock Count Details',
                                            PlantCode           = varUserInPlant.PlantCode,
                                            StockCountDate      = dp_CLNNgay.SelectedDate,
                                            ProductCategoryCode = cbx_CLNLoaiSP.Selected.ProductCategoryCode,
                                            StatusCode          = "COUNT_CONFIRMED",
                                            IsSummarized        = false
                                        )
                                    ),
                                    // Tồn kho đóng của ngày hôm trước (làm tồn đầu kỳ cho ngày kiểm kê hiện tại)
                                    ClearCollect(
                                        col_OpeningQty,
                                        Filter(
                                            'QLK List Inventory Details',
                                            PlantCode            = varUserInPlant.PlantCode,
                                            InventoryDate        = DateAdd(dp_CLNNgay.SelectedDate, -1, TimeUnit.Days),
                                            ProductCategoryCode  = cbx_CLNLoaiSP.Selected.ProductCategoryCode,
                                            ConfirmFromWarehouse = true,
                                            IsSummarized         = false,
                                            isFlag               = false
                                        )
                                    ),
                                    // Danh mục sản phẩm (dùng để lọc mã SAP hợp lệ và lấy phương pháp tính CountMethodName)
                                    ClearCollect(
                                        col_MasterDataProduction,
                                        Filter(
                                            'QLK List Master Data Production',
                                            PlantCode = varUserInPlant.PlantCode
                                        )
                                    )
                                );

                                // Nếu thiếu dữ liệu kiểm kê hoặc tồn đầu kỳ thì báo lỗi và dừng lại, không tổng hợp
                                If(
                                    IsEmpty(col_StockCountDetails) || IsEmpty(col_OpeningQty),
                                    Notify(
                                        If(
                                            IsEmpty(col_StockCountDetails) && IsEmpty(col_OpeningQty),
                                            "Không có dữ liệu kiểm kê và tồn kho",
                                            If(
                                                IsEmpty(col_StockCountDetails),
                                                "Không có dữ liệu kiểm kê",
                                                "Không có dữ liệu tồn kho"
                                            )
                                        ),
                                        NotificationType.Warning,
                                        2000
                                    );
                                    UpdateContext({varShowPopupProcessing: false}),

                                    // Danh sách mã SAP duy nhất (chỉ lấy mã có trong danh mục sản phẩm) để tổng hợp theo từng mã
                                    ClearCollect(
                                            col_UniqueSAPCodes,
                                                DropColumns(
                                                    GroupBy(
                                                        Filter(
                                                            col_StockCountDetails,
                                                            SAPCode in col_MasterDataProduction.SAPCode
                                                        ),
                                                        SAPCode,
                                                        StockCountType,
                                                        GroupData
                                                    ),
                                                    GroupData
                                                )
                                    );

                                    // Với mỗi mã SAP: lấy tồn đầu kỳ, tổng số lượng kiểm kê thực tế, và gộp ID các dòng chi tiết
                                    ForAll(
                                        col_UniqueSAPCodes As grp,
                                        With(
                                            {
                                                _opening:   LookUp(col_OpeningQty, SAPCode = grp.SAPCode && ProductTypeCode = grp.StockCountType),
                                                _actualQty: Sum(Filter(col_StockCountDetails, SAPCode = grp.SAPCode && StockCountType = grp.StockCountType), ActualQty),
                                                _idDetails: Concat(Filter(col_StockCountDetails, SAPCode = grp.SAPCode && StockCountType = grp.StockCountType), Text(ID), ";")
                                            },
                                            With(
                                                { _variance: _actualQty - _opening.ClosingQty },
                                                // Chỉ ghi dòng tổng hợp khi chênh lệch > 0
                                                If(
                                                    IsBlank(_opening)
                                                    ,
                                                    Collect(
                                                            col_StockSummary,
                                                            {
                                                                PlantCode:           varUserInPlant.PlantCode,
                                                                PlantName:           varUserInPlant.PlantName,
                                                                ProductTypeCode:     cbx_CLNLoaiSP.Selected.ProductCategoryCode,
                                                                StockCountDate:      dp_CLNNgay.SelectedDate,
                                                                SAPCode:             grp.SAPCode,
                                                                CountMethodName:     grp.StockCountType,
                                                                IDStockCountDetails: _idDetails,
                                                                IDInventoryDetails:  _opening.ID,
                                                                IDInventory:         _opening.InventoryID,
                                                                BookQty:             _opening.ClosingQty,
                                                                ActualQty:           _actualQty,
                                                                VarianceQty:         _actualQty,
                                                                Explanation:         "",
                                                                StatusCode:          Index(col_WorkflowStatus, 1).StatusCode,
                                                                NeedRecount:         true
                                                            }
                                                        )
                                                    ,
                                                    If(
                                                        _variance > 0,
                                                        Collect(
                                                            col_StockSummary,
                                                            {
                                                                PlantCode:           varUserInPlant.PlantCode,
                                                                PlantName:           varUserInPlant.PlantName,
                                                                ProductTypeCode:     cbx_CLNLoaiSP.Selected.ProductCategoryCode,
                                                                StockCountDate:      dp_CLNNgay.SelectedDate,
                                                                SAPCode:             grp.SAPCode,
                                                                CountMethodName:     grp.StockCountType,
                                                                IDStockCountDetails: _idDetails,
                                                                IDInventoryDetails:  _opening.ID,
                                                                IDInventory:         _opening.InventoryID,
                                                                BookQty:             _opening.ClosingQty,
                                                                ActualQty:           _actualQty,
                                                                VarianceQty:         _variance,
                                                                Explanation:         "",
                                                                StatusCode:          Index(col_WorkflowStatus, 1).StatusCode,
                                                                NeedRecount:         true
                                                            }
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    );

                                    // Đánh dấu các dòng kiểm kê/tồn kho nguồn vừa xử lý là đã được tổng hợp (IsSummarized = true)
                                    ClearCollect(col_SummarizedStockCount, ForAll(col_StockCountDetails, {ID: ID, IsSummarized: true}));
                                    ClearCollect(col_InventoryDetails,     ForAll(col_OpeningQty,        {ID: ID, IsSummarized: true, isFlag: true}));

                                    // Ghi nhận kết quả: cập nhật trạng thái đã tổng hợp và lưu dòng chênh lệch (nếu có) vào các list tương ứng
                                    Concurrent(
                                        Patch('QLK List Stock Count Details', col_SummarizedStockCount),
                                        Patch('QLK List Inventory Details',   col_InventoryDetails),
                                        If(
                                            !IsEmpty(col_StockSummary),
                                            Patch('QLK List Stock Count Variance', col_StockSummary)
                                        )
                                    );

                                    // Thông báo nếu không có mã nào chênh lệch > 0
                                    If(
                                        IsEmpty(col_StockSummary),
                                        Notify("Không có mã nào chênh lệch lớn hơn 0", NotificationType.Information, 2000)
                                    );

                                    // Tắt popup xử lý khi hoàn tất
                                    UpdateContext({varShowPopupProcessing: false})
                                )
                              Size: =fxFontSizeMD
                              Text: ="Xác nhận"
                              Width: =120
                        - btn_CancelChenhLechNgay:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              Icon: ="DismissCircle"
                              OnSelect: |-
                                =UpdateContext({varShowChenhLechNgay: false})
                              Size: =fxFontSizeMD
                              Text: ="Hủy"
                              Width: =120
