Screens:
  scrKiemKhoHangXa:
    Properties:
      OnVisible: |-
        =varShowMenuUser && scrKiemKhoHangXa.Size <> 1;
        Clear(updateKiemKhoHangXa);
        Clear(col_SelectedKiemKhoHangXa);
    Children:
      - con_MainKiemKhoHangXa:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderKiemKhoHangXa:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderKiemKhoHangXa:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrKiemKhoHangXa.Size
            - con_BodyKiemKhoHangXa:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderKiemKhoHangXa.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_MenuKiemKhoHangXa:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =scrKiemKhoHangXa.Size <> 1
                        Width: =If(varShowMenuUser, 240, 0)
                      Children:
                        - cmp_NavSidebarKiemKhoHangXa:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_ContentKiemKhoHangXa:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: |-
                          =If(
                              scrKiemKhoHangXa.Size = 1,
                              DropShadow.Semibold,
                              DropShadow.None
                          )
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                        RadiusTopRight: =0
                      Children:
                        - con_ActionHeaderKiemKhoHangXa:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - btn_AddKiemKhoHangXa:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Add"
                                    OnSelect: |-
                                      =Set(
                                          varStockCountDetail,
                                          {}
                                      );

                                      Set(
                                          varStockCountType,
                                          Index(col_ProductTypes, 3).ProductTypeCode
                                      );
                                      Reset(cmb_ProductCode);
                                      Reset(num_PalletQty);
                                      Reset(num_OddBagQty);
                                      Reset(dp_ProductionDate);
                                      Reset(num_BrokenBagQty);
                                      Reset(num_OddBoxQty);
                                      Reset(num_OddKgQty);
                                      Reset(txt_Note_Bao);
                                      Reset(txt_LocationName_Bao);
                                      Reset(cmb_XaDensityCode);
                                      Reset(cmb_XaBinCode);
                                      Reset(num_Measure1);
                                      Reset(num_Measure2);
                                      Reset(num_Measure3);
                                      Reset(num_DustSteamQty);
                                      Reset(cmb_ProductCode_Bigbag);
                                      Reset(num_BigBagQty);
                                      Reset(num_BigBagWeight);
                                      Reset(num_NetBigBagWeight);
                                      Reset(cmb_ProductCategory);
                                      Reset(cmb_StockCountType);

                                      Navigate(
                                          scrKiemKhoForm,
                                          ScreenTransition.CoverRight
                                      );
                                    Size: =fxFontSizeMD
                                    Text: ="Thêm"
                                    Visible: =(varUserInPlant.Role = Index(col_RoleUser,16).RoleCode || varUserInPlant.Role = Index(col_RoleUser,1).RoleCode || varUserInPlant.Role = Index(col_RoleUser,9).RoleCode)
                              - btn_RefreshKiemKhoHangXa:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="ArrowSync"
                                    OnSelect: =Refresh('QLK List Stock Count Details')
                                    Size: =fxFontSizeMD
                                    Text: ="Làm mới"
                                    Width: =120
                              - btn_RefreshKiemKhoHangXa_1:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    OnSelect: |
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xác nhận kiểm kê " & CountRows(col_SelectedKiemKhoHangXa) & " bản ghi đã chọn không?",
                                              {
                                                  Title: "Xác nhận",
                                                  ConfirmButton: "Xác nhận",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          UpdateContext({varShowPopupProcessing: true});
                                          Clear(updateKiemKhoHangXa);
                                          ForAll(
                                              col_SelectedKiemKhoHangXa As item,
                                              Collect(
                                                  updateKiemKhoHangXa,
                                                  {
                                                      ID          : item.ID,
                                                      StatusCode  : "COUNT_CONFIRMED"
                                                  }
                                              )
                                          );
                                          IfError(
                                              Patch('QLK List Stock Count Details', updateKiemKhoHangXa),
                                              Notify("Cập nhật thất bại", NotificationType.Error, 2000),
                                              Notify("Cập nhật thành công", NotificationType.Success, 2000);
                                              Clear(col_SelectedKiemKhoHangXa);
                                              Clear(updateKiemKhoHangXa);
                                          );
                                          UpdateContext({varShowPopupProcessing: false});
                                      )
                                    Size: =fxFontSizeMD
                                    Text: ="Xác nhận"
                                    Visible: |-
                                      =CountRows(
                                          Filter(
                                              col_SelectedKiemKhoHangXa,
                                              StatusCode = Index(col_WorkflowStatus,1).StatusCode
                                          )
                                      ) > 0
                                    Width: =120
                        - con_FilterKiemKhoHangBao_1:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrKiemKhoHangXa.Size = 1 ,90 ,45)
                              LayoutDirection: =If(scrKiemKhoHangBao.Size = 1 ,LayoutDirection.Vertical ,LayoutDirection.Horizontal)
                              LayoutGap: =5
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - con_Row1_1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: |
                                      =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                  Children:
                                    - dp_FilterNgayKiemHangBao_1:
                                        Control: ModernDatePicker
                                        Properties:
                                          BasePaletteColor: =RGBA(8,222,8,1)
                                          DefaultDate: =Today()
                                          Font: =fxFontFamily
                                          FontWeight: =FontWeight.Normal
                                          Format: =DatePickerFormat.Short
                                          Size: =fxFontSizeMD
                                          Width: =160
                                    - txt_SearchKiemKhoHangXa:
                                        Control: ModernTextInput
                                        Properties:
                                          Font: =fxFontFamily
                                          Placeholder: ="Tìm kiếm ...."
                                          Width: |-
                                            =
                                            If(scrKiemKhoHangBao.Size = 1 ,Parent.Width - dp_FilterNgayKiemHangBao_1.Width - 60 ,Parent.Width - dp_FilterNgayKiemHangBao_1.Width - 10)
                              - con_Row2_1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                  Children:
                                    - cbo_FilterStatusKiemKho_1:
                                        Control: ModernCombobox
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.StatusNameVI
                                          Items: =Filter(col_WorkflowStatus,StatusCode="DRAFT" || StatusCode="COUNT_CONFIRMED")
                                          SelectMultiple: =false
                                          Width: =160
                                    - cbo_FilterProductTypeNhapTuSanXuat_9:
                                        Control: ModernCombobox
                                        Properties:
                                          DefaultSelectedItems: =LookUp(col_ProductCategories,ProductCategoryCode=varUserInPlant.ProductCategoryCode)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                          Items: =col_ProductCategories
                                          SelectMultiple: =false
                                          Width: =Parent.Width - cbo_FilterStatusKiemKho_1.Width - Button1_1.Width - 10
                                    - Button1_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="Eraser"
                                          OnSelect: |-
                                            =Reset(cbo_FilterStatusKiemKho_1);
                                            Reset(cbo_FilterProductTypeNhapTuSanXuat_9);
                                            Reset(txt_SearchKiemKhoHangXa);
                                          Text: =
                                          Width: =50
                        - lbl_TitleKiemKhoHangXa:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 128, 40, 1)
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightSemiBold
                              Height: =40
                              PaddingLeft: =10
                              Size: =fxFontSizeXL
                              Text: ="Kiểm kê hàng xá"
                        - con_ListKiemKhoHangXa:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderStyle: =BorderStyle.None
                              DropShadow: =If(scrKiemKhoHangXa.Size = 1, DropShadow.None, DropShadow.Semibold)
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =If(scrKiemKhoHangXa.Size = 1, 0, 5)
                              RadiusTopRight: =6
                              Width: =Parent.Width - 10
                            Children:
                              - con_TableHeaderKiemKhoHangXa:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(250, 250, 250, 1)
                                    FillPortions: =0
                                    Height: =46
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    Visible: =scrKiemKhoHangXa.Size <> 1
                                  Children:
                                    - chk_KiemKhoHangXa_SelectAll:
                                        Control: ModernCheckbox
                                        Properties:
                                          Default: |-
                                            =CountRows(col_SelectedKiemKhoHangXa) = CountRows(gal_KiemKhoHangXa.AllItems) &&
                                            CountRows(gal_KiemKhoHangXa.AllItems) > 0
                                          DisplayMode: |
                                            =If(
                                                CountRows(
                                                    Filter(
                                                        gal_KiemKhoHangXa.AllItems,
                                                        StatusCode = Index(col_WorkflowStatus, 1).StatusCode
                                                    )
                                                ) > 0,
                                                DisplayMode.Edit,
                                                DisplayMode.Disabled
                                            )
                                          FontWeight: =""
                                          Label: =""
                                          OnCheck: =ClearCollect(col_SelectedKiemKhoHangXa, Filter(gal_KiemKhoHangXa.AllItems,StatusCode = Index(col_WorkflowStatus,1).StatusCode))
                                          OnUncheck: =Clear(col_SelectedKiemKhoHangXa)
                                          Width: =32
                                    - lbl_HeaderDensityCode:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Mã rút gọn"
                                          Width: =Parent.Width * 0.1
                                          Wrap: =false
                                    - lbl_HeaderSAPCode_Xa:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Mã SAP"
                                          Width: =Parent.Width * 0.1
                                          Wrap: =false
                                    - lbl_HeaderStockCountDateXa:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Ngày kiểm kê"
                                          Width: =Parent.Width * 0.1
                                          Wrap: =false
                                    - lbl_HeaderStatusCodeKiemKhoHangXa:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Trạng thái"
                                          Width: =Parent.Width * 0.12
                                          Wrap: =false
                                    - lbl_HeaderBinCode_1:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Mã bin"
                                          Width: =Parent.Width * 0.05
                                          Wrap: =false
                                    - lbl_HeaderMeasure1:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Đo lần 1 (m)"
                                          Width: =Parent.Width * 0.08
                                          Wrap: =false
                                    - lbl_HeaderMeasure2:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Đo lần 2 (m)"
                                          Width: =Parent.Width * 0.08
                                          Wrap: =false
                                    - lbl_HeaderMeasure3:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Đo lần 3 (m)"
                                          Width: =Parent.Width * 0.08
                                          Wrap: =false
                                    - lbl_HeaderDustSteamQty:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Bụi hơi (kg)"
                                          Wrap: =false
                                    - lbl_HeaderActualQtyXa:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Số kg tồn (Kg)"
                                          Width: =Parent.Width * 0.1
                                          Wrap: =false
                                    - lbl_HeaderActionKiemKhoHangXa:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Thao tác"
                                          Width: =80
                                          Wrap: =false
                              - gal_KiemKhoHangXa:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height - con_TableHeaderKiemKhoHangXa.Height - lbl_TotalRowsKiemKhoHangXa.Height
                                    Items: |-
                                      =Switch(
                                          varRoleCurrentFirst.Role,
                                          Index(col_RoleUser, 16).RoleCode, // Nhân viên kho thành phẩm
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "XABIN",
                                                  IsBlank(dp_FilterNgayKiemHangBao_1.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao_1.SelectedDate,
                                                  IsBlank(cbo_FilterStatusKiemKho_1.Selected) || StatusCode = cbo_FilterStatusKiemKho_1.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_9.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_9.Selected.ProductCategoryCode,
                                                  (IsBlank(txt_SearchKiemKhoHangXa.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangXa.Text)),
                                                  UserID = varUserInPlant.UserID
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          Index(col_RoleUser, 1).RoleCode, // Thủ kho thành phẩm
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "XABIN",
                                                  IsBlank(dp_FilterNgayKiemHangBao_1.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao_1.SelectedDate,
                                                  IsBlank(cbo_FilterStatusKiemKho_1.Selected) || StatusCode = cbo_FilterStatusKiemKho_1.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_9.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_9.Selected.ProductCategoryCode,
                                                  (IsBlank(txt_SearchKiemKhoHangXa.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangXa.Text)),
                                                  UserID = varUserInPlant.UserID
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          Index(col_RoleUser, 9).RoleCode,  // VHSX_HO
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "XABIN",
                                                  IsBlank(dp_FilterNgayKiemHangBao_1.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao_1.SelectedDate,
                                                  IsBlank(cbo_FilterStatusKiemKho_1.Selected) || StatusCode = cbo_FilterStatusKiemKho_1.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_9.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_9.Selected.ProductCategoryCode,
                                                  (IsBlank(txt_SearchKiemKhoHangXa.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangXa.Text))
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "XABIN",
                                                  (IsBlank(txt_SearchKiemKhoHangXa.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangXa.Text)),
                                                  IsBlank(cbo_FilterStatusKiemKho_1.Selected) || StatusCode = cbo_FilterStatusKiemKho_1.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_9.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_9.Selected.ProductCategoryCode,
                                                  IsBlank(dp_FilterNgayKiemHangBao_1.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao_1.SelectedDate
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          )
                                      )
                                    ShowScrollbar: =false
                                    TemplateSize: |-
                                      =If(
                                          scrKiemKhoHangXa.Size = 1,
                                          32 *7.2 + 10,
                                          45
                                      )
                                    Width: =Parent.Width
                                  Children:
                                    - con_RowDividerKiemKhoHangXa:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(229, 231, 235, 1)
                                          Height: =1
                                          Visible: =scrKiemKhoHangXa.Size <> 1
                                          Width: =Parent.Width - 10
                                          Y: =gal_KiemKhoHangXa.TemplateHeight
                                    - con_RowMasterKiemKhoHangXa:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =If(scrKiemKhoHangXa.Size = 1, DropShadow.Light, DropShadow.None)
                                          Height: =gal_KiemKhoHangXa.TemplateHeight
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =If(scrKiemKhoHangXa.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                          LayoutGap: =If(scrKiemKhoHangXa.Size = 1, 5, 0)
                                          PaddingLeft: =5
                                          RadiusTopLeft: =If(scrKiemKhoHangXa.Size = 1, 4, 0)
                                          Width: =Parent.Width - 10
                                        Children:
                                          - chk_KiemKhoHangXa_SelectRow:
                                              Control: ModernCheckbox
                                              Properties:
                                                Default: =ThisItem.ID in col_SelectedKiemKhoHangXa.ID
                                                DisplayMode: |-
                                                  =// Chỉ cho phép chỉnh sửa khi phiếu đang ở trạng thái DRAFT, các trạng thái khác thì khóa
                                                  If(
                                                      ThisItem.StatusCode = "DRAFT" ,
                                                      DisplayMode.Edit,
                                                      DisplayMode.Disabled
                                                  )
                                                FontWeight: =""
                                                Label: =""
                                                OnCheck: =Collect(col_SelectedKiemKhoHangXa, ThisItem)
                                                OnUncheck: =Remove(col_SelectedKiemKhoHangXa, ThisItem)
                                                Visible: =scrKiemKhoHangXa.Size <> 1
                                                Width: =32
                                          - con_RowKiemKhoHangXa:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(229, 231, 235, 1)
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(255, 255, 255, 1)
                                                FillPortions: =0
                                                Height: |-
                                                  =If(
                                                      scrKiemKhoHangXa.Size = 1,
                                                      gal_KiemKhoHangXa.TemplateHeight - con_MobileActionKiemKhoHangXa.Height - 10,
                                                      48
                                                  )
                                                LayoutAlignItems: =If(scrKiemKhoHangXa.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
