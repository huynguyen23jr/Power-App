Screens:
  srcLogin:
    Properties:
      OnVisible: =UpdateContext({varShowPopupProcessing:false});
    Children:
      - Container6:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =Color.White
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - Container14:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height/5
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - TextCanvas1:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =Parent.Height/2
                        LayoutMinWidth: =96
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =20
                        Text: ="Đăng nhập"
                        Width: =96
            - Container14_1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =10
                  PaddingRight: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - TextInputCanvas1:
                      Control: ModernTextInput
                      Properties:
                        FontWeight: =""
                        Height: =40
                        MaxLength: =-1
                        Placeholder: ="Tên đăng nhập"
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =0
                        TriggerOutput: =TriggerOutput.FocusOut
                        Width: '=Parent.Width  - Parent.PaddingLeft - Parent.PaddingRight '
                  - TextInputCanvas1_1:
                      Control: ModernTextInput
                      Properties:
                        FontWeight: =""
                        Height: =40
                        MaxLength: =-1
                        Placeholder: ="Mật khẩu"
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =0
                        TriggerOutput: =TriggerOutput.FocusOut
                        Type: =TextInputType.Password
                        Width: =Parent.Width  - Parent.PaddingLeft - Parent.PaddingRight
            - Container14_4:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - ButtonCanvas12:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Font: =Font.'Segoe UI'
                        FontWeight: =""
                        Height: =40
                        OnSelect: |
                          =/*UpdateContext(
                              {
                                  varProcessing: true,
                                  _result: 'QLTS|LoginUser'.Run(
                                      TextInputCanvas1.Value,
                                      TextInputCanvas1_1.Value
                                  )
                              }
                          );

                          If(
                              _result.statuscode = "200",
                              // ✅ Nếu thành công
                              Navigate(
                                  scrRequest,
                                  ScreenTransition.CoverRight
                              );
                              Set(varUserInPlant , Filter('QLTS Farm List User In Plant',UserID = TextInputCanvas1.Value && Password = TextInputCanvas1_1.Value));
                              UpdateContext({ varProcessing: false });
                              ,
                              //  Nếu thất bại
                              Notify(_result.message,NotificationType.Error,2000);
                              UpdateContext({ varProcessing: false });
                          );*/
                          UpdateContext({ varProcessing: true });
                          // Lấy user trong Plant
                          Set(
                              varUserInPlant,
                              LookUp(
                                  'QLK List User In Plant',
                                  UserID = TextInputCanvas1.Text &&
                                  Password = TextInputCanvas1_1.Text
                              )
                          );

                          // Kiểm tra có tìm thấy user hay không
                          If(
                              IsBlank(varUserInPlant.ID)
                              ,
                              UpdateContext({ varProcessing: false });
                              Notify(
                                  "Sai tên đăng nhập hoặc mật khẩu. Vui lòng kiểm tra lại",
                                  NotificationType.Error,
                                  2000
                              ),
                              UpdateContext(
                                  { 
                                      varProcessing: false,
                                      varPopUpWelcom : true
                                  }
                                  );
                              Set(varRoleCurrentFirst,varUserInPlant);
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =18
                        Text: ="Đăng nhập"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - 20
                  - ButtonCanvas12_1:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Outline
                        Font: =Font.'Segoe UI'
                        FontWeight: =""
                        Height: =40
                        OnSelect: =Exit()
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: |
                          =18
                        Text: ="Thoát"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =Parent.Width - 20
      - ContainerLoginSuccess:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varPopUpWelcom
            Width: =Parent.Width
          Children:
            - Container69:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.Semibold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: |
                    =Switch(
                        srcLogin.Size,

                        // ===============================
                        // 1. MOBILE (Phone Layout - Mobile dọc)
                        // ===============================
                        1,
                            Parent.Height * 0.4,

                        // ===============================
                        // 2. TABLET 
                        //    (và MOBILE NGANG trong Phone Layout)
                        // ===============================
                        2,
                            If(
                                srcLogin.Width > srcLogin.Height,
                                    // ===== NGANG =====
                                    If(
                                        App.Width > App.Height && App.Height < 600,
                                            Parent.Height * 0.7,   // Mobile ngang (Phone Layout)
                                            Parent.Height * 0.4     // Tablet ngang
                                    ),
                                    // ===== DỌC =====
                                    Parent.Height * 0.5            // Tablet dọc
                            ),

                        // ===============================
                        // 3. MOBILE (Tablet Layout mới xài tới)
                        // ===============================
                        3,
                            If(
                                srcLogin.Width > srcLogin.Height,
                                    Parent.Height * 0.65,          // Mobile ngang (Tablet Layout)
                                    Parent.Height * 0.3           // Mobile dọc (Tablet Layout)
                            ),

                        // ===============================
                        // MẶC ĐỊNH
                        // ===============================
                        Parent.Height * 0.4
                    )
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: |-
                    =Switch(
                        srcLogin.Size,
                        1,  Parent.Width * 0.9,   // Desktop
                        2,  Parent.Width * 0.7,   // Tablet dọc
                        2.1,Parent.Width * 0.6,   // Tablet ngang
                        3,  Parent.Width * 0.5,   // Mobile
                        Parent.Width * 0.3     // Mặc định
                    )
                Children:
                  - Container70:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - Container70_1.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - TextCanvas11:
                            Control: ModernText
                            Properties:
                              Align: =Align.Center
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =10
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =10
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =20
                              Text: |-
                                =$"Xin chào, {varRoleCurrentFirst.UserName}! 👋  
                                 Chào mừng bạn đã đăng nhập.
                                Thời gian: {Text(Now(),"dd/mm/yyyy hh:mm:ss am/pm","en-US")}"
                              Width: =Parent.Width
                  - Container70_1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - ButtonCanvas33:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Outline
                              FontWeight: =""
                              Icon: ="DismissCircle"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: =Navigate(scrNhapTuSanXuat, ScreenTransition.CoverRight)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Đóng"
                              VerticalAlign: =VerticalAlign.Middle
      - con_PopupProcessingLogin:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varProcessing
            Width: =Parent.Width
          Children:
            - DialogProcessingLogin:
                Control: CanvasComponent
                ComponentName: DialogProccessing
                Properties:
                  Height: =App.Height
                  Width: =App.Width
