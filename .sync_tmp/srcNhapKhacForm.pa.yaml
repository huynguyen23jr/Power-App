Screens:
  srcNhapKhacForm:
    Children:
      - con_MainNhapKhoForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderNhapKhoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderNhapKhoForm:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =srcNhapKhacForm.Size
            - con_BodyNhapKhoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderNhapKhoForm.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_BodyMenuNhapKhoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =con_BodyMainNhapKhoForm.Height - 10
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =srcNhapKhacForm.Size <> 1
                        Width: |-
                          =If(
                              varShowMenuUser,
                              240,
                              0
                          )
                      Children:
                        - cmp_NavSidebarNhapKhoForm:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainNhapKhoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 250, 251, 1)
                        Height: =Parent.Height
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(srcNhapKhacForm.Size = 1, Parent.Width - 10, Parent.Width - con_BodyMenuNhapKhoForm.Width - 10)
                      Children:
                        - con_FormNhapKhoButton:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =45
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              PaddingBottom: =10
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =10
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Width: |
                                =Parent.Width - 15
                            Children:
                              - btn_BackNhapKhoForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Icon: ="ChevronLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Back()
                                    Width: =30
                              - btn_SaveNhapKhoForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Save"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =If(
                                          IsBlank(cmb_MovementType.Selected),
                                          Notify("Vui lòng chọn Movement type", NotificationType.Error, 2000),
                                          IsBlank(cmb_Kho.Selected),
                                          Notify("Vui lòng chọn Kho", NotificationType.Error, 2000),
                                          IfError(
                                              Set(
                                                  varWarehouseReceiptDetail,
                                                  Patch(
                                                     'QLK List Production Receipt Details',
                                                      If(IsBlank(varWarehouseReceiptDetail.ID), Defaults('QLK List Production Receipt Details'), varWarehouseReceiptDetail),
                                                      {
                                                          MovementType:   cmb_MovementType.Selected.MovementType,
                                                          PurchaseOrder:  txt_PurchaseOrder.Text,
                                                          ReceiptDate:  dp_ExecutionDate.SelectedDate,
                                                          SAPCode:          txt_MaSAP.Text,
                                                          BaggingWeight:   num_DeliveredQty.Value,
                                                          SLoc:            cmb_Kho.Selected.SLoc,
                                                          Note:           txt_NoteNhapKho.Text
                                                      }
                                                  )
                                              ),
                                              Notify("Lưu không thành công", NotificationType.Error, 2000),
                                              Notify("Lưu thành công", NotificationType.Success, 2000)
                                          )
                                      )
                                    Text: ="Lưu"
                              - btn_DeleteNhapKhoForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Delete"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xóa bản ghi này không?",
                                              {
                                                  Title: "Xác nhận xóa",
                                                  Subtitle: "Hành động này không thể hoàn tác.",
                                                  ConfirmButton: "Xóa",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          IfError(
                                              Remove('QLK List Production Receipt Details', varWarehouseReceiptDetail),
                                              Notify("Xóa không thành công", NotificationType.Error, 2000),
                                              Notify("Xóa thành công", NotificationType.Success, 2000);
                                              Back()
                                          )
                                      )
                                    Text: ="Xóa"
                                    Visible: |-
                                      =!IsBlank(varWarehouseReceiptDetail.ID) && 
                                      (
                                          varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||     // FG_WH         - Thủ kho thành phẩm
                                          varUserInPlant.Role = Index(col_RoleUser,9).RoleCode        // VHSX_HO       - VHSX HO
                                      ) &&
                                      !varWarehouseReceiptDetail.isSent
                                    Width: =100
                        - con_ScrollContentNhapKhoForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Height: =Parent.Height - con_FormNhapKhoButton.Height
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              Width: =Parent.Width - 10
                            Children:
                              - con_SectionNhapKho_1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =If(srcNhapKhacForm.Size = 1, 720, 480)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Width: =Parent.Width - 20
                                  Children:
                                    - lbl_TitleNhapKho:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="Thông tin nhập kho"
                                    - con_GridNhapKho_1:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =If(srcNhapKhacForm.Size = 1, 630, 300)
                                          LayoutGap: =If(srcNhapKhacForm.Size = 1, 0, 5)
                                          LayoutGridColumns: =If(srcNhapKhacForm.Size = 1, 1, 2)
                                          LayoutGridRows: =If(srcNhapKhacForm.Size = 1, 9, 5)
                                          PaddingBottom: =5
                                          PaddingLeft: =5
                                          PaddingRight: =5
                                          PaddingTop: =5
                                        Children:
                                          - con_FieldMovementType:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_MovementType_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Movement type *"
                                                - cmb_MovementType:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: =Filter('QLK List Movement Type Mapping', MovementType = varWarehouseReceiptDetail.MovementType)
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: ="Chọn movement type..."
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.MovementType
                                                      Items: ='QLK List Movement Type Mapping'
                                                      LayoutMinWidth: =16
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                                          - con_FieldPurchaseOrder:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_PurchaseOrder_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Purchase Order"
                                                - txt_PurchaseOrder:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varWarehouseReceiptDetail.PurchaseOrder
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Placeholder: ="Nhập Purchase Order..."
                                                      Size: =fxFontSizeMD
                                          - con_FieldExecutionDate:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_ExecutionDate_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Ngày thực hiện *"
                                                - dp_ExecutionDate:
                                                    Control: ModernDatePicker
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultDate: |-
                                                        =If(
                                                            IsBlank(varWarehouseReceiptDetail.ReceiptDate),
                                                            Today(),
                                                            varWarehouseReceiptDetail.ReceiptDate
                                                        )
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      Format: =DatePickerFormat.Short
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldMaNM:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_MaNM_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Mã NM"
                                                - txt_MaNM:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varWarehouseReceiptDetail.PlantCode
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Placeholder: ="Nhập Mã NM..."
                                                      Size: =fxFontSizeMD
                                          - con_FieldTenNM:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_TenNM_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Tên NM"
                                                - txt_TenNM:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varWarehouseReceiptDetail.PlantName
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Placeholder: ="Nhập Tên NM..."
                                                      Size: =fxFontSizeMD
                                          - con_FieldMaSAP_1:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_MaSAP_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Mã SAP"
                                                - txt_MaSAP:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varWarehouseReceiptDetail.SAPCode
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Placeholder: ="Nhập Mã SAP..."
                                                      Size: =fxFontSizeMD
                                          - con_FieldDeliveredQty:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_DeliveredQty_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Khối lượng giao nhận (kg)"
                                                - num_DeliveredQty:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varWarehouseReceiptDetail.BaggingWeight
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldKho:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_Kho_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Kho *"
                                                - cmb_Kho:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: =Filter('QLK List Master Data SLoc', SLoc = varWarehouseReceiptDetail.SLoc)
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: ="Chọn kho..."
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.SLocDisplayNameVN
                                                      Items: ='QLK List Master Data SLoc'
                                                      LayoutMinWidth: =16
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                                          - con_FieldNoteNhapKho:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_NoteNhapKho_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Chi chú"
                                                - txt_NoteNhapKho:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varWarehouseReceiptDetail.Note
                                                      DisplayMode: =DisplayMode.View
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Placeholder: ="Nhập chi chú..."
                                                      Size: =fxFontSizeMD
