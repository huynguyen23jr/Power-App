Screens:
  scrKiemKhoForm:
    Properties:
      OnVisible: =//UpdateContext({varShowMoreButton:!varShowMoreButton})
    Children:
      - con_MainKiemKhoHangBaoForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderKiemKhoHangBaoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderKiemKhoHangBaoForm:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrKiemKhoForm.Size
            - con_BodyKiemKhoHangBaoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderKiemKhoHangBaoForm.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_BodyMenuKiemKhoHangBaoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =con_BodyMainKiemKhoHangBaoForm.Height - 10
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =scrKiemKhoForm.Size <> 1
                        Width: |-
                          =If(
                              varShowMenuUser,
                              240,
                              0
                          )
                      Children:
                        - cmp_NavSidebarKiemKhoHangBaoForm:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainKiemKhoHangBaoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 250, 251, 1)
                        Height: =Parent.Height
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(scrKiemKhoForm.Size = 1, Parent.Width - 10, Parent.Width - con_BodyMenuKiemKhoHangBaoForm.Width - 10)
                      Children:
                        - con_FormKiemKhoHangBaoButton:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =If(scrKiemKhoForm.Size = 1, 56, 45)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(scrKiemKhoForm.Size = 1, 8, 5)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =If(scrKiemKhoForm.Size = 1, 8, 10)
                              PaddingLeft: =If(scrKiemKhoForm.Size = 1, 8, 10)
                              PaddingRight: =If(scrKiemKhoForm.Size = 1, 8, 10)
                              PaddingTop: =If(scrKiemKhoForm.Size = 1, 8, 10)
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Width: |
                                =Parent.Width - 15
                            Children:
                              - btn_BackKiemKhoHangBaoForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =If(scrKiemKhoForm.Size = 1, ButtonAppearance.Secondary, ButtonAppearance.Transparent)
                                    Height: =If(scrKiemKhoForm.Size = 1, 40, 32)
                                    Icon: ="ChevronLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Back();
                                    RadiusBottomLeft: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusBottomRight: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusTopLeft: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusTopRight: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    Width: =If(scrKiemKhoForm.Size = 1, 40, 30)
                              - btn_SaveKiemKhoHangBaoForm:
                                  Control: ModernButton
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =If(scrKiemKhoForm.Size = 1, ButtonAppearance.Primary, ButtonAppearance.Outline)
                                    FillPortions: =0
                                    Font: =fxFontFamily
                                    Height: =If(scrKiemKhoForm.Size = 1, 40, 32)
                                    Icon: ="Save"
                                    Layout: =If(scrKiemKhoForm.Size = 1, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =If(
                                          IsBlank(cmb_ProductCategory.Selected),
                                          Notify("Vui lòng chọn Loại sản phẩm", NotificationType.Error, 2000),
                                          Select(btn_PatchKiemKhoHangBao)
                                      )
                                    RadiusBottomLeft: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusBottomRight: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusTopLeft: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusTopRight: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    Text: ="Lưu"
                                    Tooltip: ="Lưu"
                                    Width: =If(scrKiemKhoForm.Size = 1, 40, 96)
                                    Visible: |-
                                      =// Chỉ cho phép thao tác khi phiếu đang ở trạng thái nháp
                                      varStockCountDetail.StatusCode = "DRAFT" || IsBlank(varStockCountDetail.ID)
                              - btn_SendKiemKho:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =//UpdateContext({con_PopupConfirmSubmit:true})
                                      If(
                                          Confirm(
                                              "Bạn có chắc chắn muốn hoàn thành kiểm kê không? 
                                      Sau khi xác nhận, dữ liệu kiểm kê sẽ được ghi nhận là hoàn tất và không thể chỉnh sửa.",
                                              {
                                                  Title: "Xác nhận hoàn thành kiểm kê",
                                                  ConfirmButton: "Xác nhận",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          IfError(
                                              Set(
                                                  varStockCountDetail,
                                                  Patch(
                                                      'QLK List Stock Count Details',
                                                      varStockCountDetail,
                                                      {StatusCode: "COUNT_CONFIRMED"}
                                                  )
                                              ),
                                              Notify(
                                                  "Xác nhận không thành công",
                                                  NotificationType.Error,
                                                  2000
                                              ),
                                              Notify(
                                                  "Xác nhận thành công",
                                                  NotificationType.Success,
                                                  2000
                                              )
                                          )
                                      )
                                    Text: ="Xác nhận"
                                    Visible: |-
                                      =// Chỉ cho phép thao tác khi phiếu đang ở trạng thái nháp
                                      varStockCountDetail.StatusCode = "DRAFT" && scrKiemKhoForm.Size <> 1
                                    Width: =120
                              - btn_RefreshKiemKhoHangBaoForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Height: =If(scrKiemKhoForm.Size = 1, 40, 32)
                                    Icon: ="ArrowClockwise"
                                    Layout: =If(scrKiemKhoForm.Size = 1, ButtonLayout.IconOnly, ButtonLayout.IconBefore)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Refresh('QLK List Stock Count Details')
                                    RadiusBottomLeft: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusBottomRight: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusTopLeft: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    RadiusTopRight: =If(scrKiemKhoForm.Size = 1, 8, 4)
                                    Text: ="Làm mới"
                                    Tooltip: ="Làm mới"
                                    Visible: |-
                                      =If(
                                          varStockCountDetail.StatusCode <> "DRAFT",
                                          true,
                                          scrKiemKhoForm.Size <> 1
                                      )
                                    Width: =If(scrKiemKhoForm.Size = 1, 40, 120)
                              - btn_PatchKiemKhoHangBao:
                                  Control: ModernButton
                                  Properties:
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =With(
                                          {
                                              // Loại kiểm kê lấy theo combobox đang chọn trên form (BAOQC / XABIN / BIGBAG)
                                              _type: cmb_StockCountType.Selected.ProductTypeCode
                                          },
                                          With(
                                              {
                                                  _data: {
                                                      StockCountDate:      dp_StockCountDate.SelectedDate,
                                                      StockCountType:      _type,
                                                      ProductCategoryCode: cmb_ProductCategory.Selected.ProductCategoryCode,
                                                      StatusCode:          cmb_Status.Selected.StatusCode,
                                                      SAPCode: Switch(
                                                          _type,
                                                          "XABIN",  cmb_XaDensityCode.Selected.CodeSAP,
                                                          "BIGBAG", cmb_ProductCode_Bigbag.Selected.SAPCode,
                                                                    cmb_ProductCode.Selected.SAPCode
                                                      ),
                                                      ProductCode: Switch(
                                                          _type,
                                                          "XABIN",  cmb_XaDensityCode.Selected.ShortCode,
                                                          "BIGBAG", cmb_ProductCode_Bigbag.Selected.ProductionCode,
                                                                    cmb_ProductCode.Selected.ProductionCode
                                                      ),
                                                      PalletQty:      num_PalletQty.Value,
                                                      OddBagQty:      num_OddBagQty.Value,
                                                      ProductionDate: dp_ProductionDate.SelectedDate,
                                                      BrokenBagQty:   num_BrokenBagQty.Value,
                                                      OddBoxQty:      num_OddBoxQty.Value,
                                                      OddKgQty:       num_OddKgQty.Value,
                                                      Note:           txt_Note_Bao.Text,
                                                      LocationName:   txt_LocationName_Bao.Text,

                                                      // Bin xá
                                                      DensityCode:  cmb_XaDensityCode.Selected.ShortCode,
                                                      BinCode:      cmb_XaBinCode.Selected.BinCode,
                                                      Measure1:     num_Measure1.Value,
                                                      Measure2:     num_Measure2.Value,
                                                      Measure3:     num_Measure3.Value,
                                                      DustSteamQty: num_DustSteamQty.Value,

                                                      // Hàng xá
                                                      DailyEmptyMeter: num_DailyEmptyMeter.Value,
                                                      HeightPart1:     num_HeightPart1.Value,
                                                      HeightPart2:     num_HeightPart2.Value,
                                                      HeightPart3:     num_HeightPart3.Value,
                                                      HeightPart4:     num_HeightPart4.Value,
                                                      HeightPart5:     num_HeightPart5.Value,
                                                      BinVolumeM3:     num_BinVolumeM3.Value,

                                                      // Bigbag
                                                      BigBagQty:       num_BigBagQty.Value,
                                                      BigBagWeight:    num_BigBagWeight.Value,
                                                      NetBigBagWeight: num_NetBigBagWeight.Value,

                                                      // Thông tin kiểm kê
                                                      ActualQty:       num_ActualQty.Value,
                                                      StockCountQtyKg: num_StockCountQtyKg.Value
                                                  }
                                              },
                                              IfError(
                                                  Set(
                                                      varStockCountDetail,
                                                      If(
                                                          IsBlank(varStockCountDetail.ID),

                                                          // CREATE: gán plant + người kiểm kê
                                                          Patch(
                                                              'QLK List Stock Count Details',
                                                              Defaults('QLK List Stock Count Details'),
                                                              _data,
                                                              {
                                                                  PlantCode: varUserInPlant.PlantCode,
                                                                  PlantName: varUserInPlant.PlantName,
                                                                  UserID:    varUserInPlant.UserID,
                                                                  UserName:  varUserInPlant.UserName
                                                              }
                                                          ),

                                                          // UPDATE: giữ nguyên plant + người kiểm kê ban đầu
                                                          Patch(
                                                              'QLK List Stock Count Details',
                                                              varStockCountDetail,
                                                              _data
                                                          )
                                                      )
                                                  ),
                                                  Notify("Lưu không thành công", NotificationType.Error, 2000),
                                                  Notify("Lưu thành công", NotificationType.Success, 2000)
                                              )
                                          )
                                      )
                                    Visible: =false
                              - btn_RefreshKiemKhoHangBaoForm_1:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Delete"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xóa bản ghi này không?",
                                              {
                                                  Title: "Xác nhận xóa",
                                                  Subtitle: "Hành động này không thể hoàn tác.",
                                                  ConfirmButton: "Xóa",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          IfError(
                                              Remove('QLK List Stock Count Details', varStockCountDetail),
                                              Notify("Xóa không thành công", NotificationType.Error,2000),
                                              Notify("Xóa thành công", NotificationType.Success,2000);
                                              Back()
                                          )
                                      )
                                    Text: ="Xóa"
                                    Visible: |-
                                      =// Chỉ cho phép thao tác khi phiếu đang ở trạng thái nháp
                                      varStockCountDetail.StatusCode = "DRAFT" && scrKiemKhoForm.Size <> 1
                                    Width: =100
                              - Button10:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Secondary
                                    Height: =40
                                    Icon: ="MoreHorizontal"
                                    Layout: =ButtonLayout.IconOnly
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =UpdateContext({varShowMoreButton:!varShowMoreButton})
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                    Tooltip: ="Thêm thao tác"
                                    Visible: |-
                                      =If(
                                          varStockCountDetail.StatusCode <> "DRAFT",
                                          false,
                                          scrKiemKhoForm.Size = 1
                                      )
                                    Width: =40
                        - con_ScrollContentKiemKhoHangBaoForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Height: =Parent.Height - con_FormKiemKhoHangBaoButton.Height
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              Width: =Parent.Width - 10
                            Children:
                              - con_SectionChung:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =If(scrKiemKhoForm.Size = 1, 340, 220)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =If(scrKiemKhoForm.Size = 1, 0, 5)
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrKiemKhoForm.Width > 768 || IsBlank(varStockCountDetail.ID)
                                    Width: =Parent.Width - 20
                                  Children:
                                    - lbl_TitleChung:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="Thông tin chung"
                                    - con_GridChung:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =If(scrKiemKhoForm.Size = 1, 300, 160)
                                          LayoutGap: =If(scrKiemKhoForm.Size = 1, 0, 5)
                                          LayoutGridColumns: =If(scrKiemKhoForm.Size = 1, 1, 2)
                                          LayoutGridRows: =If(scrKiemKhoForm.Size = 1, 4, 2)
                                          PaddingBottom: =5
                                          PaddingLeft: =5
                                          PaddingRight: =5
                                          PaddingTop: =5
                                        Children:
                                          - con_FieldStockCountDate:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_StockCountDate:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Ngày kiểm kê *"
                                                - dp_StockCountDate:
                                                    Control: ModernDatePicker
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Start
                                                      DefaultDate: |-
                                                        =If(
                                                            scrKiemKhoForm.Width <= 768 && !IsBlank(varStockCountDetail.ID),
                                                            dp_StockCountDate_Clone.SelectedDate,
                                                            If(
                                                                IsBlank(varStockCountDetail.ID),
                                                                Today(),
                                                                varStockCountDetail.StockCountDate
                                                            )
                                                        )
                                                      DisplayMode: =If(!IsBlank(varStockCountDetail.ID) && varStockCountDetail.StatusCode <> "DRAFT", DisplayMode.Disabled, DisplayMode.Edit)
                                                      Font: =fxFontFamily
                                                      Format: =DatePickerFormat.Short
                                                      LayoutMinWidth: =Parent.Width
                                                      Size: =fxFontSizeMD
                                                      Width: =Parent.Width
                                          - con_FieldStockCountType:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_StockCountType:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Loại kiểm kê *"
                                                - cmb_StockCountType:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: =Filter(col_ProductTypes, ProductTypeCode = varStockCountType)
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: ="Chọn loại kiểm kê..."
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.ProductTypeNameVI
                                                      Items: =col_ProductTypes
                                                      LayoutMinWidth: =16
                                                      OnChange: |-
                                                        =Reset(cmb_ProductCode);
                                                        Reset(num_PalletQty);
                                                        Reset(num_OddBagQty);
                                                        Reset(dp_ProductionDate);
                                                        Reset(num_BrokenBagQty);
                                                        Reset(num_OddBoxQty);
                                                        Reset(num_OddKgQty);
                                                        Reset(txt_Note_Bao);
                                                        Reset(txt_LocationName_Bao);
                                                        Reset(cmb_XaDensityCode);
                                                        Reset(cmb_XaBinCode);
                                                        Reset(num_Measure1);
                                                        Reset(num_Measure2);
                                                        Reset(num_Measure3);
                                                        Reset(num_DustSteamQty);
                                                        Reset(cmb_ProductCode_Bigbag);
                                                        Reset(num_BigBagQty);
                                                        Reset(num_BigBagWeight);
                                                        Reset(num_NetBigBagWeight)
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                                          - con_FieldProductCategory:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_ProductCategory:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Loại hàng *"
                                                - cmb_ProductCategory:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: |-
                                                        =If(
                                                            scrKiemKhoForm.Width <= 768 && !IsBlank(varStockCountDetail.ID),
                                                            Filter(col_ProductCategories, ProductCategoryCode = cmb_ProductCategory_Clone.Selected.ProductCategoryCode),
                                                            If(
                                                                IsBlank(varStockCountDetail.ID),
                                                                Filter(
                                                                    col_ProductCategories,
                                                                    ProductCategoryCode = varUserInPlant.ProductCategoryCode
                                                                ),
                                                                Filter(col_ProductCategories, ProductCategoryCode = varStockCountDetail.ProductCategoryCode)
                                                            )
                                                        )
                                                      DisplayMode: =If(!IsBlank(varStockCountDetail.ID) && varStockCountDetail.StatusCode <> "DRAFT", DisplayMode.Disabled, DisplayMode.Edit)
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: ="Chọn loại hàng..."
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                      Items: =col_ProductCategories
                                                      LayoutMinWidth: =16
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                                          - con_FieldStatus:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_Status:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Trạng thái"
                                                - cmb_Status:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: |-
                                                        =With(
                                                            {
                                                                statusCode: Coalesce(
                                                                    varStockCountDetail.StatusCode,
                                                                    "DRAFT"
                                                                )
                                                            },
                                                            Filter(
                                                                col_WorkflowStatus,
                                                                StatusCode = statusCode
                                                            )
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: ="Chọn trạng thái..."
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.StatusNameVI
                                                      Items: =col_WorkflowStatus
                                                      LayoutMinWidth: =16
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                              - con_SectionHangBao:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =450
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
