                                                            )
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldHeightPart1:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_HeightPart1:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Chiều cao Phần 1 (m)"
                                                - num_HeightPart1:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |-
                                                        =RoundUp(
                                                            With(
                                                                {
                                                                    dailyEmptyMeter: Coalesce(Value(num_DailyEmptyMeter.Value), 0), // Số mét rỗng đo hàng ngày
                                                                    h1:              Coalesce(Value(cmb_XaBinCode.Selected.H1), 0)  // Chiều cao tối đa Phần 1 (từ bin)
                                                                },
                                                                If(
                                                                    dailyEmptyMeter <= h1,           // Mét rỗng nằm trong Phần 1
                                                                    h1 - dailyEmptyMeter,            // Chiều cao hàng Phần 1 = H1 - mét rỗng
                                                                    0                                // Mét rỗng vượt qua Phần 1 → cao = 0
                                                                )
                                                            ),
                                                            2
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldHeightPart2:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_HeightPart2:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Chiều cao Phần 2 (m)"
                                                - num_HeightPart2:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |
                                                        =Round(
                                                            With(
                                                                {
                                                                    heightPart1:     Coalesce(Value(num_HeightPart1.Value), 0),
                                                                    dailyEmptyMeter: Coalesce(Value(num_DailyEmptyMeter.Value), 0),
                                                                    h1:              Coalesce(Value(cmb_XaBinCode.Selected.H1), 0),
                                                                    h2:              Coalesce(Value(cmb_XaBinCode.Selected.H2), 0)
                                                                },
                                                                If(
                                                                    heightPart1 <> 0,
                                                                    h2,
                                                                    If(
                                                                        dailyEmptyMeter - h1 < h2,
                                                                        h2 - (dailyEmptyMeter - h1),
                                                                        0
                                                                    )
                                                                )
                                                            ),
                                                            2
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldHeightPart3:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_HeightPart3:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Chiều cao Phần 3 (m)"
                                                - num_HeightPart3:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |-
                                                        =RoundUp(
                                                            With(
                                                                {
                                                                    heightPart2:     Coalesce(Value(num_HeightPart2.Value), 0),
                                                                    dailyEmptyMeter: Coalesce(Value(num_DailyEmptyMeter.Value), 0),
                                                                    h1:              Coalesce(Value(cmb_XaBinCode.Selected.H1), 0),
                                                                    h2:              Coalesce(Value(cmb_XaBinCode.Selected.H2), 0),
                                                                    h3:              Coalesce(Value(cmb_XaBinCode.Selected.H3), 0)
                                                                },
                                                                If(
                                                                    heightPart2 <> 0,
                                                                    h3,
                                                                    If(
                                                                        dailyEmptyMeter - h1 - h2 < h3,
                                                                        h3 - (dailyEmptyMeter - h1 - h2),
                                                                        0
                                                                    )
                                                                )
                                                            ),
                                                            2
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldHeightPart4:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_HeightPart4:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Chiều cao Phần 4 (m)"
                                                - num_HeightPart4:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |
                                                        =RoundUp(
                                                            With(
                                                                {
                                                                    heightPart3:     Coalesce(Value(num_HeightPart3.Value), 0),
                                                                    dailyEmptyMeter: Coalesce(Value(num_DailyEmptyMeter.Value), 0),
                                                                    h1:              Coalesce(Value(cmb_XaBinCode.Selected.H1), 0),
                                                                    h2:              Coalesce(Value(cmb_XaBinCode.Selected.H2), 0),
                                                                    h3:              Coalesce(Value(cmb_XaBinCode.Selected.H3), 0),
                                                                    h4:              Coalesce(Value(cmb_XaBinCode.Selected.H4), 0)
                                                                },
                                                                If(
                                                                    heightPart3 <> 0,
                                                                    h4,
                                                                    If(
                                                                        dailyEmptyMeter - h1 - h2 - h3 < h4,
                                                                        h4 - (dailyEmptyMeter - h1 - h2 - h3),
                                                                        0
                                                                    )
                                                                )
                                                            ),
                                                            2
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldHeightPart5:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_HeightPart5:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Chiều cao Phần 5 (m)"
                                                - num_HeightPart5:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |
                                                        =RoundUp(
                                                            With(
                                                                {
                                                                    heightPart4:     Coalesce(Value(num_HeightPart4.Value), 0),
                                                                    dailyEmptyMeter: Coalesce(Value(num_DailyEmptyMeter.Value), 0),
                                                                    h1:              Coalesce(Value(cmb_XaBinCode.Selected.H1), 0),
                                                                    h2:              Coalesce(Value(cmb_XaBinCode.Selected.H2), 0),
                                                                    h3:              Coalesce(Value(cmb_XaBinCode.Selected.H3), 0),
                                                                    h4:              Coalesce(Value(cmb_XaBinCode.Selected.H4), 0),
                                                                    h5:              Coalesce(Value(cmb_XaBinCode.Selected.H5), 0)
                                                                },
                                                                If(
                                                                    heightPart4 <> 0,
                                                                    h5,
                                                                    If(
                                                                        dailyEmptyMeter - h1 - h2 - h3 - h4 < h5,
                                                                        h5 - (dailyEmptyMeter - h1 - h2 - h3 - h4),
                                                                        0
                                                                    )
                                                                )
                                                            ),
                                                            2
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldBinVolumeM3:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_BinVolumeM3:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Thể tích Bin chứa hàng (m3)"
                                                - num_BinVolumeM3:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |-
                                                        =With(
                                                            {
                                                                // Chiều cao từng phần
                                                                caoP1:  Coalesce(num_HeightPart1.Value, 0),
                                                                caoP2:  Coalesce(num_HeightPart2.Value, 0),
                                                                caoP3:  Coalesce(num_HeightPart3.Value, 0),
                                                                caoP4:  Coalesce(num_HeightPart4.Value, 0),
                                                                caoP5:  Coalesce(num_HeightPart5.Value, 0),
                                                                // Diện tích mặt cắt từ bin (Aging = mức độ chứa đầy)
                                                                s11:    Coalesce(Value(cmb_XaBinCode.Selected.Aging1Min), 0),    // S1 đáy trên
                                                                s12:    Coalesce(Value(cmb_XaBinCode.Selected.Aging1Max), 0),    // S1 đáy dưới / S2 đáy trên
                                                                s21:    Coalesce(Value(cmb_XaBinCode.Selected.Aging2Min), 0),    // S2 đáy trên
                                                                s2231:  Coalesce(Value(cmb_XaBinCode.Selected.Aging2MaxAging3Min), 0), // Biên P2-P3
                                                                s3241:  Coalesce(Value(cmb_XaBinCode.Selected.Aging3MaxAging4Min), 0), // Biên P3-P4
                                                                s4251:  Coalesce(Value(cmb_XaBinCode.Selected.Aging4MaxAging5Min), 0), // Biên P4-P5
                                                                s52:    Coalesce(Value(cmb_XaBinCode.Selected.Aging5Max), 0)     // S5 đáy dưới
                                                            },
                                                            Round(
                                                                caoP1 * (s11 - s12)                                              // Phần 1: hình lăng trụ
                                                                + 1/3 * caoP2 * ((s21   + s2231) + Sqrt(s21   * s2231))         // Phần 2: hình nón cụt
                                                                + 1/3 * caoP3 * ((s2231 + s3241) + Sqrt(s2231 * s3241))         // Phần 3: hình nón cụt
                                                                + 1/3 * caoP4 * ((s3241 + s4251) + Sqrt(s3241 * s4251))         // Phần 4: hình nón cụt
                                                                + 1/3 * caoP5 * ((s4251 + s52)   + Sqrt(s4251 * s52)),          // Phần 5: hình nón cụt
                                                                2
                                                            )
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                              - con_SectionKetQuaHàngBao:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: |-
                                      =If(
                                          scrKiemKhoForm.Size = 1,
                                          210,
                                          150
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =cmb_ProductCategory.Selected.ProductCategoryCode = "FINISHED_GOODS" && !IsBlank(varStockCountDetail.ID)
                                    Width: =Parent.Width - 20
                                  Children:
                                    - lbl_TitleKetQua:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="Kết quả kiểm kê hàng bao"
                                    - con_GridKetQua:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =If(scrKiemKhoForm.Size = 1, 180, 90)
                                          LayoutGap: =If(scrKiemKhoForm.Size = 1, 0, 5)
                                          LayoutGridColumns: =If(scrKiemKhoForm.Size = 1, 1, 2)
                                          LayoutGridRows: =If(scrKiemKhoForm.Size = 1, 2, 1)
                                          PaddingBottom: =5
                                          PaddingLeft: =5
                                          PaddingRight: =5
                                          PaddingTop: =5
                                        Children:
                                          - con_FieldActualQty:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_ActualQty:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Số kg tồn (Kg)"
                                                - num_ActualQty:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |-
                                                        =// Số kg tồn: tính theo loại kiểm kê (áp dụng cho cả thành phẩm và nguyên liệu)
                                                        Switch(
                                                            cmb_StockCountType.Selected.ProductTypeCode,
                                                            "BAOQC",    // Hàng bao: (pallet × lớp/pallet × bao/lớp + bao lẻ + bao rách) × kg/bao + kg lẻ
                                                            With(
                                                                {
                                                                    palletQty:      Coalesce(Value(num_PalletQty.Value), 0),
                                                                    oddBagQty:      Coalesce(Value(num_OddBagQty.Value), 0),
                                                                    brokenBagQty:   Coalesce(Value(num_BrokenBagQty.Value), 0),
                                                                    layerPerPallet: Coalesce(Value(cmb_ProductCode.Selected.LayerPerPallet), 0),
                                                                    bagPerLayer:    Coalesce(Value(cmb_ProductCode.Selected.BagPerLayer), 0),
                                                                    bagSize:        Coalesce(Value(cmb_ProductCode.Selected.BagSize), 0),
                                                                    oddKgQty:       Coalesce(Value(num_OddKgQty.Value), 0)
                                                                },
                                                                Round(
                                                                    ((palletQty * layerPerPallet * bagPerLayer) + oddBagQty + brokenBagQty) * bagSize + oddKgQty,
                                                                    2
                                                                )
                                                            ),
                                                            "BIGBAG",   // Bigbag: lấy trọng lượng bigbag
                                                            Coalesce(num_BigBagWeight.Value, 0),
                                                            "XABIN",    // Hàng xá: mật độ × thể tích bin
                                                            With(
                                                                {
                                                                    density: Coalesce(Value(cmb_XaDensityCode.Selected.Density), 0),
                                                                    thetich: Coalesce(Value(num_BinVolumeM3.Value), 0)
                                                                },
                                                                Round(density * thetich, 2)
                                                            ),
                                                            0
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldStockCountQtyKg:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_StockCountQtyKg:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Số ngày lưu kho"
                                                - num_StockCountQtyKg:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |-
                                                        =If(
                                                            cmb_ProductCategory.Selected.ProductCategoryCode = "FINISHED_GOODS", //Thành phẩm
                                                            Switch(
                                                                cmb_StockCountType.Selected.ProductTypeCode,
                                                                "BAOQC", //hàng bao
                                                                Today() - dp_ProductionDate.SelectedDate,
                                                                "BIGBAG",
                                                                Today() - dp_ProductionDate.SelectedDate,
                                                                "XABIN", //hàng xá
                                                                Today() - dp_StockCountDate.SelectedDate,
                                                                0
                                                            ),
                                                            cmb_ProductCategory.Selected.ProductCategoryCode = "RAW_MATERIAL",
                                                            Switch(
                                                                cmb_StockCountType.Selected.ProductTypeCode,
                                                                "BAOQC",
                                                                Today() - dp_StockCountDate.SelectedDate,
                                                                "BIGBAG",
                                                                Today() - dp_StockCountDate.SelectedDate,
                                                                "XABIN",
                                                                Today() - dp_StockCountDate.SelectedDate,
                                                                0
                                                            ),
                                                            0
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                              - con_SectionAttachment:
