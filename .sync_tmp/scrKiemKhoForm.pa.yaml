                                              Children:
                                                - lbl_DailyEmptyMeter:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Số mét rỗng đo hàng ngày (m)"
                                                - num_DailyEmptyMeter:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: |-
                                                        =With(
                                                            {
                                                                // Số đo 3 lần
                                                                measure1: Coalesce(num_Measure1.Value, 0), // Số đo lần 1
                                                                measure2: Coalesce(num_Measure2.Value, 0), // Số đo lần 2
                                                                measure3: Coalesce(num_Measure3.Value, 0)  // Số đo lần 3
                                                            },
                                                            Round(
                                                                (measure1 + measure2 + measure3) / 3, // Trung bình 3 lần đo
