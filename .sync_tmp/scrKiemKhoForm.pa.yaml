      - con_PopupSendKiemKho:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =con_PopupConfirmSubmit
            Width: =Parent.Width
          Children:
            - DialogAlertSendKiemKho:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =Parent.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({con_PopupConfirmSubmit:false})
                  varConfirmDialogAction: |-
                    =// Đóng popup xác nhận, hiện loading
                    UpdateContext({con_PopupConfirmSubmit: false});
                    UpdateContext({varShowPopupProcessing: true});

                    IfError(
                        Set(
                            varStockCountDetail,
                            Patch(
                                'QLK List Stock Count Details',
                                varStockCountDetail,
                                {StatusCode: "COUNT_CONFIRMED"}
                            )
                        ),
                        Notify("Gửi không thành công", NotificationType.Error,2000),
                        Notify("Gửi thành công", NotificationType.Success,2000)
                    );

                    // Ẩn loading sau khi hoàn tất
                    UpdateContext({varShowPopupProcessing: false})
                  varLabel: |-
                    ="Bạn có chắc chắn muốn hoàn thành kiểm kê không?
                    Sau khi xác nhận, dữ liệu kiểm kê sẽ được ghi nhận là hoàn tất và không thể chỉnh sửa"
                  varTitle: ="Xác nhận hoàn thành kiểm kê"
