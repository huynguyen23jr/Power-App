                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =Text7.Height + Container13.Height + Container13_1.Height + 20
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  Width: |
                    =Switch(
                        scrNhapKhac.Size,
                        ScreenSize.Small,   Parent.Width * 0.8,   // Mobile
                        ScreenSize.Medium,  Parent.Width * 0.3,   // Tablet / iPad
                        ScreenSize.Large,   Parent.Width * 0.35,   // Web/Desktop
                        Parent.Width * 0.2                   // Fallback (Large/XLarge)
                    )
                Children:
                  - Text7:
                      Control: ModernText
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: ="Thông tin"
                  - Container13:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Container15.Height * 3.5
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - Container15:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =35
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Text8:
                                  Control: ModernText
                                  Properties:
                                    Font: =Font.'Segoe UI'
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =14
                                    Text: ="Ngày nhập"
                                    Width: =120
                              - DatePicker2:
                                  Control: ModernDatePicker
                                  Properties:
                                    DefaultDate: =Today()
                                    Format: =DatePickerFormat.Short
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Placeholder: ="Chọn ngày ..."
                                    Width: =Parent.Width - Text8.Width - 5
                        - Container15_1:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =35
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Text8_1:
                                  Control: ModernText
                                  Properties:
                                    Font: =Font.'Segoe UI'
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =14
                                    Text: ="Loại sản phẩm"
                                    Width: =120
                              - Combobox1:
                                  Control: ModernCombobox
                                  Properties:
                                    DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                    InputTextPlaceholder: ="Chọn loại sản phẩm ..."
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                    Items: =col_ProductCategories
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    SelectMultiple: =false
                                    Width: =Parent.Width - Text8_1.Width - 5
                        - Container15_2:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =35
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Text8_2:
                                  Control: ModernText
                                  Properties:
                                    Font: =Font.'Segoe UI'
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =14
                                    Text: ="Sloc"
                                    Width: =120
                              - Combobox1_1:
                                  Control: ModernCombobox
                                  Properties:
                                    InputTextPlaceholder: ="Chọn sloc ..."
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.SLocDisplayNameVN
                                    Items: |-
                                      =Filter(
                                          'QLK List Master Data SLoc',
                                          PlantCode = varUserInPlant.PlantCode
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    SelectMultiple: =false
                                    Width: =Parent.Width - Text8_2.Width - 5
                  - Container13_1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =10
                        PaddingRight: =10
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - Button7:
                            Control: ModernButton
                            Properties:
                              Icon: ="CheckmarkCircle"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |
                                =If(
                                    IsBlank(Combobox1.Selected),
                                    Notify("Vui lòng chọn Loại sản phẩm", NotificationType.Warning, 2000),

                                    IsBlank(Combobox1_1.Selected),
                                    Notify("Vui lòng chọn SLoc", NotificationType.Warning, 2000),

                                    // Else: đủ điều kiện, gọi flow
                                    UpdateContext({varShowPopupGetImportData: false});
                                    UpdateContext({varShowPopupProcessing: true});
                                    With(
                                        {
                                            _result: 'QLK|GetWarehouseReceiptData'.Run(
                                                varUserInPlant.PlantCode,                              // Mã plant
                                                Text(DatePicker2.SelectedDate, "dd.mm.yyyy"),          // Ngày nhập (chuỗi hiển thị)
                                                Text(DatePicker2.SelectedDate, "yyyy-mm-dd"),          // Ngày nhập (ISO gửi flow)
                                                0,                                                      // Ca sản xuất
                                                "OTHER",                                                // Loại nhập đầu tiên
                                                0,                                                       // ID phiếu nhập
                                                Combobox1.Selected.ProductCategoryCode,                 // Mã loại sản phẩm
                                                Combobox1_1.Selected.SLoc,
                                                varUserInPlant.PlantName
                                            )
                                        },
                                        If(
                                            _result.status = "OK",
                                            Notify(_result.message, NotificationType.Information, 2000);
                                            UpdateContext({varShowPopupProcessing: false});
                                            Refresh('QLK List Production Receipt Details'),
                                            Notify(_result.message, NotificationType.Information, 2000);
                                            UpdateContext({varShowPopupProcessing: false})
                                        )
                                    );
                                )
                              Text: ="Đồng bộ"
                              Width: =110
                        - Button7_1:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Icon: ="DismissCircle"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =UpdateContext({varShowPopupGetImportData: false})
                              Text: ="Đóng"
                              Width: =110
