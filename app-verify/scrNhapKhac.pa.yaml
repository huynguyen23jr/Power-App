Screens:
  scrNhapKhac:
    Properties:
      OnVisible: =varShowMenuUser && scrNhapKhac.Size <> 1
    Children:
      - con_MainNhapTuSanXuat_3:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderNhapTuSanXuat_3:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderNhapTuSanXuat_3:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrNhapTuSanXuat.Size
            - con_BodyNhapTuSanXuat_4:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderNhapTuSanXuat_3.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_MenuNhapTuSanXuat_3:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =scrNhapTuSanXuat.Size <> 1
                        Width: =If(varShowMenuUser, 240, 0)
                      Children:
                        - cmp_NavSidebarNhapTuSanXuat_3:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_ContentNhapTuSanXuat_3:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: |-
                          =If(
                              scrDanhMucBin.Size = 1,
                              DropShadow.Semibold,
                              DropShadow.None
                          )
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                        RadiusTopRight: =0
                      Children:
                        - con_ActionHeaderNhapTuSanXuat_3:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - btn_RefreshNhapTuSanXuat_3:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="ArrowSync"
                                    OnSelect: =Refresh('QLK List Production Receipt Details')
                                    Size: =fxFontSizeMD
                                    Text: ="Làm mới"
                                    Width: =120
                              - btn_RefreshNhapTuSanXuat_5:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Database"
                                    OnSelect: |-
                                      =UpdateContext({varShowPopupGetImportData: true});
                                      Reset(Combobox1);
                                      Reset(Combobox1_1);
                                    Size: =fxFontSizeMD
                                    Text: ="Đồng bộ"
                                    Visible: |-
                                      =varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||     // FG_WH         - Thủ kho thành phẩm
                                      varUserInPlant.Role = Index(col_RoleUser,9).RoleCode        // VHSX_HO       - VHSX HO
                                    Width: =120
                              - btn_RefreshNhapTuSanXuat_8:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Send"
                                    OnSelect: |-
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn gửi " & CountRows(col_GallarySelectedNhapKhac) & " bản ghi đã chọn không?",
                                              {
                                                  Title: "Xác nhận gửi",
                                                  Subtitle: "Hành động này sẽ đánh dấu các bản ghi đã chọn là đã gửi.",
                                                  ConfirmButton: "Gửi",
                                                  CancelButton: "Hủy"
                                              }
                                          ),

                                          // Hiển thị popup xử lý
                                          UpdateContext({varShowPopupProcessing: true});

                                          IfError(
                                              // Xóa collection tạm dùng để cập nhật dữ liệu
                                              Clear(col_UpdateGallarySelectedNhapKhac);

                                              // Chuẩn bị dữ liệu Patch
                                              ForAll(
                                                  col_GallarySelectedNhapKhac As item,
                                                  Collect(
                                                      col_UpdateGallarySelectedNhapKhac,
                                                      {
                                                          ID: item.ID,
                                                          isSent: true
                                                      }
                                                  )
                                              );

                                              // Cập nhật trạng thái đã gửi
                                              Patch(
                                                  'QLK List Production Receipt Details',
                                                  col_UpdateGallarySelectedNhapKhac
                                              );

                                              // Gửi email/thông báo xác nhận nhập kho
                                              'QLK|NotifyWarehouseReceiptConfirmation'.Run(
                                                  "",
                                                  0,
                                                  varUserInPlant.PlantName,
                                                  Index(col_ReceiptType, 3).ReceiptTypeCode,
                                                  Index(col_WorkflowStatus, 1).StatusCode,
                                                  Text(DatePicker1_4.SelectedDate, "yyyy-mm-dd"),
                                                  varUserInPlant.PlantCode,
                                                  LookUp(col_ProductCategories, ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_6.Selected.ProductCategoryCode).ProductCategoryNameVI
                                              ),

                                              // Xử lý khi lỗi
                                              Notify(
                                                  "Gửi không thành công",
                                                  NotificationType.Error,
                                                  2000
                                              ),

                                              // Xử lý khi thành công
                                              Notify(
                                                  "Gửi thành công",
                                                  NotificationType.Success,
                                                  2000
                                              );

                                              // Tải lại dữ liệu
                                              Refresh('QLK List Production Receipt Details')
                                          );

                                          // Ẩn popup xử lý
                                          UpdateContext({varShowPopupProcessing: false});

                                          // Xóa danh sách record đã chọn
                                          Clear(col_GallarySelectedNhapKhac)
                                      )
                                    Size: =fxFontSizeMD
                                    Text: ="Gửi"
                                    Visible: |-
                                      =CountRows(Filter(col_GallarySelectedNhapKhac,!isSent)) > 0 && 
                                      (
                                          varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||     // FG_WH         - Thủ kho thành phẩm
                                          varUserInPlant.Role = Index(col_RoleUser,9).RoleCode        // VHSX_HO       - VHSX HO
                                      )
                                    Width: =120
                              - btn_RefreshNhapTuSanXuat_6:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    OnSelect: |-
                                      =// ============================================================
                                      // Xác nhận từ kho các bản ghi Nhập khác đã chọn
                                      // ============================================================
                                      If(
                                          // ── Hỏi xác nhận trước khi thực hiện ─────────────────────
                                          Confirm(
                                              "Bạn có chắc muốn xác nhận các bản ghi đã chọn không?",
                                              {
                                                  Title: "Xác nhận",
                                                  Subtitle: "Có " & CountRows(col_GallarySelectedNhapKhac) & " bản ghi được chọn. Hành động này sẽ đánh dấu các bản ghi này là đã xác nhận từ kho.",
                                                  ConfirmButton: "Xác nhận",
                                                  CancelButton: "Hủy"
                                              }
                                          ),

                                          // ── Người dùng đồng ý → bắt đầu xử lý ────────────────────

                                          // 1. Hiện popup loading
                                          UpdateContext({varShowPopupProcessing: true});

                                          // 2. Xóa payload của lần xác nhận trước
                                          Clear(col_updateStatusNhapKhac);

                                          // 3. Xử lý xác nhận
                                          //    - Giá trị 1: chuỗi thao tác cần chạy (chuẩn bị payload, ghi SharePoint)
                                          //    - Giá trị 2: chạy khi có lỗi      → báo "Xác nhận không thành công"
                                          //    - Giá trị 3: chạy khi thành công  → báo thành công, gửi thông báo, làm mới, dọn dẹp
                                          IfError(

                                              // [1] Chuẩn bị payload: mỗi bản ghi đã chọn → ConfirmFromWarehouse = true
                                              ForAll(
                                                  col_GallarySelectedNhapKhac As item,
                                                  Collect(
                                                      col_updateStatusNhapKhac,
                                                      {
                                                          ID: item.ID,
                                                          ConfirmFromWarehouse: true
                                                      }
                                                  )
                                              );

                                              // [2] Ghi ConfirmFromWarehouse = true lên SharePoint
                                              Patch(
                                                  'QLK List Production Receipt Details',
                                                  col_updateStatusNhapKhac
                                              ),

                                              // Nhánh lỗi
                                              Notify("Xác nhận không thành công", NotificationType.Error, 2000),

                                              // Nhánh thành công
                                              // [3] Thông báo thành công
                                              Notify("Đã xác nhận thành công!", NotificationType.Success, 2000);

                                              // [4] Gửi thông báo cho kho
                                              'QLK|NotifyWarehouseReceiptConfirmation'.Run(
                                                  "",
                                                  0,
                                                  varUserInPlant.PlantName,
                                                  Index(col_ReceiptType, 3).ReceiptTypeCode,
                                                  Index(col_WorkflowStatus, 4).StatusCode,
                                                  Text(DatePicker1_4.SelectedDate, "yyyy-mm-dd"),
                                                  varUserInPlant.PlantCode,
                                                  LookUp(col_ProductCategories, ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_6.Selected.ProductCategoryCode).ProductCategoryNameVI
                                              );

                                              // [5] Làm mới dữ liệu và dọn dẹp
                                              Refresh('QLK List Production Receipt Details');
                                              Clear(col_GallarySelectedNhapKhac);
                                              Clear(col_updateStatusNhapKhac)
                                          );

                                          // 4. Ẩn loading
                                          UpdateContext({varShowPopupProcessing: false})
                                      )
                                    Size: =fxFontSizeMD
                                    Text: ="Xác nhận"
                                    Visible: =CountRows(Filter(col_GallarySelectedNhapKhac,isSent)) > 0 && varUserInPlant.Role = Index(col_RoleUser,2).RoleCode
                                    Width: =120
                              - btn_RefreshNhapTuSanXuat_7:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Delete"
                                    OnSelect: |
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xóa các bản ghi đã chọn không?",
                                              {
                                                  Title: "Xác nhận xóa",
                                                  Subtitle: "Có " & CountRows(col_GallarySelectedNhapKhac) & " bản ghi được chọn. Hành động này không thể hoàn tác.",
                                                  ConfirmButton: "Xóa",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          UpdateContext({varShowPopupProcessing: true});
                                          IfError(
                                              Remove(
                                                  'QLK List Production Receipt Details',
                                                  col_GallarySelectedNhapKhac
                                              ),
                                              Notify("Xóa không thành công", NotificationType.Error, 2000),
                                              Notify("Đã xóa thành công!", NotificationType.Success, 2000);
                                              Refresh('QLK List Production Receipt Details');
                                              Clear(col_GallarySelectedNhapKhac)
                                          );
                                          UpdateContext({varShowPopupProcessing: false})
                                      )
                                    Size: =fxFontSizeMD
                                    Text: ="Xóa"
                                    Visible: |-
                                      =CountRows(col_GallarySelectedNhapKhac) > 0 && 
                                      (
                                          varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||     // FG_WH         - Thủ kho thành phẩm
                                          varUserInPlant.Role = Index(col_RoleUser,9).RoleCode        // VHSX_HO       - VHSX HO
                                      )
                                    Width: =120
                              - btn_RefreshNhapTuSanXuat_9:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="DismissCircle"
                                    OnSelect: |-
                                      =// ============================================================
                                      // Gửi các bản ghi Nhập khác đã chọn
                                      // ============================================================
                                      If(
                                          // ── Hỏi xác nhận trước khi gửi ───────────────────────────
                                          Confirm(
                                              "Bạn có chắc muốn từ chối " & CountRows(col_GallarySelectedNhapKhac) & " bản ghi đã chọn không?",
                                              {
                                                  Title: "Xác nhận gửi",
                                                  Subtitle: "Hành động này sẽ đánh dấu các bản ghi đã chọn là đã gửi.",
                                                  ConfirmButton: "Gửi",
                                                  CancelButton: "Hủy"
                                              }
                                          ),

                                          // ── Người dùng đồng ý → bắt đầu xử lý ────────────────────

                                          // 1. Hiện popup loading
                                          UpdateContext({varShowPopupProcessing: true});

                                          // 2. Xử lý gửi
                                          //    - Giá trị 1: chuỗi thao tác cần chạy (chuẩn bị payload, ghi SharePoint, gửi thông báo)
                                          //    - Giá trị 2: chạy khi có lỗi  → báo "Từ chối không thành công"
                                          //    - Giá trị 3: chạy khi thành công → báo "Đã từ chối" và làm mới dữ liệu
                                          IfError(

                                              // [1] Chuẩn bị payload: mỗi bản ghi đã chọn → isSent = true
                                              Clear(col_UpdateGallarySelectedNhapKhac);
                                              ForAll(
                                                  col_GallarySelectedNhapKhac As item,
                                                  Collect(
                                                      col_UpdateGallarySelectedNhapKhac,
                                                      {
                                                          ID: item.ID,
                                                          isSent: false
                                                      }
                                                  )
                                              );

                                              // [2] Ghi isSent = true lên SharePoint
                                              Patch(
                                                  'QLK List Production Receipt Details',
                                                  col_UpdateGallarySelectedNhapKhac
                                              );

                                              // [3] Gửi thông báo cho kho
                                              'QLK|NotifyWarehouseReceiptConfirmation'.Run(
                                                  "",
                                                  0,
                                                  varUserInPlant.PlantName,
                                                  Index(col_ReceiptType, 3).ReceiptTypeCode,
                                                  Index(col_WorkflowStatus, 3).StatusCode,
                                                  Text(DatePicker1_4.SelectedDate, "yyyy-mm-dd"),
                                                  varUserInPlant.PlantCode,
                                                  LookUp(col_ProductCategories, ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_6.Selected.ProductCategoryCode).ProductCategoryNameVI
                                              ),

                                              // Nhánh lỗi
                                              Notify("Từ chối không thành công", NotificationType.Error, 2000),

                                              // Nhánh thành công
                                              Notify("Đã từ chối", NotificationType.Success, 2000);
                                              Refresh('QLK List Production Receipt Details')
                                          );

                                          // 3. Ẩn loading và xóa danh sách đã chọn
                                          UpdateContext({varShowPopupProcessing: false});
                                          Clear(col_GallarySelectedNhapKhac)
                                      )
                                    Size: =fxFontSizeMD
                                    Text: ="Từ chối"
                                    Visible: =CountRows(Filter(col_GallarySelectedNhapKhac,isSent)) > 0 && varUserInPlant.Role = Index(col_RoleUser,2).RoleCode
                                    Width: =120
                        - lbl_TitleNhapTuSanXuat_3:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 128, 40, 1)
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightSemiBold
                              Height: =40
                              PaddingLeft: =10
                              Size: =fxFontSizeXL
                              Text: ="Nhập sản xuất khác"
                        - con_FilterNhapTuSanXuat_3:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(229, 231, 235, 1)
                              BorderThickness: =If(scrNhapKhac.Size = 1, 1, 0)
                              DropShadow: =DropShadow.None
                              Fill: =If(scrNhapKhac.Size = 1, RGBA(248, 250, 252, 1), RGBA(0, 0, 0, 0))
                              FillPortions: =0
                              Height: =If(scrNhapKhac.Size = 1, 92, 40)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =If(scrNhapKhac.Size = 1, 8, 10)
                              LayoutWrap: =scrNhapKhac.Size = 1
                              PaddingBottom: =If(scrNhapKhac.Size = 1, 8, 5)
                              PaddingLeft: =If(scrNhapKhac.Size = 1, 8, 5)
                              PaddingRight: =If(scrNhapKhac.Size = 1, 8, 5)
                              PaddingTop: =If(scrNhapKhac.Size = 1, 8, 5)
                              RadiusBottomLeft: =If(scrNhapKhac.Size = 1, 8, 4)
                              RadiusBottomRight: =If(scrNhapKhac.Size = 1, 8, 4)
                              RadiusTopLeft: =If(scrNhapKhac.Size = 1, 8, 4)
                              RadiusTopRight: =If(scrNhapKhac.Size = 1, 8, 4)
                            Children:
                              - txt_SearchNhapTuSanXuat_3:
                                  Control: ModernTextInput
                                  Properties:
                                    FillPortions: =If(scrNhapKhac.Size = 1, 0, 1)
                                    LayoutMinWidth: =16
                                    Placeholder: ="Tìm kiếm ...."
                                    Width: =If(scrNhapKhac.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - 2, 320)
                              - btn_FilterNhapTuSanXuat_3:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Filter"
                                    OnSelect: |-
                                      =UpdateContext({varPopUpFilterNhapTuSanXuat: true})
                                    Text: ="Bộ lọc"
                                    Visible: =false
                              - DatePicker1_4:
                                  Control: ModernDatePicker
                                  Properties:
                                    DefaultDate: =Today()
                                    Format: =DatePickerFormat.Short
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Placeholder: ="Chọn ngày ..."
                                    Width: =If(scrNhapKhac.Size = 1, RoundDown((Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap * 2 - Button5_5.Width - 4) / 2, 0), 120)
                              - cbo_FilterProductTypeNhapTuSanXuat_6:
                                  Control: ModernCombobox
                                  Properties:
                                    DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                    FillPortions: =
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightNormal
                                    InputTextPlaceholder: ="Tất cả"
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                    Items: =col_ProductCategories
                                    SelectMultiple: =false
                                    Width: =If(scrNhapKhac.Size = 1, DatePicker1_4.Width, 120)
                              - Button5_5:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =If(scrNhapKhac.Size = 1, ButtonAppearance.Outline, ButtonAppearance.Transparent)
                                    Icon: ="Eraser"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Reset(cbo_FilterProductTypeNhapTuSanXuat_6);
                                      Reset(txt_SearchNhapTuSanXuat_3);
                                      Reset(DatePicker1_4)
                                    Text: =
                                    Width: =30
                        - con_ListMainNhapKhac_1:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderStyle: =BorderStyle.None
                              DropShadow: =If(scrNhapKhac.Size = 1, DropShadow.None, DropShadow.Semibold)
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =If(scrNhapKhac.Size = 1, 0, 5)
                              RadiusTopRight: =6
                              Width: =Parent.Width - Parent.PaddingLeft * 2
                            Children:
                              - con_InnerListNhapKhac_1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: |-
                                      =Switch(
                                          scrNhapKhac.Size,
                                          1, Parent.Width,
                                          2, Max(Parent.Width, 1200),
                                          3, Max(Parent.Width, 1200),
                                          4, Parent.Width,
                                          Parent.Width
                                      )
                                  Children:
                                    - con_TableHeaderNhapKhac:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(250, 250, 250, 1)
                                          FillPortions: =0
                                          Height: =46
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Visible: =scrNhapKhac.Size <> 1
                                        Children:
                                          - chk_SelectAllNhapKhac:
                                              Control: ModernCheckbox
                                              Properties:
                                                Default: |-
                                                  =CountRows(col_GallarySelectedNhapKhac) = CountRows(gal_NhapKhac_1.AllItems) &&
                                                  CountRows(gal_NhapKhac_1.AllItems) > 0
                                                DisplayMode: |
                                                  =If(
                                                      CountRows(Filter(gal_NhapKhac_1.AllItems, ConfirmFromWarehouse = false)) > 0,
                                                      DisplayMode.Edit,
                                                      DisplayMode.Disabled
                                                  )
                                                FontWeight: =""
                                                Height: =24
                                                Label: =
                                                OnCheck: |
                                                  =ClearCollect(
                                                      col_GallarySelectedNhapKhac,
                                                      Switch(
                                                          varUserInPlant.Role,
                                                          Index(col_RoleUser, 1).RoleCode,  // FG_WH - Thủ kho thành phẩm
                                                          Filter(
                                                              gal_NhapKhac_1.AllItems,
                                                              ConfirmFromWarehouse = false,
                                                              isSent = false
