Screens:
  scrDanhMucChenhLechForm:
    Children:
      - con_MainDanhMucChenhLechForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderDanhMucChenhLechForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderDanhMucChenhLechForm:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrDanhMucChenhLechForm.Size
            - con_BodyDanhMucChenhLechForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderDanhMucChenhLechForm.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_BodyMenuDanhMucChenhLechForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        Height: =con_BodyMainDanhMucChenhLechForm.Height - 10
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Visible: =scrDanhMucChenhLechForm.Size <> 1
                        Width: |-
                          =If(
                              varShowMenuUser,
                              240,
                              0
                          )
                      Children:
                        - cmp_NavSidebarDanhMucChenhLechForm:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainDanhMucChenhLechForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.Semibold
                        Fill: =RGBA(250, 250, 251, 1)
                        Height: =Parent.Height
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Width: =If(scrDanhMucChenhLechForm.Size = 1, Parent.Width - 10, Parent.Width - con_BodyMenuDanhMucChenhLechForm.Width - 10)
                      Children:
                        - con_FormDanhMucChenhLechButton:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =45
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              PaddingBottom: =10
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =10
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Width: =Parent.Width - 20
                            Children:
                              - btn_BackDanhMucChenhLechForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Icon: ="ChevronLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Back()
                                    Width: =30
                              - btn_SaveDanhMucChenhLechForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Save"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Select(btn_PatchDanhMucChenhLech)
                                    Text: ="Lưu"
                                    Visible: =varStockCountDifferenceDetail.StatusCode = "DRAFT"
                              - btn_RefreshDanhMucChenhLechForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="ArrowClockwise"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Refresh('QLK List Stock Count Variance')
                                    Text: ="Làm mới"
                                    Width: =120
                              - btn_PatchDanhMucChenhLech:
                                  Control: ModernButton
                                  Properties:
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =// Lưu giải trình cho dòng chênh lệch đang mở
                                      If(
                                          IsBlank(varStockCountDifferenceDetail.ID),
                                          Notify("Không tìm thấy dòng chênh lệch để lưu", NotificationType.Error, 2000),

                                          // Chỉ cho sửa giải trình khi dòng còn ở trạng thái Nháp
                                          varStockCountDifferenceDetail.StatusCode <> "DRAFT",
                                          Notify("Chỉ được sửa giải trình khi dòng chênh lệch ở trạng thái Nháp", NotificationType.Warning, 2000),

                                          IfError(
                                              Set(
                                                  varStockCountDifferenceDetail,
                                                  Patch(
                                                      'QLK List Stock Count Variance',
                                                      LookUp('QLK List Stock Count Variance', ID = varStockCountDifferenceDetail.ID),
                                                      {Explanation: Trim(txt_Explanation_Form.Text)}
                                                  )
                                              ),
                                              Notify("Lưu giải trình không thành công: " & FirstError.Message, NotificationType.Error, 3000),
                                              Notify("Lưu giải trình thành công", NotificationType.Success, 2000)
                                          )
                                      )
                                    Visible: =false
                        - con_ScrollContentDanhMucChenhLechForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              Height: =Parent.Height - con_FormDanhMucChenhLechButton.Height
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              Width: =Parent.Width - 10
                            Children:
                              - con_SectionChenhLech:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: |-
                                      =If(
                                          scrDanhMucChenhLechForm.Size = 1,
                                          830,
                                          600
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Width: =Parent.Width - 20
                                  Children:
                                    - lbl_TitleChenhLech:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="Thông tin chênh lệch"
                                    - con_GridChenhLech:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Height: =If(scrDanhMucChenhLechForm.Size = 1, 760, 340)
                                          LayoutGap: =If(scrDanhMucChenhLechForm.Size = 1, 0, 5)
                                          LayoutGridColumns: =If(scrDanhMucChenhLechForm.Size = 1, 1, 2)
                                          LayoutGridRows: =If(scrDanhMucChenhLechForm.Size = 1, 8, 4)
                                          PaddingBottom: =5
                                          PaddingLeft: =5
                                          PaddingRight: =5
                                          PaddingTop: =5
                                        Children:
                                          - con_FieldNgayKiem:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_NgayKiem_FormLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Size: =fxFontSizeSM
                                                      Text: ="Ngày kiểm"
                                                - datePicker_NgayKiem_FormVal:
                                                    Control: ModernDatePicker
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      DefaultDate: =varStockCountDifferenceDetail.StockCountDate
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Format: =DatePickerFormat.Short
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                          - con_FieldLoaiHang:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_LoaiHang_FormLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Size: =fxFontSizeSM
                                                      Text: ="Loại hàng"
                                                - cbb_LoaiHang_FormVal:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      DefaultSelectedItems: =LookUp(col_ProductTypes,ProductTypeCode = varStockCountDifferenceDetail.CountMethodName)
                                                      DisplayMode: =DisplayMode.Disabled
                                                      InputTextPlaceholder: |
                                                        =""
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.ProductTypeNameVI
                                                      Items: =col_ProductTypes
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      SelectMultiple: =false
                                          - con_FieldMaSAP:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_MaSAP_FormLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Size: =fxFontSizeSM
                                                      Text: ="Mã SAP"
                                                - cbb_MaSAP_FormLbl:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      DefaultSelectedItems: =Filter('QLK List Master Data Production',PlantCode = varStockCountDifferenceDetail.PlantCode,SAPCode= varStockCountDifferenceDetail.SAPCode)
                                                      DisplayMode: =DisplayMode.Disabled
                                                      InputTextPlaceholder: |
                                                        =""
                                                      ItemDisplayText: =ThisItem.SAPCode
                                                      Items: =Filter('QLK List Master Data Production',PlantCode = varStockCountDifferenceDetail.PlantCode)
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                          - con_FieldTonSoSach:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_TonSoSach_FormLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Size: =fxFontSizeSM
                                                      Text: ="Tồn sổ sách"
                                                - num_TonSoSach_Form:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varStockCountDifferenceDetail.BookQty
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldTonThucTe:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_TonThucTe_FormLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Size: =fxFontSizeSM
                                                      Text: ="Tồn thực tế *"
                                                - num_TonThucTe_Form:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      Default: =varStockCountDetail.ActualQty
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldSaiLech:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_SaiLech_FormLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Size: =fxFontSizeSM
                                                      Text: ="Sai lệch"
                                                - num_SaiLech_Form:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varStockCountDifferenceDetail.VarianceQty
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - con_FieldKiemLai:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_KiemLai_FormLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Size: =fxFontSizeSM
                                                      Text: ="Kiểm lại"
                                                - chk_KiemLai_Form:
                                                    Control: CheckBox
                                                    Properties:
                                                      Checked: =varStockCountDifferenceDetail.NeedRecount
                                                      DisplayMode: =DisplayMode.View
                                                      Label: =
                                          - con_FieldTrangThai:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lbl_TrangThai_FormLbl:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Size: =fxFontSizeSM
                                                      Text: ="Trạng thái"
                                                - cbb_TrangThai_FormVal:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      DefaultSelectedItems: =Filter(col_WorkflowStatus,StatusCode = varStockCountDifferenceDetail.StatusCode)
                                                      DisplayMode: =DisplayMode.Disabled
                                                      InputTextPlaceholder: |
                                                        =""
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.StatusNameVI
                                                      Items: =col_WorkflowStatus
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      SelectMultiple: =false
                                    - con_FieldGiaiTrinh:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =4
                                          PaddingLeft: =5
                                          PaddingRight: =5
                                        Children:
                                          - lbl_GiaiTrinh_FormLbl:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightSemiBold
                                                Size: =fxFontSizeSM
                                                Text: ="Giải trình"
                                          - txt_Explanation_Form:
                                              Control: ModernTextInput
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Default: =varStockCountDifferenceDetail.Explanation
                                                DisplayMode: =If(varStockCountDifferenceDetail.StatusCode = "DRAFT", DisplayMode.Edit, DisplayMode.View)
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                Height: =80
                                                LayoutMinWidth: =16
                                                Placeholder: ="Nhập giải trình..."
                                                Size: =fxFontSizeMD
                                                Type: =TextInputType.Multiline
      - con_MenuOverlayNhapTuSanXuatHangBaoMobile_19:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height - 55
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =5
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowMenuUser && scrNhapTuSanXuat.Size = 1
            Width: =Parent.Width
            Y: =55
          Children:
            - con_MenuPanelNhapTuSanXuatMobile_20:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =743
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =scrNhapTuSanXuat.Size = 1
                  Width: =Parent.Width*0.7
                Children:
                  - cmp_NavSidebarNhapTuSanXuatMobile_21:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width - 10
            - btn_CloseMenuOverlayNhapTuSanXuatMobile_20:
                Control: ModernButton
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Transparent
                  FillPortions: =1
                  Layout: =ButtonLayout.TextOnly
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Set(
                        varShowMenuUser,
                        !varShowMenuUser
                    )
                  Text: =
