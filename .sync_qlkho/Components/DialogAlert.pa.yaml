ComponentDefinitions:
  DialogAlert:
    DefinitionType: CanvasComponent
    CustomProperties:
      varCloseDialogAction:
        PropertyKind: Event
        DisplayName: varCloseDialogAction
        Description: A custom property
        ReturnType: None
        Default: =false
      varConfirmDialogAction:
        PropertyKind: Event
        DisplayName: varConfirmDialogAction
        Description: A custom property
        ReturnType: None
        Default: =false
      varLabel:
        PropertyKind: Input
        DisplayName: varLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      varTitle:
        PropertyKind: Input
        DisplayName: varTitle
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =App.Height
      Width: =App.Width
    Children:
      - con_OverlayConfirmDialog:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.4)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_ConfirmDialogBox:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: |-
                    =Switch(
                        App.ActiveScreen.Size,
                        1,
                        App.ActiveScreen.Height - 40,
                        2,
                        420,
                        200
                    )
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Width: |-
                    =Switch(
                        App.ActiveScreen.Size,
                        1, App.ActiveScreen.Width - 40,
                        2, 420,
                        380
                    )
                Children:
                  - con_HeaderConfirm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =45
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =15
                        PaddingRight: =10
                      Children:
                        - lbl_TitleConfirm:
                            Control: ModernText
                            Properties:
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =14
                              Text: =DialogAlert.varTitle
                        - btn_CloseConfirm:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Transparent
                              Font: =
                              Icon: ="Dismiss"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: =DialogAlert.varCloseDialogAction()
                              Width: =32
                  - con_BodyConfirm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        PaddingBottom: =15
                        PaddingLeft: =15
                        PaddingRight: =15
                        PaddingTop: =10
                      Children:
                        - lbl_MessageConfirm:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              Size: =14
                              Text: =DialogAlert.varLabel
                  - con_FooterConfirm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        PaddingBottom: =10
                        PaddingLeft: =15
                        PaddingRight: =15
                        PaddingTop: =10
                      Children:
                        - btn_YesConfirm:
                            Control: ModernButton
                            Properties:
                              Font: =
                              Icon: ="CheckmarkCircle"
                              OnSelect: =DialogAlert.varConfirmDialogAction()
                              Size: =
                              Text: ="Đồng ý"
                              Width: =120
                        - btn_NoConfirm:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =
                              Icon: ="DismissCircle"
                              OnSelect: =DialogAlert.varCloseDialogAction()
                              Size: =
                              Text: ="Đóng"
                              Width: =120
