ComponentDefinitions:
  DialogAlertReject:
    DefinitionType: CanvasComponent
    CustomProperties:
      outComment:
        PropertyKind: Output
        DisplayName: outComment
        Description: A custom property
        DataType: Text
      varCloseDialogAction:
        PropertyKind: Event
        DisplayName: varCloseDialogAction
        Description: A custom property
        ReturnType: None
        Default: =false
      varConfirmDialogAction:
        PropertyKind: Event
        DisplayName: varConfirmDialogAction
        Description: A custom property
        ReturnType: None
        Default: =false
      varLabel:
        PropertyKind: Input
        DisplayName: varLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      varTitle:
        PropertyKind: Input
        DisplayName: Custom property 1
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =App.Height
      Width: =App.Width
      outComment: =txt_LyDoReject.Text
    Children:
      - con_OverlayRejectDialog:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.4)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_RejectDialogBox:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =350
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Width: |-
                    =Switch(
                        App.ActiveScreen.Size,
                        1, App.ActiveScreen.Width - 40,
                        2, 420,
                        380
                    )
                Children:
                  - con_HeaderReject:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =45
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =10
                        PaddingRight: =10
                      Children:
                        - lbl_TitleReject:
                            Control: ModernText
                            Properties:
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Size: =14
                              Text: =DialogAlertReject.varTitle
                        - btn_CloseReject:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Transparent
                              Font: =
                              Icon: ="Dismiss"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Reset(txt_LyDoReject);
                                DialogAlertReject.varCloseDialogAction()
                              Width: =32
                  - con_BodyReject:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                      Children:
                        - lbl_MessageReject:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Font: =Font.'Segoe UI'
                              Size: =14
                              Text: =DialogAlertReject.varLabel
                        - con_FieldLyDoReject:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                            Children:
                              - txt_LyDoReject:
                                  Control: ModernTextInput
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    Placeholder: ="Nhập lý do ..."
                                    Type: =TextInputType.Multiline
                                    Width: =Parent.Width -5
                  - con_FooterReject:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        PaddingBottom: =10
                        PaddingLeft: =15
                        PaddingRight: =15
                        PaddingTop: =10
                      Children:
                        - btn_YesReject:
                            Control: ModernButton
                            Properties:
                              DisplayMode: |-
                                =If(
                                    IsBlank(Trim(txt_LyDoReject.Text)),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Font: =
                              Icon: ="CheckmarkCircle"
                              OnSelect: |-
                                =DialogAlertReject.varConfirmDialogAction();
                                Reset(txt_LyDoReject)
                              Size: =
                              Text: ="Từ chối"
                              Width: =120
                        - btn_NoReject:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =
                              Icon: ="DismissCircle"
                              OnSelect: |-
                                =Reset(txt_LyDoReject);
                                DialogAlertReject.varCloseDialogAction()
                              Size: =
                              Text: ="Đóng"
                              Width: =120
