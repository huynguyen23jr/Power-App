Screens:
  scrMasterSanPham:
    Properties:
      OnVisible: |-
        =Clear(col_SelectedMasterSanPham);
        varShowMenuUser && scrMasterSanPham.Size <> 1
    Children:
      - con_MainMasterSanPham:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: |
              =0
          Children:
            - con_MenuMasterSanPham:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |-
                    =If(
                        scrMasterSanPham.Size = 1,
                        false,
                        true
                    )
                  Width: |-
                    =If(
                        varShowMenuUser,
                        240,
                        64
                    )
                Children:
                  - cmp_NavSidebarMasterSanPham:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainMasterSanPham:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderMasterSanPham:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderMasterSanPham:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrMasterSanPham.Size
                  - con_BodyMasterSanPham:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderMasterSanPham.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser,0,5)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =If(!varShowMenuUser,0,5)
                        PaddingLeft: =If(!varShowMenuUser,0,5)
                        PaddingRight: =If(!varShowMenuUser,0,5)
                        PaddingTop: =If(!varShowMenuUser,0,5)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_ContentMasterSanPham:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    !varShowMenuUser,
                                    DropShadow.None,
                                    DropShadow.Semibold
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =If(!varShowMenuUser,0,5)
                              RadiusTopRight: =5
                            Children:
                              - con_ActionHeaderMasterSanPham:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - btn_AddMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Set(varMasterProductDetail,{});
                                            Navigate(scrMasterDataProductionForm,ScreenTransition.CoverRight)
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                    - btn_DownloadTemplateMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowDownload"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Launch("https://greenfeedgroup.sharepoint.com/:x:/s/Feed-StockManagement-Dev2/IQC0ElvB-6hKQa34ij3X_bCFAQdHJBO2XBtbhOm25S6nYOA?e=gB3ZyN&download=1")
                                          Size: =fxFontSizeMD
                                          Text: ="Tải template"
                                          Width: =150
                                    - btn_AddMasterSanPham_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Print"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Set(varShowUploadFile, true);
                                            Reset(attFile);
                                          Size: =fxFontSizeMD
                                          Text: ="Import"
                                    - btn_RefreshMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Refresh('QLK List Master Data Production')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                                    - btn_RefreshMasterSanPham_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Delete"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xóa " & CountRows(col_SelectedMasterSanPham) & " bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận xóa",
                                                        Subtitle: "Hành động này không thể hoàn tác.",
                                                        ConfirmButton: "Xóa",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),
                                                IfError(
                                                    Remove('QLK List Master Data Production', col_SelectedMasterSanPham);
                                                    Clear(col_SelectedMasterSanPham),
                                                    Notify("Xóa không thành công", NotificationType.Error, 2000),
                                                    Notify("Đã xóa thành công!", NotificationType.Success, 2000)
                                                )
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xóa"
                                          Visible: =CountRows(col_SelectedMasterSanPham) > 0
                                          Width: =100
                              - lbl_TitleMasterSanPham:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: |
                                      =40
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Thông tin sản phẩm"
                              - con_FilterMasterSanPham:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =45
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width - Parent.PaddingLeft*2
                                  Children:
                                    - txt_SearchMasterSanPham:
                                        Control: ModernTextInput
                                        Properties:
                                          FillPortions: =1
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Placeholder: ="Tìm kiếm mã SAP, mô tả ,...."
                                          Width: =200
                                    - btn_FilterMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Filter"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =UpdateContext({varPopUpFilterMasterDataProduction:true})
                                          Text: ="Bộ lọc"
                                          Width: =120
                              - con_ListMasterSanPham:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: |-
                                      =If(
                                          scrMasterSanPham.Size = 1,
                                          DropShadow.None,
                                          DropShadow.Semibold
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: |-
                                      =If(
                                          scrMasterSanPham.Size = 1,
                                          0,
                                          5
                                      )
                                    RadiusTopRight: =0
                                    Width: =Parent.Width - Parent.PaddingLeft*2
                                  Children:
                                    - con_ListBodyMasterSanPham:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          LayoutOverflowX: =LayoutOverflow.Scroll
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - con_GalleryWrapperMasterSanPham:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =Parent.Height - lbl_TotalRowsMasterSanPham.Height
                                                LayoutMinHeight: =Parent.Height
                                                LayoutMinWidth: =16
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: |-
                                                  =Switch(
                                                      scrMasterDataProductionForm.Size,

                                                      1, // Mobile
                                                          Parent.Width ,

                                                      2, // Tablet
                                                          con_ContentMasterSanPham.Width + 300 + con_MenuMasterSanPham.Width,

                                                      3, // Web / Desktop
                                                          con_ContentMasterSanPham.Width - 10,

                                                      Parent.Width - 10
                                                  )
                                              Children:
                                                - con_TableHeaderMasterSanPham:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(249, 249, 249, 1)
                                                      Height: "=If(\r\n    scrMasterSanPham.Size = 1,\r\n    0,\r\n    50\r\n    \r\n)"
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =5
                                                      PaddingLeft: =10
                                                      PaddingRight: =10
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Visible: |-
                                                        =If(
                                                            scrMasterSanPham.Size = 1,
                                                            false,
                                                            true
                                                        )
                                                      Width: =Parent.Width
                                                      X: |
                                                        =0
                                                    Children:
                                                      - chk_MasterSanPham_SelectAll:
                                                          Control: ModernCheckbox
                                                          Properties:
                                                            Default: |-
                                                              =CountRows(col_SelectedMasterSanPham) = CountRows(gal_MasterSanPham.AllItems) &&
                                                              CountRows(gal_MasterSanPham.AllItems) > 0
                                                            FontWeight: =""
                                                            Label: =""
                                                            OnCheck: =ClearCollect(col_SelectedMasterSanPham, gal_MasterSanPham.AllItems)
                                                            OnUncheck: =Clear(col_SelectedMasterSanPham)
                                                            Width: =32
                                                      - lbl_HeaderProductGroupMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Nhóm hàng"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderSAPCodeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã SAP"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderProductionCodeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã hàng"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderDescriptionMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mô tả"
                                                            Width: =Parent.Width * 0.2
                                                            Wrap: =false
                                                      - lbl_HeaderProductTypeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Loại hàng"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderPelletSizeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Cỡ viên"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderBagSizeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Bao/gói"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderActionMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Thao tác"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                - gal_MasterSanPham:
                                                    Control: Gallery
                                                    Variant: Vertical
                                                    Properties:
                                                      BorderStyle: =BorderStyle.None
                                                      Height: =Parent.Height- con_TableHeaderMasterSanPham.Height
                                                      Items: |-
                                                        =Filter(
                                                            'QLK List Master Data Production',
                                                            PlantCode = varUserInPlant.PlantCode,
                                                            IsBlank(txt_SearchMasterSanPham.Text) ||  StartsWith(SAPCode, txt_SearchMasterSanPham.Text) || StartsWith(ProductionCode, txt_SearchMasterSanPham.Text),
                                                            // Bộ lọc nâng cao trong popup Bộ lọc
                                                            IsBlank(cbo_FltGroupMasterSanPham.Selected) || ProductGroupCode = cbo_FltGroupMasterSanPham.Selected.ProductGroupCode,
                                                            IsBlank(cbo_FltTypeMasterSanPham.Selected) || ProductTypeCode = cbo_FltTypeMasterSanPham.Selected.ProductTypeCode,
                                                            IsBlank(cbo_FltPelletMasterSanPham.Selected) || PelletSize.Value = cbo_FltPelletMasterSanPham.Selected.Value
                                                        )
                                                      ShowScrollbar: =false
                                                      TemplateSize: |-
                                                        =If(
                                                            scrMasterSanPham.Size = 1,
                                                            7 * 30 + 6 * 5 + 8 + 5 + 45 + 16 + 8,
                                                            50
                                                        )
                                                      Width: =Parent.Width
                                                      X: |
                                                        =0
                                                      Y: =con_TableHeaderMasterSanPham.Height
                                                    Children:
                                                      - con_RowDividerMasterSanPham:
                                                          Control: GroupContainer
                                                          Variant: ManualLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            Fill: =RGBA(242, 243, 247, 1)
                                                            Height: =0.5
                                                            RadiusBottomLeft: =0
                                                            RadiusBottomRight: =0
                                                            RadiusTopLeft: =0
                                                            RadiusTopRight: =0
                                                            Visible: |-
                                                              =If(
                                                                  scrMasterSanPham.Size = 1,
                                                                  false,
                                                                  true
                                                              )
                                                            Width: =Parent.Width - 10
                                                            Y: =gal_MasterSanPham.TemplateHeight - 1
                                                      - con_RowMasterSanPham:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            BorderColor: =RGBA(229, 231, 235, 1)
                                                            BorderStyle: =If(scrMasterSanPham.Size = 1, BorderStyle.Solid, BorderStyle.None)
                                                            BorderThickness: =If(scrMasterSanPham.Size = 1, 1, 0)
                                                            DropShadow: |-
                                                              =If(
                                                                  scrMasterSanPham.Size = 1,
                                                                  DropShadow.Light,
                                                                  DropShadow.None
                                                              )
                                                            Fill: =If(scrMasterSanPham.Size = 1, RGBA(255, 255, 255, 1), RGBA(0, 0, 0, 0))
                                                            Height: =If(scrMasterSanPham.Size = 1, gal_MasterSanPham.TemplateHeight - 8, 50)
                                                            LayoutAlignItems: =LayoutAlignItems.Center
                                                            LayoutDirection: =If(scrMasterSanPham.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                            LayoutGap: |-
                                                              =If(
                                                                  scrMasterSanPham.Size = 1,
                                                                  5,
                                                                  0
                                                              )
                                                            PaddingBottom: =If(scrMasterSanPham.Size = 1, 8, 0)
                                                            PaddingLeft: =If(scrMasterSanPham.Size = 1, 8, 5)
                                                            PaddingRight: =If(scrMasterSanPham.Size = 1, 8, 0)
                                                            PaddingTop: =If(scrMasterSanPham.Size = 1, 8, 0)
                                                            RadiusBottomLeft: =If(scrMasterSanPham.Size = 1, 8, 1)
                                                            RadiusBottomRight: =If(scrMasterSanPham.Size = 1, 8, 1)
                                                            RadiusTopLeft: =If(scrMasterSanPham.Size = 1, 8, 5)
                                                            RadiusTopRight: =If(scrMasterSanPham.Size = 1, 8, 1)
                                                            Width: =Parent.Width - 10
                                                          Children:
                                                            - chk_MasterSanPham_SelectRow:
                                                                Control: ModernCheckbox
                                                                Properties:
                                                                  Default: =ThisItem.ID in col_SelectedMasterSanPham.ID
                                                                  FontWeight: =""
                                                                  Label: =""
                                                                  OnCheck: =Collect(col_SelectedMasterSanPham, ThisItem)
                                                                  OnUncheck: =Remove(col_SelectedMasterSanPham, ThisItem)
                                                                  Visible: =scrMasterSanPham.Size <> 1
                                                                  Width: =32
                                                            - con_RowInfoMasterSanPham:
                                                                Control: GroupContainer
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  AlignInContainer: =AlignInContainer.SetByContainer
                                                                  DropShadow: =DropShadow.None
                                                                  FillPortions: =0
                                                                  Height: =If(scrMasterSanPham.Size = 1, gal_MasterSanPham.TemplateHeight - 8 - 16 - 5 - con_MobileActionMasterSanPham.Height, 50)
                                                                  LayoutAlignItems: |
                                                                    =If(
                                                                        scrMasterSanPham.Size = 1,
                                                                        LayoutAlignItems.Start,
                                                                        LayoutAlignItems.Center
                                                                    )
                                                                  LayoutDirection: |-
                                                                    =If(
                                                                        scrMasterSanPham.Size =1,
                                                                        LayoutDirection.Vertical,
                                                                        LayoutDirection.Horizontal
                                                                    )
                                                                  LayoutGap: =5
                                                                  PaddingLeft: |-
                                                                    =If(
                                                                        scrMasterSanPham.Size = 1,
                                                                        10,
                                                                        5
                                                                    )
                                                                  PaddingRight: =10
                                                                  PaddingTop: =If(scrMasterSanPham.Size = 1, 8, 0)
                                                                  RadiusBottomLeft: =0
                                                                  RadiusBottomRight: =0
                                                                  RadiusTopLeft: =0
                                                                  RadiusTopRight: =0
                                                                  Width: |-
                                                                    =If(
                                                                        scrMasterSanPham.Size = 1,
                                                                        Parent.Width - Parent.PaddingLeft - Parent.PaddingRight,
                                                                        Parent.Width
                                                                    )
                                                                  X: |
                                                                    =0
                                                                Children:
                                                                  - lbl_ProductGroupMasterSanPham:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: |
                                                                          =
                                                                          If(
                                                                              scrMasterSanPham.Size = 1,
                                                                              AlignInContainer.Stretch,
                                                                              AlignInContainer.SetByContainer
                                                                          )
                                                                        FillPortions: |
                                                                          =0
                                                                        Font: =fxFontFamily
                                                                        FontWeight: =fxFontWeightSemiBold
                                                                        Height: =30
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                        Size: =fxFontSizeMD
                                                                        Text: |-
                                                                          =If(scrMasterSanPham.Size = 1, "Nhóm hàng: ", "") & LookUp(col_ProductGroups,ProductGroupCode = ThisItem.ProductGroupCode).ProductGroupNameVI
                                                                        Width: =lbl_HeaderProductGroupMasterSanPham.Width
                                                                        Wrap: =false
                                                                  - lbl_SAPCodeMasterSanPham:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: |
                                                                          =
                                                                          If(
                                                                              scrMasterSanPham.Size = 1,
                                                                              AlignInContainer.Stretch,
                                                                              AlignInContainer.SetByContainer
                                                                          )
                                                                        FillPortions: |
                                                                          =0
                                                                        Font: =fxFontFamily
                                                                        FontWeight: =fxFontWeightSemiBold
                                                                        Height: =30
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                        Size: =fxFontSizeMD
                                                                        Text: |-
                                                                          =If(scrMasterSanPham.Size = 1, "Mã SAP: ", "") & ThisItem.SAPCode
                                                                        Width: =lbl_HeaderSAPCodeMasterSanPham.Width
                                                                        Wrap: =false
                                                                  - lbl_ProductionCodeMasterSanPham:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: |
                                                                          =
                                                                          If(
                                                                              scrMasterSanPham.Size = 1,
