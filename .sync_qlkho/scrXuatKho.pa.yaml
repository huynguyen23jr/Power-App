Screens:
  scrXuatKho:
    Properties:
      OnVisible: =varShowMenuUser && scrXuatKho.Size <> 1
    Children:
      - con_MainXuatKho:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuXuatKho:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrXuatKho.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarXuatKho:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainXuatKho:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderXuatKho:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderXuatKho:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrXuatKho.Size
                  - con_BodyXuatKho:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderXuatKho.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentXuatKho:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrDanhMucBin.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_ActionHeaderXuatKho:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - btn_AddXuatKho:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =Set(
                                                varGoodsIssue,
                                                {}
                                            );
                                            Navigate(
                                                scrXuatKhoForm,
                                                ScreenTransition.CoverRight
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                          Visible: |-
                                            =varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||     // FG_WH         - Thủ kho thành phẩm
                                            varUserInPlant.Role = Index(col_RoleUser,9).RoleCode        // VHSX_HO       - VHSX HO
                                    - btn_RefreshXuatKho:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: |-
                                            =Refresh('QLK List Issue Header');
                                            Refresh('QLK List Issue Detail')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                              - lbl_TitleXuatKho:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Xuất kho"
                              - con_FilterXuatKho:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    BorderThickness: =If(scrXuatKho.Size = 1, 1, 0)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(scrXuatKho.Size = 1, RGBA(248, 250, 252, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =0
                                    Height: =If(scrXuatKho.Size = 1, 92, 45)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutWrap: =scrXuatKho.Size = 1
                                    PaddingBottom: =If(scrXuatKho.Size = 1, 8, 0)
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =If(scrXuatKho.Size = 1, 8, 0)
                                    RadiusBottomLeft: =If(scrXuatKho.Size = 1, 8, 0)
                                    RadiusBottomRight: =If(scrXuatKho.Size = 1, 8, 0)
                                    RadiusTopLeft: =If(scrXuatKho.Size = 1, 8, 0)
                                    RadiusTopRight: =If(scrXuatKho.Size = 1, 8, 0)
                                  Children:
                                    - txt_SearchXuatKho:
                                        Control: ModernTextInput
                                        Properties:
                                          FillPortions: =If(scrXuatKho.Size = 1, 0, 1)
                                          Font: =fxFontFamily
                                          LayoutMinWidth: =16
                                          Placeholder: ="Tìm kiếm ...."
                                          Width: =If(scrXuatKho.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - 2, 320)
                                          X: =40
                                          Y: =40
                                    - btn_FilterXuatKho_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Filter"
                                          OnSelect: |-
                                            =UpdateContext({varPopUpFilterXuatKho: true})
                                          Text: ="Bộ lọc"
                                          Visible: =false
                                          Width: =110
                                          X: =40
                                          Y: =40
                                    - cbo_FilterProductTypeNhapTuSanXuat_3:
                                        Control: ModernCombobox
                                        Properties:
                                          DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                          FillPortions: =
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                          Items: =col_ProductCategories
                                          SelectMultiple: =false
                                          Width: =If(scrXuatKho.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap - Button5_2.Width - 4, 120)
                                          X: =40
                                          Y: =40
                                    - Button5_2:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =If(scrXuatKho.Size = 1, ButtonAppearance.Outline, ButtonAppearance.Transparent)
                                          Icon: ="Eraser"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Reset(cbo_FilterProductTypeNhapTuSanXuat_3);
                                            Reset(txt_SearchXuatKho)
                                          Text: =
                                          Width: =30
                                          X: =40
                                          Y: =40
                              - con_ListXuatKho:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =If(scrXuatKho.Size = 1, DropShadow.None, DropShadow.Semibold)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =If(scrXuatKho.Size = 1, 0, 5)
                                    RadiusTopRight: =6
                                    Width: =Parent.Width - Parent.PaddingLeft * 2
                                  Children:
                                    - con_TableHeaderXuatKho:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(250, 250, 250, 1)
                                          FillPortions: =0
                                          Height: =46
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Visible: =scrXuatKho.Size <> 1
                                        Children:
                                          - lbl_HeaderIssueNo:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Mã phiếu"
                                                Wrap: =false
                                          - lbl_HeaderIssueDate:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ngày xuất"
                                                Wrap: =false
                                          - lbl_HeaderStatusXuatKho:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Trạng thái"
                                                Wrap: =false
                                          - lbl_HeaderLoaiSanPham:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Loại sản phẩm"
                                                Wrap: =false
                                          - lbl_HeaderTotalWeight:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Tổng xuất"
                                                Wrap: =false
                                          - lbl_HeaderActionXuatKho:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Thao tác"
                                                Width: =72
                                                Wrap: =false
                                    - gal_XuatKho:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =Parent.Height - con_TableHeaderXuatKho.Height - lbl_TotalRowsXuatKho.Height
                                          Items: |-
                                            =Switch(
                                                varUserInPlant.Role,
                                                Index(col_RoleUser, 15).RoleCode, // Trưởng ca
                                                SortByColumns(
                                                    Filter(
                                                        'QLK List Issue Header',
                                                        PlantCode = varUserInPlant.PlantCode,
                                                        IsBlank(txt_SearchXuatKho.Text) || StartsWith(IssueNo, txt_SearchXuatKho.Text),
                                                        'Created By'.Email = varCurrentUser.G_Email,
                                                        IsBlank(cbo_FilterProductTypeNhapTuSanXuat_3.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_3.Selected.ProductCategoryCode
                                                    ),
                                                    "Created",
                                                    SortOrder.Descending
                                                ),
                                                Index(col_RoleUser, 1).RoleCode, // Thủ kho thành phẩm
                                                SortByColumns(
                                                    Filter(
                                                        'QLK List Issue Header',
                                                        PlantCode = varUserInPlant.PlantCode,
                                                        ProductCategoryCode = Index(col_ProductCategories,2).ProductCategoryCode,
                                                        IsBlank(txt_SearchXuatKho.Text) || StartsWith(IssueNo, txt_SearchXuatKho.Text),
                                                        'Created By'.Email = varCurrentUser.G_Email,
                                                        IsBlank(cbo_FilterProductTypeNhapTuSanXuat_3.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_3.Selected.ProductCategoryCode
                                                    ),
                                                    "Created",
                                                    SortOrder.Descending
                                                ),
                                                Index(col_RoleUser, 3).RoleCode, // Thủ kho nguyên liệu
                                                SortByColumns(
                                                    Filter(
                                                        'QLK List Issue Header',
                                                        PlantCode = varUserInPlant.PlantCode,
                                                        ProductCategoryCode = Index(col_ProductCategories,1).ProductCategoryCode,
                                                        IsBlank(txt_SearchXuatKho.Text) || StartsWith(IssueNo, txt_SearchXuatKho.Text),
                                                        'Created By'.Email = varCurrentUser.G_Email,
                                                        IsBlank(cbo_FilterProductTypeNhapTuSanXuat_3.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_3.Selected.ProductCategoryCode
                                                    ),
                                                    "Created",
                                                    SortOrder.Descending
                                                ),
                                                SortByColumns(
                                                    Filter(
                                                        'QLK List Issue Header',
                                                        PlantCode = varUserInPlant.PlantCode,
                                                        IsBlank(txt_SearchXuatKho.Text) || StartsWith(IssueNo, txt_SearchXuatKho.Text),
                                                        IsBlank(cbo_FilterProductTypeNhapTuSanXuat_3.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_3.Selected.ProductCategoryCode
                                                    ),
                                                    "Created",
                                                    SortOrder.Descending
                                                )
                                            )
                                          ShowScrollbar: =false
                                          TemplateSize: |-
                                            =If(
                                                scrXuatKho.Size = 1,
                                                (12 + 28 + 6 + 24 + 6 + 22 + 6 + 26 + 6) + 8 + 16 + 5 + 40,
                                                45
                                            )
                                          Width: =Parent.Width
                                        Children:
                                          - con_RowDividerXuatKho:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(229, 231, 235, 1)
                                                Height: =1
                                                Visible: =scrXuatKho.Size <> 1
                                                Width: =gal_XuatKho.Width -10
                                                Y: =gal_XuatKho.TemplateHeight
                                          - con_RowMasterXuatKho:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(229, 231, 235, 1)
                                                BorderStyle: =If(scrXuatKho.Size = 1, BorderStyle.Solid, BorderStyle.None)
                                                BorderThickness: =If(scrXuatKho.Size = 1, 1, 0)
                                                DropShadow: =If(scrXuatKho.Size = 1, DropShadow.Light, DropShadow.None)
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Height: =If(scrXuatKho.Size = 1, gal_XuatKho.TemplateHeight - 8, gal_XuatKho.TemplateHeight)
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: |-
                                                  =If(
                                                      scrXuatKho.Size = 1,
                                                      LayoutDirection.Vertical,
                                                      LayoutDirection.Horizontal
                                                  )
                                                LayoutGap: =If(scrXuatKho.Size = 1, 5, 0)
                                                PaddingBottom: =If(scrXuatKho.Size = 1, 8, 0)
                                                PaddingLeft: =If(scrXuatKho.Size = 1, 8, 0)
                                                PaddingRight: =If(scrXuatKho.Size = 1, 8, 0)
                                                PaddingTop: =If(scrXuatKho.Size = 1, 8, 0)
                                                RadiusBottomLeft: =If(scrXuatKho.Size = 1, 10, 0)
                                                RadiusBottomRight: =If(scrXuatKho.Size = 1, 10, 0)
                                                RadiusTopLeft: =If(scrXuatKho.Size = 1, 10, 0)
                                                RadiusTopRight: =If(scrXuatKho.Size = 1, 10, 0)
                                                Width: =Parent.Width - 10
                                              Children:
                                                - con_RowXuatKho:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(255, 255, 255, 0)
                                                      FillPortions: =0
                                                      Height: |-
                                                        =If(
                                                            scrXuatKho.Size = 1,
                                                            gal_XuatKho.TemplateHeight - 8 - 16 - 5 - con_MobileActionXuatKho.Height,
                                                            48
                                                        )
                                                      LayoutAlignItems: =If(scrXuatKho.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                      LayoutDirection: =If(scrXuatKho.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                      LayoutGap: =If(scrXuatKho.Size = 1, 6, 5)
                                                      LayoutMinHeight: =10
                                                      PaddingLeft: =If(scrXuatKho.Size = 1, 14, 5)
                                                      PaddingRight: =If(scrXuatKho.Size = 1, 14, 5)
                                                      PaddingTop: =If(scrXuatKho.Size = 1, 12, 5)
                                                      Width: |-
                                                        =If(
                                                            scrXuatKho.Size = 1,
                                                            Parent.Width - Parent.PaddingLeft - Parent.PaddingRight,
                                                            Parent.Width - Parent.PaddingRight * 2 - Parent.LayoutGap 
                                                        )
                                                    Children:
                                                      - lbl_IssueNo_Row:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =If(scrXuatKho.Size = 1, fxFontWeightBold, fxFontWeightSemiBold)
                                                            Height: =If(scrXuatKho.Size = 1, 28, 30)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =If(scrXuatKho.Size = 1, 0, 5)
                                                            PaddingTop: =0
                                                            Size: =If(scrXuatKho.Size = 1, fxFontSizeLG, fxFontSizeMD)
                                                            Text: =ThisItem.IssueNo
                                                            Width: =If(scrXuatKho.Size = 1, Parent.Width - 20, lbl_HeaderIssueNo.Width)
                                                            Wrap: =false
                                                      - lbl_IssueDate_Row:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =If(scrXuatKho.Size = 1, RGBA(107, 114, 128, 1), RGBA(36, 36, 36, 1))
                                                            Font: =fxFontFamily
                                                            Height: =If(scrXuatKho.Size = 1, 22, 30)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =If(scrXuatKho.Size = 1, 0, 5)
                                                            PaddingTop: =0
                                                            Size: =If(scrXuatKho.Size = 1, fxFontSizeSM, fxFontSizeMD)
                                                            Text: |-
                                                              =If(
                                                                  scrXuatKho.Size = 1,
                                                                  Text(ThisItem.IssueDate, "dd/mm/yyyy") & "   ·   " & LookUp(col_ProductCategories, ProductCategoryCode = ThisItem.ProductCategoryCode).ProductCategoryNameVI,
                                                                  Text(ThisItem.IssueDate, "dd/mm/yyyy")
                                                              )
                                                            Width: =If(scrXuatKho.Size = 1, Parent.Width - 20, lbl_HeaderIssueDate.Width)
                                                            Wrap: =false
                                                      - lbl_StatusXuatKho_Row:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =If(ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode, RGBA(55, 65, 81, 1), RGBA(180, 83, 9, 1))
                                                            Fill: =If(ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode, RGBA(243, 244, 246, 1), RGBA(255, 243, 224, 1))
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightSemiBold
                                                            Height: =24
                                                            PaddingBottom: =0
                                                            PaddingLeft: =10
                                                            PaddingRight: =10
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeSM
                                                            Text: |-
                                                              =With({statusItem: LookUp(col_WorkflowStatus, StatusCode = ThisItem.StatusCode)}, Coalesce(If(_defaultLanguage.Code = "EN", statusItem.StatusNameEN, statusItem.StatusNameVI), ThisItem.StatusCode))
                                                            Width: =If(scrXuatKho.Size = 1, Len(Self.Text) * 7 + 28, Min(Len(Self.Text) * 7 + 28, lbl_HeaderStatusXuatKho.Width))
                                                            Wrap: =false
                                                      - lbl_StatusSpacerXuatKho:
                                                          Control: ModernText
                                                          Properties:
                                                            Height: =24
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            Text: =""
                                                            Visible: =scrXuatKho.Size <> 1
                                                            Width: =Max(0, lbl_HeaderStatusXuatKho.Width - lbl_StatusXuatKho_Row.Width - Parent.LayoutGap)
                                                      - lbl_LoaiSanPham_Row:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =30
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =With(
                                                                  {_cat: LookUp(col_ProductCategories, ProductCategoryCode = ThisItem.ProductCategoryCode)},
                                                                  If(
                                                                      scrXuatKho.Size = 1,
                                                                      "Loại sản phẩm: " & _cat.ProductCategoryNameVI,
                                                                      _cat.ProductCategoryNameVI
                                                                  )
                                                              )
                                                            Visible: =!(scrXuatKho.Size = 1)
                                                            Width: =If(scrXuatKho.Size = 1, Parent.Width - 20, lbl_HeaderLoaiSanPham.Width)
                                                            Wrap: =false
                                                      - lbl_TotalWeight_Row:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =If(scrXuatKho.Size = 1, RGBA(45, 128, 40, 1), RGBA(36, 36, 36, 1))
                                                            Font: =fxFontFamily
                                                            FontWeight: =If(scrXuatKho.Size = 1, fxFontWeightBold, fxFontWeightNormal)
                                                            Height: =If(scrXuatKho.Size = 1, 26, 30)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =If(scrXuatKho.Size = 1, 0, 5)
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =If(
                                                                  scrXuatKho.Size = 1,
                                                                  "Tổng xuất   " & Text(Coalesce(ThisItem.TotalIssueQuantity,0), "[$-vi-VN]#.##0##") & " kg",
                                                                  Text(Coalesce(ThisItem.TotalIssueQuantity,0), "[$-vi-VN]#.##0##")
                                                              )
                                                            Width: =If(scrXuatKho.Size = 1, Parent.Width - 20, lbl_HeaderTotalWeight.Width)
                                                            Wrap: =false
                                                      - con_ActionXuatKho:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =32
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            LayoutMinHeight: =Parent.Height - Parent.PaddingTop
                                                            Visible: =scrXuatKho.Size <> 1
                                                            Width: =lbl_HeaderActionXuatKho.Width
                                                          Children:
                                                            - btn_ViewXuatKho:
                                                                Control: ModernButton
                                                                Properties:
                                                                  Appearance: =ButtonAppearance.Transparent
                                                                  Icon: ="Eye"
                                                                  Layout: =ButtonLayout.IconOnly
                                                                  OnSelect: |-
                                                                    =Set(varGoodsIssue, ThisItem);
                                                                    Navigate(scrXuatKhoForm, ScreenTransition.CoverRight)
                                                                  Width: =32
                                                            - btn_DeleteXuatKho:
                                                                Control: ModernButton
                                                                Properties:
                                                                  Appearance: =ButtonAppearance.Transparent
                                                                  Icon: ="Delete"
                                                                  Layout: =ButtonLayout.IconOnly
                                                                  OnSelect: |
                                                                    =If(
                                                                        Confirm(
