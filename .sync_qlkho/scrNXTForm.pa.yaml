                                                                                        ConfirmFromWarehouse = true                                      // Chỉ lấy bản đã được kho xác nhận
                                                                                    )
                                                                                );

                                                                                // ── Nạp lại danh sách xuất kho theo SAPCode đang chọn ─────────────────────────
                                                                                ClearCollect(
                                                                                    col_ProductionIssue,
                                                                                    Filter(
                                                                                        'QLK List Issue Detail',
                                                                                        PlantCode            = varUserInPlant.PlantCode,                  // Nhà máy hiện tại
                                                                                        PostingDate          = varNXTDetail.InventoryDate,                // Ngày của phiếu NXT
