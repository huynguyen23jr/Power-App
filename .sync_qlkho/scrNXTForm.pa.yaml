      - con_PopupDuyetNXTForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowApprovePopup
            Width: =Parent.Width
          Children:
            - DialogAlertDuyetNXTForm:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowApprovePopup:false})
                  varConfirmDialogAction: |-
                    =// ── Đóng popup xác nhận duyệt, hiện popup loading ─────────────────────────────
                    UpdateContext({varShowApprovePopup: false, varShowPopupProcessing: true});
                    Clear(col_UpdateInventoryDetailApprover);
                    Clear(col_UpdateInventoryDetailUpdate);

                    With(
                        {
                            // Xác định danh sách item cần duyệt: ưu tiên theo checkbox đã chọn (XABIN/BAOQC/BIGBAG),
                            // nếu không chọn gì thì lấy toàn bộ item đang chờ approver hiện tại duyệt
                            _pending: If(
                                CountRows(col_SelectedXABIN) > 0,
                                col_SelectedXABIN,
                                If(
                                    CountRows(col_SelectedBAOQC) > 0,
                                    col_SelectedBAOQC,
                                    If(
                                        CountRows(col_SelectedBIGBAG) > 0,
                                        col_SelectedBIGBAG,
                                        Filter(
                                            'QLK List Inventory Details',
                                            InventoryID = varNXTDetail.ID,
                                            Approver    = varCurrentUser.G_Email,
                                            isAction    = false
                                        )
                                    )
                                )
                            )
                        },
                        ForAll(
                            _pending As item,
                            Concurrent(
                                // Đánh dấu bản ghi Approver tương ứng là APPROVED (index 4)
                                Collect(
                                    col_UpdateInventoryDetailApprover,
                                    {
                                        ID:     LookUp('QLK List Inventory Details Approver', InventoryDetailsID = item.ID).ID,
                                        Status: Index(col_WorkflowStatus, 4).StatusCode
                                    }
                                ),
                                // Đánh dấu item đã được xử lý (duyệt)
                                Collect(
                                    col_UpdateInventoryDetailUpdate,
                                    {
                                        ID:       item.ID,
                                        isAction: true
                                    }
                                )
                            )
                        )
                    );

                    // ── Ghi dữ liệu lên SharePoint ───────────────────────────────────────────────
                    Concurrent(
                        Patch('QLK List Inventory Details Approver', col_UpdateInventoryDetailApprover),
                        Patch('QLK List Inventory Details'         , col_UpdateInventoryDetailUpdate)
                    );

                    // ── Cập nhật trạng thái phiếu tồn kho ────────────────────────────────────────
                    With(
                        {
                            // Các item của phiếu vẫn còn chưa xử lý (isAction = false)
                            _filterDataInventoryDetail: Filter(
                                'QLK List Inventory Details',
                                InventoryID = varNXTDetail.ID,
                                isAction    = false
                            ),
                            // Các bản ghi Approver đã bị từ chối
                            _filterDataInventoryDetailReject: Filter(
                                'QLK List Inventory Details Approver',
                                InventoryID = varNXTDetail.ID,
                                Status      = "REJECTED"
                            )
                        },
                        If(
                            // Không còn item nào chưa xử lý -> toàn bộ đã được duyệt xong
                            CountRows(_filterDataInventoryDetail) = 0,
                            Set(
                                varNXTDetail,
                                Patch(
                                    'QLK List Inventory',
                                    varNXTDetail,
                                    { StatusCode: Index(col_WorkflowStatus, 4).StatusCode }
                                )
                            );
                            'QLK|SendResultNotification'.Run(
                                "APPROVED",
                                varNXTDetail.PlantName,
                                varNXTDetail.PlantCode,
                                varNXTDetail.ID
                            );
                            ,
                            // Còn item chưa xử lý -> kiểm tra nếu có bản ghi nào bị từ chối thì đóng phiếu với trạng thái REJECTED
                            If(
                                CountRows(_filterDataInventoryDetailReject) > 0,
                                Set(
                                    varNXTDetail,
                                    Patch(
                                        'QLK List Inventory',
                                        varNXTDetail,
                                        { StatusCode: Index(col_WorkflowStatus, 25).StatusCode }
                                    )
                                );
                                'QLK|SendResultNotification'.Run(
                                    "REJECTED",
                                    varNXTDetail.PlantName,
                                    varNXTDetail.PlantCode,
                                    varNXTDetail.ID
                                );
                            )
                        )
                    );

                    // Ghi log hành động duyệt
                    Patch(
                        'QLK List Audit Log',
                        Defaults('QLK List Audit Log'),
                        {
                            ActionBy:    varUserInPlant.UserName,
                            ActionCode:  Index(col_Action, 7).ActionCode,
                            IDInventory: varNXTDetail.ID
                        }
                    );

                    UpdateContext({varShowPopupProcessing: false});
                  varLabel: ="Bạn có chắc chắn muốn phê duyệt phiếu này không?"
                  varTitle: ="Xác nhận phê duyệt"
      - con_PopupSendNXTForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =con_PopupConfirmXNT
            Width: =Parent.Width
          Children:
            - DialogAlertSendNXTForm:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({con_PopupConfirmXNT:false})
                  varConfirmDialogAction: |-
                    =UpdateContext({con_PopupConfirmXNT: false, varShowPopupProcessing: true});

                    // Reset toàn bộ collection trước khi build lại dữ liệu duyệt
                    Concurrent(
                        Clear(col_ApprovalMatrixSteps),
                        Clear(col_Details),
                        Clear(col_StockCountVariance),
                        Clear(col_ApprovalQueue),
                        Clear(col_InventoryDetails)
                    );

                    // Lấy kết quả kiểm kê (ngày hôm sau InventoryDate) để map IDStockCountVariance
                    ClearCollect(
                        col_StockCountVariance,
                        Filter(
                            'QLK List Stock Count Variance',
                            PlantCode      = varNXTDetail.PlantCode &&
                            StockCountDate = DateAdd(varNXTDetail.InventoryDate, 1, TimeUnit.Days)
                        )
                    );

                    // Lấy cấu hình ngưỡng duyệt (theo ngày, loại ApprovalTypeCode = DAILY_DIFF) của đúng plant + loại sản phẩm
                    ClearCollect(
                        col_ApprovalMatrixSteps,
                        Filter(
                            'QLK List Approval Matrix Steps',
                            PlantCode           = varNXTDetail.PlantCode &&
                            ApprovalTypeCode    = "DAILY_DIFF" &&
                            ProductCategoryCode = varNXTDetail.ProductCategoryCode
                        )
                    );

                    // Lấy các dòng chênh lệch (DayDiffQty > 0) cần duyệt của phiếu NXT hiện tại
                    ClearCollect(
                        col_Details,
                        Filter(
                            'QLK List Inventory Details',
                            InventoryID           = varNXTDetail.ID,
                            isAction              = false,
                            IsDateVarianceChecked = true
                        )
                    );

                    // Với mỗi SAPCode, xác định đúng cấp duyệt (approver) dựa theo ngưỡng cố định hoặc % trên base
                    ClearCollect(
                        col_ApprovalQueue,
                        ForAll(
                            col_Details As item,
                            With(
                                {
                                    _base: item.OpeningQty + item.TotalReceiptQty
                                },
                                With(
                                    {
                                        _stepsWithEffective: AddColumns(
                                            Filter(
                                                col_ApprovalMatrixSteps,
                                                PlantCode           = item.PlantCode &&
                                                ProductCategoryCode = item.ProductCategoryCode &&
                                                ProductTypeCode     = item.ProductTypeCode &&
                                                BagSize             = item.BagSize
                                            ),
                                            EffectiveThreshold,
                                            If(
                                                RuleTypeCode = "FIXED_VALUE",
                                                ThresholdValue,
                                                _base * ThresholdPercent
                                            )
                                        )
                                    },
                                    With(
                                        {
                                            _sorted: Sort(_stepsWithEffective, EffectiveThreshold, SortOrder.Ascending)
                                        },
                                        With(
                                            {
                                                _step: Coalesce(
                                                    LookUp(_sorted, Abs(item.DayDiffQty) <= EffectiveThreshold),
                                                    Last(_sorted)
                                                )
                                            },
                                            {
                                                InventoryID:        varNXTDetail.ID,
                                                InventoryDetailsID: item.ID,
                                                SAPCode:            item.SAPCode,
                                                ProductTypeCode:    item.ProductTypeCode,
                                                DayDiffQty:         item.DayDiffQty,
                                                RoleCode:           _step.RoleCode,
                                                ThresholdValue:     _step.ThresholdValue,
                                                RuleTypeCode:       _step.RuleTypeCode,
                                                Approver:           _step.UserEmail,
                                                ApproverName:       _step.UserName,
                                                ApproverUserID:     _step.UserID,
                                                Status:             "PENDING"
                                            }
                                        )
                                    )
                                )
                            )
                        )
                    );

                    UpdateContext({varShowPopupProcessing: false,varShowApprovalPreview:true})
                  varLabel: ="Bạn có chắc chắn muốn gửi phiếu này để phê duyệt không?"
                  varTitle: ="Gửi yêu cầu phê duyệt"
      - con_PopupTuChoiNXTForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowRejectPopup
            Width: =Parent.Width
          Children:
            - DialogAlertRejectNXTForm:
                Control: CanvasComponent
                ComponentName: DialogAlertReject
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowRejectPopup:false});
                  varConfirmDialogAction: |-
                    =// ── Đóng popup xác nhận, hiện popup loading ──────────────────────────────────
                    UpdateContext({varShowRejectPopup: false});
                    UpdateContext({varShowPopupProcessing: true});

                    // Reset các collection tạm trước khi build lại dữ liệu từ chối
                    Concurrent(
                        Clear(col_updateStatusStockCountVarianceWhenReject),
                        Clear(col_UpdateInventoryDetailApprover),
                        Clear(col_UpdateInventoryDetails)
                    );

                    With(
                        {
                            // Xác định nguồn dữ liệu: có chọn checkbox (XABIN/BAOQC/BIGBAG) hay không
                            _fromSelection: CountRows(col_SelectedXABIN) + CountRows(col_SelectedBAOQC) + CountRows(col_SelectedBIGBAG) > 0,
                            _pending: If(
                                CountRows(col_SelectedXABIN) > 0,
                                col_SelectedXABIN,
                                If(
                                    CountRows(col_SelectedBAOQC) > 0,
                                    col_SelectedBAOQC,
                                    If(
                                        CountRows(col_SelectedBIGBAG) > 0,
                                        col_SelectedBIGBAG,
                                        // Không chọn gì -> lấy toàn bộ item đang chờ approver hiện tại duyệt
                                        Filter(
                                            'QLK List Inventory Details',
                                            InventoryID = varNXTDetail.ID,
                                            Approver    = varCurrentUser.G_Email,
                                            isAction    = false
                                        )
                                    )
                                )
                            )
                        },
                        ForAll(
                            _pending As item,
                            Concurrent(
                                // Trả Stock Count Variance về trạng thái DRAFT (index 1) để kiểm kê lại
                                Collect(
                                    col_updateStatusStockCountVarianceWhenReject,
                                    {
                                        ID: LookUp('QLK List Stock Count Variance',IDInventoryDetails =item.ID).ID,
                                        StatusCode: Index(col_WorkflowStatus, 1).StatusCode
                                    }
                                ),
                                // Đánh dấu bản ghi Approver tương ứng là REJECTED (index 3)
                                Collect(
                                    col_UpdateInventoryDetailApprover,
                                    {
                                        ID: LookUp('QLK List Inventory Details Approver',InventoryDetailsID =item.ID).ID,
                                        Status: Index(col_WorkflowStatus, 3).StatusCode
                                    }
                                ),
                                // Xóa Approver hiện tại, reset cờ kiểm tra chênh lệch để đưa item về vòng kiểm kê
                                Collect(
                                    col_UpdateInventoryDetails,
                                    {
                                        ID                    : item.ID,
                                        Approver              : Blank(),
                                        //isAction               : true,
                                        IsDateVarianceChecked : false
                                    }
                                )
                            )
                        )
                    );

                    // ── Ghi dữ liệu lên SharePoint ───────────────────────────────────────────────
                    Concurrent(
                        Patch('QLK List Stock Count Variance'      , col_updateStatusStockCountVarianceWhenReject),
                        Patch('QLK List Inventory Details'         , col_UpdateInventoryDetails)
                    );

                    // ── Cập nhật trạng thái phiếu tồn kho ────────────────────────────────────────
                    With(
                        {
                            // Các bản ghi Approver đã REJECTED
                            _filterDataInventoryDetail: Filter(
                                'QLK List Inventory Details Approver',
                                InventoryID = varNXTDetail.ID,
                                Status      = "REJECTED"
                            ),
                            // Các bản ghi Approver còn PENDING (chưa duyệt/từ chối)
                            _filterDataInventoryDetailPending: Filter(
                                'QLK List Inventory Details Approver',
                                InventoryID = varNXTDetail.ID,
                                Status      = "PENDING"
                            )
                        },
                        If(
                            // Có ít nhất 1 mã bị từ chối và không còn mã nào PENDING -> toàn bộ luồng duyệt đã xử lý xong, có từ chối
                            CountRows(_filterDataInventoryDetail) > 0 && CountRows(_filterDataInventoryDetailPending) = 0,

                            Set(
                                varNXTDetail,
                                Patch(
                                    'QLK List Inventory',
                                    varNXTDetail,
                                    {
                                        StatusCode:            Index(col_WorkflowStatus, 3).StatusCode,
                                        IsDateVarianceChecked: false,
                                        isSent:                false
                                    }
                                )
                            );

                            // Gửi thông báo kết quả từ chối
                            'QLK|SendResultNotification'.Run(
                                "REJECTED",
                                varNXTDetail.PlantName,
                                varNXTDetail.PlantCode,
                                varNXTDetail.ID
                            );
                        )
                    );

                    Remove('QLK List Inventory Details Approver', col_UpdateInventoryDetailApprover);

                    // Ghi log hành động từ chối
                    Patch(
                        'QLK List Audit Log',
                        Defaults('QLK List Audit Log'),
                        {
                            ActionBy:    varUserInPlant.UserName,
                            ActionCode:  Index(col_Action, 8).ActionCode,
                            Comment:     DialogAlertRejectNXTForm.outComment,
                            IDInventory: varNXTDetail.ID
                        }
                    );

                    // Dọn các collection chọn dòng sau khi hoàn tất
                    Concurrent(
                        Clear(col_SelectedBAOQC),
                        Clear(col_SelectedBIGBAG),
                        Clear(col_SelectedXABIN)
                    );

                    UpdateContext({varShowPopupProcessing: false})
                  varLabel: ="Vui lòng nhập lý do từ chối."
                  varTitle: ="Từ chối phê duyệt"
