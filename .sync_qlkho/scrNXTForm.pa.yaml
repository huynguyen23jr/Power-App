      - con_PopupConfirmNXT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =varShowPopupConfirmNXT
            Width: =Parent.Width
          Children:
            - DialogAlertConfirmNXT:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: |-
                    =UpdateContext({varShowPopupConfirmNXT: false});
                  varConfirmDialogAction: |
                    =// Đóng popup xác nhận, hiện loading
                    UpdateContext({varShowPopupConfirmNXT: false});
                    UpdateContext({varShowPopupProcessing: true});

                    IfError(
                        Patch(
                            'QLK List Audit Log',
                            Defaults('QLK List Audit Log'),
                            {
                                ActionBy:   varUserInPlant.UserName,
                                ActionCode: Index(col_Action, 12).ActionCode,
                                IDInventory:  varNXTDetail.ID
                            }
                        );

                        // ── [1] Cập nhật status phiếu ────────────────────────────────────────────
                        Set(
                            varNXTDetail,
                            Patch(
                                'QLK List Inventory',
                                varNXTDetail,
                                {StatusCode: Index(col_WorkflowStatus, 21).StatusCode}
                            )
                        );

                        // ── [2] Load detail + clear payload song song ─────────────────────────────
                        Concurrent(
                            ClearCollect(
                                col_InventoryDetail,
                                Filter('QLK List Inventory Details', InventoryID = varNXTDetail.ID)
                            ),
                            Clear(col_UpdateInventoryDetail)
                        );

                        // ── [3] Build payload bulk update ─────────────────────────────────────────
                        ClearCollect(
                            col_UpdateInventoryDetail,
                            ForAll(col_InventoryDetail, {ID: ID, ConfirmFromWarehouse: true})
                        );

                        // ── [4] Bulk update lên SharePoint (1 call duy nhất) ─────────────────────
                        Patch('QLK List Inventory Details', col_UpdateInventoryDetail),

                        // Lỗi: thông báo, loading vẫn được ẩn bên dưới
                        Notify("Xác nhận thất bại: " & FirstError.Message, NotificationType.Error,2000)
                    );

                    // Ẩn loading sau khi hoàn tất (dù thành công hay lỗi)
                    UpdateContext({varShowPopupProcessing: false})
                  varLabel: ="Bạn có chắc chắn muốn xác nhận nhập tồn phiếu này không?"
                  varTitle: ="Xác nhận nhập tồn"
