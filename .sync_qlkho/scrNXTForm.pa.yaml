                            Control: ModernText
                            Properties:
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightBold
                              Size: =fxFontSizeMD
                              Text: ="SAPCode"
                              Width: =(Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap * 4 - 20) * 0.17
                              Wrap: =false
                        - lbl_AP_DayDiffQty:
                            Control: ModernText
                            Properties:
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightBold
                              Size: =fxFontSizeMD
                              Text: ="DayDiffQty"
                              Width: =(Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap * 4 - 20) * 0.13
                              Wrap: =false
                  - gal_ApprovalPreview:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderStyle: =BorderStyle.None
                        Items: =SortByColumns(col_ApprovalQueue, "ProductTypeCode", SortOrder.Ascending, "SAPCode", SortOrder.Ascending)
                        LayoutMinHeight: =100
                        TemplateSize: =48
                      Children:
                        - con_RowMasterApprovalPreview:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =gal_ApprovalPreview.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              Width: =Parent.Width
                            Children:
                              - cb_AP_Approver:
                                  Control: ModernCombobox
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    DefaultSelectedItems: =LookUp('QLK List User In Plant', UserEmail = ThisItem.Approver)
                                    Font: =fxFontFamily
                                    InputTextPlaceholder: ="Chọn người duyệt ..."
                                    ItemDisplayText: =ThisItem.UserName
                                    Items: =Filter('QLK List User In Plant',PlantCode = varNXTDetail.PlantCode)
                                    OnChange: |-
                                      =UpdateIf(
                                          col_ApprovalQueue,
                                          InventoryDetailsID = ThisItem.InventoryDetailsID,
                                          {
                                              Approver:       Self.Selected.UserEmail,
                                              ApproverName:   Self.Selected.UserName,
                                              ApproverUserID: Self.Selected.UserID
                                          }
                                      );
                                      ClearCollect(
                                          col_NoApprover,
                                          ShowColumns(Filter(col_ApprovalQueue, IsBlank(Approver)), SAPCode)
                                      )
                                    SelectMultiple: =false
                                    Size: =fxFontSizeMD
                                    Width: =lbl_AP_Approver.Width
                              - lbl_AP_ApproverName_Row:
                                  Control: ModernText
                                  Properties:
                                    Color: =If(IsBlank(ThisItem.Approver), RGBA(209, 52, 56, 1), RGBA(0, 0, 0, 1))
                                    Font: =fxFontFamily
                                    Size: =fxFontSizeMD
                                    Text: =If(IsBlank(ThisItem.Approver), "Chưa có người duyệt", ThisItem.ApproverName)
                                    Width: =lbl_AP_ApproverName.Width
                                    Wrap: =false
                              - lbl_AP_ProductType_Row:
                                  Control: ModernText
                                  Properties:
                                    Font: =fxFontFamily
                                    Size: =fxFontSizeMD
                                    Text: |-
                                      =Switch(
                                          ThisItem.ProductTypeCode,
                                          "BIGBAG", "Bigbag",
                                          "BAOQC",  "Bao qui cách",
                                          "XABIN",  "Xá bin",
                                          ThisItem.ProductTypeCode
                                      )
                                    Width: =lbl_AP_ProductType.Width
                                    Wrap: =false
                              - lbl_AP_SAPCode_Row:
                                  Control: ModernText
                                  Properties:
                                    Font: =fxFontFamily
                                    Size: =fxFontSizeMD
                                    Text: =ThisItem.SAPCode
                                    Width: =lbl_AP_SAPCode.Width
                                    Wrap: =false
                              - lbl_AP_DayDiffQty_Row:
                                  Control: ModernText
                                  Properties:
                                    Font: =fxFontFamily
                                    Size: =fxFontSizeMD
                                    Text: =Text(Value(ThisItem.DayDiffQty), "#,##0")
                                    Width: =lbl_AP_DayDiffQty.Width
                                    Wrap: =false
                        - rec_AP_Separator:
                            Control: Rectangle
                            Properties:
                              Fill: =RGBA(230, 230, 230, 1)
                              Height: =1
                              Width: =Parent.TemplateWidth
                              Y: =Parent.TemplateHeight - 1
                  - con_AP_Footer:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =45
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                      Children:
                        - btn_AP_Cancel:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              OnSelect: |-
                                =UpdateContext({varShowApprovalPreview:false});
                                Clear(col_ApprovalQueue);
                              Text: ="Hủy"
                              Width: =100
                        - btn_AP_Confirm:
                            Control: ModernButton
                            Properties:
                              BasePaletteColor: =RGBA(45, 128, 40, 1)
                              DisplayMode: |-
                                =If(
                                    IsEmpty(Filter(col_ApprovalQueue, IsBlank(Approver))),
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Font: =fxFontFamily
                              Icon: ="Send"
                              OnSelect: |-
                                =UpdateContext({varShowApprovalPreview: false, varShowPopupProcessing: true});

                                // Kiểm tra trước: gom các SAPCode chưa có người duyệt
                                ClearCollect(
                                    col_NoApprover,
                                    ShowColumns(Filter(col_ApprovalQueue, IsBlank(Approver)), SAPCode)
                                );

                                If(
                                    // Chặn lại lần nữa phòng trường hợp còn mã chưa có approver
                                    !IsEmpty(col_NoApprover),
                                    Notify(
                                        "Không tìm được người duyệt cho SAPCode: " & Concat(col_NoApprover, SAPCode, ", ") & ". Vui lòng chọn người duyệt trước khi gửi.",
                                        NotificationType.Error,
                                        4000
                                    ),

                                    // Build dữ liệu cần ghi từ danh sách đã xem trước (đã bao gồm approver chỉnh tay)
                                    ClearCollect(
                                        col_InventoryDetailsApprover,
                                        ForAll(
                                            col_ApprovalQueue As item,
                                            {
                                                InventoryID:          item.InventoryID,
                                                InventoryDetailsID:   item.InventoryDetailsID,
                                                IDStockCountVariance: LookUp(col_StockCountVariance, IDInventoryDetails = item.InventoryDetailsID).ID,
                                                Approver:             item.Approver,
                                                ApproverName:         item.ApproverName,
                                                Status:               item.Status
                                            }
                                        )
                                    );
                                    ClearCollect(
                                        col_InventoryDetails,
                                        ForAll(
                                            col_ApprovalQueue As item,
                                            {
                                                ID:       item.InventoryDetailsID,
                                                Approver: item.Approver
                                            }
                                        )
                                    );

                                    // Chạy tuần tự, dừng ngay ở bước lỗi đầu tiên — phiếu chỉ chuyển "đã gửi duyệt" khi mọi bước thành công
                                    IfError(
                                        Patch('QLK List Inventory Details Approver', col_InventoryDetailsApprover),
                                        Notify("Gửi duyệt thất bại (lưu người duyệt): " & FirstError.Message, NotificationType.Error, 3000),

                                        Patch('QLK List Inventory Details', col_InventoryDetails),
                                        Notify("Gửi duyệt thất bại (cập nhật chi tiết): " & FirstError.Message, NotificationType.Error, 3000),

                                        // Gọi flow gửi yêu cầu duyệt tới từng approver
                                        'QLK|CollectRequestsforApproval'.Run(varNXTDetail.ID, varNXTDetail.PlantCode, varNXTDetail.PlantName),
                                        Notify("Gửi duyệt thất bại (flow gửi yêu cầu duyệt): " & FirstError.Message, NotificationType.Error, 3000),

                                        // Cập nhật trạng thái phiếu NXT sang "đã gửi duyệt"
                                        Set(
                                            varNXTDetail,
                                            Patch(
                                                'QLK List Inventory',
                                                varNXTDetail,
                                                {
                                                    StatusCode: Index(col_WorkflowStatus, 2).StatusCode,
                                                    isSent:     true
                                                }
                                            )
                                        ),
                                        Notify("Gửi duyệt thất bại (cập nhật trạng thái phiếu): " & FirstError.Message, NotificationType.Error, 3000),

                                        // Ghi log hành động gửi duyệt
                                        Patch(
                                            'QLK List Audit Log',
                                            Defaults('QLK List Audit Log'),
                                            {
                                                ActionBy:    varUserInPlant.UserName,
                                                ActionCode:  Index(col_Action, 6).ActionCode,
                                                IDInventory: varNXTDetail.ID
                                            }
                                        );
                                        Notify("Đã gửi duyệt thành công!", NotificationType.Success, 2000)
                                    )
                                );

                                UpdateContext({varShowPopupProcessing: false})
                              Text: ="Xác nhận gửi duyệt"
                              Width: =180
      - btn_MoreBackdropNXTForm:
          Control: ModernButton
          Properties:
            AccessibleLabel: ="Đóng menu"
            Appearance: =ButtonAppearance.Transparent
            Height: =Parent.Height
            OnSelect: |-
              =UpdateContext({locShowMoreNXT: false})
            Text: =""
            Visible: =locShowMoreNXT
            Width: =Parent.Width
      - con_MoreMenuNXTForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.Bold
            Fill: =RGBA(255, 255, 255, 1)
            Height: =CountRows(gal_MoreMenuNXTForm.AllItems) * 44 + 12
            LayoutDirection: =LayoutDirection.Vertical
            PaddingBottom: =6
            PaddingTop: =6
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Visible: =locShowMoreNXT
            Width: =200
            X: =Parent.Width - Self.Width - 16
            Y: =55 + 10 + 45 + 4
          Children:
            - gal_MoreMenuNXTForm:
                Control: Gallery
                Variant: Vertical
                Properties:
                  Items: |-
                    =Filter(
                        Table(
                            {Key: "CONFIRM", Name: "Xác nhận", Icon: "CheckmarkCircle", Show: btn_RefreshNXTForm_1.Visible},
                            {Key: "SEND", Name: "Gửi duyệt", Icon: "Send", Show: btn_SendApproverNXTForm.Visible},
                            {Key: "APPROVE", Name: "Duyệt", Icon: "CheckmarkCircle", Show: btn_RefreshNXTForm_3.Visible},
                            {Key: "REJECT", Name: "Từ chối", Icon: "DismissCircle", Show: btn_RefreshNXTForm_4.Visible},
                            {Key: "CLOSE", Name: "Đóng phiếu", Icon: "CheckmarkCircle", Show: btn_RefreshNXTForm_2.Visible},
                            {Key: "DELETE", Name: "Xóa", Icon: "Delete", Show: btn_RefreshNXTForm_5.Visible},
                            {Key: "SAP", Name: "Lấy tồn từ SAP", Icon: "Globe", Show: btn_GetInventoryDetailSAP.Visible}
                        ),
                        Show
                    )
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =44
                Children:
                  - btn_MoreItemNXTForm:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Left
                        Appearance: =ButtonAppearance.Transparent
                        Color: =If(ThisItem.Key = "DELETE", RGBA(185, 28, 28, 1), RGBA(31, 41, 55, 1))
                        Height: =44
                        Icon: =ThisItem.Icon
                        OnSelect: |-
                          =UpdateContext({locShowMoreNXT: false});
                          Switch(
                              ThisItem.Key,
                                  "CONFIRM", Select(btn_RefreshNXTForm_1),
                                  "SEND", Select(btn_SendApproverNXTForm),
                                  "APPROVE", Select(btn_RefreshNXTForm_3),
                                  "REJECT", Select(btn_RefreshNXTForm_4),
                                  "CLOSE", Select(btn_RefreshNXTForm_2),
                                  "DELETE", Select(btn_RefreshNXTForm_5),
                                  "SAP", Select(btn_GetInventoryDetailSAP)
                          )
                        Size: =fxFontSizeMD
                        Text: =ThisItem.Name
                        Width: =Parent.TemplateWidth
