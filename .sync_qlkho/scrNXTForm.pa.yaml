                                                                                // ── Nạp lại danh sách nhập kho theo SAPCode đang chọn ─────────────────────────
                                                                                ClearCollect(
                                                                                    col_ProductionReceiptBase,
                                                                                    Filter(
                                                                                        'QLK List Production Receipt Details',
                                                                                        PlantCode            = varUserInPlant.PlantCode,                  // Nhà máy hiện tại
