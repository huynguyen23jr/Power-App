                                                                              Icon: ="Eye"
                                                                              Layout: =ButtonLayout.IconOnly
                                                                              OnSelect: |-
                                                                                =Clear(col_ProductionReceiptBase);
                                                                                // Mở form tạo mới, reset biến detail về rỗng
                                                                                UpdateContext({
                                                                                    varShowNXTDetailForm: true,
                                                                                    varNXTRowDetail:      ThisItem,                                        // Xóa data cũ → chế độ tạo mới
                                                                                    varProductionCode:    Index(col_ProductTypes, 3).ProductTypeCode // Mặc định loại SP đầu tiên
                                                                                });

                                                                                // Reset toàn bộ input fields về giá trị mặc định
                                                                                Reset(cmb_NXTRow_SAPCode);
                                                                                Reset(cmb_NXTRow_ProductTypeCode);

                                                                                // Nhập kho
                                                                                Reset(num_NXTRow_OpeningQty);           // Tồn đầu
                                                                                Reset(num_NXTRow_TotalReceiptQty);      // Tổng nhập

                                                                                // Xuất kho
                                                                                Reset(num_NXTRow_TotalIssueQty);        // Tổng xuất

                                                                                // Tồn kho & Chênh lệch
                                                                                Reset(num_NXTRow_ClosingQty);           // Tồn sổ sách
                                                                                Reset(num_NXTRow_ActualQty);            // Tồn thực tế
                                                                                Reset(num_NXTRow_DayDiffQty);           // Chênh lệch ngày
                                                                                Reset(num_NXTRow_MonthDiffQty);         // Chênh lệch tháng

                                                                                // Nguyên nhân
