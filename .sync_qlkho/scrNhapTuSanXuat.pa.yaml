Screens:
  scrNhapTuSanXuat:
    Properties:
      OnVisible: =varShowMenuUser && scrNhapTuSanXuat.Size <> 1
    Children:
      - con_MainNhapTuSanXuat:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuNhapTuSanXuat:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrNhapTuSanXuat.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarNhapTuSanXuat:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainNhapTuSanXuat:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderNhapTuSanXuat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderNhapTuSanXuat:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrNhapTuSanXuat.Size
                  - con_BodyNhapTuSanXuat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderNhapTuSanXuat.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentNhapTuSanXuat:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrDanhMucBin.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_ActionHeaderNhapTuSanXuat:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - btn_AddNhapTuSanXuat:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =Set(
                                                varProductionReceiptDetail,
                                                {}
                                            );
                                            Reset(dp_ReceiptDate);
                                            Reset(cmb_Shift);
                                            Reset(cmb_ProductType);
                                            Navigate(
                                                scrNhapTuSanXuatForm,
                                                ScreenTransition.CoverRight
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                          Visible: |
                                            =varUserInPlant.Role = Index(col_RoleUser,15).RoleCode || // SHIFT_LEADER  - Trưởng ca
                                            varUserInPlant.Role = Index(col_RoleUser,6).RoleCode  || // PROD_STAT     - Thống kê sản xuất
                                            varUserInPlant.Role = Index(col_RoleUser,12).RoleCode || // PROD_ASST     - Trợ lý sản xuất
                                            varUserInPlant.Role = Index(col_RoleUser,9).RoleCode     // VHSX_HO       - VHSX HO
                                    - btn_RefreshNhapTuSanXuat:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: |
                                            =Refresh('QLK List Production Receipts');
                                            Refresh('QLK List Production Receipt Details');
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                              - lbl_TitleNhapTuSanXuat:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Nhập từ sản xuất"
                              - con_FilterNhapTuSanXuat:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    BorderThickness: =If(scrNhapTuSanXuat.Size = 1, 1, 0)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(scrNhapTuSanXuat.Size = 1, RGBA(248, 250, 252, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =0
                                    Height: =If(scrNhapTuSanXuat.Size = 1, 92, 42)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    LayoutWrap: =scrNhapTuSanXuat.Size = 1
                                    PaddingBottom: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    PaddingRight: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    PaddingTop: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    RadiusBottomLeft: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    RadiusBottomRight: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    RadiusTopRight: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                  Children:
                                    - txt_SearchNhapTuSanXuat:
                                        Control: ModernTextInput
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          FillPortions: =If(scrNhapTuSanXuat.Size = 1, 0, 1)
                                          Font: =fxFontFamily
                                          LayoutMinWidth: =16
                                          Placeholder: ="Tìm kiếm ...."
                                          Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - 2, 160)
                                    - cbo_FilterProductTypeNhapTuSanXuat_2:
                                        Control: ModernCombobox
                                        Properties:
                                          DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                          FillPortions: =
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                          Items: =col_ProductCategories
                                          SelectMultiple: =false
                                          Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap - Button5.Width - 4, 140)
                                    - btn_FilterNhapTuSanXuat:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Filter"
                                          OnSelect: |-
                                            =UpdateContext({varPopUpFilterNhapTuSanXuat: true})
                                          Text: ="Bộ lọc"
                                          Visible: =false
                                    - Button5:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =If(scrNhapTuSanXuat.Size = 1, ButtonAppearance.Outline, ButtonAppearance.Transparent)
                                          Icon: ="Eraser"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Reset(cbo_FilterProductTypeNhapTuSanXuat_2);
                                            Reset(txt_SearchNhapTuSanXuat)
                                          Text: =
                                          Width: =30
                              - con_ListNhapTuSanXuat:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =If(scrNhapTuSanXuat.Size = 1, DropShadow.None, DropShadow.Semibold)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 0, 5)
                                    RadiusTopRight: =6
                                    Width: =Parent.Width - Parent.PaddingLeft * 2
                                  Children:
                                    - con_InnerNhapTuSanXuat:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          Width: |-
                                            =If(
                                                scrNhapTuSanXuat.Size = 1,
                                                Parent.Width,
                                                Max(
                                                    Parent.Width,
                                                    1300
                                                )
                                            )
                                        Children:
                                          - con_TableHeaderNhapTuSanXuat:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(250, 250, 250, 1)
                                                FillPortions: =0
                                                Height: =46
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =5
                                                PaddingLeft: =10
                                                PaddingRight: =10
                                                Visible: =scrNhapTuSanXuat.Size <> 1
                                              Children:
                                                - lbl_HeaderReceiptCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Mã phiếu nhập"
                                                      Width: =Parent.Width * 0.18
                                                      Wrap: =false
                                                - lbl_HeaderReceiptDate:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Ngày nhập"
                                                      Width: =Parent.Width * 0.15
                                                      Wrap: =false
                                                - lbl_HeaderStatusCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Trạng thái"
                                                      Width: =Parent.Width * 0.18
                                                      Wrap: =false
                                                - lbl_HeaderShift:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Ca"
                                                      Width: =Parent.Width * 0.1
                                                      Wrap: =false
                                                - lbl_HeaderLoaiSanPhamNhap:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Loại sản phẩm"
                                                      Width: =Parent.Width * 0.15
                                                      Wrap: =false
                                                - lbl_HeaderTongNhap:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Tổng nhập"
                                                      Width: =Parent.Width * 0.1
                                                      Wrap: =false
                                                - lbl_HeaderActionNhapTuSanXuat:
                                                    Control: ModernText
                                                    Properties:
                                                      FillPortions: =1
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Thao tác"
                                                      Width: =100
                                                      Wrap: =false
                                          - gal_NhapTuSanXuat:
                                              Control: Gallery
                                              Variant: Vertical
                                              Properties:
                                                BorderStyle: =BorderStyle.None
                                                Height: =Parent.Height - con_TableHeaderNhapTuSanXuat.Height - lbl_TotalRowsNhapTuSanXuat.Height
                                                Items: |-
                                                  =SortByColumns(
                                                      Filter(
                                                          'QLK List Production Receipts',
                                                          PlantCode = varUserInPlant.PlantCode,
                                                          IsBlank(txt_SearchNhapTuSanXuat.Text) || StartsWith(ReceiptCode, txt_SearchNhapTuSanXuat.Text),
                                                          IsBlank(cbo_FilterProductTypeNhapTuSanXuat_2.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_2.Selected.ProductCategoryCode,
                                                          // Bộ lọc nâng cao trong popup Lọc
                                                          IsBlank(cbo_FilterStatusNhapTuSanXuat.Selected) || StatusCode = cbo_FilterStatusNhapTuSanXuat.Selected.StatusCode,
                                                          IsBlank(cbo_FilterShiftNhapTuSanXuat.Selected) || Shift = cbo_FilterShiftNhapTuSanXuat.Selected.ShiftNo,
                                                          IsBlank(cbo_FilterProductTypeNhapTuSanXuat.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat.Selected.ProductCategoryCode
                                                      ),
                                                      "Created",
                                                      SortOrder.Descending
                                                  )
                                                ShowScrollbar: =false
                                                TemplateSize: |-
                                                  =If(
                                                      scrNhapTuSanXuat.Size = 1,
                                                      (12 + 28 + 6 + 24 + 6 + 22 + 6 + 26 + 6) + 8 + 16 + 5 + 40,
                                                      45
                                                  )
                                                Width: =Parent.Width
                                              Children:
                                                - con_RowDividerNhapTuSanXuat:
                                                    Control: GroupContainer
                                                    Variant: ManualLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(229, 231, 235, 1)
                                                      Height: =1
                                                      Visible: =scrNhapTuSanXuat.Size <> 1
                                                      Width: =Parent.Width - 10
                                                      Y: =gal_NhapTuSanXuat.TemplateHeight
                                                - con_RowMasterNhapTuSanXuat:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =RGBA(229, 231, 235, 1)
                                                      BorderStyle: =If(scrNhapTuSanXuat.Size = 1, BorderStyle.Solid, BorderStyle.None)
                                                      BorderThickness: =1
                                                      DropShadow: =If(scrNhapTuSanXuat.Size = 1, DropShadow.Light, DropShadow.None)
                                                      Fill: =If(scrNhapTuSanXuat.Size = 1, RGBA(255, 255, 255, 1), RGBA(0, 0, 0, 0))
                                                      Height: =If(scrNhapTuSanXuat.Size = 1, gal_NhapTuSanXuat.TemplateHeight - 8, gal_NhapTuSanXuat.TemplateHeight)
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: |-
                                                        =If(
                                                            scrNhapTuSanXuat.Size = 1,
                                                            LayoutDirection.Vertical,
                                                            LayoutDirection.Horizontal
                                                        )
                                                      LayoutGap: =If(scrNhapTuSanXuat.Size = 1, 5, 0)
                                                      PaddingBottom: =If(scrNhapTuSanXuat.Size = 1, 8, 0)
                                                      PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 8, 0)
                                                      PaddingRight: =If(scrNhapTuSanXuat.Size = 1, 8, 0)
                                                      PaddingTop: =If(scrNhapTuSanXuat.Size = 1, 8, 0)
                                                      RadiusBottomLeft: =If(scrNhapTuSanXuat.Size = 1, 10, 0)
                                                      RadiusBottomRight: =If(scrNhapTuSanXuat.Size = 1, 10, 0)
                                                      RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 10, 0)
                                                      RadiusTopRight: =If(scrNhapTuSanXuat.Size = 1, 10, 0)
                                                      Width: =Parent.Width - 10
                                                    Children:
                                                      - con_RowNhapTuSanXuat:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            BorderColor: =RGBA(229, 231, 235, 1)
                                                            DropShadow: =DropShadow.None
                                                            Fill: =RGBA(255, 255, 255, 1)
                                                            FillPortions: =0
                                                            Height: |-
                                                              =If(
                                                                  scrNhapTuSanXuat.Size = 1,
                                                                  gal_NhapTuSanXuat.TemplateHeight - 8 - 16 - 5 - con_MobileActionNhapTuSanXuat.Height,
                                                                  48
                                                              )
                                                            LayoutAlignItems: =If(scrNhapTuSanXuat.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                            LayoutDirection: =If(scrNhapTuSanXuat.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                            LayoutGap: =If(scrNhapTuSanXuat.Size = 1, 6, 5)
                                                            LayoutMinHeight: =10
                                                            PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 14, 5)
                                                            PaddingRight: =If(scrNhapTuSanXuat.Size = 1, 14, 5)
                                                            PaddingTop: =If(scrNhapTuSanXuat.Size = 1, 12, 5)
                                                            Width: |-
                                                              =If(
                                                                  scrNhapTuSanXuat.Size = 1,
                                                                  Parent.Width - Parent.PaddingLeft - Parent.PaddingRight,
                                                                  Parent.Width - Parent.PaddingRight * 2 - Parent.LayoutGap - 10
                                                              )
                                                          Children:
                                                            - lbl_ReceiptCode:
                                                                Control: ModernText
                                                                Properties:
                                                                  Font: =fxFontFamily
                                                                  FontWeight: =If(scrNhapTuSanXuat.Size = 1, fxFontWeightBold, fxFontWeightSemiBold)
                                                                  Height: =If(scrNhapTuSanXuat.Size = 1, 28, 30)
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 0, 5)
                                                                  PaddingTop: =0
                                                                  Size: =If(scrNhapTuSanXuat.Size = 1, fxFontSizeLG, fxFontSizeMD)
                                                                  Text: |-
                                                                    =If(
                                                                        scrNhapTuSanXuat.Size = 1,
                                                                        ThisItem.ReceiptCode,
                                                                        ThisItem.ReceiptCode
                                                                    )
                                                                  Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderReceiptCode.Width)
                                                                  Wrap: =false
                                                            - lbl_ReceiptDate:
                                                                Control: ModernText
                                                                Properties:
                                                                  Color: =If(scrNhapTuSanXuat.Size = 1, RGBA(107, 114, 128, 1), RGBA(36, 36, 36, 1))
                                                                  Font: =fxFontFamily
                                                                  Height: =If(scrNhapTuSanXuat.Size = 1, 22, 30)
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 0, 5)
                                                                  PaddingTop: =0
                                                                  Size: =If(scrNhapTuSanXuat.Size = 1, fxFontSizeSM, fxFontSizeMD)
                                                                  Text: |-
                                                                    =If(
                                                                        scrNhapTuSanXuat.Size = 1,
                                                                        Text(ThisItem.ReceiptDate, "dd/mm/yyyy") & "   ·   Ca " & ThisItem.Shift & "   ·   " & LookUp(col_ProductCategories, ProductCategoryCode = ThisItem.ProductCategoryCode).ProductCategoryNameVI,
                                                                        Text(ThisItem.ReceiptDate, "dd/mm/yyyy")
                                                                    )
                                                                  Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderReceiptDate.Width)
                                                                  Wrap: =false
                                                            - lbl_StatusCode:
                                                                Control: ModernText
                                                                Properties:
                                                                  Color: =If(ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode, RGBA(55, 65, 81, 1), RGBA(180, 83, 9, 1))
                                                                  Fill: =If(ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode, RGBA(243, 244, 246, 1), RGBA(255, 243, 224, 1))
                                                                  Font: =fxFontFamily
                                                                  FontWeight: =fxFontWeightSemiBold
                                                                  Height: =24
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =10
                                                                  PaddingRight: =10
                                                                  PaddingTop: =0
                                                                  Size: =fxFontSizeSM
                                                                  Text: |-
                                                                    =With({statusItem: LookUp(col_WorkflowStatus, StatusCode = ThisItem.StatusCode)}, Coalesce(If(_defaultLanguage.Code = "EN", statusItem.StatusNameEN, statusItem.StatusNameVI), ThisItem.StatusCode))
                                                                  Width: =If(scrNhapTuSanXuat.Size = 1, Len(Self.Text) * 7 + 28, Min(Len(Self.Text) * 7 + 28, lbl_HeaderStatusCode.Width))
                                                                  Wrap: =false
                                                            - lbl_StatusSpacerNhapTuSanXuat:
                                                                Control: ModernText
                                                                Properties:
                                                                  Height: =24
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  Text: =""
                                                                  Visible: =scrNhapTuSanXuat.Size <> 1
                                                                  Width: =Max(0, lbl_HeaderStatusCode.Width - lbl_StatusCode.Width - Parent.LayoutGap)
                                                            - lbl_Shift:
                                                                Control: ModernText
                                                                Properties:
                                                                  Font: =fxFontFamily
                                                                  Height: =30
                                                                  Size: =fxFontSizeMD
                                                                  Text: |-
                                                                    =If(
                                                                        scrNhapTuSanXuat.Size = 1,
                                                                        "Ca : " & ThisItem.Shift,
                                                                        ThisItem.Shift
                                                                    )
                                                                  Visible: =!(scrNhapTuSanXuat.Size = 1)
                                                                  Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderShift.Width)
                                                                  Wrap: =false
                                                            - lbl_LoaiSanPhamNhap_Row:
                                                                Control: ModernText
                                                                Properties:
                                                                  Font: =fxFontFamily
                                                                  Height: =30
                                                                  Size: =fxFontSizeMD
                                                                  Text: |-
                                                                    =With(
                                                                        {_cat: LookUp(col_ProductCategories, ProductCategoryCode = ThisItem.ProductCategoryCode)},
                                                                        If(
                                                                            scrNhapTuSanXuat.Size = 1,
                                                                            "Loại sản phẩm: " & _cat.ProductCategoryNameVI,
                                                                            _cat.ProductCategoryNameVI
                                                                        )
                                                                    )
                                                                  Visible: =!(scrNhapTuSanXuat.Size = 1)
                                                                  Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderLoaiSanPhamNhap.Width)
                                                                  Wrap: =false
                                                            - lbl_TongNhap:
                                                                Control: ModernText
                                                                Properties:
                                                                  Color: =If(scrNhapTuSanXuat.Size = 1, RGBA(45, 128, 40, 1), RGBA(36, 36, 36, 1))
                                                                  Font: =fxFontFamily
                                                                  FontWeight: =If(scrNhapTuSanXuat.Size = 1, fxFontWeightBold, fxFontWeightNormal)
                                                                  Height: =If(scrNhapTuSanXuat.Size = 1, 26, 30)
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 0, 5)
                                                                  PaddingTop: =0
                                                                  Size: =fxFontSizeMD
