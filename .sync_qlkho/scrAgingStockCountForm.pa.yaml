Screens:
  scrAgingStockCountForm:
    Children:
      - con_MainBodyMenuDanhMucBinFormMobile_1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height - 55
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowMenuUser && scrAgingStockCountForm.Size = 1
            Width: =Parent.Width
            Y: =55
          Children:
            - con_BodyMenuDanhMucBinFormMobile_1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingBottom: =5
                  PaddingRight: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =scrAgingStockCountForm.Size = 1
                  Width: =Parent.Width * 0.7
                Children:
                  - cmp_NavSidebarDanhMucBinFormMobile_1:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - btn_DanhMucBinFormMenuOverlay_1:
                Control: ModernButton
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Transparent
                  FillPortions: =1
                  Layout: =ButtonLayout.TextOnly
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Set(
                        varShowMenuUser,
                        false
                    )
                  Text: =""
      - con_MainAgingStockCountForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuAgingStockCountForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrAgingStockCountForm.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarAgingStockCountForm:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainAgingStockCountForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderAgingStockCountForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderAgingStockCountForm:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrAgingStockCountForm.Size
                  - con_BodyAgingStockCountForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderAgingStockCountForm.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
                        PaddingBottom: =5
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =5
                      Children:
                        - con_BodyMainAgingStockCountForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(250, 250, 251, 1)
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                            Children:
                              - conAgingStockCountForm_ActionBar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Semilight
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =52
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                  Children:
                                    - btnAgingStockCountForm_Back:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="ChevronLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          OnSelect: =Back()
                                          Width: =36
                                    - btnAgingStockCountForm_Save:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="Save"
                                          OnSelect: |
                                            =If(
                                                IsBlank(cmb_AgingStockCountForm_SAPCode.Selected),
                                                Notify("Vui lòng chọn Mã SAP", NotificationType.Error, 2000),
                                                IsBlank(cmb_AgingStockCountForm_ProductCategory.Selected),
                                                Notify("Vui lòng chọn Loại hàng", NotificationType.Error, 2000),

                                                IfError(
                                                    Patch(
                                                        'QLK List Aging Stock Count',
                                                        If(
                                                            IsBlank(varAgingStockCountDetail.ID),
                                                            Defaults('QLK List Aging Stock Count'),
                                                            varAgingStockCountDetail
                                                        ),
                                                        {
                                                            PlantCode:           varUserInPlant.PlantCode,
                                                            PlantName:           varUserInPlant.PlantName,
                                                            SAPCode:             cmb_AgingStockCountForm_SAPCode.Selected.SAPCode,
                                                            ProductionDate:      dp_AgingStockCountForm_ProductionDate.SelectedDate,
                                                            ProductCategoryCode: cmb_AgingStockCountForm_ProductCategory.Selected.ProductCategoryCode,
                                                            Quantity:            num_AgingStockCountForm_ActualQty.Value,
                                                            AgingDays:           Value(txt_AgingStockCountForm_AgingDays.Text),
                                                            Reason:              txt_AgingStockCountForm_Reason.Text,
                                                            Note:                txt_AgingStockCountForm_Note.Text
                                                        }
                                                    ),
                                                    Notify("Không thể lưu dữ liệu.", NotificationType.Error, 2000),
                                                    Notify("Đã lưu thành công.", NotificationType.Success, 2000)
                                                )
                                            )
                                          Text: ="Lưu"
                                    - btnAgingStockCountForm_Save_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="Delete"
                                          OnSelect: |
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xóa bản ghi này không?",
                                                    {
                                                        Title: "Xác nhận xóa",
                                                        ConfirmButton: "Xóa",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),
                                                IfError(
                                                    Remove('QLK List Aging Stock Count', varAgingStockCountDetail),
                                                    Notify("Xóa không thành công", NotificationType.Error, 2000),
                                                    Notify("Đã xóa thành công.", NotificationType.Success, 2000);
                                                    Navigate(scrAgingStockCount, ScreenTransition.UnCoverRight)
                                                )
                                            )
                                          Text: ="Xóa"
                              - conAgingStockCountForm_Content:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - conAgingStockCountForm_SectionInfo:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: |-
                                            =If(
                                                scrAgingStockCountForm.Size = 1,
                                                400,
                                                230
                                            )
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =10
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - lblAgingStockCountForm_SectionInfo:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(45, 128, 40, 1)
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeLG
                                                Text: ="Thông tin hàng hóa"
                                          - conAgingStockCountForm_GridInfo:
                                              Control: GroupContainer
                                              Variant: GridLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutGap: =5
                                                LayoutGridColumns: =If(scrAgingStockCountForm.Size = 1, 1, 2)
                                                LayoutGridRows: =If(scrAgingStockCountForm.Size = 1, 4, 2)
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                              Children:
                                                - conAgingStockCountForm_FieldSAPCode:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =5
                                                      PaddingBottom: =5
                                                      PaddingLeft: =5
                                                      PaddingRight: =5
                                                      PaddingTop: =5
                                                    Children:
                                                      - lblAgingStockCountForm_SAPCode:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã SAP *"
                                                      - cmb_AgingStockCountForm_SAPCode:
                                                          Control: ModernCombobox
                                                          Properties:
                                                            DefaultSelectedItems: |-
                                                              =LookUp(
                                                                  'QLK List Master Data Production',
                                                                  SAPCode = varAgingStockCountDetail.SAPCode &&
                                                                  PlantCode = varAgingStockCountDetail.PlantCode
                                                              )
                                                            Font: =fxFontFamily
                                                            InputTextPlaceholder: =""
                                                            ItemDisplayText: =ThisItem.SAPCode
                                                            Items: |-
                                                              =Filter(
                                                                  'QLK List Master Data Production',
                                                                  PlantCode = varUserInPlant.PlantCode
                                                              )
                                                            LayoutMinWidth: =Parent.Width - 10
                                                            SelectMultiple: =false
                                                - conAgingStockCountForm_FieldProductCategory:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =5
                                                      PaddingBottom: =5
                                                      PaddingLeft: =5
                                                      PaddingRight: =5
                                                      PaddingTop: =5
                                                    Children:
                                                      - lblAgingStockCountForm_ProductCategory:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Loại hàng *"
                                                      - cmb_AgingStockCountForm_ProductCategory:
                                                          Control: ModernCombobox
                                                          Properties:
                                                            DefaultSelectedItems: |-
                                                              =Filter(
                                                                  col_ProductCategories,
                                                                  ProductCategoryCode = varAgingStockCountDetail.ProductCategoryCode
                                                              )
                                                            Font: =fxFontFamily
                                                            InputTextPlaceholder: =""
                                                            ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                            Items: =col_ProductCategories
                                                            LayoutMinWidth: =Parent.Width - 10
                                                            SelectMultiple: =false
                                                - conAgingStockCountForm_FieldProductionDate:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =5
                                                      PaddingBottom: =5
                                                      PaddingLeft: =5
                                                      PaddingRight: =5
                                                    Children:
                                                      - lblAgingStockCountForm_ProductionDate:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Ngày sản xuất *"
                                                      - dp_AgingStockCountForm_ProductionDate:
                                                          Control: ModernDatePicker
                                                          Properties:
                                                            BorderStyle: =""
                                                            DefaultDate: |-
                                                              =If(
                                                                  IsBlank(varAgingStockCountDetail.ID),
                                                                  Coalesce(
                                                                      First(
                                                                          SortByColumns(
                                                                              Filter(
                                                                                  'QLK List Stock Count Details',
                                                                                  PlantCode = varUserInPlant.PlantCode,
                                                                                  SAPCode = cmb_AgingStockCountForm_SAPCode.Selected.SAPCode
                                                                              ),
                                                                              "StockCountDate",
                                                                              SortOrder.Descending
                                                                          )
                                                                      ).StockCountDate,
                                                                      Today()
                                                                  ),
                                                                  varAgingStockCountDetail.ProductionDate
                                                              )
                                                            Font: =fxFontFamily
                                                            FontWeight: =""
                                                            Format: =DatePickerFormat.Short
                                                            LayoutMinWidth: =Parent.Width - 10
                                                            Placeholder: ="Chọn ngày ..."
                                                            Size: =0
                                                - conAgingStockCountForm_FieldActualQty:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =5
                                                      PaddingLeft: =5
                                                      PaddingRight: =5
                                                      PaddingTop: =5
                                                    Children:
                                                      - lblAgingStockCountForm_ActualQty:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Khối lượng"
                                                      - num_AgingStockCountForm_ActualQty:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: |-
                                                              =If(
                                                                  IsBlank(varAgingStockCountDetail.ID),
                                                                  Coalesce(
                                                                      First(
                                                                          SortByColumns(
                                                                              Filter(
                                                                                  'QLK List Stock Count Details',
                                                                                  PlantCode = varUserInPlant.PlantCode,
                                                                                  SAPCode = cmb_AgingStockCountForm_SAPCode.Selected.SAPCode
                                                                              ),
                                                                              "StockCountDate",
                                                                              SortOrder.Descending
                                                                          )
                                                                      ).ActualQty,
                                                                      0
                                                                  ),
                                                                  varAgingStockCountDetail.Quantity
                                                              )
                                                            LayoutMinWidth: =Parent.Width - 10
                                                            Min: =0
                                    - conAgingStockCountForm_SectionAging:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =150
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =10
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - lblAgingStockCountForm_SectionAging:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(45, 128, 40, 1)
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeLG
                                                Text: ="Thông tin quá hạn"
                                          - conAgingStockCountForm_GridAging:
                                              Control: GroupContainer
                                              Variant: GridLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutGap: =5
                                                LayoutGridColumns: =If(scrAgingStockCountForm.Size = 1, 1, 2)
                                                LayoutGridRows: =1
                                                LayoutMinHeight: =80
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                              Children:
                                                - conAgingStockCountForm_FieldAgingDays:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      PaddingBottom: =5
                                                      PaddingLeft: =5
                                                      PaddingRight: =5
                                                      PaddingTop: =5
                                                    Children:
                                                      - lblAgingStockCountForm_AgingDays:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Số ngày lưu kho"
                                                      - txt_AgingStockCountForm_AgingDays:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            Default: |-
                                                              =// Số ngày tồn = từ ngày sản xuất đang chọn trên form đến hôm nay.
                                                              // Khi sửa bản ghi mà không đổi ngày sản xuất thì giữ nguyên giá trị đã lưu.
                                                              If(
                                                                  IsBlank(varAgingStockCountDetail.ID) ||
                                                                  dp_AgingStockCountForm_ProductionDate.SelectedDate <> varAgingStockCountDetail.ProductionDate,
                                                                  Coalesce(
                                                                      DateDiff(dp_AgingStockCountForm_ProductionDate.SelectedDate, Today(), TimeUnit.Days),
                                                                      0
                                                                  ),
                                                                  varAgingStockCountDetail.AgingDays
                                                              )
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Placeholder: =
                                                - conAgingStockCountForm_FieldReason:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                      PaddingBottom: =5
                                                      PaddingLeft: =5
                                                      PaddingRight: =5
                                                      PaddingTop: =5
                                                    Children:
                                                      - lblAgingStockCountForm_Reason:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Nội dung"
                                                      - txt_AgingStockCountForm_Reason:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            Default: =varAgingStockCountDetail.Reason
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Placeholder: =
                                    - conAgingStockCountForm_SectionNote:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =180
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =10
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - lblAgingStockCountForm_SectionNote:
                                              Control: ModernText
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Color: =RGBA(45, 128, 40, 1)
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeLG
                                                Text: ="Ghi chú"
                                          - conAgingStockCountForm_FieldNote:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                                PaddingBottom: =5
                                                PaddingLeft: =5
                                                PaddingRight: =5
                                                PaddingTop: =5
                                              Children:
                                                - txt_AgingStockCountForm_Note:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      Default: =varAgingStockCountDetail.Note
                                                      Height: =Parent.Height - 10
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      Placeholder: ="Nhập ghi chú .."
                                                      Type: =TextInputType.Multiline
