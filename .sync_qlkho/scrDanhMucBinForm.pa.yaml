Screens:
  scrDanhMucBinForm:
    Children:
      - con_MainDanhMucBinForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuDanhMucBinForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrDanhMucBinForm.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarDanhMucBinForm:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainDanhMucBinForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderDanhMucBinForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderDanhMucBinForm:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrDanhMucBinForm.Size
                  - con_BodyDanhMucBinForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderDanhMucBinForm.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_BodyMainDanhMucBinForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(250, 250, 251, 1)
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - conDanhMucBinForm_ActionBar:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Semilight
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =52
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                  Children:
                                    - btnDanhMucBinForm_Back:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="ChevronLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          OnSelect: =Back()
                                          Width: =36
                                    - btnDanhMucBinForm_Save:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="Save"
                                          OnSelect: |-
                                            =IfError(
                                                Patch(
                                                    'QLK List Bin',
                                                    If(
                                                        IsBlank(varBinDetail),
                                                        Defaults('QLK List Bin'),
                                                        varBinDetail
                                                    ),
                                                    {
                                                        BinCode: Trim(txtDanhMucBinForm_BinCode.Text),
                                                        H1: txtDanhMucBinForm_H1.Value,
                                                        H2: txtDanhMucBinForm_H2.Value,
                                                        H3: txtDanhMucBinForm_H3.Value,
                                                        H4: txtDanhMucBinForm_H4.Value,
                                                        H5: txtDanhMucBinForm_H5.Value,
                                                        Aging1Min: txtDanhMucBinForm_Aging1Min.Value,
                                                        Aging1Max: txtDanhMucBinForm_Aging1Max.Value,
                                                        Aging2Min: txtDanhMucBinForm_Aging2Min.Value,
                                                        Aging2MaxAging3Min: txtDanhMucBinForm_Aging2MaxAging3Min.Value,
                                                        Aging3MaxAging4Min: txtDanhMucBinForm_Aging3MaxAging4Min.Value,
                                                        Aging4MaxAging5Min: txtDanhMucBinForm_Aging4MaxAging5Min.Value,
                                                        Aging5Max: txtDanhMucBinForm_Aging5Max.Value
                                                    }
                                                ),
                                                Notify("Không thể lưu dữ liệu.", NotificationType.Error,2000),
                                                Notify("Đã lưu thành công.", NotificationType.Success,2000)
                                            )
                                          Text: ="Lưu"
                                    - btnDanhMucBinForm_Refresh:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="ArrowClockwise"
                                          OnSelect: =Refresh('QLK List Bin')
                                          Text: ="Làm mới"
                                          Width: =120
                              - conDanhMucBinForm_Content:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =12
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - conDanhMucBinForm_SectionInfo:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =130
                                          LayoutDirection: =LayoutDirection.Vertical
                                          PaddingBottom: =10
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =10
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - lblDanhMucBinForm_SectionInfo:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(45, 128, 40, 1)
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeLG
                                                Text: ="1. Thông tin bin"
                                          - conDanhMucBinForm_GridInfo:
                                              Control: GroupContainer
                                              Variant: GridLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =0
                                                LayoutGap: =10
                                                LayoutGridColumns: =1
                                                LayoutGridRows: =1
                                                LayoutMinHeight: =10
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                              Children:
                                                - conDanhMucBinForm_FieldBinCode:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_BinCode:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã bin *"
                                                      - txtDanhMucBinForm_BinCode:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            Default: =varBinDetail.BinCode
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =Parent.Width
                                                            Placeholder: ="Nhập mã bin"
                                                            Size: =fxFontSizeMD
                                    - conDanhMucBinForm_SectionH:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =If(scrDanhMucBinForm.Size = 1, 520, 320)
                                          LayoutDirection: =LayoutDirection.Vertical
                                          PaddingBottom: =10
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =10
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - lblDanhMucBinForm_SectionH:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(45, 128, 40, 1)
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeLG
                                                Text: ="2. Thông số H"
                                          - conDanhMucBinForm_GridH:
                                              Control: GroupContainer
                                              Variant: GridLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutGap: =15
                                                LayoutGridColumns: =If(scrDanhMucBinForm.Size = 1, 1, 2)
                                                LayoutGridRows: =If(scrDanhMucBinForm.Size = 1, 5, 3)
                                              Children:
                                                - conDanhMucBinForm_FieldH1:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_H1:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="H1"
                                                      - txtDanhMucBinForm_H1:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.H1
                                                            LayoutMinWidth: =Parent.Width
                                                - conDanhMucBinForm_FieldH2:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_H2:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="H2"
                                                      - txtDanhMucBinForm_H2:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.H2
                                                            LayoutMinWidth: =Parent.Width
                                                            Min: =0
                                                - conDanhMucBinForm_FieldH3:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_H3:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="H3"
                                                      - txtDanhMucBinForm_H3:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.H3
                                                            LayoutMinWidth: =Parent.Width
                                                            Min: =0
                                                - conDanhMucBinForm_FieldH4:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_H4:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="H4"
                                                      - txtDanhMucBinForm_H4:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.H4
                                                            LayoutMinWidth: =Parent.Width
                                                            Min: =0
                                                - conDanhMucBinForm_FieldH5:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_H5:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="H5"
                                                      - txtDanhMucBinForm_H5:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.H5
                                                            LayoutMinWidth: =Parent.Width
                                    - conDanhMucBinForm_SectionAging:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =If(scrDanhMucBinForm.Size = 1, 720, 420)
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =10
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                        Children:
                                          - lblDanhMucBinForm_SectionAging:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(45, 128, 40, 1)
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeLG
                                                Text: ="3. Aging"
                                          - conDanhMucBinForm_GridAging:
                                              Control: GroupContainer
                                              Variant: GridLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutGap: =15
                                                LayoutGridColumns: =If(scrDanhMucBinForm.Size = 1, 1, 2)
                                                LayoutGridRows: =If(scrDanhMucBinForm.Size = 1, 7, 4)
                                              Children:
                                                - conDanhMucBinForm_FieldAging1Min:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_Aging1Min:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="S1.1"
                                                      - txtDanhMucBinForm_Aging1Min:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.Aging1Min
                                                            LayoutMinWidth: =Parent.Width
                                                - conDanhMucBinForm_FieldAging1Max:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_Aging1Max:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="S1.2"
                                                      - txtDanhMucBinForm_Aging1Max:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.Aging1Max
                                                            LayoutMinWidth: =Parent.Width
                                                - conDanhMucBinForm_FieldAging2Min:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_Aging2Min:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="S2.1"
                                                      - txtDanhMucBinForm_Aging2Min:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.Aging2Min
                                                            LayoutMinWidth: =Parent.Width
                                                - conDanhMucBinForm_FieldAging2MaxAging3Min:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_Aging2MaxAging3Min:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="S2.2, S3.1"
                                                      - txtDanhMucBinForm_Aging2MaxAging3Min:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.Aging2MaxAging3Min
                                                            LayoutMinWidth: |
                                                              =Parent.Width
                                                - conDanhMucBinForm_FieldAging3MaxAging4Min:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_Aging3MaxAging4Min:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="S3.2, S4.1"
                                                      - txtDanhMucBinForm_Aging3MaxAging4Min:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.Aging3MaxAging4Min
                                                            LayoutMinWidth: =Parent.Width
                                                - conDanhMucBinForm_FieldAging4MaxAging5Min:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_Aging4MaxAging5Min:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="S4.2, S5.1"
                                                      - txtDanhMucBinForm_Aging4MaxAging5Min:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.Aging4MaxAging5Min
                                                            LayoutMinWidth: =Parent.Width
                                                - conDanhMucBinForm_FieldAging5Max:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =76
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lblDanhMucBinForm_Aging5Max:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="S5.2"
                                                      - txtDanhMucBinForm_Aging5Max:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            Default: =varBinDetail.Aging5Max
                                                            LayoutMinWidth: =Parent.Width
      - con_MainBodyMenuDanhMucBinFormMobile:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height - 55
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowMenuUser && scrDanhMucBinForm.Size = 1
            Width: =Parent.Width
            Y: =55
          Children:
            - con_BodyMenuDanhMucBinFormMobile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingBottom: =5
                  PaddingRight: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =scrDanhMucBinForm.Size = 1
                  Width: =Parent.Width * 0.7
                Children:
                  - cmp_NavSidebarDanhMucBinFormMobile:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - btn_DanhMucBinFormMenuOverlay:
                Control: ModernButton
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Transparent
                  FillPortions: =1
                  Layout: =ButtonLayout.TextOnly
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Set(
                        varShowMenuUser,
                        false
                    )
                  Text: =""
