Screens:
  scrPheDuyetChenhLech:
    Children:
      - con_MainNhapTuSanXuat_4:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuNhapTuSanXuat_4:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrNhapTuSanXuat.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarNhapTuSanXuat_4:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainNhapTuSanXuat_4:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderNhapTuSanXuat_4:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderNhapTuSanXuat_4:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrNhapTuSanXuat.Size
                  - con_BodyNhapTuSanXuat_5:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderNhapTuSanXuat_4.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentNhapTuSanXuat_4:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrDanhMucBin.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_ActionHeaderNhapTuSanXuat_4:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - btn_AddNhapTuSanXuat_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: =Set(varProductionReceiptDetail, {}); Navigate(scrNhapTuSanXuatForm, ScreenTransition.CoverRight)
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                    - btn_RefreshNhapTuSanXuat_4:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: |
                                            =Refresh('QLK List Production Receipts');
                                            Refresh('QLK List Production Receipt Details');
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                              - lbl_TitleNhapTuSanXuat_4:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Duyệt  Chênh lệch"
                              - con_FilterNhapTuSanXuat_4:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =42
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - txt_SearchNhapTuSanXuat_4:
                                        Control: ModernTextInput
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          LayoutMinWidth: =16
                                          Placeholder: ="Tìm kiếm ...."
                                    - btn_FilterNhapTuSanXuat_4:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Filter"
                                          OnSelect: |-
                                            =UpdateContext({varPopUpFilterNhapTuSanXuat: true})
                                          Text: ="Bộ lọc"
                              - con_ListNhapTuSanXuat_1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =If(scrNhapTuSanXuat.Size = 1, DropShadow.None, DropShadow.Semibold)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 0, 5)
                                    RadiusTopRight: =6
                                    Width: =Parent.Width - Parent.PaddingLeft * 2
                                  Children:
                                    - lbl_TotalRowsNhapTuSanXuat_1:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeMD
                                          Text: =0
      - con_MenuOverlayMaTranPheDuyet_1:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height - 55
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =5
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowMenuUser && scrMaTranPheDuyet.Size = 1
            Width: =Parent.Width
            Y: =55
          Children:
            - con_MenuPanelMaTranPheDuyet_1:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =scrMaTranPheDuyet.Size = 1
                  Width: =Parent.Width * 0.7
                Children:
                  - cmp_NavSidebarMaTranPheDuyetMobile_1:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - btn_CloseMenuOverlayMaTranPheDuyet_1:
                Control: ModernButton
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Transparent
                  FillPortions: =1
                  Layout: =ButtonLayout.TextOnly
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(varShowMenuUser, false)
                  Text: =""
      - con_PopupProcessingKiemKho_6:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =//varShowPopupProcessing
            Width: =Parent.Width
          Children:
            - DialogProccessingKiemKho_7:
                Control: CanvasComponent
                ComponentName: DialogProccessing
                Properties:
                  Height: =App.Height
                  Width: =App.Width
