      - ComboBox1:
          Control: ModernCombobox
          Properties:
            Appearance: =Appearance.Outline
            BasePaletteColor: =RGBA(22, 163, 74, 1)
            Color: =RGBA(17, 24, 39, 1)
            DefaultSelectedItems: |-
              =// Hiển thị user đang được chọn (mặc định là user đăng nhập)
              Filter(
                  'GFVN_SharePointListHREmployeesURL',
                  G_Email = varCurrentUser.G_Email
              )
            DelayOutput: =true
            Font: =fxFontFamily
            Height: =36
            InputTextPlaceholder: ="Giả lập user..."
            ItemDisplayText: =ThisItem.FullName & " - " & ThisItem.G_Email
            Items: |
              =// Luôn lấy từ danh sách HR; gõ để tìm theo tên hoặc email (delegable)
              If(
                  IsBlank(Self.SearchText),
                  // Chưa gõ gì: chỉ lấy 50 người đầu để mở dropdown nhanh, không bị trắng
                  FirstN(
                      SortByColumns(
                          'GFVN_SharePointListHREmployeesURL',
                          "FullName",
                          SortOrder.Ascending
                      ),
                      50
                  ),
                  SortByColumns(
                      Filter(
                          'GFVN_SharePointListHREmployeesURL',
                          StartsWith(FullName, Self.SearchText)
                              || StartsWith(G_Email, Self.SearchText)
