Screens:
  scrUsers:
    Properties:
      Fill: =   Color.White
      OnVisible: |-
        =If(
            scrUsers.Size = 1,
            Set(
                varShowMenuUser,
                false
            )
        )
    Children:
      - conMainUser:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: |
              =0
          Children:
            - conBodyMenuUser:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |-
                    =If(
                        scrUsers.Size = 1,
                        false,
                        true
                    )
                  Width: |-
                    =If(
                        varShowMenuUser,
                        240,
                        64
                    )
                Children:
                  - NavSiderBarUser:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainUser:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - conHeaderUser:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - HeaderUser:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrUsers.Size
                  - conBodyUser:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - conHeaderUser.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser,0,5)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =If(!varShowMenuUser,0,5)
                        PaddingLeft: =If(!varShowMenuUser,0,5)
                        PaddingRight: =If(!varShowMenuUser,0,5)
                        PaddingTop: =If(!varShowMenuUser,0,5)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conBodyMainUser:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    !varShowMenuUser,
                                    DropShadow.None,
                                    DropShadow.Semibold
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.Height - Parent.PaddingTop - Parent.PaddingBottom
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =If(!varShowMenuUser,0,5)
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =If(!varShowMenuUser,0,5)
                              RadiusTopRight: =5
                            Children:
                              - Text2:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: |
                                      ="Thông tin người dùng"
                              - con_FilterUser:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(scrUsers.Size = 1, 96, 52)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    LayoutWrap: =scrUsers.Size = 1
                                    PaddingBottom: =8
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - txt_searchUser:
                                        Control: ModernTextInput
                                        Properties:
                                          Appearance: =Appearance.Outline
                                          FillPortions: =If(scrUsers.Size = 1, 0, 1)
                                          Font: =fxFontFamily
                                          Height: =36
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =120
                                          OnChange: =If(scrUsers.Size = 1, Reset(gal_Users); Reset(gal_UsersInPlant))
                                          Placeholder: ="Tìm theo MSNV, họ tên, email..."
                                          Size: =fxFontSizeMD
                                          TriggerOutput: =TriggerOutput.Delayed
                                          Type: =TextInputType.Search
                                          Width: =If(scrUsers.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 320)
                                    - cbx_FilterRoleUser:
                                        Control: ModernCombobox
                                        Properties:
                                          Appearance: =Appearance.Outline
                                          Font: =fxFontFamily
                                          Height: =36
                                          InputTextPlaceholder: ="Lọc theo vai trò..."
                                          ItemDisplayText: =ThisItem.RoleNameVI
                                          Items: =col_RoleUser
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =140
                                          OnChange: =If(scrUsers.Size = 1, Reset(gal_Users); Reset(gal_UsersInPlant))
                                          SelectMultiple: =false
                                          Size: =fxFontSizeMD
                                          Width: =If(scrUsers.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap - 40, 280)
                                    - btn_clearSearchUser:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Height: =36
                                          Icon: ="Eraser"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Reset(txt_searchUser);
                                            Reset(cbx_FilterRoleUser)
                                          Size: =fxFontSizeMD
                                          Text: =If(scrUsers.Size = 1, "", "Xóa lọc")
                                          Width: =If(scrUsers.Size = 1, 40, 100)
                              - con_ListUser:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: |-
                                      =If(
                                          scrUsers.Size = 1,
                                          DropShadow.None,
                                          DropShadow.Semibold
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: |-
                                      =If(
                                          scrUsers.Size = 1,
                                          0,
                                          5
                                      )
                                    RadiusTopRight: =0
                                    Width: =Parent.Width - Parent.PaddingLeft*2
                                  Children:
                                    - con_UserListBody:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          LayoutOverflowX: =LayoutOverflow.Scroll
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - con_UserGalleryWrapper:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =Parent.Height - Text4.Height
                                                LayoutMinHeight: =Parent.Height
                                                LayoutMinWidth: =16
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =conBodyMainUser.Width - 10
                                              Children:
                                                - con_UserTableHeader:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(249, 249, 249, 1)
                                                      Height: =If(scrUsers.Size = 1, 0, 50)
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      PaddingLeft: =10
                                                      PaddingRight: =10
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Visible: |-
                                                        =If(
                                                            scrUsers.Size = 1,
                                                            false,
                                                            true
                                                        )
                                                      Width: =Parent.Width
                                                      X: |
                                                        =0
                                                    Children:
                                                      - lbl_UserHeaderMSSV:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="MSSV"
                                                      - lbl_UserHeaderFullName:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =2
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Họ tên"
                                                      - lbl_UserHeaderEmail:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =2
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Email"
                                                      - lbl_UserHeaderRole:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =2
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Role"
                                                      - lbl_UserHeaderActions:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Thao tác"
                                                - gal_Users:
                                                    Control: Gallery
                                                    Variant: Vertical
                                                    Properties:
                                                      BorderStyle: =BorderStyle.None
                                                      Height: =Parent.Height- con_UserTableHeader.Height
                                                      Items: |-
                                                        =If(
                                                            IsBlank(cbx_FilterRoleUser.Selected.RoleCode),
                                                            // Không lọc role: toàn bộ list HR (delegable)
                                                            SortByColumns(
                                                                Filter(
                                                                    'GFVN_SharePointListHREmployeesURL',
                                                                    IsBlank(txt_searchUser.Text) ||
                                                                        StartsWith(UserId, txt_searchUser.Text) ||
                                                                        StartsWith(FullName, txt_searchUser.Text) ||
                                                                        StartsWith(G_Email, txt_searchUser.Text)
                                                                ),
                                                                "FullName",
                                                                SortOrder.Ascending
                                                            ),
                                                            // Có lọc role: lấy email theo role trong User In Plant rồi tra thông tin HR
                                                            SortByColumns(
                                                                Filter(
                                                                    ForAll(
                                                                        Filter('QLK List User In Plant', Role = cbx_FilterRoleUser.Selected.RoleCode) As _u,
                                                                        LookUp('GFVN_SharePointListHREmployeesURL', G_Email = _u.UserEmail)
                                                                    ),
                                                                    !IsBlank(G_Email) &&
                                                                    (
                                                                        IsBlank(txt_searchUser.Text) ||
                                                                        StartsWith(UserId, txt_searchUser.Text) ||
                                                                        StartsWith(FullName, txt_searchUser.Text) ||
                                                                        StartsWith(G_Email, txt_searchUser.Text)
                                                                    )
                                                                ),
                                                                "FullName",
                                                                SortOrder.Ascending
                                                            )
                                                        )
                                                      ShowScrollbar: =false
                                                      TemplateSize: =If(scrUsers.Size = 1, 182, 50)
                                                      Visible: |-
                                                        =// 1. idt.automation → list HR
                                                        varCurrentUser.G_Email = "idt.automation@greenfeed.com.vn"
                                                      Width: =Parent.Width
                                                      X: |
                                                        =0
                                                      Y: =con_UserTableHeader.Height
                                                    Children:
                                                      - con_parentUser:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            DropShadow: |-
                                                              =If(
                                                                  scrUsers.Size = 1,
                                                                  DropShadow.Light,
                                                                  DropShadow.None
                                                              )
                                                            Fill: =RGBA(255, 255, 255, 1)
                                                            Height: =If(scrUsers.Size = 1, 172, 50)
                                                            LayoutDirection: =If(scrUsers.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                            RadiusBottomLeft: =If(scrUsers.Size = 1, 8, 1)
                                                            RadiusBottomRight: =If(scrUsers.Size = 1, 8, 1)
                                                            RadiusTopLeft: =If(scrUsers.Size = 1, 8, 5)
                                                            RadiusTopRight: =If(scrUsers.Size = 1, 8, 1)
                                                            Width: =Parent.Width - 10
                                                          Children:
                                                            - conUserRow:
                                                                Control: GroupContainer
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  AlignInContainer: =AlignInContainer.SetByContainer
                                                                  DropShadow: =DropShadow.None
                                                                  FillPortions: =0
                                                                  Height: =If(scrUsers.Size = 1, 120, 50)
                                                                  LayoutAlignItems: |
                                                                    =If(
                                                                        scrUsers.Size = 1,
                                                                        LayoutAlignItems.Start,
                                                                        LayoutAlignItems.Center
                                                                    )
                                                                  LayoutDirection: =LayoutDirection.Horizontal
                                                                  LayoutGap: =If(scrUsers.Size = 1, 4, 0)
                                                                  LayoutWrap: =scrUsers.Size = 1
                                                                  PaddingBottom: =If(scrUsers.Size = 1, 7, 0)
                                                                  PaddingLeft: =If(scrUsers.Size = 1, 14, 5)
                                                                  PaddingRight: =If(scrUsers.Size = 1, 14, 10)
                                                                  PaddingTop: =If(scrUsers.Size = 1, 9, 0)
                                                                  RadiusBottomLeft: =0
                                                                  RadiusBottomRight: =0
                                                                  RadiusTopLeft: =0
                                                                  RadiusTopRight: =0
                                                                  Width: =Parent.Width
                                                                  X: |
                                                                    =0
                                                                Children:
                                                                  - lbl_UserMSSV:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrUsers.Size = 1, AlignInContainer.Start, AlignInContainer.SetByContainer)
                                                                        Color: =If(scrUsers.Size = 1, RGBA(36, 36, 36, 1), RGBA(36, 36, 36, 1))
                                                                        FillPortions: |-
                                                                          =If(
                                                                              scrUsers.Size = 1,
                                                                              0,
                                                                              1
                                                                          )
                                                                        Font: =fxFontFamily
                                                                        FontWeight: =fxFontWeightNormal
                                                                        Height: =If(scrUsers.Size = 1, 50, 30)
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                        PaddingBottom: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingLeft: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingRight: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingTop: =If(scrUsers.Size = 1, 0, 5)
                                                                        Size: =If(scrUsers.Size = 1, fxFontSizeSM, fxFontSizeMD)
                                                                        Text: =If(scrUsers.Size = 1, "MSSV" & Char(10) & ThisItem.UserId, ThisItem.UserId)
                                                                        VerticalAlign: =If(scrUsers.Size = 1, VerticalAlign.Top, VerticalAlign.Middle)
                                                                        Width: =If(scrUsers.Size = 1, (Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap) / 2 - 1, 150)
                                                                        Wrap: =scrUsers.Size = 1
                                                                  - lbl_UserFullName:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrUsers.Size = 1, AlignInContainer.Start, AlignInContainer.SetByContainer)
                                                                        Color: =If(scrUsers.Size = 1, RGBA(36, 36, 36, 1), RGBA(36, 36, 36, 1))
                                                                        FillPortions: |-
                                                                          =If(
                                                                              scrUsers.Size = 1,
                                                                              0,
                                                                              2
                                                                          )
                                                                        Font: =fxFontFamily
                                                                        FontWeight: =If(scrUsers.Size = 1, fxFontWeightSemiBold, fxFontWeightNormal)
                                                                        Height: =If(scrUsers.Size = 1, 50, 30)
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                        PaddingBottom: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingLeft: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingRight: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingTop: =If(scrUsers.Size = 1, 0, 5)
                                                                        Size: =If(scrUsers.Size = 1, fxFontSizeSM, fxFontSizeMD)
                                                                        Text: =If(scrUsers.Size = 1, "Họ tên" & Char(10) & Trim(ThisItem.FullName), Trim(ThisItem.FullName))
                                                                        VerticalAlign: =If(scrUsers.Size = 1, VerticalAlign.Top, VerticalAlign.Middle)
                                                                        Width: =If(scrUsers.Size = 1, (Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap) / 2 - 1, 150)
                                                                        Wrap: =scrUsers.Size = 1
                                                                  - lbl_UserEmail:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrUsers.Size = 1, AlignInContainer.Start, AlignInContainer.SetByContainer)
                                                                        Color: =If(scrUsers.Size = 1, RGBA(36, 36, 36, 1), RGBA(36, 36, 36, 1))
                                                                        FillPortions: |-
                                                                          =If(
                                                                              scrUsers.Size = 1,
                                                                              0,
                                                                              2
                                                                          )
                                                                        Font: =fxFontFamily
                                                                        FontWeight: =fxFontWeightNormal
                                                                        Height: =If(scrUsers.Size = 1, 50, 30)
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                        PaddingBottom: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingLeft: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingRight: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingTop: =If(scrUsers.Size = 1, 0, 5)
                                                                        Size: =If(scrUsers.Size = 1, fxFontSizeSM, fxFontSizeMD)
                                                                        Text: =If(scrUsers.Size = 1, "Email" & Char(10) & ThisItem.G_Email, ThisItem.G_Email)
                                                                        VerticalAlign: =If(scrUsers.Size = 1, VerticalAlign.Top, VerticalAlign.Middle)
                                                                        Width: =If(scrUsers.Size = 1, (Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap) / 2 - 1, 150)
                                                                        Wrap: =scrUsers.Size = 1
                                                                  - lbl_UserRole:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrUsers.Size = 1, AlignInContainer.Start, AlignInContainer.SetByContainer)
                                                                        Color: =If(scrUsers.Size = 1, RGBA(45, 128, 40, 1), RGBA(36, 36, 36, 1))
                                                                        Fill: =RGBA(0, 0, 0, 0)
                                                                        FillPortions: |-
                                                                          =If(
                                                                              scrUsers.Size = 1,
                                                                              0,
                                                                              2
                                                                          )
                                                                        Font: =fxFontFamily
                                                                        FontWeight: =If(scrUsers.Size = 1, fxFontWeightSemiBold, fxFontWeightNormal)
                                                                        Height: =If(scrUsers.Size = 1, 50, 30)
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                        PaddingBottom: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingLeft: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingRight: =If(scrUsers.Size = 1, 0, 5)
                                                                        PaddingTop: =If(scrUsers.Size = 1, 0, 5)
                                                                        RadiusBottomLeft: =0
                                                                        RadiusBottomRight: =0
                                                                        RadiusTopLeft: =0
                                                                        RadiusTopRight: =0
                                                                        Size: =If(scrUsers.Size = 1, fxFontSizeSM, fxFontSizeMD)
                                                                        Text: =If(scrUsers.Size = 1, "Vai trò" & Char(10) & Coalesce(LookUp(col_RoleUser,RoleCode = LookUp('QLK List User In Plant',UserEmail = ThisItem.G_Email).Role).RoleNameVI, "Chưa phân quyền"), Coalesce(LookUp(col_RoleUser,RoleCode = LookUp('QLK List User In Plant',UserEmail = ThisItem.G_Email).Role).RoleNameVI, "Chưa phân quyền"), Coalesce(LookUp(col_RoleUser,RoleCode = LookUp('QLK List User In Plant',UserEmail = ThisItem.G_Email).Role).RoleNameVI, "Chưa phân quyền"), Coalesce(LookUp(col_RoleUser,RoleCode = LookUp('QLK List User In Plant',UserEmail = ThisItem.G_Email).Role).RoleNameVI, "-"))
                                                                        VerticalAlign: =If(scrUsers.Size = 1, VerticalAlign.Top, VerticalAlign.Middle)
                                                                        Width: =If(scrUsers.Size = 1, (Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap) / 2 - 1, 150)
                                                                        Wrap: =scrUsers.Size = 1
                                                                  - con_UserActions:
                                                                      Control: GroupContainer
                                                                      Variant: AutoLayout
                                                                      Properties:
                                                                        AlignInContainer: =AlignInContainer.SetByContainer
                                                                        DropShadow: =DropShadow.None
                                                                        Height: |
                                                                          =30
                                                                        LayoutAlignItems: =LayoutAlignItems.Center
                                                                        LayoutDirection: =LayoutDirection.Horizontal
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                        PaddingBottom: =8
                                                                        RadiusBottomLeft: =0
                                                                        RadiusBottomRight: =0
                                                                        RadiusTopLeft: =0
                                                                        RadiusTopRight: =0
                                                                        Visible: |-
                                                                          =If(
                                                                              scrUsers.Size = 1,
                                                                              false,
                                                                              true
                                                                          )
                                                                        Width: =0
                                                                      Children:
                                                                        - btn_UserEdit:
                                                                            Control: ModernButton
                                                                            Properties:
                                                                              Appearance: =ButtonAppearance.Transparent
                                                                              Icon: ="Eye"
                                                                              Layout: =ButtonLayout.IconOnly
                                                                              LayoutMinHeight: =16
                                                                              LayoutMinWidth: =16
                                                                              OnSelect: |
                                                                                =// Mở popup chỉnh sửa user, load data hiện tại vào biến
                                                                                UpdateContext(
                                                                                    {
                                                                                        varShowEditUser:   true,
                                                                                        varEditUserDetail: LookUp(                         // Lấy record User In Plant theo email
                                                                                                               'QLK List User In Plant',
                                                                                                               UserEmail = ThisItem.G_Email
                                                                                                           ),
                                                                                        varDetailUser:     ThisItem                        // Lưu thông tin user từ Google
                                                                                    }
                                                                                );

                                                                                // Reset combobox về mặc định trước khi mở form
                                                                                Reset(cbx_EUNhaMay);
                                                                                Reset(cbx_EURole);
                                                                              Width: =30
                                                            - con_buttonUserMobile:
                                                                Control: GroupContainer
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  AlignInContainer: =AlignInContainer.SetByContainer
                                                                  DropShadow: =DropShadow.None
                                                                  FillPortions: =0
                                                                  Height: =44
                                                                  LayoutDirection: =LayoutDirection.Vertical
                                                                  LayoutJustifyContent: =LayoutJustifyContent.Center
                                                                  PaddingLeft: =14
                                                                  PaddingRight: =14
                                                                  RadiusBottomLeft: =0
                                                                  RadiusBottomRight: =0
                                                                  RadiusTopLeft: =0
                                                                  RadiusTopRight: =0
                                                                  Visible: |-
                                                                    =If(
                                                                        scrUsers.Size = 1,
                                                                        true,
                                                                        false
                                                                    )
                                                                  Width: =Parent.Width
                                                                Children:
