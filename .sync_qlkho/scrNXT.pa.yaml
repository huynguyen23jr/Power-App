Screens:
  scrNXT:
    Properties:
      OnVisible: =varShowMenuUser && scrNXT.Size <> 1
    Children:
      - con_MainNXT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuNXT:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrNXT.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarNXT:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainNXT:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderNXT_1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderNXT:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrNXT.Size
                  - con_BodyNXT:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderNXT_1.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentNXT:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrNXT.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_ActionHeaderNXT:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - btn_AddNewNXT:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =// Reset form và clear dữ liệu cũ song song trước khi chuyển màn hình
                                            Concurrent(
                                                Set(varNXTDetail, {}),          // Xóa phiếu đang chọn
                                                Reset(dp_NXT_InventoryDate),    // Reset ngày về mặc định
                                                Reset(cmb_NXT_ProductCategory)  // Reset loại sản phẩm về mặc định
                                            );

                                            // Chuyển sang màn hình form chi tiết NXT
                                            Navigate(scrNXTForm, ScreenTransition.CoverRight)
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm "
                                          Visible: |-
                                            =varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||   // FG_WH         - Thủ kho thành phẩm
                                            varUserInPlant.Role = Index(col_RoleUser,9).RoleCode ||   // VHSX_HO       - VHSX HO
                                            varUserInPlant.Role = Index(col_RoleUser,2).RoleCode      // FG_SUP        - Giám sát thành phẩm
                                          Width: =120
                                    - btn_RefreshNXT:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: =Refresh('QLK List Inventory')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                              - lbl_TitleNXT_1:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Nhập xuất tồn"
                              - con_FilterNXT:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    BorderThickness: =If(scrNXT.Size = 1, 1, 0)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(scrNXT.Size = 1, RGBA(248, 250, 252, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =0
                                    Height: =If(scrNXT.Size = 1, 96, 45)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =If(scrNXT.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutGap: =If(scrNXT.Size = 1, 0, 8)
                                    LayoutMinWidth: =10
                                    PaddingBottom: =If(scrNXT.Size = 1, 8, 0)
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =If(scrNXT.Size = 1, 8, 0)
                                    RadiusBottomLeft: =If(scrNXT.Size = 1, 8, 0)
                                    RadiusBottomRight: =If(scrNXT.Size = 1, 8, 0)
                                    RadiusTopLeft: =If(scrNXT.Size = 1, 8, 0)
                                    RadiusTopRight: =If(scrNXT.Size = 1, 8, 0)
                                  Children:
                                    - con_SearchNXT:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Width: |-
                                            =If(
                                                scrNXT.Size = 1,
                                                Parent.Width - Parent.PaddingLeft - Parent.PaddingRight,
                                                Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap - con_FilterActionsNXT.Width
                                            )
                                        Children:
                                          - txt_SearchNXT:
                                              Control: ModernTextInput
                                              Properties:
                                                Font: =fxFontFamily
                                                LayoutMinWidth: =16
                                                Placeholder: ="Tìm kiếm ...."
                                                Width: =Parent.Width
                                    - con_FilterActionsNXT:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Width: =If(scrNXT.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 160 + 36 + 8)
                                        Children:
                                          - cbo_FilterProductTypeNhapTuSanXuat_13:
                                              Control: ModernCombobox
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                                FillPortions: =
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightNormal
                                                InputTextPlaceholder: ="Tất cả"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                Items: =col_ProductCategories
                                                SelectMultiple: =false
                                                Width: =Parent.Width - btn_ClearFilterNXT.Width - Parent.LayoutGap
                                          - btn_ClearFilterNXT:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =ButtonAppearance.Outline
                                                BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                Font: =fxFontFamily
                                                Icon: ="Eraser"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =Reset(txt_SearchNXT);
                                                  Reset(cbo_FilterProductTypeNhapTuSanXuat_13)
                                                Text: =
                                                Width: =36
                              - con_ListNXT_1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =If(scrNXT.Size = 1, DropShadow.None, DropShadow.Semibold)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =If(scrNXT.Size = 1, 0, 5)
                                    RadiusTopRight: =6
                                    Width: =Parent.Width - Parent.PaddingLeft * 2
                                  Children:
                                    - con_TableHeaderNXT:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(250, 250, 250, 1)
                                          FillPortions: =0
                                          Height: =46
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Visible: =scrNXT.Size <> 1
                                        Children:
                                          - lbl_HeaderInventoryDateNXT:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ngày nhập tồn"
                                                Wrap: =false
                                          - lbl_HeaderProductCategoryNXT:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Phân loại hàng"
                                                Wrap: =false
                                          - lbl_HeaderStatusCodeNXT:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Trạng thái"
                                                Wrap: =false
                                          - lbl_HeaderActionNXT:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Thao tác"
                                                Width: =72
                                                Wrap: =false
                                    - gal_NXT_1:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =Parent.Height - con_TableHeaderNXT.Height - con_FooterNXT.Height
                                          Items: |-
                                            =SortByColumns(
                                                Filter(
                                                    'QLK List Inventory',
                                                    PlantCode = varUserInPlant.PlantCode,
                                                    IsBlank(cbo_FilterProductTypeNhapTuSanXuat_13.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_13.Selected.ProductCategoryCode
                                                ),
                                                "InventoryDate",
                                                SortOrder.Descending,
                                                "Created",
                                                SortOrder.Descending
                                            )
                                          ShowScrollbar: =false
                                          TemplateSize: |-
                                            =If(
                                                scrNXT.Size = 1,
                                                (12 + 28 + 6 + 22 + 6 + 24 + 6) + 8 + 16 + 5 + 40,
                                                45
                                            )
                                          Width: =Parent.Width
                                        Children:
                                          - con_RowDividerNXT:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(229, 231, 235, 1)
                                                Height: =1
                                                Visible: =scrNXT.Size <> 1
                                                Width: =gal_NXT_1.Width - 10
                                                Y: =gal_NXT_1.TemplateHeight
                                          - con_RowMasterNXT:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(229, 231, 235, 1)
                                                BorderStyle: =If(scrNXT.Size = 1, BorderStyle.Solid, BorderStyle.None)
                                                BorderThickness: =If(scrNXT.Size = 1, 1, 0)
                                                DropShadow: =If(scrNXT.Size = 1, DropShadow.Light, DropShadow.None)
                                                Fill: =If(scrNXT.Size = 1, RGBA(255, 255, 255, 1), RGBA(0, 0, 0, 0))
                                                Height: =If(scrNXT.Size = 1, gal_NXT_1.TemplateHeight - 8, gal_NXT_1.TemplateHeight)
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =If(scrNXT.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                LayoutGap: =If(scrNXT.Size = 1, 5, 0)
                                                PaddingBottom: =If(scrNXT.Size = 1, 8, 0)
                                                PaddingLeft: =If(scrNXT.Size = 1, 8, 0)
                                                PaddingRight: =If(scrNXT.Size = 1, 8, 0)
                                                PaddingTop: =If(scrNXT.Size = 1, 8, 0)
                                                RadiusBottomLeft: =If(scrNXT.Size = 1, 10, 0)
                                                RadiusBottomRight: =If(scrNXT.Size = 1, 10, 0)
                                                RadiusTopLeft: =If(scrNXT.Size = 1, 10, 0)
                                                RadiusTopRight: =If(scrNXT.Size = 1, 10, 0)
                                                Width: =Parent.Width - 10
                                              Children:
                                                - con_RowNXT_1:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =If(scrNXT.Size = 1, gal_NXT_1.TemplateHeight - 8 - 16 - 5 - con_RowActionsNXT.Height, gal_NXT_1.TemplateHeight)
                                                      LayoutAlignItems: =If(scrNXT.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                      LayoutDirection: =If(scrNXT.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                      LayoutGap: =If(scrNXT.Size = 1, 6, 5)
                                                      LayoutMinHeight: =If(scrNXT.Size = 1, 16, Parent.Height)
                                                      PaddingLeft: =If(scrNXT.Size = 1, 14, 10)
                                                      PaddingRight: =If(scrNXT.Size = 1, 14, 5)
                                                      PaddingTop: =If(scrNXT.Size = 1, 12, 0)
                                                      Width: |-
                                                        =If(
                                                            scrNXT.Size = 1,
                                                            Parent.Width - Parent.PaddingLeft - Parent.PaddingRight,
                                                            Parent.Width - Parent.PaddingRight * 2 - Parent.LayoutGap - con_RowActionsNXT_1.Width
                                                        )
                                                    Children:
                                                      - lbl_RowInventoryDateNXT:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =If(scrNXT.Size = 1, fxFontWeightBold, fxFontWeightNormal)
                                                            Height: =If(scrNXT.Size = 1, 28, 30)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =If(scrNXT.Size = 1, 0, 5)
                                                            PaddingTop: =0
                                                            Size: =If(scrNXT.Size = 1, fxFontSizeLG, fxFontSizeMD)
                                                            Text: =Text(ThisItem.InventoryDate, "dd/mm/yyyy")
                                                            Width: =If(scrNXT.Size = 1, Parent.Width - 20, lbl_HeaderInventoryDateNXT.Width)
                                                            Wrap: =false
                                                      - lbl_RowProductCategoryNXT:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =If(scrNXT.Size = 1, RGBA(107, 114, 128, 1), RGBA(36, 36, 36, 1))
                                                            Font: =fxFontFamily
                                                            Height: =If(scrNXT.Size = 1, 22, 30)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =If(scrNXT.Size = 1, 0, 5)
                                                            PaddingTop: =0
                                                            Size: =If(scrNXT.Size = 1, fxFontSizeSM, fxFontSizeMD)
                                                            Text: =LookUp(col_ProductCategories, ProductCategoryCode = ThisItem.ProductCategoryCode).ProductCategoryNameVI
                                                            Width: =If(scrNXT.Size = 1, Parent.Width - 20, lbl_HeaderProductCategoryNXT.Width)
                                                            Wrap: =false
                                                      - lbl_RowProductCategoryNXT_1:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =If(ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode, RGBA(55, 65, 81, 1), RGBA(180, 83, 9, 1))
                                                            Fill: =If(ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode, RGBA(243, 244, 246, 1), RGBA(255, 243, 224, 1))
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightSemiBold
                                                            Height: =24
                                                            PaddingBottom: =0
                                                            PaddingLeft: =10
                                                            PaddingRight: =10
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeSM
                                                            Text: =LookUp(col_WorkflowStatus, StatusCode = ThisItem.StatusCode).StatusNameVI
                                                            Width: =Min(Len(Self.Text) * 7 + 28, lbl_HeaderStatusCodeNXT.Width)
                                                            Wrap: =false
                                                - con_RowActionsNXT:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Start
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =40
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =10
                                                      PaddingLeft: =14
                                                      PaddingRight: =14
                                                      Visible: '=scrNXT.Size = 1 '
                                                      Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                                    Children:
                                                      - btn_NXT_MobileView:
                                                          Control: ModernButton
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Center
                                                            BasePaletteColor: =RGBA(7, 220, 8, 1)
                                                            Font: =Font.'Segoe UI'
                                                            Height: =36
                                                            Icon: ="Eye"
                                                            OnSelect: |-
                                                              =Set(varNXTDetail, ThisItem);
                                                              Navigate(scrNXTForm,ScreenTransition.CoverRight)
                                                            RadiusBottomLeft: =8
                                                            RadiusBottomRight: =8
                                                            RadiusTopLeft: =8
                                                            RadiusTopRight: =8
                                                            Size: =fxFontSizeMD
                                                            Text: ="Xem chi tiết"
                                                            Width: =If(btn_NXT_MobileDelete.Visible, (Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap) / 2, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight)
                                                      - btn_NXT_MobileDelete:
                                                          Control: ModernButton
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Center
                                                            Appearance: =ButtonAppearance.Outline
                                                            BasePaletteColor: =RGBA(107, 114, 128, 1)
                                                            Font: =Font.'Segoe UI'
                                                            Height: =36
                                                            Icon: ="Delete"
                                                            OnSelect: |
                                                              =
                                                              If(
                                                                  Confirm(
                                                                      "Bạn có chắc muốn xóa bản ghi này không?",
                                                                      {
                                                                          Title: "Xác nhận xóa",
                                                                          Subtitle: "Hành động này không thể hoàn tác.",
                                                                          ConfirmButton: "Xóa",
                                                                          CancelButton: "Hủy"
                                                                      }
                                                                  ),
                                                                  UpdateContext({varShowPopupProcessing: true});
                                                                  IfError(
                                                                      Clear(col_InventoryDetailToDelete);
                                                                      ClearCollect(
                                                                          col_InventoryDetailToDelete,
                                                                          Filter('QLK List Inventory Details', InventoryID = ThisItem.ID)
                                                                      );
                                                                      Remove('QLK List Inventory Details', col_InventoryDetailToDelete);
                                                                      Remove('QLK List Inventory', ThisItem),
                                                                      UpdateContext({varShowPopupProcessing: false});
                                                                      Notify("Xóa không thành công", NotificationType.Error, 2000);
                                                                      ,
                                                                      UpdateContext({varShowPopupProcessing: false});
                                                                      Notify("Đã xoá thành công", NotificationType.Success, 2000);
                                                                  )
                                                              )
                                                            RadiusBottomLeft: =8
                                                            RadiusBottomRight: =8
                                                            RadiusTopLeft: =8
                                                            RadiusTopRight: =8
                                                            Size: =fxFontSizeMD
                                                            Text: ="Xóa"
                                                            Visible: =ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode
                                                            Width: =(Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap) / 2
                                                - con_RowActionsNXT_1:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =gal_NXT_1.TemplateHeight
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutMinHeight: =Parent.Height
                                                      Visible: =scrNXT.Size <> 1
                                                      Width: =lbl_HeaderActionNXT.Width
                                                    Children:
                                                      - btn_ViewNXT_1:
                                                          Control: ModernButton
                                                          Properties:
                                                            Appearance: =ButtonAppearance.Transparent
                                                            Icon: ="Eye"
                                                            Layout: =ButtonLayout.IconOnly
                                                            OnSelect: |-
                                                              =Set(varNXTDetail, ThisItem);
                                                              Navigate(scrNXTForm,ScreenTransition.CoverRight)
                                                            Width: =32
                                                      - btn_DeleteNXT_1:
                                                          Control: ModernButton
                                                          Properties:
                                                            Appearance: =ButtonAppearance.Transparent
                                                            Icon: ="Delete"
                                                            Layout: =ButtonLayout.IconOnly
                                                            OnSelect: |
                                                              =If(
                                                                  Confirm(
                                                                      "Bạn có chắc muốn xóa bản ghi này không?",
                                                                      {
                                                                          Title: "Xác nhận xóa",
                                                                          Subtitle: "Hành động này không thể hoàn tác.",
                                                                          ConfirmButton: "Xóa",
                                                                          CancelButton: "Hủy"
                                                                      }
                                                                  ),
                                                                  UpdateContext({varShowPopupProcessing: true});
                                                                  IfError(
                                                                      Clear(col_InventoryDetailToDelete);
                                                                      ClearCollect(
                                                                          col_InventoryDetailToDelete,
                                                                          Filter('QLK List Inventory Details', InventoryID = ThisItem.ID)
                                                                      );
                                                                      Remove('QLK List Inventory Details', col_InventoryDetailToDelete);
                                                                      Remove('QLK List Inventory', ThisItem),
                                                                      UpdateContext({varShowPopupProcessing: false});
                                                                      Notify("Xóa không thành công", NotificationType.Error, 2000);
                                                                      ,
                                                                      UpdateContext({varShowPopupProcessing: false});
                                                                      Notify("Đã xoá thành công", NotificationType.Success, 2000);
                                                                  )
                                                              )
                                                            Visible: |-
                                                              =ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode && 
                                                              (
                                                                  varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||   // FG_WH         - Thủ kho thành phẩm
                                                                  varUserInPlant.Role = Index(col_RoleUser,9).RoleCode ||   // VHSX_HO       - VHSX HO
                                                                  varUserInPlant.Role = Index(col_RoleUser,4).RoleCode      // RM_SUP        - Giám sát nguyên liệu
                                                              )
                                                            Width: =32
                                    - con_FooterNXT:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =44
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =16
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                        Children:
                                          - lbl_TotalRowsNXT:
                                              Control: ModernText
                                              Properties:
