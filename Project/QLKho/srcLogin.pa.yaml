                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =10
                  PaddingRight: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - TextInputCanvas1:
                      Control: ModernTextInput
                      Properties:
                        FontWeight: =""
                        Height: =40
                        MaxLength: =-1
                        Placeholder: ="Tên đăng nhập"
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =0
                        TriggerOutput: =TriggerOutput.FocusOut
                        Width: '=Parent.Width  - Parent.PaddingLeft - Parent.PaddingRight '
                  - TextInputCanvas1_1:
                      Control: ModernTextInput
                      Properties:
                        FontWeight: =""
                        Height: =40
                        MaxLength: =-1
                        Placeholder: ="Mật khẩu"
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        Size: =0
                        TriggerOutput: =TriggerOutput.FocusOut
                        Type: =TextInputType.Password
                        Width: =Parent.Width  - Parent.PaddingLeft - Parent.PaddingRight
            - Container14_4:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - ButtonCanvas12:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Font: =Font.'Segoe UI'
                        FontWeight: =""
                        Height: =40
                        OnSelect: |
                          =/*UpdateContext(
                              {
                                  varProcessing: true,
                                  _result: 'QLTS|LoginUser'.Run(
                                      TextInputCanvas1.Value,
                                      TextInputCanvas1_1.Value
                                  )
                              }
                          );

                          If(
                              _result.statuscode = "200",
                              // ✅ Nếu thành công
                              Navigate(
                                  scrRequest,
                                  ScreenTransition.CoverRight
                              );
                              Set(varUserInPlant , Filter('QLTS Farm List User In Plant',UserID = TextInputCanvas1.Value && Password = TextInputCanvas1_1.Value));
                              UpdateContext({ varProcessing: false });
                              ,
                              //  Nếu thất bại
                              Notify(_result.message,NotificationType.Error,2000);
                              UpdateContext({ varProcessing: false });
                          );*/
                          UpdateContext({ varProcessing: true });
                          // Lấy user trong Plant
                          Set(
                              varUserInPlant,
                              LookUp(
                                  'QLK List User In Plant',
                                  UserID = TextInputCanvas1.Text &&
                                  Password = TextInputCanvas1_1.Text
                              )
                          );

                          // Kiểm tra có tìm thấy user hay không
                          If(
                              IsBlank(varUserInPlant.ID)
                              ,
                              UpdateContext({ varProcessing: false });
                              Notify(
                                  "Sai tên đăng nhập hoặc mật khẩu. Vui lòng kiểm tra lại",
                                  NotificationType.Error,
                                  2000
                              ),
                              UpdateContext(
                                  { 
                                      varProcessing: false,
                                      varPopUpWelcom : true
                                  }
                                  );
                              Set(varRoleCurrentFirst,varUserInPlant);
                          )
