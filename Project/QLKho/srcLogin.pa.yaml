      - ContainerLoginSuccess:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varPopUpWelcom
            Width: =Parent.Width
          Children:
            - Container69:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Center
                  DropShadow: =DropShadow.Semibold
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: |
                    =Switch(
                        srcLogin.Size,

                        // ===============================
                        // 1. MOBILE (Phone Layout - Mobile dọc)
                        // ===============================
                        1,
                            Parent.Height * 0.4,

                        // ===============================
                        // 2. TABLET 
                        //    (và MOBILE NGANG trong Phone Layout)
                        // ===============================
                        2,
                            If(
                                srcLogin.Width > srcLogin.Height,
                                    // ===== NGANG =====
                                    If(
                                        App.Width > App.Height && App.Height < 600,
                                            Parent.Height * 0.7,   // Mobile ngang (Phone Layout)
                                            Parent.Height * 0.4     // Tablet ngang
                                    ),
                                    // ===== DỌC =====
                                    Parent.Height * 0.5            // Tablet dọc
                            ),

                        // ===============================
                        // 3. MOBILE (Tablet Layout mới xài tới)
                        // ===============================
                        3,
                            If(
                                srcLogin.Width > srcLogin.Height,
                                    Parent.Height * 0.65,          // Mobile ngang (Tablet Layout)
                                    Parent.Height * 0.3           // Mobile dọc (Tablet Layout)
                            ),

                        // ===============================
                        // MẶC ĐỊNH
                        // ===============================
                        Parent.Height * 0.4
                    )
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: |-
                    =Switch(
                        srcLogin.Size,
                        1,  Parent.Width * 0.9,   // Desktop
                        2,  Parent.Width * 0.7,   // Tablet dọc
                        2.1,Parent.Width * 0.6,   // Tablet ngang
                        3,  Parent.Width * 0.5,   // Mobile
                        Parent.Width * 0.3     // Mặc định
                    )
