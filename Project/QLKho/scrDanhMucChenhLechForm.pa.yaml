Screens:
  scrDanhMucChenhLechForm:
    Children:
      - con_MainDanhMucChenhLechForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_BodyMenuDanhMucChenhLechForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =scrDanhMucChenhLechForm.Size <> 1
                  Width: |-
                    =If(
                        varShowMenuUser,
                        240,
                        64
                    )
                Children:
                  - cmp_NavSidebarDanhMucChenhLechForm:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainDanhMucChenhLechForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderDanhMucChenhLechForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderDanhMucChenhLechForm:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrDanhMucChenhLechForm.Size
                  - con_BodyDanhMucChenhLechForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderDanhMucChenhLechForm.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_BodyMainDanhMucChenhLechForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.Semibold
                              Fill: =RGBA(250, 250, 251, 1)
                              Height: =Parent.Height
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Width: =If(scrDanhMucChenhLechForm.Size = 1, Parent.Width - 10, Parent.Width - 10)
                            Children:
                              - con_FormButtonMobile_KCLF:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrDanhMucChenhLechForm.Size = 1
                                    Width: =Parent.Width - 20
                                  Children:
                                    - btn_BackMobile_KCLF:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="ChevronLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Back()
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =40
                                    - lbl_MobileActionPos_KCLF:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(2), Switch(Value, 1, btn_SaveDanhMucChenhLechForm.Visible, 2, btn_RefreshDanhMucChenhLechForm.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_KCLF:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_KCLF.Text), 0, CountRows(Split(lbl_MobileActionPos_KCLF.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_KCLF:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_KCLF.Text, ","), 1).Value), 0), 1, "Save", 2, "ArrowClockwise", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                IfError(Value(Index(Split(lbl_MobileActionPos_KCLF.Text, ","), 1).Value), 0),
                                                1, Select(btn_SaveDanhMucChenhLechForm),
                                                2, Select(btn_RefreshDanhMucChenhLechForm)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_KCLF.Text, ","), 1).Value), 0), 1, "Lưu", 2, "Làm mới", "")
                                          Tooltip: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_KCLF.Text, ","), 1).Value), 0), 1, "Lưu", 2, "Làm mới", "")
                                          Visible: =Value(lbl_MobileActionCount_KCLF.Text) >= 1
                                    - btn_MobileAction2_KCLF:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_KCLF.Text, ","), 2).Value), 0), 1, "Save", 2, "ArrowClockwise", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                IfError(Value(Index(Split(lbl_MobileActionPos_KCLF.Text, ","), 2).Value), 0),
                                                1, Select(btn_SaveDanhMucChenhLechForm),
                                                2, Select(btn_RefreshDanhMucChenhLechForm)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_KCLF.Text, ","), 2).Value), 0), 1, "Lưu", 2, "Làm mới", "")
                                          Tooltip: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_KCLF.Text, ","), 2).Value), 0), 1, "Lưu", 2, "Làm mới", "")
                                          Visible: =Value(lbl_MobileActionCount_KCLF.Text) >= 2
                                    - btn_MobileMore_KCLF:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_KCLF: !varShowMoreActionsMobile_KCLF})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_KCLF.Text) >= 3
                                          Width: =40
                              - con_FormDanhMucChenhLechButton:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =45
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrDanhMucChenhLechForm.Size <> 1
                                    Width: =Parent.Width - 20
                                  Children:
                                    - btn_BackDanhMucChenhLechForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="ChevronLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Back()
                                          Width: =30
                                    - btn_SaveDanhMucChenhLechForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="Save"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Select(btn_PatchDanhMucChenhLech)
                                          Text: ="Lưu"
                                          Visible: =varStockCountDifferenceDetail.StatusCode = "DRAFT"
                                    - btn_RefreshDanhMucChenhLechForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="ArrowClockwise"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Refresh('QLK List Stock Count Variance')
                                          Text: ="Làm mới"
                                          Width: =120
                                    - btn_PatchDanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =// Lưu giải trình cho dòng chênh lệch đang mở
                                            If(
                                                IsBlank(varStockCountDifferenceDetail.ID),
                                                Notify("Không tìm thấy dòng chênh lệch để lưu", NotificationType.Error, 2000),

                                                // Chỉ cho sửa giải trình khi dòng còn ở trạng thái Nháp
                                                varStockCountDifferenceDetail.StatusCode <> "DRAFT",
                                                Notify("Chỉ được sửa giải trình khi dòng chênh lệch ở trạng thái Nháp", NotificationType.Warning, 2000),

                                                IfError(
                                                    Set(
                                                        varStockCountDifferenceDetail,
                                                        Patch(
                                                            'QLK List Stock Count Variance',
                                                            LookUp('QLK List Stock Count Variance', ID = varStockCountDifferenceDetail.ID),
                                                            {Explanation: Trim(txt_Explanation_Form.Text)}
                                                        )
                                                    ),
                                                    Notify("Lưu giải trình không thành công: " & FirstError.Message, NotificationType.Error, 3000),
                                                    Notify("Lưu giải trình thành công", NotificationType.Success, 2000)
                                                )
                                            )
                                          Visible: =false
                              - con_ScrollContentDanhMucChenhLechForm:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.Height - con_FormDanhMucChenhLechButton.Height
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    Width: =Parent.Width - 10
                                  Children:
                                    - con_SectionChenhLech:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: |-
                                            =If(
                                                scrDanhMucChenhLechForm.Size = 1,
                                                10 + 30 + 8 + (4 * 78 + 3 * 12 + 10) + 8 + 128 + 10 + 8,
                                                10 + 30 + 8 + (4 * 78 + 3 * 10 + 10) + 8 + 128 + 10 + 8
                                            )
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =10
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =10
                                          RadiusBottomLeft: =5
                                          RadiusBottomRight: =5
                                          RadiusTopLeft: =5
                                          RadiusTopRight: =5
                                          Width: =Parent.Width - 20
                                        Children:
                                          - lbl_TitleChenhLech:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(45, 128, 40, 1)
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Height: =30
                                                Size: =fxFontSizeLG
                                                Text: ="Thông tin chênh lệch"
                                                Wrap: =false
                                          - con_GridChenhLech:
                                              Control: GroupContainer
                                              Variant: GridLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =If(scrDanhMucChenhLechForm.Size = 1, 4 * 78 + 3 * 12 + 10, 4 * 78 + 3 * 10 + 10)
                                                LayoutGap: =If(scrDanhMucChenhLechForm.Size = 1, 12, 10)
                                                LayoutGridColumns: =2
                                                LayoutGridRows: =4
                                                PaddingBottom: =5
                                                PaddingLeft: =5
                                                PaddingRight: =5
                                                PaddingTop: =5
                                              Children:
                                                - con_FieldNgayKiem:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - lbl_NgayKiem_FormLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(55, 65, 81, 1)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightNormal
                                                            Height: =22
                                                            Size: =fxFontSizeMD
                                                            Text: ="Ngày kiểm"
                                                      - datePicker_NgayKiem_FormVal:
                                                          Control: ModernDatePicker
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            DefaultDate: =varStockCountDifferenceDetail.StockCountDate
                                                            DisplayMode: =DisplayMode.Disabled
                                                            Format: =DatePickerFormat.Short
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                - con_FieldLoaiHang:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - lbl_LoaiHang_FormLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(55, 65, 81, 1)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightNormal
                                                            Height: =22
                                                            Size: =fxFontSizeMD
                                                            Text: ="Loại hàng"
                                                      - cbb_LoaiHang_FormVal:
                                                          Control: ModernCombobox
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            DefaultSelectedItems: =LookUp(col_ProductTypes,ProductTypeCode = varStockCountDifferenceDetail.CountMethodName)
                                                            DisplayMode: =DisplayMode.Disabled
                                                            InputTextPlaceholder: |
                                                              =""
                                                            IsSearchable: =false
                                                            ItemDisplayText: =ThisItem.ProductTypeNameVI
                                                            Items: =col_ProductTypes
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            SelectMultiple: =false
                                                - con_FieldMaSAP:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - lbl_MaSAP_FormLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(55, 65, 81, 1)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightNormal
                                                            Height: =22
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã SAP"
                                                      - cbb_MaSAP_FormLbl:
                                                          Control: ModernCombobox
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            DefaultSelectedItems: =Filter('QLK List Master Data Production',PlantCode = varStockCountDifferenceDetail.PlantCode,SAPCode= varStockCountDifferenceDetail.SAPCode)
                                                            DisplayMode: =DisplayMode.Disabled
                                                            InputTextPlaceholder: |
                                                              =""
                                                            ItemDisplayText: =ThisItem.SAPCode
                                                            Items: =Filter('QLK List Master Data Production',PlantCode = varStockCountDifferenceDetail.PlantCode)
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                - con_FieldTonSoSach:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - lbl_TonSoSach_FormLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(55, 65, 81, 1)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightNormal
                                                            Height: =22
                                                            Size: =fxFontSizeMD
                                                            Text: ="Tồn sổ sách"
                                                      - num_TonSoSach_Form:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Default: =varStockCountDifferenceDetail.BookQty
                                                            DisplayMode: =DisplayMode.Disabled
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                - con_FieldTonThucTe:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - lbl_TonThucTe_FormLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(55, 65, 81, 1)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightNormal
                                                            Height: =22
                                                            Size: =fxFontSizeMD
                                                            Text: ="Tồn thực tế *"
                                                      - num_TonThucTe_Form:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Appearance: =Appearance.Outline
                                                            Default: =varStockCountDetail.ActualQty
                                                            DisplayMode: =DisplayMode.Disabled
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                - con_FieldSaiLech:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - lbl_SaiLech_FormLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(55, 65, 81, 1)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightNormal
                                                            Height: =22
                                                            Size: =fxFontSizeMD
                                                            Text: ="Sai lệch"
                                                      - num_SaiLech_Form:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Default: =varStockCountDifferenceDetail.VarianceQty
                                                            DisplayMode: =DisplayMode.Disabled
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                - con_FieldKiemLai:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - lbl_KiemLai_FormLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(55, 65, 81, 1)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightNormal
                                                            Height: =22
                                                            Size: =fxFontSizeMD
                                                            Text: ="Kiểm lại"
                                                      - chk_KiemLai_Form:
                                                          Control: CheckBox
                                                          Properties:
                                                            Checked: =varStockCountDifferenceDetail.NeedRecount
                                                            DisplayMode: =DisplayMode.View
                                                            Label: =
                                                - con_FieldTrangThai:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =6
                                                    Children:
                                                      - lbl_TrangThai_FormLbl:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Color: =RGBA(55, 65, 81, 1)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightNormal
                                                            Height: =22
                                                            Size: =fxFontSizeMD
                                                            Text: ="Trạng thái"
                                                      - lbl_TrangThai_FormBadge:
                                                          Control: ModernText
                                                          Properties:
                                                            Align: =Align.Center
                                                            BorderColor: =Coalesce(LookUp(fxStatusStyles, Code = varStockCountDifferenceDetail.StatusCode).BorderColor, fxStatusDefaultBorder)
                                                            BorderStyle: =BorderStyle.Solid
                                                            BorderThickness: =1
                                                            Color: =Coalesce(LookUp(fxStatusStyles, Code = varStockCountDifferenceDetail.StatusCode).TextColor, fxStatusDefaultText)
                                                            Fill: =Coalesce(LookUp(fxStatusStyles, Code = varStockCountDifferenceDetail.StatusCode).BackColor, fxStatusDefaultBack)
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightSemiBold
                                                            Height: =28
                                                            PaddingBottom: =2
                                                            PaddingLeft: =12
                                                            PaddingRight: =12
                                                            PaddingTop: =2
                                                            RadiusBottomLeft: =14
                                                            RadiusBottomRight: =14
                                                            RadiusTopLeft: =14
                                                            RadiusTopRight: =14
                                                            Size: =fxFontSizeSM
                                                            Text: |-
                                                              =With(
                                                                  {statusItem: LookUp(col_WorkflowStatus, StatusCode = varStockCountDifferenceDetail.StatusCode)},
                                                                  Coalesce(statusItem.StatusNameVI, varStockCountDifferenceDetail.StatusCode)
                                                              )
                                                            Width: =Min(Len(Self.Text) * 8 + 30, Parent.Width - 10)
                                          - con_FieldGiaiTrinh:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =22 + 6 + 100
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =6
                                                PaddingLeft: =5
                                                PaddingRight: =5
                                              Children:
                                                - lbl_GiaiTrinh_FormLbl:
                                                    Control: ModernText
