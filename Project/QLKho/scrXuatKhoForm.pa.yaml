                        PaddingLeft: =10
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                      Children:
                        - btn_CancelXuatKhoForm:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              Icon: ="ChevronLeft"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Reset(cmb_XK_FormMovementType);
                                Reset(dp_XK_FormPostingDate);
                                Reset(cmb_XK_FormSAPCode);
                                Reset(num_XK_FormQuantity);
                                Reset(txt_XK_FormSLoc);
                                Reset(txt_XK_FormNote);
                                UpdateContext({varShowXuatKhoForm: false})
                              Text: =
                              Width: =30
                        - btn_SaveXuatKhoDetail:
                            Control: ModernButton
                            Properties:
                              Font: =fxFontFamily
                              Icon: ="Save"
                              OnSelect: |-
                                =If(
                                    IsBlank(cmb_XK_FormMovementType.Selected),
                                    Notify("Vui lòng chọn Movement type", NotificationType.Warning, 2000),

                                    IsBlank(dp_XK_FormPostingDate.SelectedDate),
                                    Notify("Vui lòng chọn ngày hạch toán", NotificationType.Warning, 2000),

                                    IsBlank(cmb_XK_FormSAPCode.Selected),
                                    Notify("Vui lòng chọn Mã SAP", NotificationType.Warning, 2000),

                                    Coalesce(num_XK_FormQuantity.Value, 0) <= 0,
                                    Notify("Số lượng xuất phải lớn hơn 0", NotificationType.Warning, 2000),

                                    // Hợp lệ → hiện loading rồi lưu
                                    UpdateContext({varShowPopupProcessing: true});

                                    With(
                                        {vIsNew: IsBlank(varIssueDetail.ID)},
                                        With(
                                            {
                                                savedRecord: IfError(
                                                    Patch(
                                                        'QLK List Issue Detail',
                                                        If(vIsNew, Defaults('QLK List Issue Detail'), varIssueDetail),
                                                        {
                                                            IssueHeaderId:       varGoodsIssue.ID,
                                                            IssueTypeCode:       varIssueTypeCode,
                                                            PlantCode:           varGoodsIssue.PlantCode,
                                                            PlantName:           varGoodsIssue.PlantName,
                                                            MovementType:        cmb_XK_FormMovementType.Selected.MovementType,
                                                            PostingDate:         dp_XK_FormPostingDate.SelectedDate,
                                                            SAPCode:             cmb_XK_FormSAPCode.Selected.SAPCode,
                                                            Quantity:            num_XK_FormQuantity.Value,
                                                            SLoc:                txt_XK_FormSLoc.Text,
                                                            Note:                txt_XK_FormNote.Text,
                                                            ProductCategoryCode: varGoodsIssue.ProductCategoryCode,
                                                            // Quy cách bao lấy theo mã SAP đang chọn (Items đã lọc theo plant của user)
                                                            BagSize:             cmb_XK_FormSAPCode.Selected.BagSize
                                                        }
                                                    ),
                                                    Blank()
                                                )
                                            },
                                            If(
                                                IsBlank(savedRecord),
                                                // Giữ form mở để người dùng không mất dữ liệu đã nhập
                                                Notify("Lỗi lưu không thành công", NotificationType.Error, 2000),

                                                // Fetch lại để đảm bảo data đúng
                                                ClearCollect(
                                                    col_IssueDetails,
                                                    Filter('QLK List Issue Detail', IssueHeaderId = varGoodsIssue.ID)
                                                );

                                                // Tính lại TotalIssueQuantity
                                                Set(
                                                    varGoodsIssue,
                                                    Patch(
                                                        'QLK List Issue Header',
                                                        varGoodsIssue,
                                                        {TotalIssueQuantity: Sum(col_IssueDetails, Quantity)}
                                                    )
                                                );

                                                UpdateContext({varShowXuatKhoForm: false});
                                                Notify(
                                                    If(vIsNew, "Thêm thành công", "Cập nhật thành công"),
                                                    NotificationType.Success,
                                                    2000
                                                );
                                                Reset(cmb_XK_FormMovementType);
                                                Reset(dp_XK_FormPostingDate);
                                                Reset(cmb_XK_FormSAPCode);
                                                Reset(num_XK_FormQuantity);
                                                Reset(txt_XK_FormSLoc);
                                                Reset(txt_XK_FormNote)
                                            )
                                        )
                                    );

                                    // Ẩn loading sau khi hoàn tất
                                    UpdateContext({varShowPopupProcessing: false})
                                )
                              Size: =fxFontSizeMD
                              Text: ="Lưu và đóng"
                              Visible: |-
                                =varGoodsIssue.StatusCode = "DRAFT" &&
                                If(
                                    varIssueTypeCode = "OTHER" &&
                                        (varUserInPlant.Role = "SHIFT_LEADER" || varUserInPlant.Role = "PROD_STAT" || varUserInPlant.Role = "VHSX_HO"),
                                        true,
                                        If(
                                            varUserInPlant.Role = "INV_STAFF" || varUserInPlant.Role = "FG_WH" || varUserInPlant.Role = "VHSX_HO",
                                            true,
                                            false
                                        )
                                    )
                              Width: =140
