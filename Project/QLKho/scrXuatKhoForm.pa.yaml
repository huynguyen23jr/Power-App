      - con_PopupRollbackXuatKho:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =varShowPopupRollbackXuatKho
            Width: =Parent.Width
          Children:
            - DialogAlertRollbackXuatKho:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowPopupRollbackXuatKho:false})
                  varConfirmDialogAction: |-
                    =// 1. Đóng popup, hiện loading
                    UpdateContext({varShowPopupRollbackXuatKho: false});
                    UpdateContext({varShowPopupProcessing: true});

                    // 2. Rollback phiếu về "Nháp" và reset tất cả detail lines
                    IfError(
                        // 2a. Cập nhật header về DRAFT
                        Set(
                            varGoodsIssue,
                            Patch(
                                'QLK List Issue Header',
                                varGoodsIssue,
                                {
                                    StatusCode: "DRAFT"
                                }
                            )
                        );
                        // 2b. Reset tất cả detail lines: ConfirmFromWarehouse = false
                        ClearCollect(
                            col_RollbackIssueDetails,
                            Filter(
                                'QLK List Issue Detail',
                                IssueHeaderId = varGoodsIssue.ID,
                                ConfirmFromWarehouse = true
                            )
                        );
                        ForAll(
                            col_RollbackIssueDetails,
                            Patch(
                                'QLK List Issue Detail',
                                ThisRecord,
                                {
                                    ConfirmFromWarehouse: false
                                }
                            )
                        );
                        // 2c. Ghi audit log
                        Patch(
                            'QLK List Audit Log',
                            Defaults('QLK List Audit Log'),
                            {
                                ActionBy:      varUserInPlant.UserName,
                                ActionCode:    "ROLLBACK",
                                IDIssueHeader: varGoodsIssue.ID
                            }
                        );
                        Notify("Rollback phiếu về Nháp thành công", NotificationType.Success, 2000),

                        Notify("Rollback thất bại: " & FirstError.Message, NotificationType.Error, 3000)
                    );

                    // 3. Ẩn loading
                    UpdateContext({varShowPopupProcessing: false});
                  varLabel: ="Bạn có chắc chắn muốn rollback phiếu xuất này không? Phiếu sẽ chuyển về trạng thái Nháp và tất cả dòng chi tiết sẽ được reset."
                  varTitle: ="Rollback phiếu xuất"
