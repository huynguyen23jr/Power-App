Screens:
  scrXuatKhoForm:
    Properties:
      OnVisible: |-
        =Set(varSelectedWarehouseTab, "GENERAL"); // reset tab về mặc định
        Clear(col_SelectedXuatDaiLy);
        Clear(col_SelectedXuatNoiBo);
        Clear(col_SelectedXuatKhac);
        Reset(tab_IssueList)
    Children:
      - con_MainXuatKhoForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_BodyMenuXuatKhoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =scrXuatKhoForm.Size <> 1
                  Width: |-
                    =If(
                        varShowMenuUser,
                        240,
                        64
                    )
                Children:
                  - NavSiderBarXuatKhoForm:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainXuatKhoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderXuatKhoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - HeaderFormXuatKho:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrXuatKhoForm.Size
                  - con_BodyXuatKhoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderXuatKhoForm.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_BodyMainXuatKhoForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                              Fill: =RGBA(250, 250, 251, 1)
                              Height: =Parent.Height
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =10
                              PaddingLeft: =10
                              PaddingRight: =10
                              PaddingTop: =10
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =5
                            Children:
                              - con_FormButtonMobile_XK:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrXuatKhoForm.Size = 1
                                    Width: =Parent.Width - 25
                                  Children:
                                    - btn_BackMobile_XK:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="ChevronLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Back()
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =40
                                    - lbl_MobileActionPos_XK:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(9), Switch(Value, 1, btn_SaveXuatKhoForm.Visible, 2, btn_SendXuatKho.Visible, 3, btn_RefreshXuatKhoForm_1.Visible, 4, btn_RefreshXuatKhoForm_2.Visible, 5, btn_SyncXuatKhoForm.Visible, 6, btn_ExportXuatKhoForm.Visible, 7, btn_RefreshXuatKhoForm.Visible, 8, btn_RollbackXuatKho.Visible, 9, btn_DeleteNhapTuSanXuat_3.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_XK:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_XK.Text), 0, CountRows(Split(lbl_MobileActionPos_XK.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_XK:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_XK.Text, ","), 1), 1)).Value), 1, "Save", 2, "Send", 3, "CheckmarkCircle", 4, "DismissCircle", 5, "Database", 6, "ArrowDownload", 7, "ArrowClockwise", 8, "ArrowUndo", 9, "Delete", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_XK.Text, ","), 1), 1)).Value),
                                                1, Select(btn_SaveXuatKhoForm),
                                                2, Select(btn_SendXuatKho),
                                                3, Select(btn_RefreshXuatKhoForm_1),
                                                4, Select(btn_RefreshXuatKhoForm_2),
                                                5, Select(btn_SyncXuatKhoForm),
                                                6, Select(btn_ExportXuatKhoForm),
                                                7, Select(btn_RefreshXuatKhoForm),
                                                8, Select(btn_RollbackXuatKho),
                                                9, Select(btn_DeleteNhapTuSanXuat_3)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_XK.Text, ","), 1), 1)).Value), 1, "Lưu", 2, "Gửi", 3, "Xác nhận", 4, "Từ chối", 5, "Đồng bộ", 6, "Export", 7, "Làm mới", 8, "Rollback", 9, "Xóa", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_XK.Text, ","), 1), 1)).Value), 1, "Lưu", 2, "Gửi", 3, "Xác nhận", 4, "Từ chối", 5, "Đồng bộ", 6, "Export", 7, "Làm mới", 8, "Rollback", 9, "Xóa", "")
                                          Visible: =Value(lbl_MobileActionCount_XK.Text) >= 1
                                    - btn_MobileAction2_XK:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_XK.Text, ","), 2), 1)).Value), 1, "Save", 2, "Send", 3, "CheckmarkCircle", 4, "DismissCircle", 5, "Database", 6, "ArrowDownload", 7, "ArrowClockwise", 8, "ArrowUndo", 9, "Delete", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_XK.Text, ","), 2), 1)).Value),
                                                1, Select(btn_SaveXuatKhoForm),
                                                2, Select(btn_SendXuatKho),
                                                3, Select(btn_RefreshXuatKhoForm_1),
                                                4, Select(btn_RefreshXuatKhoForm_2),
                                                5, Select(btn_SyncXuatKhoForm),
                                                6, Select(btn_ExportXuatKhoForm),
                                                7, Select(btn_RefreshXuatKhoForm),
                                                8, Select(btn_RollbackXuatKho),
                                                9, Select(btn_DeleteNhapTuSanXuat_3)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_XK.Text, ","), 2), 1)).Value), 1, "Lưu", 2, "Gửi", 3, "Xác nhận", 4, "Từ chối", 5, "Đồng bộ", 6, "Export", 7, "Làm mới", 8, "Rollback", 9, "Xóa", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_XK.Text, ","), 2), 1)).Value), 1, "Lưu", 2, "Gửi", 3, "Xác nhận", 4, "Từ chối", 5, "Đồng bộ", 6, "Export", 7, "Làm mới", 8, "Rollback", 9, "Xóa", "")
                                          Visible: =Value(lbl_MobileActionCount_XK.Text) >= 2
                                    - btn_MobileMore_XK:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_XK: !varShowMoreActionsMobile_XK})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_XK.Text) >= 3
                                          Width: =40
                              - con_FormXuatKhoButton:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =45
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrXuatKhoForm.Size <> 1
                                    Width: =Parent.Width - 25
                                    X: =40
                                    Y: =40
                                  Children:
                                    - btn_BackXuatKhoForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="ChevronLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Back()
                                          Width: =30
                                    - btn_SaveXuatKhoForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="Save"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |
                                            =If(
                                                IsBlank(cmb_ProductTypeXuatKho.Selected),
                                                Notify("Vui lòng chọn Loại sản phẩm", NotificationType.Warning, 2000),
                                                IsBlank(dp_IssueDate.SelectedDate),
                                                Notify("Vui lòng chọn Ngày xuất", NotificationType.Warning, 2000),
                                                Select(btn_PatchXuatKho)
                                            )
                                          Text: ="Lưu"
                                          Visible: =varGoodsIssue.StatusCode = "DRAFT" || IsBlank(varGoodsIssue.ID)
                                    - btn_SendXuatKho:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="Send"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |
                                            =With(
                                                {
                                                    _data: Filter(
                                                        'QLK List Issue Detail',
                                                        IssueHeaderId = varGoodsIssue.ID
                                                    )
                                                },
                                                If(
                                                    CountRows(_data) > 0,
                                                    UpdateContext({con_PopupConfirmSubmit: true}),
                                                    Notify("Chưa có dữ liệu chi tiết, vui lòng nhập trước khi gửi duyệt.", NotificationType.Warning, 2000)
                                                )
                                            )
                                          Text: ="Gửi"
                                          Visible: |-
                                            =varGoodsIssue.StatusCode = "DRAFT" 
                                            && (
                                                varUserInPlant.Role = "FG_WH" ||     // FG_WH         - Thủ kho thành phẩm
                                                varUserInPlant.Role = "PLANT_DIR" ||     // PLANT_DIR     - Giám đốc nhà máy
                                                varUserInPlant.Role = "VHSX_HO"        // VHSX_HO       - VHSX HO
                                            )
                                    - btn_RefreshXuatKhoForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="ArrowClockwise"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Refresh('QLK List Issue Header');
                                            Refresh('QLK List Issue Detail');
                                            Set(varGoodsIssue,LookUp('QLK List Issue Header',ID = varGoodsIssue.ID));
                                          Text: ="Làm mới"
                                          Visible: =!IsBlank(varGoodsIssue.ID)
                                          Width: =120
                                    - btn_ExportXuatKhoForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="ArrowDownload"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =// Xuất Excel 3 sheet (Xuất đại lý / Xuất nội bộ / Xuất khác); file tự xoá trên SharePoint sau khi tải
                                            UpdateContext({ varShowPopupProcessing: true });
                                            With(
                                                {
                                                    _result: 'QLK|ExportGoodsIssueData'.Run(
                                                        varGoodsIssue.ID,                          // ID phiếu xuất
                                                        "DEALER",     // Mã loại xuất đại lý
                                                        "INTERNAL",     // Mã loại xuất nội bộ
                                                        "OTHER"      // Mã loại xuất khác
                                                    )
                                                },
                                                If(
                                                    _result.status = "200",
                                                    Launch(_result.fileurl, {}, LaunchTarget.New);
                                                    Notify("Xuất " & _result.rowcount & " dòng thành công", NotificationType.Success, 3000),
                                                    Notify("Xuất thất bại: " & _result.message, NotificationType.Error, 3000)
                                                )
                                            );
                                            UpdateContext({ varShowPopupProcessing: false })
                                          Text: ="Export"
                                          Visible: |-
                                            =!IsBlank(varGoodsIssue.ID) &&
                                            (varUserInPlant.Role = "VHSX_HO" ||   // VHSX_HO       - VHSX HO
                                            varUserInPlant.Role = "FG_SUP")      // FG_SUP        - Giám sát thành phẩm
                                          Width: =120
                                    - btn_PatchXuatKho:
                                        Control: ModernButton
                                        Properties:
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =IfError(
                                                With(
                                                    {
                                                        vPlantCode:         varUserInPlant.PlantCode,
                                                        vPlantName:         varUserInPlant.PlantName,
                                                        vIssueDate:         dp_IssueDate.SelectedDate,
                                                        vIssuecProductType: cmb_ProductTypeXuatKho.Selected.ProductCategoryCode,
                                                        vIssueDateKey:      Text(dp_IssueDate.SelectedDate, "yyyymmdd"),
                                                        vIsNew:             IsBlank(varGoodsIssue.ID)
                                                    },
                                                    With(
                                                        {
                                                            // Phiếu khác (không phải phiếu đang sửa) cùng plant + loại SP + ngày xuất
                                                            vDuplicate: LookUp(
                                                                'QLK List Issue Header',
                                                                PlantCode           = vPlantCode &&
                                                                ProductCategoryCode = vIssuecProductType &&
                                                                IssueDate           = vIssueDate
                                                            )
                                                        },
                                                        If(
                                                            !IsBlank(vDuplicate.ID) && vDuplicate.ID <> Coalesce(varGoodsIssue.ID, 0),
                                                            Notify("Phiếu xuất ngày " & Text(vIssueDate, "dd/mm/yyyy") & " đã tồn tại.", NotificationType.Warning, 2000),

                                                            vIsNew,
                                                            // Tạo mới — số thứ tự = số cuối của phiếu mới nhất trong plant + 1
                                                            // (lấy theo ID lớn nhất để không bị trùng khi có phiếu bị xóa hoặc vượt giới hạn delegation)
                                                            With(
                                                                {
                                                                    vLastNo: First(
                                                                        SortByColumns(
                                                                            Filter('QLK List Issue Header', PlantCode = vPlantCode),
                                                                            "ID",
                                                                            SortOrder.Descending
                                                                        )
                                                                    ).IssueNo
                                                                },
                                                                With(
                                                                    {
                                                                        vIssueNo: "ISS-" & vIssueDateKey & "-" &
                                                                            Text(Coalesce(Value(Last(Split(vLastNo, "-")).Value), 0) + 1, "0000000")
                                                                    },
                                                                    Set(
                                                                        varGoodsIssue,
                                                                        Patch(
                                                                            'QLK List Issue Header',
                                                                            Defaults('QLK List Issue Header'),
                                                                            {
                                                                                IssueNo:             vIssueNo,
                                                                                IssueDate:           vIssueDate,
                                                                                StatusCode:          cmb_StatusXuatKho.Selected.StatusCode,
                                                                                ProductCategoryCode: vIssuecProductType,
                                                                                PlantCode:           vPlantCode,
                                                                                PlantName:           vPlantName
                                                                            }
                                                                        )
                                                                    );
                                                                    Patch(
                                                                        'QLK List Audit Log',
                                                                        Defaults('QLK List Audit Log'),
                                                                        {
                                                                            ActionBy:      varUserInPlant.UserName,
                                                                            ActionCode:    "CREATE",
                                                                            IDIssueHeader: varGoodsIssue.ID
                                                                        }
                                                                    );
                                                                    Notify("Thêm thành công", NotificationType.Success, 2000)
                                                                )
                                                            ),

                                                            // Cập nhật — giữ nguyên IssueNo
                                                            Set(
                                                                varGoodsIssue,
                                                                Patch(
                                                                    'QLK List Issue Header',
                                                                    varGoodsIssue,
                                                                    {
                                                                        IssueDate:           vIssueDate,
                                                                        StatusCode:          cmb_StatusXuatKho.Selected.StatusCode,
                                                                        ProductCategoryCode: vIssuecProductType,
                                                                        PlantCode:           vPlantCode,
                                                                        PlantName:           vPlantName
                                                                    }
                                                                )
                                                            );
                                                            Notify("Cập nhật thành công", NotificationType.Success, 2000)
                                                        )
                                                    )
                                                ),
                                                Notify("Không thể lưu phiếu xuất", NotificationType.Error, 2000)
                                            )
                                          Visible: =false
                                    - btn_RefreshXuatKhoForm_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="CheckmarkCircle"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =UpdateContext({varShowPopupConfirmIssue:true})
                                          Text: ="Xác nhận "
                                          Visible: |
                                            =varGoodsIssue.StatusCode = "WAREHOUSE_PENDING" 
                                            && (varUserInPlant.Role = "FG_WH" || varUserInPlant.Role = "FG_SUP" || varUserInPlant.Role = "SHIFT_LEADER" || varUserInPlant.Role = "PROD_STAT")
                                            && With(
                                                {
                                                    _filterData: Filter(
                                                        'QLK List Issue Detail',
                                                        IssueHeaderId = varGoodsIssue.ID
                                                    )
                                                },
                                                Switch(
                                                    varUserInPlant.Role,
                                                    "FG_SUP",   // FG_SUP        - Giám sát thành phẩm
                                                    CountRows(
                                                        Filter(
                                                            _filterData,
                                                            IssueTypeCode = "DEALER" || IssueTypeCode = "INTERNAL",
                                                            !ConfirmFromWarehouse
                                                        )
                                                    ) > 0,
                                                    "SHIFT_LEADER",   // SHIFT_LEADER  - Trưởng ca
                                                    CountRows(
                                                        Filter(
                                                            _filterData,
                                                            IssueTypeCode = "OTHER",
                                                            !ConfirmFromWarehouse
                                                        )
                                                    ) > 0,
                                                    "PROD_STAT",   // PROD_STAT     - Thống kê sản xuất
                                                    CountRows(
                                                        Filter(
                                                            _filterData,
                                                            IssueTypeCode = "OTHER",
                                                            !ConfirmFromWarehouse
                                                        )
                                                    ) > 0
                                                )
                                            )
                                          Width: =120
                                    - btn_RefreshXuatKhoForm_2:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="DismissCircle"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =UpdateContext({varShowPopupRejectIssue:true})
                                          Text: ="Từ chối"
                                          Visible: |
                                            =varGoodsIssue.StatusCode = "WAREHOUSE_PENDING" 
                                            && (varUserInPlant.Role = "FG_WH" || varUserInPlant.Role = "FG_SUP" || varUserInPlant.Role = "SHIFT_LEADER" || varUserInPlant.Role = "PROD_STAT")
                                            && With(
                                                {
                                                    _filterData: Filter(
                                                        'QLK List Issue Detail',
                                                        IssueHeaderId = varGoodsIssue.ID
                                                    )
                                                },
                                                Switch(
                                                    varUserInPlant.Role,
                                                    "FG_SUP",   // FG_SUP        - Giám sát thành phẩm
                                                    CountRows(
                                                        Filter(
                                                            _filterData,
                                                            IssueTypeCode = "DEALER" || IssueTypeCode = "INTERNAL",
                                                            !ConfirmFromWarehouse
                                                        )
                                                    ) > 0,
                                                    "SHIFT_LEADER",   // SHIFT_LEADER  - Trưởng ca
                                                    CountRows(
                                                        Filter(
                                                            _filterData,
                                                            IssueTypeCode = "OTHER",
                                                            !ConfirmFromWarehouse
                                                        )
                                                    ) > 0,
                                                    "PROD_STAT",   // PROD_STAT     - Thống kê sản xuất
                                                    CountRows(
                                                        Filter(
                                                            _filterData,
                                                            IssueTypeCode = "OTHER",
                                                            !ConfirmFromWarehouse
                                                        )
                                                    ) > 0
                                                )
                                            )
                                          Width: =120
                                    - btn_DeleteNhapTuSanXuat_3:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Icon: ="Delete"
                                          OnSelect: |
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xóa bản ghi này không?",
                                                    {
                                                        Title: "Xác nhận xóa",
