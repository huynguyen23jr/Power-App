                  RadiusBottomRight: =5
                  RadiusTopLeft: =5
                  RadiusTopRight: =5
                  Width: |-
                    =Switch(
                        scrXuatKhoForm.Size,
                        1, Parent.Width - 20,
                        2, Parent.Width * 0.75,
                        3, Parent.Width * 0.5,
                        4, Parent.Width * 0.4,
                        Parent.Width
                    )
