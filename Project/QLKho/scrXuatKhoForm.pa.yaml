                  Height: |-
                    =Switch(
                        scrXuatKhoForm.Size,
                        1, Min(760, Parent.Height * 0.95),
                        2, Min(760, Parent.Height * 0.9),
                        3, 500,
                        4, 500,
                        500
                    )
