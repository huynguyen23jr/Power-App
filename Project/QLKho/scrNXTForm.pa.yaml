                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =If(
                                                                  scrNXTForm.Size = 1,
                                                                  "Thời gian: " & Text(ThisItem.Modified, "dd/mm/yyyy hh:mm AM/PM"),
                                                                  Text(ThisItem.Modified, "dd/mm/yyyy hh:mm AM/PM")
