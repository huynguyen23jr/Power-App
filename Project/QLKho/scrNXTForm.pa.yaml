                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - con_FieldNXTRow_SAPCode:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                  Children:
                                    - lbl_NXTRow_SAPCode:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          Size: =fxFontSizeMD
                                          Text: ="Mã SAP *"
                                    - cmb_NXTRow_SAPCode:
                                        Control: ModernCombobox
                                        Properties:
                                          Appearance: =Appearance.Outline
                                          DefaultSelectedItems: =Filter('QLK List Master Data Production', SAPCode = varNXTRowDetail.SAPCode)
                                          DisplayMode: |-
                                            =If(
                                                varNXTDetail.StatusCode = Index(
                                                    col_WorkflowStatus,
                                                    1
                                                ).StatusCode,
                                                DisplayMode.Edit,
                                                DisplayMode.Disabled
                                            )
                                          Font: =fxFontFamily
                                          InputTextPlaceholder: ="Chọn mã SAP"
                                          ItemDisplayText: =ThisItem.SAPCode
                                          Items: |-
                                            =Filter(
                                                'QLK List Master Data Production',
                                                PlantCode = varUserInPlant.PlantCode,
                                                ProductTypeCode = varProductionCode
                                            )
                                          LayoutMinWidth: =Parent.Width - 8
                                          OnChange: |
                                            =UpdateContext({_onChangeSAPCode:true});
                                            // ── Nạp lại danh sách nhập kho theo SAPCode đang chọn ─────────────────────────
                                            ClearCollect(
                                                col_ProductionReceiptBase,
                                                Filter(
                                                    'QLK List Production Receipt Details',
                                                    PlantCode            = varUserInPlant.PlantCode,                  // Nhà máy hiện tại
                                                    ReceiptDate          = varNXTDetail.InventoryDate,                // Ngày của phiếu NXT
                                                    ProductCategoryCode  = varNXTDetail.ProductCategoryCode,          // Loại SP của phiếu
                                                    SAPCode              = Self.Selected.SAPCode,                     // Mã SAP vừa chọn
                                                    ReceiptTypeCode      = "OTHER",
                                                    ConfirmFromWarehouse = true                                      // Chỉ lấy bản đã được kho xác nhận
                                                )
                                            );

                                            // ── Nạp lại danh sách xuất kho theo SAPCode đang chọn ─────────────────────────
                                            ClearCollect(
                                                col_ProductionIssue,
                                                Filter(
                                                    'QLK List Issue Detail',
                                                    PlantCode            = varUserInPlant.PlantCode,                  // Nhà máy hiện tại
                                                    PostingDate          = varNXTDetail.InventoryDate,                // Ngày của phiếu NXT
                                                    ProductCategoryCode  = varNXTDetail.ProductCategoryCode,          // Loại SP của phiếu
                                                    SAPCode              = Self.Selected.SAPCode,                     // Mã SAP vừa chọn
                                                    ConfirmFromWarehouse = true                                      // Chỉ lấy bản đã được kho xác nhận
                                                )
                                            );
                                          SelectMultiple: =false
                                          Size: =fxFontSizeMD
                              - con_FieldNXTRow_ProductTypeCode:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                  Children:
                                    - lbl_NXTRow_ProductTypeCode:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          Size: =fxFontSizeMD
                                          Text: ="Loại hàng *"
                                    - cmb_NXTRow_ProductTypeCode:
                                        Control: ModernCombobox
                                        Properties:
                                          Appearance: =Appearance.Outline
                                          DefaultSelectedItems: |
                                            =If(
                                                IsBlank(varNXTRowDetail.ID),
                                                Filter(
                                                    col_ProductTypes,
                                                    ProductTypeCode = cmb_NXTRow_SAPCode.Selected.ProductTypeCode
                                                ),
                                                Filter(
                                                    col_ProductTypes,
                                                    ProductTypeCode = varNXTRowDetail.ProductTypeCode
                                                )
                                            )
                                          DisplayMode: =DisplayMode.Disabled
                                          Font: =fxFontFamily
                                          InputTextPlaceholder: ="Chọn loại hàng"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ProductTypeNameVI
                                          Items: =col_ProductTypes
                                          LayoutMinWidth: =Parent.Width - 8
                                          SelectMultiple: =false
                                          Size: =fxFontSizeMD
