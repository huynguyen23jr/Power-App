                      Children:
                        - btn_AP_Cancel:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              OnSelect: |-
                                =UpdateContext({varShowApprovalPreview:false});
                                Clear(col_ApprovalQueue);
                              Text: ="Hủy"
                              Width: =100
                        - btn_AP_Confirm:
                            Control: ModernButton
                            Properties:
                              BasePaletteColor: =RGBA(45, 128, 40, 1)
                              DisplayMode: |-
                                =If(
                                    IsEmpty(Filter(col_ApprovalQueue, IsBlank(Approver))),
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              Font: =fxFontFamily
                              Icon: ="Send"
                              OnSelect: |-
                                =UpdateContext({varShowApprovalPreview: false, varShowPopupProcessing: true});

                                // Kiểm tra trước: gom các SAPCode chưa có người duyệt
                                ClearCollect(
                                    col_NoApprover,
                                    ShowColumns(Filter(col_ApprovalQueue, IsBlank(Approver)), SAPCode)
                                );

                                If(
                                    // Chặn lại lần nữa phòng trường hợp còn mã chưa có approver
                                    !IsEmpty(col_NoApprover),
                                    Notify(
                                        "Không tìm được người duyệt cho SAPCode: " & Concat(col_NoApprover, SAPCode, ", ") & ". Vui lòng chọn người duyệt trước khi gửi.",
                                        NotificationType.Error,
                                        4000
                                    ),

                                    // Build dữ liệu cần ghi từ danh sách đã xem trước (đã bao gồm approver chỉnh tay)
                                    ClearCollect(
                                        col_InventoryDetailsApprover,
                                        ForAll(
                                            col_ApprovalQueue As item,
                                            {
                                                InventoryID:          item.InventoryID,
                                                InventoryDetailsID:   item.InventoryDetailsID,
                                                IDStockCountVariance: LookUp(col_StockCountVariance, IDInventoryDetails = item.InventoryDetailsID).ID,
                                                Approver:             item.Approver,
                                                ApproverName:         item.ApproverName,
                                                Status:               item.Status
                                            }
                                        )
                                    );
                                    ClearCollect(
                                        col_InventoryDetails,
                                        ForAll(
                                            col_ApprovalQueue As item,
                                            {
                                                ID:       item.InventoryDetailsID,
                                                Approver: item.Approver
                                            }
                                        )
                                    );

                                    // Chạy tuần tự, dừng ngay ở bước lỗi đầu tiên — phiếu chỉ chuyển "đã gửi duyệt" khi mọi bước thành công
                                    IfError(
                                        Patch('QLK List Inventory Details Approver', col_InventoryDetailsApprover),
                                        Notify("Gửi duyệt thất bại (lưu người duyệt): " & FirstError.Message, NotificationType.Error, 3000),

                                        Patch('QLK List Inventory Details', col_InventoryDetails),
                                        Notify("Gửi duyệt thất bại (cập nhật chi tiết): " & FirstError.Message, NotificationType.Error, 3000),

                                        // Gọi flow gửi yêu cầu duyệt tới từng approver
                                        'QLK|CollectRequestsforApproval'.Run(varNXTDetail.ID, varNXTDetail.PlantCode, varNXTDetail.PlantName),
                                        Notify("Gửi duyệt thất bại (flow gửi yêu cầu duyệt): " & FirstError.Message, NotificationType.Error, 3000),

                                        // Cập nhật trạng thái phiếu NXT sang "đã gửi duyệt"
                                        Set(
                                            varNXTDetail,
                                            Patch(
                                                'QLK List Inventory',
                                                varNXTDetail,
                                                {
                                                    StatusCode: Index(col_WorkflowStatus, 2).StatusCode,
                                                    isSent:     true
                                                }
                                            )
                                        ),
                                        Notify("Gửi duyệt thất bại (cập nhật trạng thái phiếu): " & FirstError.Message, NotificationType.Error, 3000),

                                        // Ghi log hành động gửi duyệt
                                        Patch(
                                            'QLK List Audit Log',
