                                                            Wrap: =false
                                                      - txt_DS_NguoiDuyet:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightSemiBold
                                                            Size: =fxFontSizeMD
                                                            Text: |-
