                                                                  scrNXTForm.Size = 1,
                                                                  "Trạng thái: " & LookUp(col_WorkflowStatus, StatusCode = ThisItem.Status).StatusNameVI,
                                                                  LookUp(col_WorkflowStatus, StatusCode = ThisItem.Status).StatusNameVI
