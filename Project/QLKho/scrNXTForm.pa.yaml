                                                                  "REJECTED", RGBA(200, 40, 40, 1),    // Đỏ = từ chối
                                                                  RGBA(100, 100, 100, 1)               // Xám = khác
                                                              )
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: |-
