                                                      Height: =0.5
                                                      Visible: =scrNXTForm.Size <> 1
                                                      Width: =Parent.Width - 10
                                                      Y: =41.5
                                    - lbl_DS_RowCount:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Font: =fxFontFamily
                                          Size: =fxFontSizeMD
                                          Text: ="Hiển thị " & CountRows(gal_DanhSachDuyet.AllItems) & " dòng"
                                          Wrap: =false
      - con_PopupNXTRowForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.35)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowNXTDetailForm
            Width: =Parent.Width
          Children:
            - con_FormNXTRow:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.Regular
                  Fill: =Color.White
                  FillPortions: =0
                  Height: |-
                    =Switch(
                        scrNXTForm.Size,
                        1, Parent.Height * 0.9 ,
                        2, Parent.Height * 0.75,
                        3, Parent.Height * 0.75,
                        4, Parent.Height * 0.7,
                        Parent.Height * 0.7
                    )
                    //con_ActionNXTRowForm.Height + con_SectionCoban.Height + con_SectionNhapKho.Height + con_SectionXuatKho.Height + con_SectionTonKho.Height + con_SectionNguyenNhan.Height+ Parent.LayoutGap + Parent.PaddingTop*2 + 80
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  RadiusBottomLeft: =3
                  RadiusBottomRight: =3
                  RadiusTopLeft: =3
                  RadiusTopRight: =3
                  Width: |-
                    =Switch(
                        scrNXTForm.Size,
                        1, Parent.Width - 16,
                        2, Parent.Width * 0.7,
                        3, Parent.Width * 0.7,
                        4, Parent.Width * 0.5,
                        Parent.Width
                    )
                Children:
                  - con_ActionNXTRowForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.Regular
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                      Children:
                        - btn_CancelNXTRowForm:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              Icon: ="ChevronLeft"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =UpdateContext({varShowNXTDetailForm: false})
                              Text: =""
                              Width: =34
                        - btn_SaveNXTRowForm:
                            Control: ModernButton
                            Properties:
                              Font: =fxFontFamily
                              Icon: ="Save"
                              OnSelect: |-
                                =With(
                                    {
                                        _sapCode: cmb_NXTRow_SAPCode.Selected.SAPCode,
                                        _isNew:   IsBlank(varNXTRowDetail.ID)
                                    },
                                    With(
                                        {
                                            // Dòng trong cùng phiếu NXT đang mang mã SAP này (nếu có)
                                            _existing: LookUp(
                                                'QLK List Inventory Details',
                                                InventoryID = varNXTDetail.ID && SAPCode = _sapCode
                                            )
                                        },
                                        With(
                                        {
                                            // Trùng khi dòng đó không phải là dòng đang sửa
                                            _isDuplicate: !IsBlank(_existing.ID) && _existing.ID <> Coalesce(varNXTRowDetail.ID, 0)
                                        },
                                        If(
                                            IsBlank(_sapCode),
                                            Notify("Vui lòng chọn Mã SAP", NotificationType.Warning, 2000),

                                            _isDuplicate,
                                            Notify("SAPCode " & _sapCode & " đã tồn tại trong phiếu này", NotificationType.Warning, 2000),

                                            IfError(
                                                Patch(
                                                    'QLK List Inventory Details',
                                                    If(_isNew, Defaults('QLK List Inventory Details'), varNXTRowDetail),
                                                    {
                                                        InventoryID:           varNXTDetail.ID,
                                                        InventoryDate:         varNXTDetail.InventoryDate,
                                                        PlantCode:             varNXTDetail.PlantCode,
                                                        PlantName:             varNXTDetail.PlantName,
                                                        ProductCategoryCode:   varNXTDetail.ProductCategoryCode,

                                                        SAPCode:               _sapCode,
                                                        ProductTypeCode:       cmb_NXTRow_ProductTypeCode.Selected.ProductTypeCode,

                                                        OpeningQty:            num_NXTRow_OpeningQty.Value,
                                                        TotalReceiptQty:       num_NXTRow_TotalReceiptQty.Value,
                                                        TotalIssueQty:         num_NXTRow_TotalIssueQty.Value,

                                                        ClosingQty:            num_NXTRow_ClosingQty.Value,
                                                        ActualQty:             num_NXTRow_ActualQty.Value,
                                                        DayDiffQty:            num_NXTRow_DayDiffQty.Value,
                                                        MonthDiffQty:          num_NXTRow_MonthDiffQty.Value,

                                                        Reason:                txt_NXTRow_Reason.Text,
                                                        // Quy cách bao lấy theo mã SAP đang chọn (Items đã lọc theo plant)
                                                        BagSize:               cmb_NXTRow_SAPCode.Selected.BagSize,
                                                        IsDateVarianceChecked: num_NXTRow_DayDiffQty.Value <> 0
                                                    }
                                                ),
                                                Notify("Lỗi: " & FirstError.Message, NotificationType.Error, 2000),

                                                UpdateContext({varShowNXTDetailForm: false});
                                                Notify(
                                                    If(_isNew, "Thêm thành công", "Cập nhật thành công"),
                                                    NotificationType.Success, 2000
                                                )
                                            )
                                        )
                                        )
                                    )
                                )
                              Size: =fxFontSizeMD
                              Text: ="Lưu và đóng"
                              Visible: =varNXTDetail.StatusCode = Index(col_WorkflowStatus,1).StatusCode || varNXTDetail.StatusCode = Index(col_WorkflowStatus,21).StatusCode
                              Width: =140
                  - con_SectionCoban:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Regular
