Screens:
  scrNXTForm:
    Properties:
      OnVisible: |-
        =Clear(col_ProductionReceiptBase);
        Clear(col_SelectedBAOQC);
        Clear(col_SelectedBIGBAG);
        Clear(col_SelectedXABIN);
        Clear(col_ProductionIssue);
        Set(
            varSelectedWarehouseTab,
            LookUp(
                col_WarehouseFormTabs,
                Code = "GENERAL"
            )
        )
    Children:
      - con_MainNXTForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderNXTForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderNXTForm:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        LayoutMinWidth: |
                          =0
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrNXTForm.Size
            - con_BodyNXTForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderNXTForm.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_BodyMenuNXTForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =con_BodyMainNXTForm.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =scrNXTForm.Size <> 1
                        Width: |-
                          =If(
                              varShowMenuUser,
                              240,
                              0
                          )
                      Children:
                        - cmp_NavSidebarNXTForm:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainNXTForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 250, 251, 1)
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_FormNXTButton:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =45
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                            Children:
                              - btn_BackNXTForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Icon: ="ChevronLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Back()
                                    Width: =30
                              - btn_SaveNXTForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Save"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: "=If(\n    IsBlank(cmb_NXT_ProductCategory.Selected),\n    Notify(\"Vui lòng chọn Loại sản phẩm\", NotificationType.Warning, 2000),\n\n    With(\n        {\n            // Kiểm tra đã tồn tại phiếu cùng nhà máy + ngày chưa\n            locExistingToday: LookUp(\n                'QLK List Inventory',\n                PlantCode     = varUserInPlant.PlantCode &&\n                InventoryDate = dp_NXT_InventoryDate.SelectedDate &&\n                ProductCategoryCode = cmb_NXT_ProductCategory.Selected.ProductCategoryCode\n            )\n        },\n        If(\n            // Chỉ block khi tạo mới mà đã có dữ liệu ngày đó\n            IsBlank(varNXTDetail.ID) && !IsBlank(locExistingToday),\n            Notify(\"Dữ liệu XNT ngày \" & Text(dp_NXT_InventoryDate.SelectedDate, \"dd/mm/yyyy\") & \" đã được tạo rồi.\", NotificationType.Warning, 2000)\n            ,\n\n            IfError(\n                If(\n                    IsBlank(varNXTDetail.ID),\n                    // TẠO MỚI — lưu kết quả vào varNXTDetail để dùng tiếp\n                    Set(\n                        varNXTDetail,\n                        Patch(\n                            'QLK List Inventory',\n                            Defaults('QLK List Inventory'),\n                            {\n                                PlantCode:           varUserInPlant.PlantCode,\n                                PlantName:           varUserInPlant.PlantName,\n                                InventoryDate:       dp_NXT_InventoryDate.SelectedDate,\n                                ProductCategoryCode: cmb_NXT_ProductCategory.Selected.ProductCategoryCode,\n                                StatusCode:          Index(col_WorkflowStatus, 1).StatusCode\n                            }\n                        )\n                    )\n                    ;\n                    \n                    // Ghi audit log hành động submit\n                    Patch(\n                        'QLK List Audit Log',\n                        Defaults('QLK List Audit Log'),\n                        {\n                            ActionBy:   varCurrentUser.FullName,\n                            ActionCode: Index(col_Action, 1).ActionCode,\n                            IDInventory:  varNXTDetail.ID\n                        }\n                    );\n                    ,\n\n                    // CẬP NHẬT — lưu lại record mới nhất vào varNXTDetail\n                    Set(\n                        varNXTDetail,\n                        Patch(\n                            'QLK List Inventory',\n                            varNXTDetail,\n                            {\n                                InventoryDate:       dp_NXT_InventoryDate.SelectedDate,\n                                ProductCategoryCode: cmb_NXT_ProductCategory.Selected.ProductCategoryCode\n                            }\n                        )\n                    );\n                ),\n                Notify(\"Lưu không thành công\", NotificationType.Error,2000),\n                Notify(\n                    If(IsBlank(varNXTDetail.ID), \"Thêm thành công\", \"Cập nhật thành công\"),\n                    NotificationType.Success\n                    ,2000\n                )\n            )\n        )\n    )\n)\n"
                                    Text: ="Lưu"
                                    Visible: =varNXTDetail.StatusCode = Index(col_WorkflowStatus,1).StatusCode || IsBlank(varNXTDetail.ID)
                              - btn_RefreshNXTForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="ArrowClockwise"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Refresh('QLK List Inventory');
                                      Refresh('QLK List Inventory Details Approver');
                                      Refresh('QLK List Inventory Details');
                                      Set(varNXTDetail,LookUp('QLK List Inventory',ID = varNXTDetail.ID ));
                                    Text: ="Làm mới"
                                    Visible: =!IsBlank(varNXTDetail.ID)
                                    Width: =120
                              - btn_RefreshNXTForm_1:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |
                                      =With(
                                          {
                                              _filterInventoryDetail: Filter(
                                                  'QLK List Inventory Details',
                                                  InventoryID = varNXTDetail.ID
                                              )
                                          },
                                          If(
                                              CountRows(_filterInventoryDetail) > 0,
                                              UpdateContext({varShowPopupConfirmNXT: true}),
                                              Notify("Chưa có thông tin chi tiết NXT, vui lòng nhập đồng bộ dữ liệu trước khi gửi duyệt", NotificationType.Warning, 2000)
                                          )
                                      )
                                    Text: ="Xác nhận"
                                    Visible: |
                                      =varNXTDetail.StatusCode = Index(col_WorkflowStatus,1).StatusCode && 
                                      (
                                          varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||   // FG_WH         - Thủ kho thành phẩm
                                          varUserInPlant.Role = Index(col_RoleUser,9).RoleCode ||   // VHSX_HO       - VHSX HO
                                          varUserInPlant.Role = Index(col_RoleUser,2).RoleCode      // RM_SUP        - Giám sát nguyên liệu
                                      )
                                    Width: =120
                              - btn_SendApproverNXTForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Send"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =UpdateContext({con_PopupConfirmXNT:true})
                                    Text: ="Gửi duyệt"
                                    Visible: |-
                                      =With(
                                          {
                                              _filterInventoryDetails: Filter(
                                                  'QLK List Inventory Details',
                                                  InventoryID         = varNXTDetail.ID
                                              )
                                          },
                                          CountIf(_filterInventoryDetails, DayDiffQty <> 0,!isAction )
                                      )
                                      && !varNXTDetail.isSent && (varNXTDetail.StatusCode = Index(col_WorkflowStatus,21).StatusCode || varNXTDetail.StatusCode = Index(col_WorkflowStatus,25).StatusCode || varNXTDetail.StatusCode = Index(col_WorkflowStatus,25).StatusCode) && 
                                      varNXTDetail.IsSubmittedForApproval && varUserInPlant.Role = Index(col_RoleUser,2).RoleCode
                                    Width: =120
                              - btn_RefreshNXTForm_3:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =UpdateContext({varShowApprovePopup:true})
                                    Text: ="Duyệt"
                                    Visible: |-
                                      =varNXTDetail.isSent && varNXTDetail.StatusCode = Index(col_WorkflowStatus,2).StatusCode && With(
                                          {
                                              _filterInventoryDetails: Filter(
                                                  'QLK List Inventory Details',
                                                  InventoryID         = varNXTDetail.ID,
                                                  Approver            = varCurrentUser.G_Email,
                                                  isAction            = false
                                              )
                                          },
                                          CountRows(_filterInventoryDetails) >0 
                                      )
                                    Width: =120
                              - btn_RefreshNXTForm_4:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="DismissCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =UpdateContext({varShowRejectPopup:true});
                                      Reset(DialogAlertRejectNXTForm)
                                    Text: ="Từ chối"
                                    Visible: |-
                                      =varNXTDetail.isSent && varNXTDetail.StatusCode = Index(col_WorkflowStatus,2).StatusCode && With(
                                          {
                                              _filterInventoryDetails: Filter(
                                                  'QLK List Inventory Details',
                                                  InventoryID         = varNXTDetail.ID,
                                                  Approver            = varCurrentUser.G_Email,
                                                  isAction            = false
                                              )
                                          },
                                          CountRows(_filterInventoryDetails) >0 
                                      )
                                    Width: =120
                              - btn_RefreshNXTForm_2:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn đóng phiếu này không?",
                                              {
                                                  Title: "Xác nhận đóng phiếu",
                                                  Subtitle: "Sau khi đóng phiếu sẽ không thể chỉnh sửa.",
                                                  ConfirmButton: "Đóng phiếu",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          UpdateContext({varShowPopupProcessing:true});
                                          IfError(
                                              Set(
                                                  varNXTDetail,
                                                  Patch(
                                                      'QLK List Inventory',
                                                      varNXTDetail,
                                                      {
                                                          StatusCode: Index(col_WorkflowStatus, 23).StatusCode
                                                      }
                                                  )
                                              );
                                              Patch(
                                                  'QLK List Audit Log',
                                                  Defaults('QLK List Audit Log'),
                                                  {
                                                      ActionBy:    varCurrentUser.FullName,
                                                      ActionCode:  Index(col_Action, 13).ActionCode,
                                                      IDInventory: varNXTDetail.ID
                                                  }
                                              );
                                              'QLK|GenerateOverstockDurationReport'.Run(varNXTDetail.PlantCode,varNXTDetail.ProductCategoryCode,varNXTDetail.ID,Text(varNXTDetail.InventoryDate,"yyyy-mm-dd"));
                                              ,
                                              UpdateContext({varShowPopupProcessing:false});
                                              Notify("Không thể đóng phiếu.", NotificationType.Error, 2000),
                                              UpdateContext({varShowPopupProcessing:false});
                                              Notify("Đóng phiếu thành công.", NotificationType.Success, 2000)
                                          )
                                      )
                                    Text: ="Đóng phiếu"
                                    Visible: |-
                                      =!IsBlank(varNXTDetail.ID) 
                                      && ((varNXTDetail.StatusCode = Index(col_WorkflowStatus,4).StatusCode || varNXTDetail.StatusCode = Index(col_WorkflowStatus,2).StatusCode) 
                                      && (With(
                                          {
                                              _filterInventoryDetails: Filter(
                                                                              'QLK List Inventory Details',
                                                                              InventoryID         = varNXTDetail.ID,
                                                                              isAction            = false
                                                                          )
                                          },
                                          CountRows(_filterInventoryDetails) = 0
                                      )) ) && varUserInPlant.Role = Index(col_RoleUser,2).RoleCode
                                    Width: =130
                              - btn_RefreshNXTForm_5:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Delete"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xóa bản ghi này không?",
                                              {
                                                  Title: "Xác nhận xóa",
                                                  Subtitle: "Hành động này không thể hoàn tác.",
                                                  ConfirmButton: "Xóa",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          UpdateContext({varShowPopupProcessing: true});
                                          IfError(
                                              Clear(col_InventoryDetailToDelete);
                                              ClearCollect(
                                                  col_InventoryDetailToDelete,
                                                  Filter('QLK List Inventory Details', InventoryID = varNXTDetail.ID)
                                              );
                                              Remove('QLK List Inventory Details', col_InventoryDetailToDelete);
                                              Remove('QLK List Inventory', varNXTDetail),
                                              UpdateContext({varShowPopupProcessing: false});
                                              Notify("Xóa không thành công", NotificationType.Error, 2000);
                                              ,
                                              UpdateContext({varShowPopupProcessing: false});
                                              Navigate(scrNXT,ScreenTransition.CoverRight);
                                              Notify("Đã xoá thành công", NotificationType.Success, 2000);
                                          )
                                      )
                                    Text: ="Xóa"
                                    Visible: =varNXTDetail.StatusCode = Index(col_WorkflowStatus,1).StatusCode
                                    Width: =100
                              - btn_GetInventoryDetailSAP:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Icon: ="Globe"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =UpdateContext({varShowPopupGetInventoryData:true});
                                      Reset(Combobox1_4);
                                      Reset(Combobox1_5);
                                    Text: =
                                    Visible: =varNXTDetail.StatusCode = Index(col_WorkflowStatus,1).StatusCode && !IsBlank(varNXTDetail.ID)
                        - con_ThongTinNXTForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =con_SectionThongTin.Height + con_SectionBAOQC.Height *3 + 100
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =10
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - con_tabNXTForm:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =45
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Width: =Parent.Width - 10
                                  Children:
                                    - tab_Receipt_2:
                                        Control: ModernTabList
                                        Properties:
                                          Default: =LookUp(col_WarehouseFormTabs,Code = varSelectedWarehouseTab.Code)
                                          Height: =Parent.Height - 10
                                          ItemDisplayText: =ThisItem.NameVI
                                          Items: |-
                                            =If(
                                                IsBlank(varNXTDetail.ID),
                                                Filter(col_WarehouseFormTabs, Code = "GENERAL"),   // Chỉ tab Thông tin chung khi tạo mới
                                                col_WarehouseFormTabs       // Sửa record: hiện tất cả trừ tab SortOrder=2
                                            )
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnChange: |-
                                            =Set(
                                                varSelectedWarehouseTab,
                                                LookUp(col_WarehouseFormTabs, Code = Self.Selected.Code)
                                            )
                                          TabSize: =TabSize.Small
                                          Width: =Parent.Width
                              - con_SectionThongTin:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: |-
                                      =Switch(
                                          scrNXTForm.Size,
                                          1,
                                          290,
                                          2,
                                          140,
                                          140
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =varSelectedWarehouseTab.Code = "GENERAL"
                                  Children:
                                    - lbl_TitleThongTin:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeMD
                                          Text: ="Thông tin"
                                    - con_FieldsThongTin:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutGridColumns: =If(scrNXTForm.Size = 1, 1, 3)
                                          LayoutGridRows: =If(scrNXTForm.Size = 1, 3, 1)
                                          LayoutMinHeight: =Parent.LayoutMinHeight
                                        Children:
                                          - con_FieldNXTInventoryDate:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                PaddingLeft: =5
                                                PaddingRight: =5
                                              Children:
                                                - lbl_NXT_InventoryDate:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Ngày nhập tồn *"
                                                - dp_NXT_InventoryDate:
                                                    Control: ModernDatePicker
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Start
                                                      Appearance: =Appearance.Outline
                                                      DefaultDate: |-
                                                        =If(
                                                            IsBlank(varNXTDetail.ID),
                                                            Today(),
                                                            varNXTDetail.InventoryDate
                                                        )
                                                      DisplayMode: |-
                                                        =If(
                                                            varNXTDetail.StatusCode = Index(
                                                                col_WorkflowStatus,
                                                                1
                                                            ).StatusCode || IsBlank(varNXTDetail.ID),
                                                            DisplayMode.Edit,
                                                            DisplayMode.Disabled
                                                        )
                                                      Font: =fxFontFamily
                                                      Format: =DatePickerFormat.Short
                                                      LayoutMinWidth: =Parent.Width - 5
                                                      Size: =fxFontSizeMD
                                                      Width: =Parent.Width -10
                                          - con_FieldNXTProductCategory:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                                PaddingLeft: =5
                                                PaddingRight: =5
                                              Children:
                                                - lbl_NXT_ProductCategory:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Loại hàng"
                                                - cmb_NXT_ProductCategory:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      Appearance: =Appearance.Outline
                                                      DefaultSelectedItems: |-
                                                        =If(
                                                            IsBlank(varNXTDetail.ID),
                                                            LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode),
                                                            LookUp(col_ProductCategories, ProductCategoryCode = varNXTDetail.ProductCategoryCode)
                                                        )
                                                      DisplayMode: |-
                                                        =If(
                                                            varNXTDetail.StatusCode = Index(
                                                                col_WorkflowStatus,
                                                                1
                                                            ).StatusCode || IsBlank(varNXTDetail.ID),
                                                            DisplayMode.Edit,
                                                            DisplayMode.Disabled
                                                        )
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: =""
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                      Items: =col_ProductCategories
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                                                      Width: =Parent.Width - 10
                                          - con_FieldNXTProductCategory_1:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =83
                                                LayoutDirection: =LayoutDirection.Vertical
                                                PaddingLeft: =5
                                                PaddingRight: =5
                                                X: =460
                                                Y: =16
                                              Children:
                                                - lbl_NXT_ProductCategory_1:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Trạng thái"
                                                - cmb_StatusCode_1:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: |-
                                                        =If(
                                                            IsBlank(varNXTDetail.ID),
                                                            LookUp(
                                                                col_WorkflowStatus,
                                                                StatusCode = "DRAFT"
                                                            ),
                                                            LookUp(
                                                                col_WorkflowStatus,
                                                                StatusCode = varNXTDetail.StatusCode
                                                            )
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
