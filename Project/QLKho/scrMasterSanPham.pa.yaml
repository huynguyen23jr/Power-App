Screens:
  scrMasterSanPham:
    Properties:
      OnVisible: |-
        =Clear(col_SelectedMasterSanPham);
        varShowMenuUser && scrMasterSanPham.Size <> 1
    Children:
      - con_MainMasterSanPham:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: |
              =0
          Children:
            - con_MenuMasterSanPham:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |-
                    =If(
                        scrMasterSanPham.Size = 1,
                        false,
                        true
                    )
                  Width: |-
                    =If(
                        varShowMenuUser,
                        240,
                        64
                    )
                Children:
                  - cmp_NavSidebarMasterSanPham:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainMasterSanPham:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderMasterSanPham:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderMasterSanPham:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrMasterSanPham.Size
                  - con_BodyMasterSanPham:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderMasterSanPham.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser,0,5)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =If(!varShowMenuUser,0,5)
                        PaddingLeft: =If(!varShowMenuUser,0,5)
                        PaddingRight: =If(!varShowMenuUser,0,5)
                        PaddingTop: =If(!varShowMenuUser,0,5)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_ContentMasterSanPham:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    !varShowMenuUser,
                                    DropShadow.None,
                                    DropShadow.Semibold
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =If(!varShowMenuUser,0,5)
                              RadiusTopRight: =5
                            Children:
                              - con_FormButtonMobile_MasterSanPham:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrMasterSanPham.Size = 1
                                    Width: =Parent.Width - 10
                                  Children:
                                    - lbl_MobileActionPos_MasterSanPham:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(6), Switch(Value, 1, btn_AddMasterSanPham.Visible, 2, btn_DownloadTemplateMasterSanPham.Visible, 3, btn_AddMasterSanPham_1.Visible, 4, btn_RefreshMasterSanPham.Visible, 5, btn_ExportMasterSanPham.Visible, 6, btn_RefreshMasterSanPham_1.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_MasterSanPham:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_MasterSanPham.Text), 0, CountRows(Split(lbl_MobileActionPos_MasterSanPham.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_MasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_MasterSanPham.Text, ","), 1), 1)).Value), 1, "Add", 2, "ArrowDownload", 3, "Print", 4, "ArrowSync", 5, "ArrowDownload", 6, "Delete", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_MasterSanPham.Text, ","), 1), 1)).Value),
                                                1, Select(btn_AddMasterSanPham),
                                                2, Select(btn_DownloadTemplateMasterSanPham),
                                                3, Select(btn_AddMasterSanPham_1),
                                                4, Select(btn_RefreshMasterSanPham),
                                                5, Select(btn_ExportMasterSanPham),
                                                6, Select(btn_RefreshMasterSanPham_1)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_MasterSanPham.Text, ","), 1), 1)).Value), 1, "Thêm", 2, "Tải template", 3, "Import", 4, "Làm mới", 5, "Export", 6, "Xóa", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_MasterSanPham.Text, ","), 1), 1)).Value), 1, "Thêm", 2, "Tải template", 3, "Import", 4, "Làm mới", 5, "Export", 6, "Xóa", "")
                                          Visible: =Value(lbl_MobileActionCount_MasterSanPham.Text) >= 1
                                    - btn_MobileAction2_MasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_MasterSanPham.Text, ","), 2), 1)).Value), 1, "Add", 2, "ArrowDownload", 3, "Print", 4, "ArrowSync", 5, "ArrowDownload", 6, "Delete", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_MasterSanPham.Text, ","), 2), 1)).Value),
                                                1, Select(btn_AddMasterSanPham),
                                                2, Select(btn_DownloadTemplateMasterSanPham),
                                                3, Select(btn_AddMasterSanPham_1),
                                                4, Select(btn_RefreshMasterSanPham),
                                                5, Select(btn_ExportMasterSanPham),
                                                6, Select(btn_RefreshMasterSanPham_1)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_MasterSanPham.Text, ","), 2), 1)).Value), 1, "Thêm", 2, "Tải template", 3, "Import", 4, "Làm mới", 5, "Export", 6, "Xóa", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_MasterSanPham.Text, ","), 2), 1)).Value), 1, "Thêm", 2, "Tải template", 3, "Import", 4, "Làm mới", 5, "Export", 6, "Xóa", "")
                                          Visible: =Value(lbl_MobileActionCount_MasterSanPham.Text) >= 2
                                    - btn_MobileMore_MasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_MasterSanPham: !varShowMoreActionsMobile_MasterSanPham})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_MasterSanPham.Text) >= 3
                                          Width: =40
                              - con_ActionHeaderMasterSanPham:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =scrMasterSanPham.Size <> 1
                                  Children:
                                    - btn_AddMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Set(varMasterProductDetail,{});
                                            Navigate(scrMasterDataProductionForm,ScreenTransition.CoverRight)
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                    - btn_DownloadTemplateMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowDownload"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Launch("https://greenfeedgroup.sharepoint.com/:x:/s/Feed-StockManagement-Dev2/IQC0ElvB-6hKQa34ij3X_bCFAQdHJBO2XBtbhOm25S6nYOA?e=gB3ZyN&download=1")
                                          Size: =fxFontSizeMD
                                          Text: ="Tải template"
                                          Width: =150
                                    - btn_AddMasterSanPham_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Print"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Set(varShowUploadFile, true);
                                            Reset(attFile);
                                          Size: =fxFontSizeMD
                                          Text: ="Import"
                                    - btn_RefreshMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Refresh('QLK List Master Data Production')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                                    - btn_ExportMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowDownload"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowPopupProcessing: true});
                                            Set(varExportResult, 'QLK|ExportMasterDataProduct'.Run(varUserInPlant.PlantCode));
                                            UpdateContext({varShowPopupProcessing: false});
                                            If(
                                                varExportResult.status = "200",
                                                Launch(varExportResult.fileurl, {}, LaunchTarget.New);
                                                Notify("Xuất " & varExportResult.rowcount & " sản phẩm thành công", NotificationType.Success, 3000),
                                                Notify("Xuất thất bại: " & varExportResult.message, NotificationType.Error, 3000)
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Export"
                                          Width: =120
                                    - btn_RefreshMasterSanPham_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Delete"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xóa " & CountRows(col_SelectedMasterSanPham) & " bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận xóa",
                                                        Subtitle: "Hành động này không thể hoàn tác.",
                                                        ConfirmButton: "Xóa",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),
                                                IfError(
                                                    // Đọc phạm vi nhà máy vào collection trước khi đếm; SharePoint không hỗ trợ CountRows trực tiếp.
                                                    ClearCollect(col_DeleteScopeMaster, Filter('QLK List Master Data Production', PlantCode = varUserInPlant.PlantCode));
                                                    If(
                                                        // Chỉ xóa theo phạm vi khi đã chọn đủ dữ liệu và chưa chạm ngưỡng 500 dòng.
                                                        CountRows(col_SelectedMasterSanPham) = CountRows(gal_MasterSanPham.AllItems) &&
                                                        IsBlank(txt_SearchMasterSanPham.Text) &&
                                                        IsBlank(cbo_FltGroupMasterSanPhamV2.Selected) &&
                                                        IsBlank(cbo_FltTypeMasterSanPhamV2.Selected) &&
                                                        IsBlank(cbo_FltPelletMasterSanPhamV2.Selected) &&
                                                        CountRows(col_SelectedMasterSanPham) = CountRows(col_DeleteScopeMaster) &&
                                                        CountRows(Filter(col_DeleteScopeMaster, !(ID in col_SelectedMasterSanPham.ID))) = 0 &&
                                                        CountRows(col_SelectedMasterSanPham) > 0 && CountRows(col_DeleteScopeMaster) < 500,
                                                        RemoveIf('QLK List Master Data Production', PlantCode = varUserInPlant.PlantCode),
                                                        // Chọn một phần → giữ xóa theo ID, không bỏ sót dòng ngoài giới hạn collection
                                                        ForAll(col_SelectedMasterSanPham As item, Remove('QLK List Master Data Production', LookUp('QLK List Master Data Production', ID = item.ID)))
                                                    );
                                                    Clear(col_SelectedMasterSanPham),
                                                    Notify("Xóa không thành công", NotificationType.Error, 2000),
                                                    Notify("Đã xóa thành công!", NotificationType.Success, 2000)
                                                )
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xóa"
                                          Visible: =CountRows(col_SelectedMasterSanPham) > 0
                                          Width: =100
                              - lbl_TitleMasterSanPham:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: |
                                      =40
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Thông tin sản phẩm"
                              - con_FilterMasterSanPham:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =45
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width - Parent.PaddingLeft*2
                                  Children:
                                    - txt_SearchMasterSanPham:
                                        Control: ModernTextInput
                                        Properties:
                                          FillPortions: =1
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Placeholder: ="Tìm kiếm mã SAP, mô tả ,...."
                                          Width: =200
                                    - btn_FilterMasterSanPham:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Filter"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =UpdateContext({varPopUpFilterMasterDataProduction:true})
                                          Text: ="Bộ lọc" & If(!IsBlank(cbo_FltGroupMasterSanPhamV2.Selected) || !IsBlank(cbo_FltTypeMasterSanPhamV2.Selected) || !IsBlank(cbo_FltPelletMasterSanPhamV2.Selected), "  ●", "")
                                          Width: =120
                              - con_ListMasterSanPham:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: |-
                                      =If(
                                          scrMasterSanPham.Size = 1,
                                          DropShadow.None,
                                          DropShadow.Semibold
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: |-
                                      =If(
                                          scrMasterSanPham.Size = 1,
                                          0,
                                          5
                                      )
                                    RadiusTopRight: =0
                                    Width: =Parent.Width - Parent.PaddingLeft*2
                                  Children:
                                    - con_ListBodyMasterSanPham:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          LayoutOverflowX: =LayoutOverflow.Scroll
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - con_GalleryWrapperMasterSanPham:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =Parent.Height - lbl_TotalRowsMasterSanPham.Height
                                                LayoutMinHeight: =Parent.Height
                                                LayoutMinWidth: =16
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: |-
                                                  =Switch(
                                                      scrMasterDataProductionForm.Size,

                                                      1, // Mobile
                                                          Parent.Width ,

                                                      2, // Tablet
                                                          con_ContentMasterSanPham.Width + 300 + con_MenuMasterSanPham.Width,

                                                      3, // Web / Desktop
                                                          con_ContentMasterSanPham.Width - 10,

                                                      Parent.Width - 10
                                                  )
                                              Children:
                                                - con_TableHeaderMasterSanPham:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(249, 249, 249, 1)
                                                      Height: "=If(\r\n    scrMasterSanPham.Size = 1,\r\n    0,\r\n    50\r\n    \r\n)"
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =5
                                                      PaddingLeft: =10
                                                      PaddingRight: =10
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Visible: |-
                                                        =If(
                                                            scrMasterSanPham.Size = 1,
                                                            false,
                                                            true
                                                        )
                                                      Width: =Parent.Width
                                                      X: |
                                                        =0
                                                    Children:
                                                      - chk_MasterSanPham_SelectAll:
                                                          Control: ModernCheckbox
                                                          Properties:
                                                            Default: |-
                                                              =CountRows(col_SelectedMasterSanPham) = CountRows(gal_MasterSanPham.AllItems) &&
                                                              CountRows(gal_MasterSanPham.AllItems) > 0
                                                            FontWeight: =""
                                                            Label: =""
                                                            OnCheck: =ClearCollect(col_SelectedMasterSanPham, gal_MasterSanPham.AllItems)
                                                            OnUncheck: =Clear(col_SelectedMasterSanPham)
                                                            Width: =32
                                                      - lbl_HeaderProductGroupMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Nhóm hàng"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderSAPCodeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã SAP"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderProductionCodeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã hàng"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderDescriptionMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mô tả"
                                                            Width: =Parent.Width * 0.2
                                                            Wrap: =false
                                                      - lbl_HeaderProductTypeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Loại hàng"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderPelletSizeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                            Text: ="Cỡ viên"
                                                            Width: =Parent.Width * 0.1
                                                            Wrap: =false
                                                      - lbl_HeaderBagSizeMasterSanPham:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
