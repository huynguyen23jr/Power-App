            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowChenhLechNgay
            Width: =Parent.Width
          Children:
            - con_ChenhLechNgayBox:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.Regular
                  Fill: =Color.White
                  FillPortions: =0
                  Height: =250
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                  Width: |-
                    =Switch(
                        App.ActiveScreen.Size,
                        1, App.ActiveScreen.Width - 40,
                        2, 420,
                        400
                    )
                Children:
                  - con_HeaderChenhLechNgay:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =45
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        PaddingLeft: =15
                        PaddingRight: =10
                      Children:
                        - lbl_TitleChenhLechNgay:
                            Control: ModernText
                            Properties:
                              FillPortions: =1
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightBold
                              Size: =fxFontSizeLG
                              Text: ="Chênh lệch ngày"
                        - btn_CloseChenhLechNgay:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Transparent
                              Font: =fxFontFamily
                              Icon: ="Dismiss"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =UpdateContext({varShowChenhLechNgay: false})
                              Width: =32
                  - con_BodyChenhLechNgay:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                      Children:
                        - con_FieldCLNNgay:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =70
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =75
                              PaddingLeft: =10
                              PaddingRight: =10
                            Children:
                              - lbl_CLNNgay:
                                  Control: ModernText
                                  Properties:
                                    Font: =fxFontFamily
                                    Size: =fxFontSizeMD
                                    Text: ="Chọn ngày *"
                              - dp_CLNNgay:
                                  Control: ModernDatePicker
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    DefaultDate: =Today()
                                    Font: =fxFontFamily
                                    Format: =DatePickerFormat.Short
                                    LayoutMinWidth: =Parent.Width-20
                                    Placeholder: ="Chọn ngày ..."
                                    Size: =fxFontSizeMD
                        - con_FieldCLNLoaiSP:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =70
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =75
                              PaddingLeft: =10
                              PaddingRight: =10
                            Children:
                              - lbl_CLNLoaiSP:
                                  Control: ModernText
                                  Properties:
                                    Font: =fxFontFamily
                                    Size: =fxFontSizeMD
                                    Text: ="Loại sản phẩm *"
                              - cbx_CLNLoaiSP:
                                  Control: ModernCombobox
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                    Font: =fxFontFamily
                                    InputTextPlaceholder: ="Chọn loại sản phẩm ..."
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                    Items: =col_ProductCategories
                                    SelectMultiple: =false
                                    Size: =fxFontSizeMD
                                    Width: =Parent.Width -5
                  - con_FooterChenhLechNgay:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        PaddingBottom: =10
                        PaddingLeft: =15
                        PaddingRight: =15
                        PaddingTop: =10
                      Children:
                        - btn_ConfirmChenhLechNgay:
                            Control: ModernButton
                            Properties:
                              DisplayMode: |-
                                =If(
                                    IsBlank(dp_CLNNgay.SelectedDate) || IsBlank(cbx_CLNLoaiSP.Selected),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              Font: =fxFontFamily
                              Icon: ="CheckmarkCircle"
                              OnSelect: |
                                =// Đóng popup "chênh lệch ngày" (nếu đang mở) và bật popup "đang xử lý" trong lúc tổng hợp dữ liệu
                                UpdateContext({varShowChenhLechNgay: false});
                                UpdateContext({varShowPopupProcessing: true});

                                // [CHỈNH] Tổng hợp + tạo chênh lệch chuyển xuống flow 'QLK | Create Stock Count Variance'
                                // (đọc dữ liệu có phân trang, tính toán không vòng lặp, ghi bulk bằng SharePoint $batch).
                                // Logic giữ nguyên như bản ForAll/Patch cũ trong app.
                                // Flow trả về: status (OK / NO_DATA / ERROR), message, draftcount, totalcount, updatepayload
                                IfError(
                                    With(
                                        {
                                            _res: 'QLK|CreateStockCountVariance'.Run(
                                                varUserInPlant.PlantCode,
                                                varUserInPlant.PlantName,
                                                Text(dp_CLNNgay.SelectedDate, "yyyy-mm-dd"),
                                                cbx_CLNLoaiSP.Selected.ProductCategoryCode
                                            )
                                        },
                                        Switch(
                                            _res.status,
                                            // Thiếu dữ liệu kiểm kê / tồn kho → flow trả đúng câu thông báo cũ
                                            "NO_DATA",
                                            Notify(_res.message, NotificationType.Warning, 2000),
                                            "OK",
                                            If(
                                                // Có mã DRAFT → flow đã tạo dòng chênh lệch
                                                Value(_res.draftcount) > 0,
                                                Notify(_res.message, NotificationType.Success, 2000),
                                                // Không có mã chênh lệch → cập nhật thẳng tồn kho bằng payload flow trả về (giữ như cũ)
                                                If(
                                                    IsBlank(_res.updatepayload) || _res.updatepayload = "[]",
                                                    Notify("Không có mã nào chênh lệch lớn hơn 0", NotificationType.Information, 2000),
                                                    IfError(
                                                        'QLK|UpdateInventoryDetailsonVarianceApproved'.Run(
                                                            _res.updatepayload,
                                                            varUserInPlant.PlantCode,
                                                            cbx_CLNLoaiSP.Selected.ProductCategoryCode
                                                        ),
                                                        Notify("Không có mã chênh lệch nhưng cập nhật tồn kho không thành công: " & FirstError.Message, NotificationType.Error, 3000),
                                                        Notify("Không có mã chênh lệch, đã cập nhật tồn kho cho " & CountRows(Table(ParseJSON(_res.updatepayload))) & " mã", NotificationType.Success, 2000)
                                                    )
                                                )
                                            ),
                                            // ERROR → flow trả message kèm mã run để tra lịch sử chạy
                                            Notify(_res.message, NotificationType.Error, 3000)
                                        )
                                    ),
                                    Notify("Tạo chênh lệch không thành công: " & FirstError.Message, NotificationType.Error, 3000)
                                );

                                // [CHỈNH] Flow ghi dữ liệu phía server → refresh để gallery thấy dòng mới
                                Refresh('QLK List Stock Count Variance');

                                // Tắt popup xử lý khi hoàn tất
                                UpdateContext({varShowPopupProcessing: false})

                                /* ======================================================================
                                   [CODE CŨ] Tổng hợp + tạo chênh lệch ngay trong app (ForAll/Patch).
                                   Đã chuyển xuống flow 'QLK | Create Stock Count Variance' ở trên.
                                   Giữ lại để tham khảo / rollback: bỏ comment khối này và xóa đoạn gọi flow.
                                   ======================================================================

                                // Xóa các collection tạm trước khi nạp lại dữ liệu mới
                                Concurrent(
                                    Clear(col_OpeningQty),
                                    Clear(col_StockCountDetails),
                                    Clear(col_StockSummary),
                                    Clear(col_UniqueSAPCodes)
                                );

                                // Nạp song song 4 nguồn dữ liệu: chi tiết kiểm kê, tồn đầu kỳ, danh mục sản phẩm, và tồn kho ngày hiện tại
                                Concurrent(
                                    // Các dòng kiểm kê đã xác nhận (COUNT_CONFIRMED) trong ngày, chưa được tổng hợp
                                    ClearCollect(
                                        col_StockCountDetails,
                                        Filter(
                                            'QLK List Stock Count Details',
                                            PlantCode           = varUserInPlant.PlantCode,
                                            StockCountDate      = dp_CLNNgay.SelectedDate,
                                            ProductCategoryCode = cbx_CLNLoaiSP.Selected.ProductCategoryCode,
                                            StatusCode          = "COUNT_CONFIRMED",
                                            IsSummarized        = false
                                        )
                                    ),
                                    // Tồn kho đóng của ngày hôm trước (làm tồn đầu kỳ cho ngày kiểm kê hiện tại)
                                    ClearCollect(
                                        col_OpeningQty,
                                        Filter(
                                            'QLK List Inventory Details',
                                            PlantCode            = varUserInPlant.PlantCode,
                                            InventoryDate        = DateAdd(dp_CLNNgay.SelectedDate, -1, TimeUnit.Days),
                                            ProductCategoryCode  = cbx_CLNLoaiSP.Selected.ProductCategoryCode,
                                            ConfirmFromWarehouse = true
                                        )
                                    ),
                                    // Danh mục sản phẩm (dùng để lọc mã SAP hợp lệ và lấy phương pháp tính CountMethodName)
                                    ClearCollect(
                                        col_MasterDataProduction,
                                        Filter(
                                            'QLK List Master Data Production',
                                            PlantCode = varUserInPlant.PlantCode
                                        )
                                    )
                                );

                                // Nếu thiếu dữ liệu kiểm kê hoặc tồn đầu kỳ thì báo lỗi và dừng lại, không tổng hợp
                                If(
                                    IsEmpty(col_StockCountDetails) || IsEmpty(col_OpeningQty),
                                    Notify(
                                        If(
                                            IsEmpty(col_StockCountDetails) && IsEmpty(col_OpeningQty),
                                            "Không có dữ liệu kiểm kê và tồn kho",
                                            If(
                                                IsEmpty(col_StockCountDetails),
                                                "Không có dữ liệu kiểm kê",
                                                "Không có dữ liệu tồn kho"
                                            )
                                        ),
                                        NotificationType.Warning,
                                        2000
                                    );
                                    UpdateContext({varShowPopupProcessing: false}),

                                    // Danh sách mã SAP duy nhất (chỉ lấy mã có trong danh mục sản phẩm) để tổng hợp theo từng mã
                                    ClearCollect(
                                            col_UniqueSAPCodes,
                                                GroupBy(
                                                    Filter(
                                                        col_StockCountDetails,
                                                        SAPCode in col_MasterDataProduction.SAPCode
                                                    ),
                                                    SAPCode,
                                                    StockCountType,
                                                    GroupData
                                                )
                                    );

                                    // Với mỗi mã SAP: tính tổng hợp từ GroupData (không cần Filter lại col_StockCountDetails)
                                    ForAll(
                                        col_UniqueSAPCodes As grp,
                                        With(
                                            {
                                                _opening:   LookUp(col_OpeningQty, SAPCode = grp.SAPCode),
                                                _actualQty: Sum(grp.GroupData, ActualQty),
                                                _idDetails: Concat(grp.GroupData, Text(ID), ";"),
                                                _bizGroup:  LookUp(col_MasterDataProduction, SAPCode = grp.SAPCode).BusinessGroupCode,
                                                _parentInvID: LookUp(col_OpeningQty, true).ID
                                            },
                                            With(
                                                { _variance: _actualQty - _opening.ClosingQty },
                                                If(
                                                    IsBlank(_opening) || _variance >= 0,
                                                    Collect(
                                                        col_StockSummary,
                                                        {
                                                            PlantCode:           varUserInPlant.PlantCode,
                                                            PlantName:           varUserInPlant.PlantName,
                                                            ProductTypeCode:     cbx_CLNLoaiSP.Selected.ProductCategoryCode,
                                                            StockCountDate:      dp_CLNNgay.SelectedDate,
                                                            SAPCode:             grp.SAPCode,
                                                            CountMethodName:     grp.StockCountType,
                                                            IDStockCountDetails: _idDetails,
                                                            IDInventoryDetails:  _opening.ID,
                                                            IDInventory:         _opening.InventoryID,
                                                            BookQty:             _opening.OpeningQty,
                                                            ActualQty:           _actualQty,
                                                            VarianceQty:         If(IsBlank(_opening), _actualQty, If(_variance > 0, _variance, 0)),
                                                            TotalReceiptQty:     Coalesce(_opening.TotalReceiptQty, 0),
                                                            TotalIssueQty:       Coalesce(_opening.TotalIssueQty, 0),
                                                            Explanation:         "",
                                                            StatusCode:          If(IsBlank(_opening) || _variance > 0, "DRAFT", "APPROVED"),
                                                            NeedRecount:         IsBlank(_opening) || _variance > 0,
                                                            BusinessGroupCode:   _bizGroup
                                                        }
                                                    )
                                                )
                                            )
                                        )
                                    );

                                    // Đánh dấu các dòng kiểm kê/tồn kho nguồn vừa xử lý là đã được tổng hợp (IsSummarized = true)
                                    ClearCollect(col_SummarizedStockCount, ForAll(col_StockCountDetails, {ID: ID, IsSummarized: true}));
                                    ClearCollect(col_InventoryDetails,     ForAll(col_OpeningQty,        {ID: ID, IsSummarized: true, isFlag: true}));

                                    // Ghi nhận kết quả: cập nhật trạng thái đã tổng hợp và lưu dòng chênh lệch (nếu có) vào các list tương ứng
                                    Concurrent(
                                        Patch('QLK List Stock Count Details', col_SummarizedStockCount),
                                        Patch('QLK List Inventory Details',   col_InventoryDetails),
                                        If(
                                            !IsEmpty(Filter(col_StockSummary, StatusCode = "DRAFT")),
                                            Patch('QLK List Stock Count Variance', col_StockSummary)
                                        )
                                    );

                                    // Không có mã nào chênh lệch → cập nhật thẳng số liệu tồn kho qua flow
                                    // (payload cùng cấu trúc với bước duyệt chênh lệch: 1 dòng / mã SAP trong col_UniqueSAPCodes)
                                    If(
                                        IsEmpty(Filter(col_StockSummary, StatusCode = "DRAFT")),
                                        ClearCollect(
                                            col_UpdateItemsInventoryDetail,
                                            ForAll(
                                                Filter(col_StockSummary, !IsBlank(IDInventoryDetails)) As item,
                                                {
                                                    ID:                    item.IDInventoryDetails,
                                                    ActualQty:             item.ActualQty,
                                                    IsDateVarianceChecked: true,
                                                    PlantCode:             item.PlantCode,
                                                    InventoryDate:         item.StockCountDate,
                                                    ProductCategoryCode:   item.ProductTypeCode,
                                                    SAPCode:              item.SAPCode,
                                                    BookQty:               item.BookQty,
                                                    Explanation:           ""
                                                }
                                            )
                                        );

                                        If(
                                            IsEmpty(col_UpdateItemsInventoryDetail),
                                            Notify("Không có mã nào chênh lệch lớn hơn 0", NotificationType.Information, 2000),
                                            IfError(
                                                'QLK|UpdateInventoryDetailsonVarianceApproved'.Run(
                                                    JSON(col_UpdateItemsInventoryDetail),
                                                    varUserInPlant.PlantCode,
                                                    cbx_CLNLoaiSP.Selected.ProductCategoryCode
                                                ),
                                                Notify("Không có mã chênh lệch nhưng cập nhật tồn kho không thành công: " & FirstError.Message, NotificationType.Error, 3000),
                                                Notify("Không có mã chênh lệch, đã cập nhật tồn kho cho " & CountRows(col_UpdateItemsInventoryDetail) & " mã", NotificationType.Success, 2000)
                                            )
                                        )
                                    );

                                    // Tắt popup xử lý khi hoàn tất
                                    UpdateContext({varShowPopupProcessing: false})
                                )
                                ====================================================================== [HẾT CODE CŨ] */
                              Size: =fxFontSizeMD
                              Text: ="Xác nhận"
                              Width: =120
                        - btn_CancelChenhLechNgay:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              Icon: ="DismissCircle"
                              OnSelect: |-
                                =UpdateContext({varShowChenhLechNgay: false})
                              Size: =fxFontSizeMD
                              Text: ="Hủy"
                              Width: =120
      - con_PopupProcessingDanhMucChenhLech:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowPopupProcessing
            Width: =Parent.Width
          Children:
            - DialogProccessingKiemKho_1:
                Control: CanvasComponent
                ComponentName: DialogProccessing
                Properties:
                  Height: =App.Height
                  Width: =App.Width
      - con_PopupSendDanhMucChenhLech:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =con_PopupConfirmSubmit
            Width: =Parent.Width
          Children:
            - DialogAlertSendDanhMucChenhLech:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({con_PopupConfirmSubmit:false})
                  varConfirmDialogAction: "=// ============================================================\n// 1. Tắt popup xác nhận, hiện popup loading\n// ============================================================\nUpdateContext({con_PopupConfirmSubmit: false});\nUpdateContext({varShowPopupProcessing: true});\n\n\n// ============================================================\n// 2. Khởi tạo collection chứa ID cần reset cho từng bảng\n//    - col_ResetStockCountIDs      : payload cho 'QLK List Stock Count Details'\n//    - col_ResetInventoryDetailIDs : payload cho 'QLK List Inventory Details'\n// ============================================================\nConcurrent(\n    Clear(col_ResetStockCountIDs),\n    Clear(col_ResetInventoryDetailIDs)\n);\n\n\n// ============================================================\n// 3. Build payload reset\n//    Chỉ xử lý các dòng được chọn có NeedRecount = true\n//    (các dòng cần kiểm kê lại)\n// ============================================================\nForAll(\n    Filter(col_SelectedItems, NeedRecount) As selected,\n    Concurrent(\n\n        // 3.1 Reset bản ghi kiểm kê:\n        //     - Bỏ đánh dấu đã tổng hợp (IsSummarized = false)\n        //     - Đưa trạng thái về bước đầu của workflow (Index 1)\n        ForAll(\n            Split(selected.IDStockCountDetails, \";\") As idItem,\n            If(\n                !IsBlank(idItem.Value),\n                 Collect(\n                            col_ResetStockCountIDs,\n                            {\n                                ID: Value(idItem.Value),\n                                IsSummarized: false,\n                                StatusCode: \"DRAFT\"\n                            }\n                        )\n            )\n        )\n        \n        ,\n\n        // 3.2 Reset bản ghi tồn kho:\n        //     - Bỏ đánh dấu đã tổng hợp (IsSummarized = false)\n        //     - Bỏ cờ isFlag để có thể được tổng hợp lại\n        Collect(\n            col_ResetInventoryDetailIDs,\n            {\n                ID: selected.IDInventoryDetails,\n                IsSummarized: false,\n                isFlag: false\n            }\n        )\n    )\n);\n\n\n// ============================================================\n// 4. Ghi dữ liệu lên SharePoint\n//    Bulk update IsSummarized = false (2 calls cố định,\n//    chạy song song thay vì Patch từng record)\n// ============================================================\nConcurrent(\n    Patch('QLK List Stock Count Details', col_ResetStockCountIDs),\n    Patch('QLK List Inventory Details', col_ResetInventoryDetailIDs)\n);\n\n\n// ============================================================\n// 5. Xóa các dòng cần kiểm lại khỏi bảng tổng hợp Variance\n//    (chỉ xóa những dòng NeedRecount = true)\n// ============================================================\nRemove(\n    'QLK List Stock Count Variance',\n    Filter(col_SelectedItems, NeedRecount)\n);\n\n\n// ============================================================\n// 6. Dọn dẹp sau khi hoàn tất\n// ============================================================\nUpdateContext({varShowPopupProcessing: false});   // Ẩn loading\nClear(col_SelectedItems);                         // Xóa danh sách đã chọn"
                  varLabel: ="Bạn có chắc muốn yêu cầu người kiểm kê kiểm lại phiếu này không?"
                  varTitle: ="Yêu cầu kiểm lại"
      - con_PopupGuiDuyetDanhMucChenhLech:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowPopupSubmitDifferenceApproval
            Width: =Parent.Width
          Children:
            - DialogAlertGuiDuyetDanhMucChenhLech:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowPopupSubmitDifferenceApproval:false})
                  varConfirmDialogAction: |
                    =// Tắt popup xác nhận, hiện loading
                    UpdateContext({varShowPopupSubmitDifferenceApproval: false});
                    UpdateContext({varShowPopupProcessing: true});

                    // Xóa collection trước khi build để tránh dữ liệu cũ
                    Clear(col_UpdateStockCountVariance);
                    // Lấy các dòng được chọn có NeedRecount = false → cập nhật StatusCode sang bước tiếp theo
                    ForAll(
                        col_SelectedItems As selected,
                        Collect(
                            col_UpdateStockCountVariance,
                            {
                                ID:         selected.ID,
                                StatusCode: "PENDING"   // Trạng thái bước 2 trong workflow
                            }
                        );

                    );

                    // Bulk update 1 lần thay vì patch từng record
                    Patch('QLK List Stock Count Variance', col_UpdateStockCountVariance);

                    //send mail 
                    'QLK|SendVarianceApprovalNotification'.Run(varUserInPlant.PlantCode,varUserInPlant.PlantName,"",Text(dp_FilterNgayKiemNXTDanhMucChenhLech.SelectedDate, "yyyy-mm-dd"));

                    // Ẩn loading sau khi hoàn tất
                    UpdateContext({varShowPopupProcessing: false});

                    Clear(col_SelectedItems);
                  varLabel: ="Bạn có chắc chắn muốn gửi duyệt danh mục chênh lệch này không?"
                  varTitle: ="Xác nhận gửi duyệt"
      - con_PopupDuyetDanhMucChenhLech:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowPopupApproveDifference
            Width: =Parent.Width
          Children:
            - DialogAlertDuyetDanhMucChenhLech:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowPopupApproveDifference:false})
                  varConfirmDialogAction: |-
                    =// ── Đóng popup xác nhận, hiện popup loading ──────────────────────────────────
                    UpdateContext({varShowPopupApproveDifference: false});
                    UpdateContext({varShowPopupProcessing: true});


                    // ── Chuẩn bị collection payload để bulk update Variance ──────────────────────
                    Concurrent(
                        Clear(col_UpdateStockCountVariance),   // Xóa dữ liệu cũ trước khi build lại
                        Clear(col_UpdateItemsInventoryDetail),
                        Clear(col_updateStatusInventory),
                        Clear(col_updateStatusInventoryDistinct)
                    );


                    // Chỉ duyệt các dòng KHÔNG cần kiểm lại (NeedRecount = false)
                    // → chuyển StatusCode sang "Đã phê duyệt"
                    ForAll(
                        col_SelectedItems As selected,
                        Concurrent(
                            Collect(
                                col_UpdateStockCountVariance,
                                {
                                    ID: selected.ID,
                                    StatusCode: "APPROVED"
                                }
                            ),
                            Collect(
                                col_updateStatusInventory,
                                {
                                    ID: selected.IDInventory
                                }
                            )
                        )
                    );


                    // Gom TẤT CẢ mã đã kiểm kê trong ngày (kể cả không chênh lệch)
                    // Dùng ForAll qua distinct dates → delegatable (không dùng "in" với local collection)
                    ClearCollect(col_ApprovalDates, Distinct(col_SelectedItems, StockCountDate));
                    ForAll(
                        col_ApprovalDates As dt,
                        ForAll(
                            Filter(
                                'QLK List Stock Count Variance',
                                PlantCode = varUserInPlant.PlantCode,
                                StockCountDate = dt.Value
                            ) As selected,
                            Collect(
                                col_UpdateItemsInventoryDetail,
                                {
                                    ID: Value(selected.IDInventoryDetails),
                                    ActualQty: selected.ActualQty,
                                    IsDateVarianceChecked: true,
                                    PlantCode: selected.PlantCode,
                                    InventoryDate: selected.StockCountDate,
                                    ProductCategoryCode: selected.ProductTypeCode,
                                    SAPCode: selected.SAPCode,
                                    BookQty: selected.BookQty,
                                    Explanation: Coalesce(selected.Explanation, "")
                                }
                            )
                        )
                    );


                    ClearCollect(
                        col_DistinctInventory,
                        Distinct(col_updateStatusInventory, ID)
                    );


                    ForAll(
                        col_DistinctInventory As item,
                        Collect(
                            col_updateStatusInventoryDistinct,
                            {
                                ID: item.Value,
                                IsSubmittedForApproval: true
                            }
                        )
                    );


                    // ── Ghi dữ liệu lên SharePoint ────────────────────────────────────────────────
                    // Bulk update 1 lần thay vì Patch từng record → giảm số lệnh gọi SharePoint
                    Concurrent(
                        Patch('QLK List Stock Count Variance', col_UpdateStockCountVariance),
                        Patch('QLK List Inventory', col_updateStatusInventoryDistinct)
                    );

                    // ── Cập nhật tồn kho (Inventory Details) qua flow 'QLK | Update Inventory Details on Variance Approved' ──
                    // Flow nhận: JSON các dòng đã duyệt (ID chi tiết tồn, ActualQty, BookQty, Explanation...), PlantCode, ProductCategoryCode.
                    // Flow sẽ: ghi ActualQty/OpeningQty/DayDiffQty/MonthDiffQty/Reason cho từng dòng,
                    //          tính cờ isSent + IsSubmittedForApproval cho phiếu tồn (QLK List Inventory),
                    //          đặt isAction = true cho các dòng chưa kiểm lại (IsDateVarianceChecked = false).
                    // Lưu ý: bước Patch SharePoint phía trên chạy TRƯỚC flow → nếu flow lỗi, dữ liệu duyệt đã ghi nhưng tồn kho chưa cập nhật → phải báo lỗi cho người dùng.
                    // Flow có Response_OK / Response_Error ({ status, message }). Sau khi refresh flow trong Studio có thể đọc _result.status; hiện dựa vào IfError.
                    IfError(
                        'QLK|UpdateInventoryDetailsonVarianceApproved'.Run(
                            JSON(col_UpdateItemsInventoryDetail),
                            varUserInPlant.PlantCode,
                            varUserInPlant.ProductCategoryCode
                        ),
                        Notify("Đã duyệt nhưng cập nhật tồn kho không thành công: " & FirstError.Message, NotificationType.Error, 5000)
                    );


                    // ── Dọn dẹp sau khi hoàn tất ──────────────────────────────────────────────────
                    UpdateContext({varShowPopupProcessing: false});   // Ẩn loading
                    Clear(col_SelectedItems);                         // Xóa danh sách đã chọn
                  varLabel: ="Bạn có chắc chắn muốn duyệt danh mục chênh lệch này không?"
                  varTitle: ="Xác nhận duyệt"
      - con_PopupSendDanhMucChenhLechXNT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =con_PopupConfirmSubmitXNT
            Width: =Parent.Width
          Children:
            - DialogAlertSendDanhMucChenhLech_1:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({con_PopupConfirmSubmitXNT:false})
                  varConfirmDialogAction: |-
                    =// ============================================================
                    // 1. Tắt popup xác nhận, hiện popup loading
                    // ============================================================
                    UpdateContext({con_PopupConfirmSubmitXNT: false});
                    UpdateContext({varShowPopupProcessing: true});


                    // ============================================================
                    // 2. Khởi tạo collection (xóa sạch dữ liệu của lần chạy trước)
                    //    - col_ResetInventoryDetailIDs : payload cho 'QLK List Inventory Details'
                    //    - col_RawInventoryIDs         : ID Inventory cha (có thể trùng)
                    //    - col_InventoryParentIDs      : ID Inventory cha đã loại trùng → payload cho 'QLK List Inventory'
                    //    - col_ResetStockCountIDs      : payload cho 'QLK List Stock Count Details'
                    // ============================================================
                    Clear(col_ResetInventoryDetailIDs);
                    Clear(col_RawInventoryIDs);
                    Clear(col_InventoryParentIDs);
                    Clear(col_ResetStockCountIDs);


                    // ============================================================
                    // 3. Tách ID chi tiết + ID cha
                    //    Chỉ xử lý các dòng được chọn có NeedRecount = true
                    // ============================================================
                    ForAll(
                        Filter(col_SelectedItems, NeedRecount) As selected,

                        // 3.1 Payload reset Inventory Details: bỏ đánh dấu đã tổng hợp
                        //     (bỏ qua dòng không có ID, tránh Patch tạo nhầm bản ghi mới)
                        If(
                            !IsBlank(selected.IDInventoryDetails),
                            Collect(
                                col_ResetInventoryDetailIDs,
                                {
                                    ID: Value(selected.IDInventoryDetails),
                                    IsSummarized: false,
                                    isFlag: false
                                }
                            )
                        );

                        // 3.2 Gom ID Inventory cha: đưa StatusCode về bước đầu của workflow
                        If(
                            !IsBlank(selected.IDInventory),
                            Collect(
                                col_RawInventoryIDs,
                                {
                                    ID: Value(selected.IDInventory),
                                    StatusCode: "DRAFT"
                                }
                            )
                        );

                        // 3.3 Tách ID kiểm kê từ chuỗi "id1;id2;id3" (dấu phân cách là ";")
                        //     bỏ qua giá trị rỗng, rồi reset IsSummarized = false
                        ForAll(
                            Split(selected.IDStockCountDetails, ";") As idItem,
                            If(
                                !IsBlank(Trim(idItem.Value)),
                                Collect(
                                    col_ResetStockCountIDs,
                                    {
                                        ID: Value(Trim(idItem.Value)),
                                        IsSummarized: false
                                    }
                                )
                            )
                        )
                    );

                    // 3.4 Loại trùng ID Inventory cha (nhiều dòng chọn có thể cùng 1 Inventory)
                    ClearCollect(
                        col_InventoryParentIDs,
                        DropColumns(
                            GroupBy(col_RawInventoryIDs, ID, StatusCode, grp),
                            grp
                        )
                    );


                    // ============================================================
                    // 4. Ghi lên SharePoint rồi mới xóa dòng Variance
                    //    Bất kỳ bước ghi nào lỗi → dừng, KHÔNG xóa dòng Variance
                    //    (giữ nguyên dữ liệu để người dùng bấm lại)
                    // ============================================================
                    IfError(
                        If(!IsEmpty(col_ResetInventoryDetailIDs), Patch('QLK List Inventory Details', col_ResetInventoryDetailIDs));
                        If(!IsEmpty(col_ResetStockCountIDs),      Patch('QLK List Stock Count Details', col_ResetStockCountIDs));
                        If(!IsEmpty(col_InventoryParentIDs),      Patch('QLK List Inventory', col_InventoryParentIDs));

                        // Xóa các dòng cần kiểm lại khỏi bảng tổng hợp Variance
                        Remove(
                            'QLK List Stock Count Variance',
                            Filter(col_SelectedItems, NeedRecount)
                        );

                        Notify("Đã yêu cầu kiểm lại " & CountRows(Filter(col_SelectedItems, NeedRecount)) & " dòng", NotificationType.Success, 2000),

                        Notify("Yêu cầu kiểm lại không thành công: " & FirstError.Message, NotificationType.Error, 3000)
                    );


                    // ============================================================
                    // 5. Dọn dẹp sau khi hoàn tất (thành công hoặc lỗi)
                    // ============================================================
                    UpdateContext({varShowPopupProcessing: false});   // Ẩn loading
                    Clear(col_SelectedItems);                         // Xóa danh sách đã chọn
                  varLabel: ="Bạn có chắc muốn yêu cầu kiểm lại phiếu này không?"
                  varTitle: ="Yêu cầu kiểm lại"
