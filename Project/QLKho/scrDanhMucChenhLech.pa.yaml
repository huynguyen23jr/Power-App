Screens:
  scrDanhMucChenhLech:
    Properties:
      OnVisible: |-
        =Clear(col_SelectedItems);
        varShowMenuUser && scrDanhMucChenhLech.Size <> 1;
        Reset(tab_CLN)
    Children:
      - con_MainNXTDanhMucChenhLech:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuNXTDanhMucChenhLech:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrDanhMucChenhLech.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarNXTDanhMucChenhLech:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainNXTDanhMucChenhLech:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderNXTDanhMucChenhLech:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderNXTDanhMucChenhLech:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrDanhMucChenhLech.Size
                  - con_BodyNXTDanhMucChenhLech:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderNXTDanhMucChenhLech.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentNXTDanhMucChenhLech:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrDanhMucChenhLech.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_FormButtonMobile_DanhMucChenhLech:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrDanhMucChenhLech.Size = 1
                                    Width: =Parent.Width - 10
                                  Children:
                                    - lbl_MobileActionPos_DanhMucChenhLech:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(6), Switch(Value, 1, btn_ThemDanhMucChenhLech.Visible, 2, btn_RefreshNXTDanhMucChenhLech.Visible, 3, btn_KiemLaiDanhMucChenhLech.Visible, 4, btn_KiemLaiDanhMucChenhLech_1.Visible, 5, btn_GuiDuyetDanhMucChenhLech.Visible, 6, btn_DuyetDanhMucChenhLech.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_DanhMucChenhLech:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_DanhMucChenhLech.Text), 0, CountRows(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_DanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ","), 1), 1)).Value), 1, "Add", 2, "ArrowSync", 3, "ArrowUndo", 4, "ArrowUndo", 5, "Send", 6, "Send", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ","), 1), 1)).Value),
                                                1, Select(btn_ThemDanhMucChenhLech),
                                                2, Select(btn_RefreshNXTDanhMucChenhLech),
                                                3, Select(btn_KiemLaiDanhMucChenhLech),
                                                4, Select(btn_KiemLaiDanhMucChenhLech_1),
                                                5, Select(btn_GuiDuyetDanhMucChenhLech),
                                                6, Select(btn_DuyetDanhMucChenhLech)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ","), 1), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Kiểm lại XNT", 4, "Kiểm kê lại", 5, "Gửi duyệt", 6, "Duyệt", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ","), 1), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Kiểm lại XNT", 4, "Kiểm kê lại", 5, "Gửi duyệt", 6, "Duyệt", "")
                                          Visible: =Value(lbl_MobileActionCount_DanhMucChenhLech.Text) >= 1
                                    - btn_MobileAction2_DanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ","), 2), 1)).Value), 1, "Add", 2, "ArrowSync", 3, "ArrowUndo", 4, "ArrowUndo", 5, "Send", 6, "Send", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ","), 2), 1)).Value),
                                                1, Select(btn_ThemDanhMucChenhLech),
                                                2, Select(btn_RefreshNXTDanhMucChenhLech),
                                                3, Select(btn_KiemLaiDanhMucChenhLech),
                                                4, Select(btn_KiemLaiDanhMucChenhLech_1),
                                                5, Select(btn_GuiDuyetDanhMucChenhLech),
                                                6, Select(btn_DuyetDanhMucChenhLech)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ","), 2), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Kiểm lại XNT", 4, "Kiểm kê lại", 5, "Gửi duyệt", 6, "Duyệt", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_DanhMucChenhLech.Text, ","), 2), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Kiểm lại XNT", 4, "Kiểm kê lại", 5, "Gửi duyệt", 6, "Duyệt", "")
                                          Visible: =Value(lbl_MobileActionCount_DanhMucChenhLech.Text) >= 2
                                    - btn_MobileMore_DanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_DanhMucChenhLech: !varShowMoreActionsMobile_DanhMucChenhLech})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_DanhMucChenhLech.Text) >= 3
                                          Width: =40
                              - con_ActionHeaderNXTDanhMucChenhLech:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =42
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    Visible: =scrDanhMucChenhLech.Size <> 1
                                  Children:
                                    - btn_ThemDanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(200, 60, 60, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =UpdateContext({varShowChenhLechNgay :true});
                                            Reset(dp_CLNNgay);
                                            Reset(cbx_CLNLoaiSP);
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                          Visible: =varUserInPlant.Role = "VHSX_HO" || varUserInPlant.Role = "FG_SUP"
                                          Width: =90
                                    - btn_RefreshNXTDanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: |-
                                            =Refresh('QLK List Stock Count Variance');
                                            Refresh('QLK List Production Receipt Details');
                                            Refresh('QLK List Issue Detail');
                                            Refresh('QLK List Stock Count Details');
                                            Refresh('QLK List Inventory Details');
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                                    - btn_KiemLaiDanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(200, 60, 60, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowUndo"
                                          OnSelect: =UpdateContext({con_PopupConfirmSubmitXNT:true})
                                          Size: =fxFontSizeMD
                                          Text: ="Kiểm lại XNT"
                                          Visible: |
                                            =CountRows(Filter(col_SelectedItems,NeedRecount,StatusCode = "DRAFT")) > 0
                                          Width: =140
                                    - btn_KiemLaiDanhMucChenhLech_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(200, 60, 60, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowUndo"
                                          OnSelect: =UpdateContext({con_PopupConfirmSubmit:true})
                                          Size: =fxFontSizeMD
                                          Text: ="Kiểm kê lại"
                                          Visible: =CountRows(Filter(col_SelectedItems,NeedRecount,StatusCode = "DRAFT")) > 0
                                          Width: =140
                                    - btn_GuiDuyetDanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(200, 60, 60, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Send"
                                          OnSelect: =UpdateContext({varShowPopupSubmitDifferenceApproval:true})
                                          Size: =fxFontSizeMD
                                          Text: ="Gửi duyệt"
                                          Visible: |-
                                            =!IsBlank(dp_FilterNgayKiemNXTDanhMucChenhLech.SelectedDate) &&
                                            scrDanhMucChenhLech.Size <> 1 &&
                                            !IsBlank(
                                                LookUp(
                                                    'QLK List Stock Count Variance',
                                                    PlantCode      = varUserInPlant.PlantCode &&
                                                    StockCountDate = dp_FilterNgayKiemNXTDanhMucChenhLech.SelectedDate &&
                                                    StatusCode     = "DRAFT"
                                                )
                                            )
                                          Width: =120
                                    - btn_DuyetDanhMucChenhLech:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(200, 60, 60, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Send"
                                          OnSelect: =UpdateContext({varShowPopupApproveDifference:true})
                                          Size: =fxFontSizeMD
                                          Text: ="Duyệt"
                                          Visible: |-
                                            =// Kiểm tra có dòng nào đang ở trạng thái "chờ phê duyệt" không
                                            CountRows(Filter(col_SelectedItems, StatusCode = "DRAFT")) > 0
                                          Width: =120
                              - lbl_TitleNXTDanhMucChenhLech:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Sai lệch ngày"
                              - con_FilterNXTDanhMucChenhLech:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    BorderThickness: =If(scrDanhMucChenhLech.Size = 1, 1, 0)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(scrDanhMucChenhLech.Size = 1, RGBA(248, 250, 252, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =0
                                    Height: =If(scrDanhMucChenhLech.Size = 1, If(varShowFilterKCL, 288, 96), 45)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =If(scrDanhMucChenhLech.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutGap: =If(scrDanhMucChenhLech.Size = 1, 4, 0)
                                    PaddingBottom: =If(scrDanhMucChenhLech.Size = 1, 8, 0)
                                    PaddingLeft: =If(scrDanhMucChenhLech.Size = 1, 8, 0)
                                    PaddingRight: =If(scrDanhMucChenhLech.Size = 1, 8, 0)
                                    PaddingTop: =If(scrDanhMucChenhLech.Size = 1, 8, 0)
                                    RadiusBottomLeft: =If(scrDanhMucChenhLech.Size = 1, 8, 4)
                                    RadiusBottomRight: =If(scrDanhMucChenhLech.Size = 1, 8, 4)
                                    RadiusTopLeft: =If(scrDanhMucChenhLech.Size = 1, 8, 4)
                                    RadiusTopRight: =If(scrDanhMucChenhLech.Size = 1, 8, 4)
                                  Children:
                                    - con_Row1_NXTDanhMucChenhLech:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          Visible: =scrDanhMucChenhLech.Size <> 1
                                          Width: =If(scrDanhMucChenhLech.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 260)
                                        Children:
                                          - dp_FilterNgayKiemNXTDanhMucChenhLech:
                                              Control: ModernDatePicker
                                              Properties:
                                                BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                DefaultDate: =Today()
                                                Font: =fxFontFamily
                                                FontWeight: =FontWeight.Normal
                                                Format: =DatePickerFormat.Short
                                                Size: =fxFontSizeMD
                                                Width: =If(scrDanhMucChenhLech.Size = 1, (Parent.Width - Parent.LayoutGap) / 2, 120)
                                          - cmb_FilterLoaiHangNXTDanhMucChenhLech:
                                              Control: ModernCombobox
                                              Properties:
                                                BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                Font: =fxFontFamily
                                                InputTextPlaceholder: ="Loại hàng..."
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.ProductTypeNameVI
                                                Items: =col_ProductTypes
                                                SelectMultiple: =false
                                                Size: =fxFontSizeMD
                                                Width: =If(scrDanhMucChenhLech.Size = 1, (Parent.Width - Parent.LayoutGap) / 2, 130)
                                    - con_Row2_NXTDanhMucChenhLech:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          FillPortions: =If(scrDanhMucChenhLech.Size = 1, 0, 1)
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          Visible: =scrDanhMucChenhLech.Size <> 1
                                          Width: =If(scrDanhMucChenhLech.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 400)
                                        Children:
                                          - txt_SearchNXTDanhMucChenhLech:
                                              Control: ModernTextInput
                                              Properties:
                                                BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                LayoutMinWidth: =16
                                                Placeholder: ="Tìm mã SAP..."
                                          - cbo_FilterStatusKiemKho_3:
                                              Control: ModernCombobox
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightNormal
                                                InputTextPlaceholder: ="Tất cả"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.StatusNameVI
                                                Items: =Filter(col_WorkflowStatus, StatusCode = "DRAFT" || StatusCode = "APPROVED")
                                                SelectMultiple: =false
                                                Width: =If(scrDanhMucChenhLech.Size = 1, 100, 120)
                                          - Button1_3:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =If(scrDanhMucChenhLech.Size = 1, ButtonAppearance.Outline, ButtonAppearance.Transparent)
                                                Icon: ="Eraser"
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                OnSelect: |-
                                                  =Reset(cmb_FilterLoaiHangNXTDanhMucChenhLech);
                                                  Reset(txt_SearchNXTDanhMucChenhLech);
                                                  Reset(cbo_FilterStatusKiemKho_3);
                                                Text: =
                                                Width: =40
                                    - con_FilterMobKCL:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =If(varShowFilterKCL, 272, 80)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Visible: =scrDanhMucChenhLech.Size = 1
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                        Children:
                                          - con_FilterHeadKCL:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =56
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =10
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                              Children:
                                                - btn_FilterIconKCL:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Icon: ="Filter"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext({varShowFilterKCL: !varShowFilterKCL})
                                                      Width: =32
                                                - con_FilterHeadTextKCL:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =56
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutJustifyContent: =LayoutJustifyContent.Center
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - lbl_FilterTitleKCL:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Height: =28
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeMD
                                                            Text: ="Bộ lọc" & If((If(!IsBlank(dp_FilterNgayMobKCL.SelectedDate), 1, 0) + If(!IsBlank(cmb_FilterLoaiMobKCL.Selected), 1, 0) + If(!IsBlank(txt_SearchMobKCL.Text), 1, 0) + If(!IsBlank(cbo_StatusMobKCL.Selected), 1, 0)) > 0, " (" & (If(!IsBlank(dp_FilterNgayMobKCL.SelectedDate), 1, 0) + If(!IsBlank(cmb_FilterLoaiMobKCL.Selected), 1, 0) + If(!IsBlank(txt_SearchMobKCL.Text), 1, 0) + If(!IsBlank(cbo_StatusMobKCL.Selected), 1, 0)) & ")", "")
                                                            Wrap: =false
                                                      - lbl_FilterSummaryKCL:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =RGBA(107, 114, 128, 1)
                                                            Font: =fxFontFamily
                                                            Height: =22
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeXS
                                                            Text: |-
                                                              ="Ngày: " & If(IsBlank(dp_FilterNgayMobKCL.SelectedDate), "-", Text(dp_FilterNgayMobKCL.SelectedDate, "mm/dd/yyyy")) & "  •  Loại hàng: " & Coalesce(cmb_FilterLoaiMobKCL.Selected.ProductTypeNameVI, "Tất cả") & "  •  Mã SAP: " & If(IsBlank(txt_SearchMobKCL.Text), "-", txt_SearchMobKCL.Text) & "  •  Trạng thái: " & Coalesce(cbo_StatusMobKCL.Selected.StatusNameVI, "Tất cả")
                                                            Wrap: =false
                                                - btn_FilterToggleKCL:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Height: =36
