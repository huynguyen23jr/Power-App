Screens:
  scrAgingStockCount:
    Properties:
      OnVisible: =Clear(col_SelectedAgingStockCount)
    Children:
      - con_MainAgingStockCount:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuAgingStockCount:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrAgingStockCount.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarAgingStockCount:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainAgingStockCount:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderAgingStockCount:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderAgingStockCount:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrAgingStockCount.Size
                  - con_BodyAgingStockCount:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderAgingStockCount.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentAgingStockCount:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrAgingStockCount.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_FormButtonMobile_AgingStockCount:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrAgingStockCount.Size = 1
                                    Width: =Parent.Width - 10
                                  Children:
                                    - lbl_MobileActionPos_AgingStockCount:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(3), Switch(Value, 1, btn_AddNewNXT_1.Visible, 2, btn_RefreshAgingStockCount.Visible, 3, btn_DeleteAgingStockCount.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_AgingStockCount:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_AgingStockCount.Text), 0, CountRows(Split(lbl_MobileActionPos_AgingStockCount.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_AgingStockCount:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_AgingStockCount.Text, ","), 1), 1)).Value), 1, "Add", 2, "ArrowSync", 3, "Delete", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_AgingStockCount.Text, ","), 1), 1)).Value),
                                                1, Select(btn_AddNewNXT_1),
                                                2, Select(btn_RefreshAgingStockCount),
                                                3, Select(btn_DeleteAgingStockCount)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_AgingStockCount.Text, ","), 1), 1)).Value), 1, "Thêm mới", 2, "Làm mới", 3, "Xóa", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_AgingStockCount.Text, ","), 1), 1)).Value), 1, "Thêm mới", 2, "Làm mới", 3, "Xóa", "")
                                          Visible: =Value(lbl_MobileActionCount_AgingStockCount.Text) >= 1
                                    - btn_MobileAction2_AgingStockCount:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_AgingStockCount.Text, ","), 2), 1)).Value), 1, "Add", 2, "ArrowSync", 3, "Delete", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_AgingStockCount.Text, ","), 2), 1)).Value),
                                                1, Select(btn_AddNewNXT_1),
                                                2, Select(btn_RefreshAgingStockCount),
                                                3, Select(btn_DeleteAgingStockCount)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_AgingStockCount.Text, ","), 2), 1)).Value), 1, "Thêm mới", 2, "Làm mới", 3, "Xóa", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_AgingStockCount.Text, ","), 2), 1)).Value), 1, "Thêm mới", 2, "Làm mới", 3, "Xóa", "")
                                          Visible: =Value(lbl_MobileActionCount_AgingStockCount.Text) >= 2
                                    - btn_MobileMore_AgingStockCount:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_AgingStockCount: !varShowMoreActionsMobile_AgingStockCount})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_AgingStockCount.Text) >= 3
                                          Width: =40
                              - con_ActionHeaderAgingStockCount:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    Visible: =scrAgingStockCount.Size <> 1
                                  Children:
                                    - btn_AddNewNXT_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =// Reset form và clear dữ liệu cũ song song trước khi chuyển màn hình
                                            Set(varAgingStockCountDetail,{});

                                            Reset(cmb_AgingStockCountForm_SAPCode);
                                                                Reset(dp_AgingStockCountForm_ProductionDate);
                                                                Reset(num_AgingStockCountForm_ActualQty);
                                                                Reset(txt_AgingStockCountForm_AgingDays);
                                                                Reset(txt_AgingStockCountForm_Reason);
                                                                Reset(txt_AgingStockCountForm_Note);

                                            // Chuyển sang màn hình form chi tiết NXT
                                            Navigate(scrAgingStockCountForm, ScreenTransition.CoverRight)
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm mới"
                                          Visible: =varUserInPlant.Role = "FG_WH"
                                          Width: =120
                                    - btn_RefreshAgingStockCount:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: =Refresh('QLK List Aging Stock Count')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                                    - btn_DeleteAgingStockCount:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Delete"
                                          OnSelect: |-
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xóa " & CountRows(col_SelectedAgingStockCount) & " bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận xóa",
                                                        Subtitle: "Hành động này không thể hoàn tác.",
                                                        ConfirmButton: "Xóa",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),
                                                IfError(
                                                    // Đếm trên collection cục bộ; đủ dữ liệu và dưới 500 dòng mới dùng nhánh xóa theo phạm vi.
                                                    ClearCollect(col_DeleteScopeAging, Filter('QLK List Aging Stock Count', PlantCode = varUserInPlant.PlantCode));
                                                    If(
                                                        // Chọn hết, không tìm kiếm và không lọc ngày.
                                                        CountRows(col_SelectedAgingStockCount) = CountRows(gal_AgingStockCount.AllItems) &&
                                                        IsBlank(txt_SearchAgingStockCount.Text) &&
                                                        IsBlank(dp_FilterNgayKiemNXTDanhMucChenhLech_1.SelectedDate) &&
                                                        CountRows(col_SelectedAgingStockCount) = CountRows(col_DeleteScopeAging) &&
                                                        CountRows(Filter(col_DeleteScopeAging, !(ID in col_SelectedAgingStockCount.ID))) = 0 &&
                                                        CountRows(col_SelectedAgingStockCount) > 0 && CountRows(col_DeleteScopeAging) < 500,
                                                        RemoveIf('QLK List Aging Stock Count', PlantCode = varUserInPlant.PlantCode),
                                                        // Chọn một phần → giữ xóa theo ID, không bỏ sót dòng ngoài giới hạn collection
                                                        ForAll(col_SelectedAgingStockCount As item, Remove('QLK List Aging Stock Count', LookUp('QLK List Aging Stock Count', ID = item.ID)))
                                                    ),
                                                    Notify("Xóa không thành công", NotificationType.Error, 2000),
                                                    Clear(col_SelectedAgingStockCount);
                                                    Refresh('QLK List Aging Stock Count');
                                                    Notify("Đã xóa thành công.", NotificationType.Success, 2000)
                                                )
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xóa"
                                          Visible: =CountRows(col_SelectedAgingStockCount) > 0
                                          Width: =120
                              - lbl_TitleAgingStockCount:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Quá hạn lưu kho"
                              - con_FilterAgingStockCount:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(scrAgingStockCount.Size = 1, If(varShowFilterKAG, 288, 96), 45)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - con_SearchAgingStockCount:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          Height: =35
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          Visible: =scrAgingStockCount.Size <> 1
                                        Children:
                                          - dp_FilterNgayKiemNXTDanhMucChenhLech_1:
                                              Control: ModernDatePicker
                                              Properties:
                                                BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                DefaultDate: =Today()
                                                Font: =fxFontFamily
                                                FontWeight: =FontWeight.Normal
                                                Format: =DatePickerFormat.Short
                                                Size: =fxFontSizeMD
                                                Width: =160
                                          - txt_SearchAgingStockCount:
                                              Control: ModernTextInput
                                              Properties:
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                LayoutMinWidth: =16
                                                Placeholder: ="Tìm kiếm ...."
                                    - con_FilterActionsAgingStockCount:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =35
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          Visible: =scrAgingStockCount.Size <> 1
                                          Width: =btn_ClearFilterNXT_1.Width   + 10
                                        Children:
                                          - btn_ClearFilterNXT_1:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =ButtonAppearance.Outline
                                                BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                Font: =fxFontFamily
                                                Icon: ="Eraser"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =Reset(txt_SearchAgingStockCount);
                                                  Reset(dp_FilterNgayKiemNXTDanhMucChenhLech_1)
                                                Text: =
                                                Width: =40
                                          - btn_FilterAgingStockCount:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =ButtonAppearance.Outline
                                                BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                Font: =fxFontFamily
                                                Icon: ="Filter"
                                                OnSelect: |-
                                                  =UpdateContext({varPopUpFilterAgingStockCount: true})
                                                Text: ="Bộ lọc"
                                                Visible: =false
                                                Width: =110
                                    - con_FilterMobKAG:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =If(varShowFilterKAG, 272, 80)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Visible: =scrAgingStockCount.Size = 1
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                        Children:
                                          - con_FilterHeadKAG:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =56
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =10
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                              Children:
                                                - btn_FilterIconKAG:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Icon: ="Filter"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext({varShowFilterKAG: !varShowFilterKAG})
                                                      Width: =32
                                                - con_FilterHeadTextKAG:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =56
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutJustifyContent: =LayoutJustifyContent.Center
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - lbl_FilterTitleKAG:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Height: =28
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeMD
                                                            Text: ="Bộ lọc" & If((If(!IsBlank(dp_FilterNgayMobKAG.SelectedDate), 1, 0) + If(!IsBlank(txt_SearchMobKAG.Text), 1, 0)) > 0, " (" & (If(!IsBlank(dp_FilterNgayMobKAG.SelectedDate), 1, 0) + If(!IsBlank(txt_SearchMobKAG.Text), 1, 0)) & ")", "")
                                                            Wrap: =false
                                                      - lbl_FilterSummaryKAG:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =RGBA(107, 114, 128, 1)
                                                            Font: =fxFontFamily
                                                            Height: =22
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeXS
                                                            Text: |-
                                                              ="Ngày: " & If(IsBlank(dp_FilterNgayMobKAG.SelectedDate), "-", Text(dp_FilterNgayMobKAG.SelectedDate, "mm/dd/yyyy")) & "  •  Mã SAP: " & If(IsBlank(txt_SearchMobKAG.Text), "-", txt_SearchMobKAG.Text)
                                                            Wrap: =false
                                                - btn_FilterToggleKAG:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Height: =36
                                                      Icon: =If(varShowFilterKAG, "ChevronUp", "ChevronDown")
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext({varShowFilterKAG: !varShowFilterKAG})
                                                      Width: =36
                                          - con_FilterBodyKAG:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =184
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =8
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                Visible: =varShowFilterKAG
                                              Children:
                                                - con_FldDateKAG:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =64
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - lbl_FldDateKAG:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =24
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeSM
                                                            Text: ="Ngày kiểm kê"
                                                      - dp_FilterNgayMobKAG:
                                                          Control: ModernDatePicker
                                                          Properties:
                                                            BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                            DefaultDate: =Today()
                                                            Font: =fxFontFamily
                                                            Format: =DatePickerFormat.Short
                                                            Height: =40
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                - con_FldSearchKAG:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =64
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - lbl_FldSearchKAG:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =24
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeSM
                                                            Text: ="Tìm theo mã SAP"
                                                      - txt_SearchMobKAG:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =40
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Placeholder: ="Tìm theo mã SAP ..."
                                                - con_FldBtnRowKAG:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =40
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =10
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - btn_FltClearKAG:
                                                          Control: ModernButton
                                                          Properties:
                                                            Appearance: =ButtonAppearance.Outline
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            Height: =40
                                                            Icon: ="Eraser"
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            OnSelect: |-
                                                              =Reset(dp_FilterNgayMobKAG);
                                                              Reset(txt_SearchMobKAG)
                                                            Text: ="Xóa lọc"
                                                      - btn_FltApplyKAG:
                                                          Control: ModernButton
                                                          Properties:
                                                            BasePaletteColor: =RGBA(46, 125, 50, 1)
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            Height: =40
                                                            Icon: ="Search"
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            OnSelect: |-
                                                              =UpdateContext({varShowFilterKAG: false})
                                                            Text: ="Áp dụng"
                              - con_ListAgingStockCount:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
