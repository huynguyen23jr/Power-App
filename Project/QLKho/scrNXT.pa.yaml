Screens:
  scrNXT:
    Properties:
      OnVisible: =varShowMenuUser && scrNXT.Size <> 1
    Children:
      - con_MainNXT:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuNXT:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrNXT.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarNXT:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainNXT:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderNXT_1:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderNXT:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrNXT.Size
                  - con_BodyNXT:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderNXT_1.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentNXT:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrNXT.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_ActionHeaderNXT:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - btn_AddNewNXT:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =// Reset form và clear dữ liệu cũ song song trước khi chuyển màn hình
                                            Concurrent(
                                                Set(varNXTDetail, {}),          // Xóa phiếu đang chọn
                                                Reset(dp_NXT_InventoryDate),    // Reset ngày về mặc định
                                                Reset(cmb_NXT_ProductCategory)  // Reset loại sản phẩm về mặc định
                                            );

                                            // Chuyển sang màn hình form chi tiết NXT
                                            Navigate(scrNXTForm, ScreenTransition.CoverRight)
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm "
                                          Visible: |-
                                            =varUserInPlant.Role = "FG_WH" ||   // FG_WH         - Thủ kho thành phẩm
                                            varUserInPlant.Role = "VHSX_HO" ||   // VHSX_HO       - VHSX HO
                                            varUserInPlant.Role = "FG_SUP"      // FG_SUP        - Giám sát thành phẩm
                                          Width: =120
                                    - btn_RefreshNXT:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: =Refresh('QLK List Inventory')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                              - lbl_TitleNXT_1:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Nhập xuất tồn"
                              - con_FilterNXT:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    BorderThickness: =If(scrNXT.Size = 1, 1, 0)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(scrNXT.Size = 1, RGBA(248, 250, 252, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =0
                                    Height: =If(scrNXT.Size = 1, If(varShowFilterKNXT, 288, 96), 45)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =If(scrNXT.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                    LayoutGap: =If(scrNXT.Size = 1, 0, 8)
                                    LayoutMinWidth: =10
                                    PaddingBottom: =If(scrNXT.Size = 1, 8, 0)
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =If(scrNXT.Size = 1, 8, 0)
                                    RadiusBottomLeft: =If(scrNXT.Size = 1, 8, 0)
                                    RadiusBottomRight: =If(scrNXT.Size = 1, 8, 0)
                                    RadiusTopLeft: =If(scrNXT.Size = 1, 8, 0)
                                    RadiusTopRight: =If(scrNXT.Size = 1, 8, 0)
                                  Children:
                                    - con_SearchNXT:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Visible: =scrNXT.Size <> 1
                                          Width: |-
                                            =If(
                                                scrNXT.Size = 1,
                                                Parent.Width - Parent.PaddingLeft - Parent.PaddingRight,
                                                Parent.Width - Parent.PaddingLeft - Parent.PaddingRight - Parent.LayoutGap - con_FilterActionsNXT.Width
                                            )
                                        Children:
                                          - txt_SearchNXT:
                                              Control: ModernTextInput
                                              Properties:
                                                Font: =fxFontFamily
                                                LayoutMinWidth: =16
                                                Placeholder: ="Tìm kiếm ...."
                                                Width: =Parent.Width
                                    - con_FilterActionsNXT:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Center
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Visible: =scrNXT.Size <> 1
                                          Width: =If(scrNXT.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, 160 + 36 + 8)
                                        Children:
                                          - cbo_FilterProductTypeNhapTuSanXuat_13:
                                              Control: ModernCombobox
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                                FillPortions: =
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightNormal
                                                InputTextPlaceholder: ="Tất cả"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                Items: =col_ProductCategories
                                                SelectMultiple: =false
                                                Width: =Parent.Width - btn_ClearFilterNXT.Width - Parent.LayoutGap
                                          - btn_ClearFilterNXT:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =ButtonAppearance.Outline
                                                BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                Font: =fxFontFamily
                                                Icon: ="Eraser"
                                                Layout: =ButtonLayout.IconOnly
                                                OnSelect: |-
                                                  =Reset(txt_SearchNXT);
                                                  Reset(cbo_FilterProductTypeNhapTuSanXuat_13)
                                                Text: =
                                                Width: =36
                                    - con_FilterMobKNXT:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =If(varShowFilterKNXT, 272, 80)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Visible: =scrNXT.Size = 1
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                        Children:
                                          - con_FilterHeadKNXT:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =56
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =10
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                              Children:
                                                - btn_FilterIconKNXT:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Icon: ="Filter"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext({varShowFilterKNXT: !varShowFilterKNXT})
                                                      Width: =32
                                                - con_FilterHeadTextKNXT:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =56
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutJustifyContent: =LayoutJustifyContent.Center
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - lbl_FilterTitleKNXT:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Height: =28
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeMD
                                                            Text: ="Bộ lọc" & If((If(!IsBlank(dp_DateMobKNXT.SelectedDate), 1, 0) + If(!IsBlank(cbo_StatusMobKNXT.Selected), 1, 0) + If(!IsBlank(cbo_CategoryMobKNXT.Selected), 1, 0)) > 0, " (" & (If(!IsBlank(dp_DateMobKNXT.SelectedDate), 1, 0) + If(!IsBlank(cbo_StatusMobKNXT.Selected), 1, 0) + If(!IsBlank(cbo_CategoryMobKNXT.Selected), 1, 0)) & ")", "")
                                                            Wrap: =false
                                                      - lbl_FilterSummaryKNXT:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =RGBA(107, 114, 128, 1)
                                                            Font: =fxFontFamily
                                                            Height: =22
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeXS
                                                            Text: |-
                                                              ="Ngày: " & If(IsBlank(dp_DateMobKNXT.SelectedDate), "-", Text(dp_DateMobKNXT.SelectedDate, "mm/dd/yyyy")) & "  •  Trạng thái: " & Coalesce(cbo_StatusMobKNXT.Selected.StatusNameVI, "Tất cả") & "  •  Loại sản phẩm: " & Coalesce(cbo_CategoryMobKNXT.Selected.ProductCategoryNameVI, "Tất cả")
                                                            Wrap: =false
                                                - btn_FilterToggleKNXT:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Height: =36
                                                      Icon: =If(varShowFilterKNXT, "ChevronUp", "ChevronDown")
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext({varShowFilterKNXT: !varShowFilterKNXT})
                                                      Width: =36
                                          - con_FilterBodyKNXT:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =184
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =8
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                                Visible: =varShowFilterKNXT
                                              Children:
                                                - con_FldDateKNXT:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =64
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - lbl_FldDateKNXT:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =24
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeSM
                                                            Text: ="Ngày kiểm"
                                                      - dp_DateMobKNXT:
                                                          Control: ModernDatePicker
                                                          Properties:
                                                            BasePaletteColor: =RGBA(8, 222, 8, 1)
                                                            DefaultDate: =Blank()
                                                            Font: =fxFontFamily
                                                            Format: =DatePickerFormat.Short
                                                            Height: =40
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Placeholder: ="Chọn ngày"
                                                - con_FldComboRowKNXT:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =64
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =10
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - con_FldStatusKNXT:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            Height: =64
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                          Children:
                                                            - lbl_FldStatusKNXT:
                                                                Control: ModernText
                                                                Properties:
                                                                  Font: =fxFontFamily
                                                                  Height: =24
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingTop: =0
                                                                  Size: =fxFontSizeSM
                                                                  Text: ="Trạng thái"
                                                            - cbo_StatusMobKNXT:
                                                                Control: ModernCombobox
                                                                Properties:
                                                                  Font: =fxFontFamily
                                                                  Height: =40
                                                                  InputTextPlaceholder: ="Tất cả trạng thái"
                                                                  IsSearchable: =false
                                                                  ItemDisplayText: =ThisItem.StatusNameVI
                                                                  Items: =col_WorkflowStatus
                                                                  LayoutMinHeight: =16
                                                                  LayoutMinWidth: =16
                                                                  SelectMultiple: =false
                                                      - con_FldCategoryKNXT:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            Height: =64
                                                            LayoutAlignItems: =LayoutAlignItems.Stretch
                                                            LayoutDirection: =LayoutDirection.Vertical
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                          Children:
                                                            - lbl_FldCategoryKNXT:
                                                                Control: ModernText
                                                                Properties:
                                                                  Font: =fxFontFamily
                                                                  Height: =24
                                                                  LayoutMinHeight: =0
                                                                  LayoutMinWidth: =0
                                                                  PaddingBottom: =0
                                                                  PaddingLeft: =0
                                                                  PaddingTop: =0
                                                                  Size: =fxFontSizeSM
                                                                  Text: ="Loại sản phẩm"
                                                            - cbo_CategoryMobKNXT:
                                                                Control: ModernCombobox
                                                                Properties:
                                                                  DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                                                  Font: =fxFontFamily
                                                                  Height: =40
                                                                  InputTextPlaceholder: ="Tất cả"
                                                                  IsSearchable: =false
                                                                  ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                                  Items: =col_ProductCategories
                                                                  LayoutMinHeight: =16
                                                                  LayoutMinWidth: =16
                                                                  SelectMultiple: =false
                                                - con_FldBtnRowKNXT:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =40
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =10
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - btn_FltClearKNXT:
                                                          Control: ModernButton
                                                          Properties:
                                                            Appearance: =ButtonAppearance.Outline
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            Height: =40
                                                            Icon: ="Eraser"
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            OnSelect: |-
                                                              =Reset(dp_DateMobKNXT);
                                                              Reset(cbo_StatusMobKNXT);
                                                              Reset(cbo_CategoryMobKNXT)
                                                            Text: ="Xóa lọc"
                                                      - btn_FltApplyKNXT:
                                                          Control: ModernButton
                                                          Properties:
                                                            BasePaletteColor: =RGBA(46, 125, 50, 1)
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            Height: =40
                                                            Icon: ="Search"
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            OnSelect: |-
                                                              =UpdateContext({varShowFilterKNXT: false})
                                                            Text: ="Áp dụng"
                              - con_ListNXT_1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =If(scrNXT.Size = 1, DropShadow.None, DropShadow.Semibold)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =If(scrNXT.Size = 1, 0, 5)
                                    RadiusTopRight: =6
                                    Width: =Parent.Width - Parent.PaddingLeft * 2
                                  Children:
                                    - con_TableHeaderNXT:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(250, 250, 250, 1)
                                          FillPortions: =0
                                          Height: =46
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Visible: =scrNXT.Size <> 1
                                        Children:
                                          - lbl_HeaderInventoryDateNXT:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ngày nhập tồn"
                                                Wrap: =false
                                          - lbl_HeaderProductCategoryNXT:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Phân loại hàng"
                                                Wrap: =false
                                          - lbl_HeaderStatusCodeNXT:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Trạng thái"
                                                Wrap: =false
                                          - lbl_HeaderActionNXT:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Thao tác"
                                                Width: =72
                                                Wrap: =false
                                    - gal_NXT_1:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =Parent.Height - con_TableHeaderNXT.Height - con_FooterNXT.Height
                                          Items: |-
                                            =// Chỉ lấy các cột đang hiển thị trên danh sách (nhanh hơn)
                                            ShowColumns(
                                                SortByColumns(
                                                    Filter(
                                                        'QLK List Inventory',
                                                        PlantCode = varUserInPlant.PlantCode,
                                                        IsBlank(cbo_FilterProductTypeNhapTuSanXuat_13.Selected) || scrNXT.Size = 1 || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_13.Selected.ProductCategoryCode,
                                                        IsBlank(dp_DateMobKNXT.SelectedDate) || (InventoryDate >= dp_DateMobKNXT.SelectedDate && InventoryDate < DateAdd(dp_DateMobKNXT.SelectedDate, 1, TimeUnit.Days)),
                                                        IsBlank(cbo_StatusMobKNXT.Selected) || StatusCode = cbo_StatusMobKNXT.Selected.StatusCode,
                                                        IsBlank(cbo_CategoryMobKNXT.Selected) || scrNXT.Size <> 1 || ProductCategoryCode = cbo_CategoryMobKNXT.Selected.ProductCategoryCode
                                                    ),
                                                    "InventoryDate",
                                                    SortOrder.Descending,
                                                    "Created",
                                                    SortOrder.Descending
                                                ),
                                                InventoryDate,
                                                ProductCategoryCode,
                                                StatusCode,
                                                ID
                                            )
                                          ShowScrollbar: =false
                                          TemplateSize: |-
                                            =If(
                                                scrNXT.Size = 1,
                                                (12 + 28 + 6 + 22 + 6 + 24 + 6) + 8 + 16 + 5 + 40,
                                                45
                                            )
                                          Width: =Parent.Width
                                        Children:
                                          - con_RowDividerNXT:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(229, 231, 235, 1)
                                                Height: =1
                                                Visible: =scrNXT.Size <> 1
                                                Width: =gal_NXT_1.Width - 10
                                                Y: =gal_NXT_1.TemplateHeight
                                          - con_RowMasterNXT:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(229, 231, 235, 1)
