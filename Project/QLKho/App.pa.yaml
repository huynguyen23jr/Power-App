                      SubMenu: [
                          {
                              ID: 71, Title: "Quá hạn lưu kho", Icon: "Cube", Screen: scrAgingStockCount, Sort: 7.1,
                              Visible: varUserInPlant.Role in [rc9, rc17, rc18, rc2, rc7, rc15, rc6, rc12, rc13, rc1, rc8]
