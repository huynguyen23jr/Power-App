                                    Items: |-
                                      =SortByColumns(
                                          Filter(
                                              'QLK List Density',
                                              IsBlank(txt_SearchDanhMucDensity.Text) ||   StartsWith(CodeSAP, txt_SearchDanhMucDensity.Text) ||   StartsWith(ShortCode, txt_SearchDanhMucDensity.Text),
                                              PlantCode = varUserInPlant.PlantCode
                                          ),
                                          "CodeSAP",
                                          SortOrder.Ascending
                                      )
                                    ShowScrollbar: =false
                                    TemplateSize: =If(scrDanhMucDensity.Size = 1, 3 * 30 + 2 * 4 + 8 + 5 + 45 + 16 + 8, 48)
