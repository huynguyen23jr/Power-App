                                                BorderColor: =RGBA(229, 231, 235, 1)
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(255, 255, 255, 1)
                                                FillPortions: =0
                                                Height: =If(scrDanhMucDensity.Size = 1, gal_DanhMucDensity.TemplateHeight - 8 - 16 - 5 - con_MobileActionDanhMucDensity.Height, 48)
                                                LayoutAlignItems: =If(scrDanhMucDensity.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                LayoutDirection: =If(scrDanhMucDensity.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                LayoutGap: =If(scrDanhMucDensity.Size = 1, 4, 5)
                                                LayoutMinHeight: =If(scrDanhMucDensity.Size = 1, 16, Parent.Height)
                                                PaddingLeft: =If(scrDanhMucDensity.Size = 1, 10, 5)
                                                PaddingRight: =If(scrDanhMucDensity.Size = 1, 10, 5)
                                                PaddingTop: =If(scrDanhMucDensity.Size = 1, 8, 0)
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Width: =If(scrDanhMucDensity.Size = 1, Parent.Width - Parent.PaddingLeft - Parent.PaddingRight, Parent.Width - Parent.PaddingRight * 2 - Parent.LayoutGap - 10)
