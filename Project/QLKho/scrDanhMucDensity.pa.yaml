                                              Properties:
                                                Checked: =ThisItem.ID in col_SelectedDanhMucDensity.ID
                                                Label: =""
                                                OnCheck: =Collect(col_SelectedDanhMucDensity, ThisItem)
                                                OnUncheck: =Remove(col_SelectedDanhMucDensity, ThisItem)
                                                Visible: =scrDanhMucDensity.Size <> 1
                                                Width: =32
                                          - con_RowDanhMucDensity:
