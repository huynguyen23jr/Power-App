                                                            OnSelect: |-
                                                              =If(
                                                                  Confirm(
                                                                      "Bạn có chắc muốn xóa bản ghi này không?",
                                                                      {
                                                                          Title: "Xác nhận xóa",
                                                                          Subtitle: "Hành động này không thể hoàn tác.",
                                                                          ConfirmButton: "Xóa",
                                                                          CancelButton: "Hủy"
                                                                      }
                                                                  ),
                                                                  IfError(
                                                                      Remove('QLK List Density', ThisItem),
                                                                      Notify("Xóa không thành công", NotificationType.Error,2000),
                                                                      Notify("Đã xóa thành công!", NotificationType.Success,2000)
                                                                  )
                                                              )
