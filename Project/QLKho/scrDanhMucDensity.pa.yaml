                                          PaddingBottom: =If(scrDanhMucDensity.Size = 1, 8, 0)
                                          PaddingLeft: =If(scrDanhMucDensity.Size = 1, 8, 5)
                                          PaddingRight: =If(scrDanhMucDensity.Size = 1, 8, 0)
                                          PaddingTop: =If(scrDanhMucDensity.Size = 1, 8, 0)
                                          RadiusBottomLeft: =If(scrDanhMucDensity.Size = 1, 8, 0)
                                          RadiusBottomRight: =If(scrDanhMucDensity.Size = 1, 8, 0)
                                          RadiusTopLeft: =If(scrDanhMucDensity.Size = 1, 8, 0)
                                          RadiusTopRight: =If(scrDanhMucDensity.Size = 1, 8, 0)
                                          Width: =If(scrDanhMucDensity.Size = 1, Parent.Width - 10, Parent.Width)
