                                                            Icon: ="Eye"
                                                            Layout: =ButtonLayout.IconOnly
                                                            OnSelect: |-
                                                              =Set(varDensityDetail, ThisItem);
                                                              Navigate(scrDanhMucDensityForm, ScreenTransition.CoverRight)
                                                            Width: =32
                                                      - btn_DeleteDanhMucDensity:
                                                          Control: ModernButton
                                                          Properties:
                                                            Appearance: =ButtonAppearance.Transparent
                                                            Icon: ="Delete"
