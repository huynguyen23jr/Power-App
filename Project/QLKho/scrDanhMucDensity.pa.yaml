                                          OnCheck: =ClearCollect(col_SelectedDanhMucDensity, gal_DanhMucDensity.AllItems)
                                          OnUncheck: =Clear(col_SelectedDanhMucDensity)
                                          Width: =32
                                    - lbl_HeaderCodeSAPDensity:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeMD
                                          Text: ="Code SAP"
                                          Width: =Parent.Width * 0.3
                                          Wrap: =false
                                    - lbl_HeaderShortCodeDensity:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeMD
                                          Text: ="Code rút gọn"
                                          Width: =Parent.Width * 0.3
                                          Wrap: =false
                                    - lbl_HeaderDensityValue:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeMD
                                          Text: ="Khối lượng riêng"
                                          Width: =Parent.Width * 0.25
                                          Wrap: =false
                                    - lbl_HeaderActionDensity:
                                        Control: ModernText
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeMD
                                          Text: ="Thao tác"
                                          Width: =100
                                          Wrap: =false
