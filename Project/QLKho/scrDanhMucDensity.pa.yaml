                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          BorderStyle: =If(scrDanhMucDensity.Size = 1, BorderStyle.Solid, BorderStyle.None)
                                          BorderThickness: =If(scrDanhMucDensity.Size = 1, 1, 0)
                                          DropShadow: =If(scrDanhMucDensity.Size = 1, DropShadow.Light, DropShadow.None)
                                          Fill: =If(scrDanhMucDensity.Size = 1, RGBA(255, 255, 255, 1), RGBA(0, 0, 0, 0))
