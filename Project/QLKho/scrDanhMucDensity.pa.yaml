                                                      OnSelect: |-
                                                        =Set(varDensityDetail, ThisItem);
                                                        Navigate(scrDanhMucDensityForm, ScreenTransition.CoverRight)
                                                      Size: =14
                                                      Text: ="Xem chi tiết"
                                                      Width: =If(btn_Density_MobileDelete.Visible, (Parent.Width - Parent.LayoutGap) / 2, Parent.Width)
