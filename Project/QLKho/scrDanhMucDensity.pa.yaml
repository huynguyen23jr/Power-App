                                                - lbl_CodeSAPDensity:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Height: =30
                                                      Size: =fxFontSizeMD
                                                      Text: |-
                                                        =If(scrDanhMucDensity.Size = 1, "Code SAP: ", "") & ThisItem.CodeSAP
                                                      Width: =If(scrDanhMucDensity.Size = 1, Parent.Width - 20, lbl_HeaderCodeSAPDensity.Width)
                                                      Wrap: =false
                                                - lbl_ShortCodeDensity:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Height: =30
                                                      Size: =fxFontSizeMD
