Screens:
  srcNhapKhacForm:
    Children:
      - con_MainNhapKhoForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_BodyMenuNhapKhoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =srcNhapKhacForm.Size <> 1
                  Width: |-
                    =If(
                        varShowMenuUser,
                        240,
                        64
                    )
                Children:
                  - cmp_NavSidebarNhapKhoForm:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainNhapKhoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderNhapKhoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderNhapKhoForm:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =srcNhapKhacForm.Size
                  - con_BodyNhapKhoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderNhapKhoForm.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_BodyMainNhapKhoForm:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(250, 250, 251, 1)
                              Height: =Parent.Height
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =If(srcNhapKhacForm.Size = 1, Parent.Width - 10, Parent.Width - 10)
                            Children:
                              - con_FormButtonMobile_NKF:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =srcNhapKhacForm.Size = 1
                                    Width: =Parent.Width - 15
                                  Children:
                                    - btn_BackMobile_NKF:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="ChevronLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Back()
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Width: =40
                                    - lbl_MobileActionPos_NKF:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(2), Switch(Value, 1, btn_SaveNhapKhoForm.Visible, 2, btn_DeleteNhapKhoForm.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_NKF:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_NKF.Text), 0, CountRows(Split(lbl_MobileActionPos_NKF.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_NKF:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_NKF.Text, ","), 1).Value), 0), 1, "Save", 2, "Delete", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                IfError(Value(Index(Split(lbl_MobileActionPos_NKF.Text, ","), 1).Value), 0),
                                                1, Select(btn_SaveNhapKhoForm),
                                                2, Select(btn_DeleteNhapKhoForm)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_NKF.Text, ","), 1).Value), 0), 1, "Lưu", 2, "Xóa", "")
                                          Tooltip: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_NKF.Text, ","), 1).Value), 0), 1, "Lưu", 2, "Xóa", "")
                                          Visible: =Value(lbl_MobileActionCount_NKF.Text) >= 1
                                    - btn_MobileAction2_NKF:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_NKF.Text, ","), 2).Value), 0), 1, "Save", 2, "Delete", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                IfError(Value(Index(Split(lbl_MobileActionPos_NKF.Text, ","), 2).Value), 0),
                                                1, Select(btn_SaveNhapKhoForm),
                                                2, Select(btn_DeleteNhapKhoForm)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_NKF.Text, ","), 2).Value), 0), 1, "Lưu", 2, "Xóa", "")
                                          Tooltip: =Switch(IfError(Value(Index(Split(lbl_MobileActionPos_NKF.Text, ","), 2).Value), 0), 1, "Lưu", 2, "Xóa", "")
                                          Visible: =Value(lbl_MobileActionCount_NKF.Text) >= 2
                                    - btn_MobileMore_NKF:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_NKF: !varShowMoreActionsMobile_NKF})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_NKF.Text) >= 3
                                          Width: =40
                              - con_FormNhapKhoButton:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =45
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =srcNhapKhacForm.Size <> 1
                                    Width: |
                                      =Parent.Width - 15
                                  Children:
                                    - btn_BackNhapKhoForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="ChevronLeft"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: =Back()
                                          Width: =30
                                    - btn_SaveNhapKhoForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="Save"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =If(
                                                IsBlank(cmb_MovementType.Selected),
                                                Notify("Vui lòng chọn Movement type", NotificationType.Error, 2000),
                                                IsBlank(cmb_Kho.Selected),
                                                Notify("Vui lòng chọn Kho", NotificationType.Error, 2000),
                                                IfError(
                                                    Set(
                                                        varWarehouseReceiptDetail,
                                                        Patch(
                                                           'QLK List Production Receipt Details',
                                                            If(IsBlank(varWarehouseReceiptDetail.ID), Defaults('QLK List Production Receipt Details'), varWarehouseReceiptDetail),
                                                            {
                                                                MovementType:   cmb_MovementType.Selected.MovementType,
                                                                PurchaseOrder:  txt_PurchaseOrder.Text,
                                                                ReceiptDate:  dp_ExecutionDate.SelectedDate,
                                                                SAPCode:          txt_MaSAP.Text,
                                                                BaggingWeight:   num_DeliveredQty.Value,
                                                                SLoc:            cmb_Kho.Selected.SLoc,
                                                                Note:           txt_NoteNhapKho.Text
                                                            }
                                                        )
                                                    ),
                                                    Notify("Lưu không thành công", NotificationType.Error, 2000),
                                                    Notify("Lưu thành công", NotificationType.Success, 2000)
                                                )
                                            )
                                          Text: ="Lưu"
                                    - btn_DeleteNhapKhoForm:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Icon: ="Delete"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xóa bản ghi này không?",
                                                    {
                                                        Title: "Xác nhận xóa",
                                                        Subtitle: "Hành động này không thể hoàn tác.",
                                                        ConfirmButton: "Xóa",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),
                                                IfError(
                                                    Remove('QLK List Production Receipt Details', varWarehouseReceiptDetail),
                                                    Notify("Xóa không thành công", NotificationType.Error, 2000),
                                                    Notify("Xóa thành công", NotificationType.Success, 2000);
                                                    Back()
                                                )
                                            )
                                          Text: ="Xóa"
                                          Visible: |-
                                            =!IsBlank(varWarehouseReceiptDetail.ID) && 
                                            (
                                                varUserInPlant.Role = "FG_WH" ||     // FG_WH         - Thủ kho thành phẩm
                                                varUserInPlant.Role = "VHSX_HO"        // VHSX_HO       - VHSX HO
                                            ) &&
                                            !varWarehouseReceiptDetail.isSent
                                          Width: =100
                              - con_ScrollContentNhapKhoForm:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.Height - con_FormNhapKhoButton.Height
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    Width: =Parent.Width - 10
                                  Children:
                                    - con_SectionNhapKho_1:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =If(srcNhapKhacForm.Size = 1, 440, 480)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =5
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =10
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =10
                                          RadiusBottomLeft: =5
                                          RadiusBottomRight: =5
                                          RadiusTopLeft: =5
                                          RadiusTopRight: =5
                                          Width: =Parent.Width - 20
                                        Children:
                                          - lbl_TitleNhapKho:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(45, 128, 40, 1)
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeLG
                                                Text: ="Thông tin nhập kho"
                                          - con_GridNhapKho_1:
                                              Control: GroupContainer
                                              Variant: GridLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =If(srcNhapKhacForm.Size = 1, 350, 300)
                                                LayoutGap: =If(srcNhapKhacForm.Size = 1, 0, 5)
                                                LayoutGridColumns: =2
                                                LayoutGridRows: =5
                                                PaddingBottom: =5
                                                PaddingLeft: =5
                                                PaddingRight: =5
                                                PaddingTop: =5
                                              Children:
                                                - con_FieldMovementType:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_MovementType_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Movement type *"
                                                      - cmb_MovementType:
                                                          Control: ModernCombobox
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            DefaultSelectedItems: =Filter('QLK List Movement Type Mapping', MovementType = varWarehouseReceiptDetail.MovementType)
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            InputTextPlaceholder: ="Chọn movement type..."
                                                            IsSearchable: =false
                                                            ItemDisplayText: =ThisItem.MovementType
                                                            Items: ='QLK List Movement Type Mapping'
                                                            LayoutMinWidth: =16
                                                            SelectMultiple: =false
                                                            Size: =fxFontSizeMD
                                                - con_FieldPurchaseOrder:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_PurchaseOrder_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Purchase Order"
                                                      - txt_PurchaseOrder:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Default: =varWarehouseReceiptDetail.PurchaseOrder
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Placeholder: ="Nhập Purchase Order..."
                                                            Size: =fxFontSizeMD
                                                - con_FieldExecutionDate:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_ExecutionDate_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Ngày thực hiện *"
                                                      - dp_ExecutionDate:
                                                          Control: ModernDatePicker
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            DefaultDate: |-
                                                              =If(
                                                                  IsBlank(varWarehouseReceiptDetail.ReceiptDate),
                                                                  Today(),
                                                                  varWarehouseReceiptDetail.ReceiptDate
                                                              )
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            Format: =DatePickerFormat.Short
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                - con_FieldMaNM:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_MaNM_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã NM"
                                                      - txt_MaNM:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Default: =varWarehouseReceiptDetail.PlantCode
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Placeholder: ="Nhập Mã NM..."
                                                            Size: =fxFontSizeMD
                                                - con_FieldTenNM:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_TenNM_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Tên NM"
                                                      - txt_TenNM:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Default: =varWarehouseReceiptDetail.PlantName
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Placeholder: ="Nhập Tên NM..."
                                                            Size: =fxFontSizeMD
                                                - con_FieldMaSAP_1:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_MaSAP_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Mã SAP"
                                                      - txt_MaSAP:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Default: =varWarehouseReceiptDetail.SAPCode
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Placeholder: ="Nhập Mã SAP..."
                                                            Size: =fxFontSizeMD
                                                - con_FieldDeliveredQty:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_DeliveredQty_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Khối lượng giao nhận (kg)"
                                                      - num_DeliveredQty:
                                                          Control: ModernNumberInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Default: =varWarehouseReceiptDetail.BaggingWeight
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Size: =fxFontSizeMD
                                                - con_FieldKho:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_Kho_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Kho *"
                                                      - cmb_Kho:
                                                          Control: ModernCombobox
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            DefaultSelectedItems: =Filter('QLK List Master Data SLoc', SLoc = varWarehouseReceiptDetail.SLoc)
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            InputTextPlaceholder: ="Chọn kho..."
                                                            IsSearchable: =false
                                                            ItemDisplayText: =ThisItem.SLocDisplayNameVN
                                                            Items: ='QLK List Master Data SLoc'
                                                            LayoutMinWidth: =16
                                                            SelectMultiple: =false
                                                            Size: =fxFontSizeMD
                                                - con_FieldNoteNhapKho:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutGap: =4
                                                    Children:
                                                      - lbl_NoteNhapKho_Form:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Font: =fxFontFamily
                                                            Size: =fxFontSizeMD
                                                            Text: ="Chi chú"
                                                      - txt_NoteNhapKho:
                                                          Control: ModernTextInput
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            Default: =varWarehouseReceiptDetail.Note
                                                            DisplayMode: =DisplayMode.View
                                                            Font: =fxFontFamily
                                                            LayoutMinWidth: =16
                                                            Placeholder: ="Nhập chi chú..."
                                                            Size: =fxFontSizeMD
      - btn_CloseMoreOverlay_NKF:
          Control: ModernButton
          Properties:
            Appearance: =ButtonAppearance.Transparent
            Height: =Parent.Height - con_HeaderNhapKhoForm.Height
            Layout: =ButtonLayout.TextOnly
            OnSelect: |-
              =UpdateContext({varShowMoreActionsMobile_NKF: false})
            Text: =""
            Visible: =varShowMoreActionsMobile_NKF && srcNhapKhacForm.Size = 1 && Value(lbl_MobileActionCount_NKF.Text) >= 3
            Width: =Parent.Width
            Y: =con_HeaderNhapKhoForm.Height
      - con_PopoverMore_NKF:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            DropShadow: =DropShadow.Regular
            Fill: =RGBA(255, 255, 255, 1)
