Screens:
  scrUsersForm:
    Children:
      - conMainFormUser:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            X: |
              =0
          Children:
            - conHeaderFormUser:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - HeaderFormUser:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft*2 - 5
                        varSizeScreen: =scrUsers.Size
            - con_BodyFormUser:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - conHeaderFormUser.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_BodyMenuFormUser:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Visible: |-
                          =If(
                              scrUsers.Size = 1,
                              false,
                              true
                          )
                        Width: |-
                          =If(
                              varShowMenuUser,
                              240,
                              0
                          )
                      Children:
                        - NavSiderBarUser_1:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainUser:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semibold
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
      - con_MenuOverlayNhapTuSanXuatHangBaoMobile_13:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height - 55
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =5
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowMenuUser && scrNhapTuSanXuat.Size = 1
            Width: =Parent.Width
            Y: =55
          Children:
            - con_MenuPanelNhapTuSanXuatMobile_14:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =743
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =scrNhapTuSanXuat.Size = 1
                  Width: =Parent.Width*0.7
                Children:
                  - cmp_NavSidebarNhapTuSanXuatMobile_14:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width - 10
            - btn_CloseMenuOverlayNhapTuSanXuatMobile_14:
                Control: ModernButton
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Transparent
                  FillPortions: =1
                  Layout: =ButtonLayout.TextOnly
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Set(
                        varShowMenuUser,
                        !varShowMenuUser
                    )
                  Text: =
