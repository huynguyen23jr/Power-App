                                          DropShadow: =DropShadow.None
                                          LayoutGap: =10
                                          LayoutGridColumns: =If(scrMasterDataProductionForm.Size = 1, 1, 3)
                                          LayoutGridRows: =If(scrMasterDataProductionForm.Size = 1, 3, 1)
                                        Children:
                                          - conMasterProduct_FieldPalletSize:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMasterProduct_PalletSize:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Kích thước pallet"
                                                - txtMasterProduct_PalletSize:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varMasterProductDetail.PalletSize
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                          - conMasterProduct_FieldLayerPerPallet:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMasterProduct_LayerPerPallet:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Số lớp/pallet"
                                                - txtInput_MasterProduct_LayerPerPallet:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varMasterProductDetail.LayerPerPallet
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                          - conMasterProduct_FieldBagPerLayer:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMasterProduct_BagPerLayer:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Số bao/lớp"
                                                - txtMasterProduct_BagPerLayer:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varMasterProductDetail.BagPerLayer
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                              - conMasterProduct_SectionBox:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
