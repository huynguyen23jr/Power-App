                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =If(scrMasterDataProductionForm.Size = 1, 320, 170)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =10
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - lblMasterProduct_SectionBag:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="3. Thông tin bao"
                                    - conMasterProduct_GridBag:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutGap: =10
                                          LayoutGridColumns: =If(scrMasterDataProductionForm.Size = 1, 1, 3)
                                          LayoutGridRows: =If(scrMasterDataProductionForm.Size = 1, 3, 1)
                                        Children:
                                          - conMasterProduct_FieldBagSize:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMasterProduct_BagSize:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Cỡ bao"
                                                - txtInutMasterProduct_BagSize:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varMasterProductDetail.BagSize
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                          - conMasterProduct_FieldBagWeight:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMasterProduct_BagWeight:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="KL bao bì"
                                                - txtMasterProduct_BagWeight:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varMasterProductDetail.BagWeight
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                          - conMasterProduct_FieldSmallBagPerBag:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMasterProduct_SmallBagPerBag:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Số túi/bao"
                                                - txtMasterProduct_SmallBagPerBag:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Default: =varMasterProductDetail.SmallBagPerBag
                                                      Font: =fxFontFamily
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                              - conMasterProduct_SectionPallet:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =If(scrMasterDataProductionForm.Size = 1, 320, 170)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =10
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - lblMasterProduct_SectionPallet:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="4. Quy cách pallet"
                                    - conMasterProduct_GridPallet:
                                        Control: GroupContainer
                                        Variant: GridLayout
