Screens:
  scrMaTranPheDuyetForm:
    Children:
      - con_MainMaTranPheDuyetForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderMaTranPheDuyetForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderMaTranPheDuyetForm:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrMaTranPheDuyetForm.Size
            - con_BodyMaTranPheDuyetForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderMaTranPheDuyetForm.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  LayoutOverflowX: =LayoutOverflow.Scroll
                  LayoutOverflowY: |-
                    =If(
                        scrMaTranPheDuyetForm.Size = 1,
                        LayoutOverflow.Scroll,
                        LayoutOverflow.Hide
                    )
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_MenuMaTranPheDuyetForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        Height: =con_BodyMainMaTranPheDuyetForm.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =scrMaTranPheDuyetForm.Size <> 1
                        Width: =If(varShowMenuUser, 240, 0)
                      Children:
                        - cmp_NavSidebarMaTranPheDuyetForm:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainMaTranPheDuyetForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 250, 251, 1)
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - conMaTranPheDuyetForm_ActionBar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =52
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                            Children:
                              - btnMaTranPheDuyetForm_Back:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Icon: ="ChevronLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    OnSelect: =Back()
                                    Width: =36
                              - btnMaTranPheDuyetForm_Save:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Save"
                                    OnSelect: |-
                                      =IfError(
                                          Set(
                                              varMaTranPheDuyetDetail,
                                              Patch(
                                                  'QLK List Approval Matrix',
                                                  If(
                                                      IsBlank(varMaTranPheDuyetDetail),
                                                      Defaults('QLK List Approval Matrix'),
                                                      varMaTranPheDuyetDetail
                                                  ),
                                                  {
                                                      ProductCategoryCode: cmbMaTranPheDuyetForm_ProductCategoryCode.Selected.ProductCategoryCode,
                                                      ProductTypeCode: cmbMaTranPheDuyetForm_ProductTypeCode.Selected.ProductTypeCode,
                                                      BagSize: numMaTranPheDuyetForm_BagSize.Value,
                                                      ApprovalTypeCode: cmbMaTranPheDuyetForm_ApprovalTypeCode.Selected.ApprovalTypeCode,
                                                      PlantCode: varUserInPlant.PlantCode,
                                                      PlantName: varUserInPlant.PlantName
                                                  }
                                              )
                                          ),
                                          Notify("Không thể lưu dữ liệu.", NotificationType.Error,2000),
                                          Notify("Đã lưu thành công.", NotificationType.Success,2000)
                                      )
                                    Text: ="Lưu"
                              - btnMaTranPheDuyetForm_Refresh:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="ArrowClockwise"
                                    OnSelect: |-
                                      =Set(varMaTranPheDuyetDetail,LookUp('QLK List Approval Matrix',ID = varMaTranPheDuyetDetail.ID));
                                      Refresh('QLK List Approval Matrix');
                                      Refresh('QLK List Approval Matrix Steps');
                                    Text: ="Làm mới"
                                    Width: =120
                        - conMaTranPheDuyetForm_Content:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: |-
                                =If(
                                    scrMaTranPheDuyetForm.Size = 1,
                                    410,
                                    240
                                )
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - conMaTranPheDuyetForm_SectionInfo:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: |-
                                      =If(
                                          scrMaTranPheDuyetForm.Size = 1,
                                          380,
                                          230
                                      )
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: |-
                                      =If(
                                          scrMaTranPheDuyetForm.Size = 1,
                                          0,
                                          5
                                      )
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                  Children:
                                    - lblMaTranPheDuyetForm_SectionInfo:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="Thông tin ma trận phê duyệt"
                                    - conMaTranPheDuyetForm_GridInfo:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutGap: =15
                                          LayoutGridColumns: =If(scrMaTranPheDuyetForm.Size = 1, 1, 2)
                                          LayoutGridRows: =If(scrMaTranPheDuyetForm.Size = 1, 4, 2)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                        Children:
                                          - conMaTranPheDuyetForm_FieldProductCategoryCode:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMaTranPheDuyetForm_ProductCategoryCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Phân loại sản phẩm *"
                                                - cmbMaTranPheDuyetForm_ProductCategoryCode:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: =LookUp(col_ProductCategories,ProductCategoryCode = varMaTranPheDuyetDetail.ProductCategoryCode)
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: =""
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                      Items: =col_ProductCategories
                                                      LayoutMinWidth: =Parent.Width
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                                          - conMaTranPheDuyetForm_FieldProductTypeCode:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMaTranPheDuyetForm_ProductTypeCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Loại hàng *"
                                                - cmbMaTranPheDuyetForm_ProductTypeCode:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: =LookUp(col_ProductTypes,ProductTypeCode = varMaTranPheDuyetDetail.ProductTypeCode)
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: =""
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.ProductTypeNameVI
                                                      Items: =col_ProductTypes
                                                      LayoutMinWidth: =Parent.Width
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                                          - conMaTranPheDuyetForm_FieldBagSize:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMaTranPheDuyetForm_BagSize:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Cỡ bao *"
                                                - numMaTranPheDuyetForm_BagSize:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      Default: =varMaTranPheDuyetDetail.BagSize
                                                      Font: =fxFontFamily
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      Size: =fxFontSizeMD
                                          - conMaTranPheDuyetForm_FieldApprovalTypeCode:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblMaTranPheDuyetForm_ApprovalTypeCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Loại phê duyệt *"
                                                - cmbMaTranPheDuyetForm_ApprovalTypeCode:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      DefaultSelectedItems: =LookUp(col_ApprovalTypes,ApprovalTypeCode = varMaTranPheDuyetDetail.ApprovalTypeCode)
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: =""
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.ApprovalTypeNameVI
                                                      Items: =col_ApprovalTypes
                                                      LayoutMinWidth: |
                                                        =123
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                              - con_ApprovalMatrixSteps:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =If(scrMaTranPheDuyetForm.Size = 1, 520, 360)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =!IsBlank(varMaTranPheDuyetDetail.ID)
                                  Children:
                                    - lbl_ApprovalMatrixSteps_Title:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="Chi tiết ma trận phê duyệt"
                                    - con_ApprovalMatrixSteps_SearchAction:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =10
                                          LayoutJustifyContent: =LayoutJustifyContent.End
                                          PaddingBottom: =8
                                          PaddingLeft: =8
                                          PaddingRight: =8
                                          PaddingTop: =8
                                        Children:
                                          - btn_Add_ApprovalMatrixSteps:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =ButtonAppearance.Transparent
                                                Icon: ="Add"
                                                OnSelect: |-
                                                  =Set(var_ApprovalMatrixStepsDetail, {});
                                                  UpdateContext({varShow_ApprovalMatrixStepsDetail: true});
                                                  Reset(cmb_PopupField_RuleTypeCode);
                                                  Reset(cmb_PopupField_RoleCode);
                                                  Reset(cmb_PopupField_ApproverName);
                                                  Reset(txt_PopupField_ThresholdValue);
                                                  Reset(txt_PopupField_ThresholdPercent);
                                                Text: ="Thêm"
                                                Width: =100
                                    - con_ApprovalMatrixSteps_ListBody:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =If(scrMaTranPheDuyetForm.Size = 1, DropShadow.None, DropShadow.Semibold)
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutOverflowX: =LayoutOverflow.Scroll
                                          RadiusTopLeft: =If(scrMaTranPheDuyetForm.Size = 1, 0, 5)
                                          RadiusTopRight: =0
                                        Children:
                                          - con_ApprovalMatrixSteps_GalleryWrapper:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Start
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =Parent.Height - lbl_ApprovalMatrixSteps_TotalRows.Height
                                                Width: =con_ApprovalMatrixSteps_ListBody.Width
                                              Children:
                                                - con_ApprovalMatrixSteps_TableHeader:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(249, 249, 249, 1)
                                                      Height: =If(scrMaTranPheDuyetForm.Size = 1, 0, 50)
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      PaddingLeft: =10
                                                      PaddingRight: =10
                                                      Visible: =scrMaTranPheDuyetForm.Size <> 1
                                                      Width: =Parent.Width
                                                    Children:
                                                      - lbl_ApprovalMatrixSteps_HeaderRuleTypeCode:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Size: =fxFontSizeMD
                                                            Text: ="Loại điều kiện"
                                                      - lbl_ApprovalMatrixSteps_HeaderRoleCode:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =2
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Size: =fxFontSizeMD
                                                            Text: ="Vai trò"
                                                      - lbl_ApprovalMatrixSteps_HeaderApproverName:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =2
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Size: =fxFontSizeMD
                                                            Text: ="Tên người phê duyệt"
                                                      - lbl_ApprovalMatrixSteps_HeaderThresholdValue:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Size: =fxFontSizeMD
                                                            Text: ="Giá trị ngưỡng"
                                                      - lbl_ApprovalMatrixSteps_HeaderThresholdPercent:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Size: =fxFontSizeMD
                                                            Text: ="Tỷ lệ giới hạn (%)"
                                                      - lbl_ApprovalMatrixSteps_HeaderAction:
                                                          Control: ModernText
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.Stretch
                                                            FillPortions: =1
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Size: =fxFontSizeMD
                                                            Text: ="Thao tác"
                                                - gal_ApprovalMatrixSteps:
                                                    Control: Gallery
                                                    Variant: Vertical
                                                    Properties:
                                                      BorderStyle: =BorderStyle.None
                                                      Height: =Parent.Height - con_ApprovalMatrixSteps_TableHeader.Height
                                                      Items: |-
                                                        =Filter(
                                                            'QLK List Approval Matrix Steps',
                                                            ApprovalMatrixID = varMaTranPheDuyetDetail.ID
                                                        )
                                                      ShowScrollbar: =false
                                                      TemplateSize: |-
                                                        =If(
                                                            scrMaTranPheDuyetForm.Size = 1,
                                                            230,
                                                            50
                                                        )
                                                      Width: =Parent.Width
                                                      Y: =con_ApprovalMatrixSteps_TableHeader.Height
                                                    Children:
                                                      - con_ApprovalMatrixSteps_RowDivider:
                                                          Control: GroupContainer
                                                          Variant: ManualLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            Fill: =RGBA(242, 243, 247, 1)
                                                            Height: =0.5
                                                            Visible: =scrMaTranPheDuyetForm.Size <> 1
                                                            Width: =Parent.Width - 10
                                                            Y: =gal_ApprovalMatrixSteps.TemplateHeight - 1
                                                      - con_ApprovalMatrixSteps_RowParent:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            DropShadow: =If(scrMaTranPheDuyetForm.Size = 1, DropShadow.Light, DropShadow.None)
                                                            Height: =gal_ApprovalMatrixSteps.TemplateHeight
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            LayoutGap: =If(scrMaTranPheDuyetForm.Size = 1, 5, 0)
                                                            Width: =Parent.Width - 10
                                                          Children:
                                                            - con_ApprovalMatrixSteps_Row:
                                                                Control: GroupContainer
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  DropShadow: =DropShadow.None
                                                                  FillPortions: =0
                                                                  Height: =Parent.Height
                                                                  LayoutAlignItems: =If(scrMaTranPheDuyetForm.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                                  LayoutDirection: =If(scrMaTranPheDuyetForm.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                                  LayoutMinHeight: =Parent.Height
                                                                  PaddingLeft: =If(scrMaTranPheDuyetForm.Size = 1, 10, 5)
                                                                  PaddingRight: =10
                                                                  PaddingTop: =If(scrMaTranPheDuyetForm.Size = 1, 10, 5)
                                                                  Width: |-
                                                                    =If(
                                                                        scrMaTranPheDuyetForm.Size = 1,
                                                                        Parent.Width / 1.25,
                                                                        Parent.Width
                                                                    )
                                                                Children:
                                                                  - lbl_ApprovalMatrixSteps_RuleTypeCode:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrMaTranPheDuyetForm.Size = 1, AlignInContainer.Stretch, AlignInContainer.SetByContainer)
                                                                        FillPortions: =If(scrMaTranPheDuyetForm.Size = 1, 1, 0)
                                                                        Font: =fxFontFamily
                                                                        Height: =30
                                                                        Size: =fxFontSizeMD
                                                                        Text: =LookUp(col_RuleTypes,RuleTypeCode = ThisItem.RuleTypeCode).RuleTypeNameVI
                                                                        Width: =lbl_ApprovalMatrixSteps_HeaderRuleTypeCode.Width
                                                                        Wrap: =false
                                                                  - lbl_ApprovalMatrixSteps_RoleCode:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrMaTranPheDuyetForm.Size = 1, AlignInContainer.Stretch, AlignInContainer.SetByContainer)
                                                                        FillPortions: =If(scrMaTranPheDuyetForm.Size = 1, 1, 0)
                                                                        Font: =fxFontFamily
                                                                        Height: =30
                                                                        Size: =fxFontSizeMD
                                                                        Text: =LookUp(col_RoleUser,RoleCode = ThisItem.RoleCode).RoleNameVI
                                                                        Width: =lbl_ApprovalMatrixSteps_HeaderRoleCode.Width
                                                                        Wrap: =false
                                                                  - lbl_ApprovalMatrixSteps_ApproverName:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrMaTranPheDuyetForm.Size = 1, AlignInContainer.Stretch, AlignInContainer.SetByContainer)
                                                                        FillPortions: =If(scrMaTranPheDuyetForm.Size = 1, 1, 0)
                                                                        Font: =fxFontFamily
                                                                        Height: =30
                                                                        Size: =fxFontSizeMD
                                                                        Text: =ThisItem.UserName
                                                                        Width: =lbl_ApprovalMatrixSteps_HeaderApproverName.Width
                                                                        Wrap: =false
                                                                  - lbl_ApprovalMatrixSteps_ThresholdValue:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrMaTranPheDuyetForm.Size = 1, AlignInContainer.Stretch, AlignInContainer.SetByContainer)
                                                                        FillPortions: =If(scrMaTranPheDuyetForm.Size = 1, 1, 0)
                                                                        Font: =fxFontFamily
                                                                        Height: =30
                                                                        Size: =fxFontSizeMD
                                                                        Text: =Text(ThisItem.ThresholdValue)
                                                                        Width: =lbl_ApprovalMatrixSteps_HeaderThresholdValue.Width
                                                                        Wrap: =false
                                                                  - lbl_ApprovalMatrixSteps_ThresholdPercent:
                                                                      Control: ModernText
                                                                      Properties:
                                                                        AlignInContainer: =If(scrMaTranPheDuyetForm.Size = 1, AlignInContainer.Stretch, AlignInContainer.SetByContainer)
                                                                        FillPortions: =If(scrMaTranPheDuyetForm.Size = 1, 1, 0)
                                                                        Font: =fxFontFamily
                                                                        Height: =30
                                                                        Size: =fxFontSizeMD
                                                                        Text: =Text(ThisItem.ThresholdPercent)
                                                                        Width: =lbl_ApprovalMatrixSteps_HeaderThresholdPercent.Width
                                                                        Wrap: =false
                                                                  - con_ApprovalMatrixSteps_Actions:
                                                                      Control: GroupContainer
                                                                      Variant: AutoLayout
                                                                      Properties:
                                                                        DropShadow: =DropShadow.None
                                                                        FillPortions: =If(scrMaTranPheDuyetForm.Size = 1, 1, 0)
                                                                        Height: =30
                                                                        LayoutAlignItems: =LayoutAlignItems.Center
                                                                        LayoutDirection: =LayoutDirection.Horizontal
                                                                        LayoutMinHeight: =Parent.Height
                                                                        Visible: =scrMaTranPheDuyetForm.Size <> 1
                                                                        Width: =lbl_ApprovalMatrixSteps_HeaderAction.Width
                                                                      Children:
                                                                        - btn_ApprovalMatrixSteps_Edit:
                                                                            Control: ModernButton
                                                                            Properties:
                                                                              Appearance: =ButtonAppearance.Transparent
                                                                              Icon: ="Edit"
                                                                              Layout: =ButtonLayout.IconOnly
                                                                              OnSelect: |-
                                                                                =Set(var_ApprovalMatrixStepsDetail, ThisItem);
                                                                                UpdateContext({varShow_ApprovalMatrixStepsDetail: true})
                                                                              Width: =30
                                                                        - btn_ApprovalMatrixSteps_Delete:
                                                                            Control: ModernButton
                                                                            Properties:
