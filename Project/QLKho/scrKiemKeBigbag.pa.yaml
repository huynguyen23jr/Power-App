Screens:
  scrKiemKeBigbag:
    Properties:
      OnVisible: |-
        =// Xóa lựa chọn cũ mỗi khi vào màn hình (đồng bộ với màn kiểm kê hàng bao / hàng xá)
        Clear(col_SelectedKiemKhoHangBigbag);
        Clear(updateKiemKhoBigBag)
    Children:
      - con_MainKiemKhoHangBigbag:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderKiemKhoHangBigbag:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderKiemKhoHangBigbag:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrKiemKeBigbag.Size
            - con_BodyKiemKhoHangBigbag:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderKiemKhoHangBigbag.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_MenuKiemKhoHangBigbag:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =scrKiemKeBigbag.Size <> 1
                        Width: =If(varShowMenuUser, 240, 0)
                      Children:
                        - cmp_NavSidebarKiemKhoHangBigbag:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_ContentKiemKhoHangBigbag:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: |-
                          =If(
                              scrKiemKeBigbag.Size = 1,
                              DropShadow.Semibold,
                              DropShadow.None
                          )
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                        RadiusTopRight: =0
                      Children:
                        - con_ActionHeaderKiemKhoHangBigbag:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - btn_AddKiemKhoHangBao_1:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Add"
                                    OnSelect: |-
                                      =Set(
                                          varStockCountDetail,
                                          {}
                                      );

                                      Set(
                                          varStockCountType,
                                          Index(col_ProductTypes, 2).ProductTypeCode
                                      );
                                      Reset(cmb_ProductCode);
                                      Reset(num_PalletQty);
                                      Reset(num_OddBagQty);
                                      Reset(dp_ProductionDate);
                                      Reset(num_BrokenBagQty);
                                      Reset(num_OddBoxQty);
                                      Reset(num_OddKgQty);
                                      Reset(txt_Note_Bao);
                                      Reset(txt_LocationName_Bao);
                                      Reset(cmb_XaDensityCode);
                                      Reset(cmb_XaBinCode);
                                      Reset(num_Measure1);
                                      Reset(num_Measure2);
                                      Reset(num_Measure3);
                                      Reset(num_DustSteamQty);
                                      Reset(cmb_ProductCode_Bigbag);
                                      Reset(num_BigBagQty);
                                      Reset(num_BigBagWeight);
                                      Reset(num_NetBigBagWeight);
                                      Reset(cmb_ProductCategory);
                                      Reset(cmb_StockCountType);

                                      Navigate(
                                          scrKiemKhoForm,
                                          ScreenTransition.CoverRight
                                      );
                                    Size: =fxFontSizeMD
                                    Text: ="Thêm"
                                    Visible: =(varUserInPlant.Role = Index(col_RoleUser,16).RoleCode || varUserInPlant.Role = Index(col_RoleUser,1).RoleCode || varUserInPlant.Role = Index(col_RoleUser,9).RoleCode)
                              - btn_RefreshKiemKhoHangBigbag:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="ArrowSync"
                                    OnSelect: =Refresh('QLK List Stock Count Details')
                                    Size: =fxFontSizeMD
                                    Text: ="Làm mới"
                                    Width: =120
                              - btn_RefreshKiemKhoHangXa_3:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    OnSelect: |
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xác nhận kiểm kê " & CountRows(col_SelectedKiemKhoHangBigbag) & " bản ghi đã chọn không?",
                                              {
                                                  Title: "Xác nhận",
                                                  ConfirmButton: "Xác nhận",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          UpdateContext({varShowPopupProcessing: true});
                                          Clear(updateKiemKhoBigBag);
                                          ForAll(
                                              col_SelectedKiemKhoHangBigbag As item,
                                              Collect(
                                                  updateKiemKhoBigBag,
                                                  {
                                                      ID          : item.ID,
                                                      StatusCode  : "COUNT_CONFIRMED"
                                                  }
                                              )
                                          );
                                          IfError(
                                              Patch('QLK List Stock Count Details', updateKiemKhoBigBag),
                                              Notify("Cập nhật thất bại", NotificationType.Error, 2000),
                                              Notify("Cập nhật thành công", NotificationType.Success, 2000);
                                              Clear(col_SelectedKiemKhoHangBigbag);
                                              Clear(updateKiemKhoBigBag);
                                          );
                                          UpdateContext({varShowPopupProcessing: false})
                                      )
                                    Size: =fxFontSizeMD
                                    Text: ="Xác nhận"
                                    Visible: |-
                                      =CountRows(
                                          Filter(
                                              col_SelectedKiemKhoHangBigbag,
                                              StatusCode = Index(col_WorkflowStatus,1).StatusCode
                                          )
                                      ) > 0
                                    Width: =120
                        - lbl_TitleKiemKhoHangBigbag:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 128, 40, 1)
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightSemiBold
                              Height: =40
                              PaddingLeft: =10
                              Size: =fxFontSizeXL
                              Text: ="Kiểm kê bigbag"
                        - con_FilterKiemKhoHangBao_2:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrKiemKeBigbag.Size = 1 ,90 ,45)
                              LayoutDirection: =If(scrKiemKhoHangBao.Size = 1 ,LayoutDirection.Vertical ,LayoutDirection.Horizontal)
                              LayoutGap: =5
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - con_Row1_2:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: |
                                      =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                  Children:
                                    - dp_FilterNgayKiemHangBao_2:
                                        Control: ModernDatePicker
                                        Properties:
                                          BasePaletteColor: =RGBA(8,222,8,1)
                                          DefaultDate: =Today()
                                          Font: =fxFontFamily
                                          FontWeight: =FontWeight.Normal
                                          Format: =DatePickerFormat.Short
                                          Size: =fxFontSizeMD
                                          Width: =160
                                    - txt_SearchKiemKhoHangBigbag:
                                        Control: ModernTextInput
                                        Properties:
                                          Font: =fxFontFamily
                                          Placeholder: ="Tìm kiếm ...."
                                          Width: |-
                                            =
                                            If(scrKiemKhoHangBao.Size = 1 ,Parent.Width - dp_FilterNgayKiemHangBao_2.Width - 60 ,Parent.Width - dp_FilterNgayKiemHangBao_2.Width - 10)
                              - con_Row2_2:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                  Children:
                                    - cbo_FilterStatusKiemKho_2:
                                        Control: ModernCombobox
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.StatusNameVI
                                          Items: =Filter(col_WorkflowStatus,StatusCode="DRAFT" || StatusCode="COUNT_CONFIRMED")
                                          SelectMultiple: =false
                                          Width: =160
                                    - cbo_FilterProductTypeNhapTuSanXuat_10:
                                        Control: ModernCombobox
                                        Properties:
                                          DefaultSelectedItems: =LookUp(col_ProductCategories,ProductCategoryCode=varUserInPlant.ProductCategoryCode)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                          Items: =col_ProductCategories
                                          SelectMultiple: =false
                                          Width: =Parent.Width - cbo_FilterStatusKiemKho_2.Width - Button1_2.Width - 10
                                    - Button1_2:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="Eraser"
                                          OnSelect: |-
                                            =Reset(cbo_FilterStatusKiemKho_2);
                                            Reset(cbo_FilterProductTypeNhapTuSanXuat_10);
                                            Reset(txt_SearchKiemKhoHangBigbag);
                                          Text: =
                                          Width: =50
                        - con_ListKiemKhoHangBigbag:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderStyle: =BorderStyle.None
                              DropShadow: =If(scrKiemKeBigbag.Size = 1, DropShadow.None, DropShadow.Semibold)
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =If(scrKiemKeBigbag.Size = 1, 0, 5)
                              RadiusTopRight: =6
                              Width: =Parent.Width - Parent.PaddingLeft * 2
                            Children:
                              - con_TableHeaderKiemKhoHangBigbag:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(250, 250, 250, 1)
                                    FillPortions: =0
                                    Height: =46
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    Visible: =scrKiemKeBigbag.Size <> 1
                                  Children:
                                    - chk_KiemKhoHangBigbag_SelectAll:
                                        Control: ModernCheckbox
                                        Properties:
                                          Default: |-
                                            =CountRows(col_SelectedKiemKhoHangBigbag) = CountRows(gal_KiemKhoHangBigbag.AllItems) &&
                                            CountRows(gal_KiemKhoHangBigbag.AllItems) > 0
                                          DisplayMode: |
                                            =If(
                                                CountRows(
                                                    Filter(
                                                        gal_KiemKhoHangBigbag.AllItems,
                                                        StatusCode = Index(col_WorkflowStatus, 1).StatusCode
                                                    )
                                                ) > 0,
                                                DisplayMode.Edit,
                                                DisplayMode.Disabled
                                            )
                                          FontWeight: =""
                                          Label: =""
                                          OnCheck: =ClearCollect(col_SelectedKiemKhoHangBigbag, Filter(gal_KiemKhoHangBigbag.AllItems,StatusCode = Index(col_WorkflowStatus,1).StatusCode))
                                          OnUncheck: =Clear(col_SelectedKiemKhoHangBigbag)
                                          Width: =32
                                    - lbl_HeaderBigbagSAPCode:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Mã hàng"
                                          Width: |
                                            =Parent.Width * 0.1
                                          Wrap: =false
                                    - lbl_HeaderStockCountDateBigbag:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Ngày kiểm kê"
                                          Width: =Parent.Width * 0.1
                                          Wrap: =false
                                    - lbl_HeaderStatusCodeKiemKhoHangBigbag:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Trạng thái"
                                          Width: |
                                            =Parent.Width * 0.15
                                          Wrap: =false
                                    - lbl_HeaderBigbagBagQty:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Số lượng túi"
                                          Width: =Parent.Width * 0.15
                                          Wrap: =false
                                    - lbl_HeaderBigbagTotalWeight:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Tổng KL (kg)"
                                          Width: =Parent.Width * 0.15
                                          Wrap: =false
                                    - lbl_HeaderBigbagBigbagWeight:
                                        Control: ModernText
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="KL tịnh bigbag (kg)"
                                          Wrap: =false
                                    - lbl_HeaderActualQtyBigbag:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Số kg tồn (Kg)"
                                          Width: =Parent.Width * 0.1
                                          Wrap: =false
                                    - lbl_HeaderActionKiemKhoHangBigbag:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Thao tác"
                                          Width: =80
                                          Wrap: =false
                              - gal_KiemKhoHangBigbag:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height - con_TableHeaderKiemKhoHangBigbag.Height - lbl_TotalRowsKiemKhoHangBigbag.Height
                                    Items: |-
                                      =Switch(
                                          varRoleCurrentFirst.Role,
                                          Index(col_RoleUser, 16).RoleCode, // Nhân viên kho thành phẩm
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "BIGBAG",
                                                  IsBlank(dp_FilterNgayKiemHangBao_2.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao_2.SelectedDate,
                                                  IsBlank(cbo_FilterStatusKiemKho_2.Selected) || StatusCode = cbo_FilterStatusKiemKho_2.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_10.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_10.Selected.ProductCategoryCode,
                                                  (IsBlank(txt_SearchKiemKhoHangBigbag.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangBigbag.Text)),
                                                  UserID = varUserInPlant.UserID
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          Index(col_RoleUser, 1).RoleCode, // Thủ kho thành phẩm
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "BIGBAG",
                                                  IsBlank(dp_FilterNgayKiemHangBao_2.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao_2.SelectedDate,
                                                  IsBlank(cbo_FilterStatusKiemKho_2.Selected) || StatusCode = cbo_FilterStatusKiemKho_2.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_10.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_10.Selected.ProductCategoryCode,
                                                  (IsBlank(txt_SearchKiemKhoHangBigbag.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangBigbag.Text)),
                                                  UserID = varUserInPlant.UserID
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          Index(col_RoleUser, 9).RoleCode, // VHSX_HO
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "BIGBAG",
                                                  IsBlank(dp_FilterNgayKiemHangBao_2.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao_2.SelectedDate,
                                                  IsBlank(cbo_FilterStatusKiemKho_2.Selected) || StatusCode = cbo_FilterStatusKiemKho_2.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_10.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_10.Selected.ProductCategoryCode,
                                                  (IsBlank(txt_SearchKiemKhoHangBigbag.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangBigbag.Text))
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "BIGBAG",
                                                  (IsBlank(txt_SearchKiemKhoHangBigbag.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangBigbag.Text)),
                                                  IsBlank(cbo_FilterStatusKiemKho_2.Selected) || StatusCode = cbo_FilterStatusKiemKho_2.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_10.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_10.Selected.ProductCategoryCode,
                                                  IsBlank(dp_FilterNgayKiemHangBao_2.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao_2.SelectedDate
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          )
                                      )
                                    ShowScrollbar: =false
                                    TemplateSize: |-
                                      =If(
                                          scrKiemKeBigbag.Size = 1,
                                          32 * 7 + 10,
                                          45
                                      )
                                    Width: =Parent.Width
                                  Children:
                                    - con_RowDividerKiemKhoHangBigbag:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(229, 231, 235, 1)
                                          Height: =1
                                          Visible: =scrKiemKeBigbag.Size <> 1
                                          Width: =Parent.Width - 10
                                          Y: =gal_KiemKhoHangBigbag.TemplateHeight
                                    - con_RowMasterKiemKhoHangBigbag:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =If(scrKiemKeBigbag.Size = 1, DropShadow.Light, DropShadow.None)
                                          Height: =gal_KiemKhoHangBigbag.TemplateHeight
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: |-
                                            =If(
                                                scrKiemKeBigbag.Size = 1,
                                                LayoutDirection.Vertical,
                                                LayoutDirection.Horizontal
                                            )
                                          LayoutGap: =If(scrKiemKeBigbag.Size = 1, 5, 0)
                                          PaddingLeft: =5
                                          RadiusTopLeft: =If(scrKiemKeBigbag.Size = 1, 4, 0)
                                          Width: =Parent.Width - 10
                                        Children:
                                          - chk_KiemKhoHangBigbag_SelectRow:
                                              Control: ModernCheckbox
                                              Properties:
                                                Default: =ThisItem.ID in col_SelectedKiemKhoHangBigbag.ID
                                                DisplayMode: |-
                                                  =If(
                                                      ThisItem.StatusCode = "DRAFT" ,
                                                      DisplayMode.Edit,
                                                      DisplayMode.Disabled
                                                  )
                                                FontWeight: =""
                                                Label: =""
                                                OnCheck: =Collect(col_SelectedKiemKhoHangBigbag, ThisItem)
                                                OnUncheck: =Remove(col_SelectedKiemKhoHangBigbag, ThisItem)
                                                Visible: =scrKiemKeBigbag.Size <> 1
                                                Width: =32
                                          - con_RowKiemKhoHangBigbag:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(229, 231, 235, 1)
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(255, 255, 255, 1)
                                                FillPortions: =0
                                                Height: |-
                                                  =If(
                                                      scrKiemKeBigbag.Size = 1,
                                                      gal_KiemKhoHangBigbag.TemplateHeight - con_MobileActionKiemKhoHangBigbag.Height - 10,
                                                      48
                                                  )
                                                LayoutAlignItems: =If(scrKiemKeBigbag.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                LayoutDirection: =If(scrKiemKeBigbag.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                LayoutGap: =5
                                                LayoutMinHeight: =10
                                                PaddingLeft: =If(scrKiemKeBigbag.Size = 1, 10, 5)
                                                PaddingRight: =If(scrKiemKeBigbag.Size = 1, 10, 5)
                                                PaddingTop: =If(scrKiemKeBigbag.Size = 1, 10, 5)
                                                Width: =If(scrKiemKeBigbag.Size = 1, Parent.Width / 1.2, Parent.Width - 32 - 10)
                                              Children:
                                                - lbl_BigbagSAPCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightSemiBold
                                                      Height: =30
                                                      Size: =fxFontSizeMD
                                                      Text: |-
                                                        =If(scrKiemKeBigbag.Size = 1, "Mã hàng: " & ThisItem.SAPCode, ThisItem.SAPCode)
                                                      Width: =If(scrKiemKeBigbag.Size = 1, Parent.Width - 20, lbl_HeaderBigbagSAPCode.Width)
                                                      Wrap: =false
                                                - lbl_BigbagStockCountDate:
                                                    Control: ModernText
