Screens:
  scrNhapKhac:
    Properties:
      OnVisible: =varShowMenuUser && scrNhapKhac.Size <> 1
    Children:
      - con_MainNhapTuSanXuat_3:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuNhapTuSanXuat_3:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrNhapTuSanXuat.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarNhapTuSanXuat_3:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainNhapTuSanXuat_3:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderNhapTuSanXuat_3:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderNhapTuSanXuat_3:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrNhapTuSanXuat.Size
                  - con_BodyNhapTuSanXuat_4:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderNhapTuSanXuat_3.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentNhapTuSanXuat_3:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrDanhMucBin.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_FormButtonMobile_NhapKhac:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrNhapKhac.Size = 1
                                    Width: =Parent.Width - 10
                                  Children:
                                    - lbl_MobileActionPos_NhapKhac:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(6), Switch(Value, 1, btn_RefreshNhapTuSanXuat_3.Visible, 2, btn_RefreshNhapTuSanXuat_5.Visible, 3, btn_RefreshNhapTuSanXuat_8.Visible, 4, btn_RefreshNhapTuSanXuat_6.Visible, 5, btn_RefreshNhapTuSanXuat_7.Visible, 6, btn_RefreshNhapTuSanXuat_9.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_NhapKhac:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_NhapKhac.Text), 0, CountRows(Split(lbl_MobileActionPos_NhapKhac.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_NhapKhac:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_NhapKhac.Text, ","), 1), 1)).Value), 1, "ArrowSync", 2, "Database", 3, "Send", 4, "CheckmarkCircle", 5, "Delete", 6, "DismissCircle", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_NhapKhac.Text, ","), 1), 1)).Value),
                                                1, Select(btn_RefreshNhapTuSanXuat_3),
                                                2, Select(btn_RefreshNhapTuSanXuat_5),
                                                3, Select(btn_RefreshNhapTuSanXuat_8),
                                                4, Select(btn_RefreshNhapTuSanXuat_6),
                                                5, Select(btn_RefreshNhapTuSanXuat_7),
                                                6, Select(btn_RefreshNhapTuSanXuat_9)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_NhapKhac.Text, ","), 1), 1)).Value), 1, "Làm mới", 2, "Đồng bộ", 3, "Gửi", 4, "Xác nhận", 5, "Xóa", 6, "Từ chối", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_NhapKhac.Text, ","), 1), 1)).Value), 1, "Làm mới", 2, "Đồng bộ", 3, "Gửi", 4, "Xác nhận", 5, "Xóa", 6, "Từ chối", "")
                                          Visible: =Value(lbl_MobileActionCount_NhapKhac.Text) >= 1
                                    - btn_MobileAction2_NhapKhac:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_NhapKhac.Text, ","), 2), 1)).Value), 1, "ArrowSync", 2, "Database", 3, "Send", 4, "CheckmarkCircle", 5, "Delete", 6, "DismissCircle", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_NhapKhac.Text, ","), 2), 1)).Value),
                                                1, Select(btn_RefreshNhapTuSanXuat_3),
                                                2, Select(btn_RefreshNhapTuSanXuat_5),
                                                3, Select(btn_RefreshNhapTuSanXuat_8),
                                                4, Select(btn_RefreshNhapTuSanXuat_6),
                                                5, Select(btn_RefreshNhapTuSanXuat_7),
                                                6, Select(btn_RefreshNhapTuSanXuat_9)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_NhapKhac.Text, ","), 2), 1)).Value), 1, "Làm mới", 2, "Đồng bộ", 3, "Gửi", 4, "Xác nhận", 5, "Xóa", 6, "Từ chối", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_NhapKhac.Text, ","), 2), 1)).Value), 1, "Làm mới", 2, "Đồng bộ", 3, "Gửi", 4, "Xác nhận", 5, "Xóa", 6, "Từ chối", "")
                                          Visible: =Value(lbl_MobileActionCount_NhapKhac.Text) >= 2
                                    - btn_MobileMore_NhapKhac:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_NhapKhac: !varShowMoreActionsMobile_NhapKhac})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_NhapKhac.Text) >= 3
                                          Width: =40
                              - con_ActionHeaderNhapTuSanXuat_3:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    Visible: =scrNhapKhac.Size <> 1
                                  Children:
                                    - btn_RefreshNhapTuSanXuat_3:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: =Refresh('QLK List Production Receipt Details')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                                    - btn_RefreshNhapTuSanXuat_5:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Database"
                                          OnSelect: |-
                                            =UpdateContext({varShowPopupGetImportData: true});
                                            Reset(Combobox1);
                                            Reset(Combobox1_1);
                                          Size: =fxFontSizeMD
                                          Text: ="Đồng bộ"
                                          Visible: |-
                                            =varUserInPlant.Role = "FG_WH" ||     // FG_WH         - Thủ kho thành phẩm
                                            varUserInPlant.Role = "VHSX_HO"        // VHSX_HO       - VHSX HO
                                          Width: =120
                                    - btn_RefreshNhapTuSanXuat_8:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Send"
                                          OnSelect: |-
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn gửi " & CountRows(col_GallarySelectedNhapKhac) & " bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận gửi",
                                                        Subtitle: "Hành động này sẽ đánh dấu các bản ghi đã chọn là đã gửi.",
                                                        ConfirmButton: "Gửi",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),

                                                // Hiển thị popup xử lý
                                                UpdateContext({varShowPopupProcessing: true});

                                                IfError(
                                                    // Xóa collection tạm dùng để cập nhật dữ liệu
                                                    Clear(col_UpdateGallarySelectedNhapKhac);

                                                    // Chuẩn bị dữ liệu Patch
                                                    ForAll(
                                                        col_GallarySelectedNhapKhac As item,
                                                        Collect(
                                                            col_UpdateGallarySelectedNhapKhac,
                                                            {
                                                                ID: item.ID,
                                                                isSent: true
                                                            }
                                                        )
                                                    );

                                                    // Cập nhật trạng thái đã gửi
                                                    Patch(
                                                        'QLK List Production Receipt Details',
                                                        col_UpdateGallarySelectedNhapKhac
                                                    );

                                                    // Gửi email/thông báo xác nhận nhập kho
                                                    'QLK|NotifyWarehouseReceiptConfirmation'.Run(
                                                        "",
                                                        0,
                                                        varUserInPlant.PlantName,
                                                        "OTHER",
                                                        "DRAFT",
                                                        Text(DatePicker1_4.SelectedDate, "yyyy-mm-dd"),
                                                        varUserInPlant.PlantCode,
                                                        LookUp(col_ProductCategories, ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_6.Selected.ProductCategoryCode).ProductCategoryNameVI
                                                    ),

                                                    // Xử lý khi lỗi
                                                    Notify(
                                                        "Gửi không thành công",
                                                        NotificationType.Error,
                                                        2000
                                                    ),

                                                    // Xử lý khi thành công
                                                    Notify(
                                                        "Gửi thành công",
                                                        NotificationType.Success,
                                                        2000
                                                    );

                                                    // Tải lại dữ liệu
                                                    Refresh('QLK List Production Receipt Details')
                                                );

                                                // Ẩn popup xử lý
                                                UpdateContext({varShowPopupProcessing: false});

                                                // Xóa danh sách record đã chọn
                                                Clear(col_GallarySelectedNhapKhac)
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Gửi"
                                          Visible: |-
                                            =CountRows(Filter(col_GallarySelectedNhapKhac,!isSent)) > 0 && 
                                            (
                                                varUserInPlant.Role = "FG_WH" ||     // FG_WH         - Thủ kho thành phẩm
                                                varUserInPlant.Role = "VHSX_HO"        // VHSX_HO       - VHSX HO
                                            )
                                          Width: =120
                                    - btn_RefreshNhapTuSanXuat_6:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="CheckmarkCircle"
                                          OnSelect: |-
                                            =// ============================================================
                                            // Xác nhận từ kho các bản ghi Nhập khác đã chọn
                                            // ============================================================
                                            If(
                                                // ── Hỏi xác nhận trước khi thực hiện ─────────────────────
                                                Confirm(
                                                    "Bạn có chắc muốn xác nhận các bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận",
                                                        Subtitle: "Có " & CountRows(col_GallarySelectedNhapKhac) & " bản ghi được chọn. Hành động này sẽ đánh dấu các bản ghi này là đã xác nhận từ kho.",
                                                        ConfirmButton: "Xác nhận",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),

                                                // ── Người dùng đồng ý → bắt đầu xử lý ────────────────────

                                                // 1. Hiện popup loading
                                                UpdateContext({varShowPopupProcessing: true});

                                                // 2. Xóa payload của lần xác nhận trước
                                                Clear(col_updateStatusNhapKhac);

                                                // 3. Xử lý xác nhận
                                                //    - Giá trị 1: chuỗi thao tác cần chạy (chuẩn bị payload, ghi SharePoint)
                                                //    - Giá trị 2: chạy khi có lỗi      → báo "Xác nhận không thành công"
                                                //    - Giá trị 3: chạy khi thành công  → báo thành công, gửi thông báo, làm mới, dọn dẹp
                                                IfError(

                                                    // [1] Chuẩn bị payload: mỗi bản ghi đã chọn → ConfirmFromWarehouse = true
                                                    ForAll(
                                                        col_GallarySelectedNhapKhac As item,
                                                        Collect(
                                                            col_updateStatusNhapKhac,
                                                            {
                                                                ID: item.ID,
                                                                ConfirmFromWarehouse: true
                                                            }
                                                        )
                                                    );

                                                    // [2] Ghi ConfirmFromWarehouse = true lên SharePoint
                                                    Patch(
                                                        'QLK List Production Receipt Details',
                                                        col_updateStatusNhapKhac
                                                    ),

                                                    // Nhánh lỗi
                                                    Notify("Xác nhận không thành công", NotificationType.Error, 2000),

                                                    // Nhánh thành công
                                                    // [3] Thông báo thành công
                                                    Notify("Đã xác nhận thành công!", NotificationType.Success, 2000);

                                                    // [4] Gửi thông báo cho kho
                                                    'QLK|NotifyWarehouseReceiptConfirmation'.Run(
                                                        "",
                                                        0,
                                                        varUserInPlant.PlantName,
                                                        "OTHER",
                                                        "APPROVED",
                                                        Text(DatePicker1_4.SelectedDate, "yyyy-mm-dd"),
                                                        varUserInPlant.PlantCode,
                                                        LookUp(col_ProductCategories, ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_6.Selected.ProductCategoryCode).ProductCategoryNameVI
                                                    );

                                                    // [5] Làm mới dữ liệu và dọn dẹp
                                                    Refresh('QLK List Production Receipt Details');
                                                    Clear(col_GallarySelectedNhapKhac);
                                                    Clear(col_updateStatusNhapKhac)
                                                );

                                                // 4. Ẩn loading
                                                UpdateContext({varShowPopupProcessing: false})
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xác nhận"
                                          Visible: =CountRows(Filter(col_GallarySelectedNhapKhac,isSent)) > 0 && varUserInPlant.Role = "FG_SUP"
                                          Width: =120
                                    - btn_RefreshNhapTuSanXuat_7:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Delete"
                                          OnSelect: |
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xóa các bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận xóa",
                                                        Subtitle: "Có " & CountRows(col_GallarySelectedNhapKhac) & " bản ghi được chọn. Hành động này không thể hoàn tác.",
                                                        ConfirmButton: "Xóa",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),
                                                UpdateContext({varShowPopupProcessing: true});
                                                IfError(
                                                    // Đếm trên collection cục bộ; phạm vi luôn giới hạn theo nhà máy và loại nhập khác.
                                                    ClearCollect(col_DeleteScopeNhapKhac, Filter('QLK List Production Receipt Details', ReceiptTypeCode = "OTHER", PlantCode = varUserInPlant.PlantCode));
                                                    If(
                                                        // Chọn hết, không lọc và chưa chạm ngưỡng 500 dòng mới xóa theo phạm vi.
                                                        CountRows(col_GallarySelectedNhapKhac) = CountRows(gal_NhapKhac_1.AllItems) &&
                                                        IsBlank(txt_SearchNhapTuSanXuat_3.Text) &&
                                                        IsBlank(DatePicker1_4.SelectedDate) &&
                                                        IsBlank(cbo_FilterProductTypeNhapTuSanXuat_6.Selected) &&
                                                        CountRows(col_GallarySelectedNhapKhac) = CountRows(col_DeleteScopeNhapKhac) &&
                                                        CountRows(Filter(col_DeleteScopeNhapKhac, !(ID in col_GallarySelectedNhapKhac.ID))) = 0 &&
                                                        CountRows(col_GallarySelectedNhapKhac) > 0 && CountRows(col_DeleteScopeNhapKhac) < 500,
                                                        RemoveIf(
                                                            'QLK List Production Receipt Details',
                                                            ReceiptTypeCode = "OTHER",
                                                            PlantCode = varUserInPlant.PlantCode
                                                        ),
                                                        // Chọn một phần → giữ xóa theo ID, không bỏ sót dòng ngoài giới hạn collection
                                                        ForAll(col_GallarySelectedNhapKhac As item, Remove('QLK List Production Receipt Details', LookUp('QLK List Production Receipt Details', ID = item.ID)))
                                                    ),
                                                    Notify("Xóa không thành công", NotificationType.Error, 2000),
                                                    Notify("Đã xóa thành công!", NotificationType.Success, 2000);
                                                    Refresh('QLK List Production Receipt Details');
                                                    Clear(col_GallarySelectedNhapKhac)
                                                );
                                                UpdateContext({varShowPopupProcessing: false})
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xóa"
                                          Visible: |-
                                            =CountRows(col_GallarySelectedNhapKhac) > 0 && 
                                            (
                                                varUserInPlant.Role = "FG_WH" ||     // FG_WH         - Thủ kho thành phẩm
                                                varUserInPlant.Role = "VHSX_HO"        // VHSX_HO       - VHSX HO
                                            )
                                          Width: =120
                                    - btn_RefreshNhapTuSanXuat_9:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="DismissCircle"
                                          OnSelect: |-
                                            =// ============================================================
                                            // Gửi các bản ghi Nhập khác đã chọn
                                            // ============================================================
                                            If(
                                                // ── Hỏi xác nhận trước khi gửi ───────────────────────────
                                                Confirm(
                                                    "Bạn có chắc muốn từ chối " & CountRows(col_GallarySelectedNhapKhac) & " bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận gửi",
                                                        Subtitle: "Hành động này sẽ đánh dấu các bản ghi đã chọn là đã gửi.",
                                                        ConfirmButton: "Gửi",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),

                                                // ── Người dùng đồng ý → bắt đầu xử lý ────────────────────

                                                // 1. Hiện popup loading
                                                UpdateContext({varShowPopupProcessing: true});

                                                // 2. Xử lý gửi
                                                //    - Giá trị 1: chuỗi thao tác cần chạy (chuẩn bị payload, ghi SharePoint, gửi thông báo)
                                                //    - Giá trị 2: chạy khi có lỗi  → báo "Từ chối không thành công"
                                                //    - Giá trị 3: chạy khi thành công → báo "Đã từ chối" và làm mới dữ liệu
                                                IfError(

                                                    // [1] Chuẩn bị payload: mỗi bản ghi đã chọn → isSent = true
                                                    Clear(col_UpdateGallarySelectedNhapKhac);
                                                    ForAll(
                                                        col_GallarySelectedNhapKhac As item,
                                                        Collect(
                                                            col_UpdateGallarySelectedNhapKhac,
                                                            {
                                                                ID: item.ID,
                                                                isSent: false
                                                            }
                                                        )
                                                    );

                                                    // [2] Ghi isSent = true lên SharePoint
                                                    Patch(
                                                        'QLK List Production Receipt Details',
                                                        col_UpdateGallarySelectedNhapKhac
                                                    );

                                                    // [3] Gửi thông báo cho kho
