Screens:
  scrNhapTuSanXuat:
    Properties:
      OnVisible: =varShowMenuUser && scrNhapTuSanXuat.Size <> 1
    Children:
      - con_MainNhapTuSanXuat:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuNhapTuSanXuat:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrNhapTuSanXuat.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarNhapTuSanXuat:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainNhapTuSanXuat:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderNhapTuSanXuat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderNhapTuSanXuat:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrNhapTuSanXuat.Size
                  - con_BodyNhapTuSanXuat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderNhapTuSanXuat.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentNhapTuSanXuat:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrDanhMucBin.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_ActionHeaderNhapTuSanXuat:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - btn_AddNhapTuSanXuat:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =Set(
                                                varProductionReceiptDetail,
                                                {}
                                            );
                                            Reset(dp_ReceiptDate);
                                            Reset(cmb_Shift);
                                            Reset(cmb_ProductType);
                                            Navigate(
                                                scrNhapTuSanXuatForm,
                                                ScreenTransition.CoverRight
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                          Visible: |
                                            =varUserInPlant.Role = "SHIFT_LEADER" || // SHIFT_LEADER  - Trưởng ca
                                            varUserInPlant.Role = "PROD_STAT"  || // PROD_STAT     - Thống kê sản xuất
                                            varUserInPlant.Role = "PROD_ASST" || // PROD_ASST     - Trợ lý sản xuất
                                            varUserInPlant.Role = "FG_SUP"  || // FG_SUP        - Giám sát thành phẩm
                                            varUserInPlant.Role = "VHSX_HO"     // VHSX_HO       - VHSX HO
                                    - btn_RefreshNhapTuSanXuat:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: |
                                            =Refresh('QLK List Production Receipts');
                                            Refresh('QLK List Production Receipt Details');
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                              - lbl_TitleNhapTuSanXuat:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Nhập từ sản xuất"
                              - con_FilterNhapTuSanXuatV2:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    BorderThickness: =If(scrNhapTuSanXuat.Size = 1, 1, 0)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(scrNhapTuSanXuat.Size = 1, RGBA(248, 250, 252, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =0
                                    Height: =If(scrNhapTuSanXuat.Size = 1, 60, 52)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =If(scrNhapTuSanXuat.Size = 1, 8, 10)
                                    PaddingBottom: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    PaddingRight: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    PaddingTop: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    RadiusBottomLeft: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    RadiusBottomRight: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                    RadiusTopRight: =If(scrNhapTuSanXuat.Size = 1, 8, 5)
                                  Children:
                                    - txt_SearchNhapTuSanXuatV2:
                                        Control: ModernTextInput
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          FillPortions: =If(scrNhapTuSanXuat.Size = 1, 1, 3)
                                          Font: =fxFontFamily
                                          Height: =40
                                          LayoutMinWidth: =If(scrNhapTuSanXuat.Size = 1, 16, 200)
                                          Placeholder: =If(scrNhapTuSanXuat.Size = 1, "Tìm kiếm mã phiếu...", "Mã phiếu nhập...")
                                    - dp_FromNhapTuSanXuatV2:
                                        Control: ModernDatePicker
                                        Properties:
                                          DefaultDate: =Blank()
                                          FillPortions: =2
                                          Format: =DatePickerFormat.Short
                                          Height: =40
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =140
                                          Placeholder: ="Từ ngày"
                                          Visible: =scrNhapTuSanXuat.Size <> 1
                                          Width: =150
                                    - lbl_DateDashNhapTuSanXuatV2:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          Font: =fxFontFamily
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Text: ="-"
                                          Visible: =scrNhapTuSanXuat.Size <> 1
                                          Width: =12
                                    - dp_ToNhapTuSanXuatV2:
                                        Control: ModernDatePicker
                                        Properties:
                                          DefaultDate: =Blank()
                                          FillPortions: =2
                                          Format: =DatePickerFormat.Short
                                          Height: =40
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =140
                                          Placeholder: ="Đến ngày"
                                          Visible: =scrNhapTuSanXuat.Size <> 1
                                          Width: =150
                                    - cbo_StatusWebNhapTuSanXuatV2:
                                        Control: ModernCombobox
                                        Properties:
                                          FillPortions: =2
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          Height: =40
                                          InputTextPlaceholder: ="Trạng thái"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.StatusNameVI
                                          Items: =col_WorkflowStatus
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =150
                                          SelectMultiple: =false
                                          Visible: =scrNhapTuSanXuat.Size <> 1
                                          Width: =170
                                    - cbo_ShiftWebNhapTuSanXuatV2:
                                        Control: ModernCombobox
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          Height: =40
                                          InputTextPlaceholder: ="Ca"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ShiftNameVI
                                          Items: =col_ShiftName
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =100
                                          SelectMultiple: =false
                                          Visible: =scrNhapTuSanXuat.Size <> 1
                                          Width: =130
                                    - btn_FilterNhapTuSanXuatV2:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: ="Filter"
                                          OnSelect: |-
                                            =UpdateContext({varPopUpFilterNhapTuSanXuat: true})
                                          Text: ="Bộ lọc" & If((If(!IsBlank(cbo_FilterStatusNhapTuSanXuatV2.Selected), 1, 0) + If(!IsBlank(cbo_FilterShiftNhapTuSanXuatV2.Selected), 1, 0)) > 0, " (" & (If(!IsBlank(cbo_FilterStatusNhapTuSanXuatV2.Selected), 1, 0) + If(!IsBlank(cbo_FilterShiftNhapTuSanXuatV2.Selected), 1, 0)) & ")", "")
                                          Visible: =scrNhapTuSanXuat.Size = 1
                                          Width: =If(scrNhapTuSanXuat.Size = 1, 120, 120)
                                    - btn_ClearFilterNhapTuSanXuatV2:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: ="Eraser"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Reset(txt_SearchNhapTuSanXuatV2);
                                            Reset(dp_FromNhapTuSanXuatV2);
                                            Reset(dp_ToNhapTuSanXuatV2);
                                            Reset(cbo_StatusWebNhapTuSanXuatV2);
                                            Reset(cbo_ShiftWebNhapTuSanXuatV2)
                                          Text: ="Xóa lọc"
                                          Visible: =scrNhapTuSanXuat.Size <> 1
                                          Width: =110
                              - con_ListNhapTuSanXuat:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =If(scrNhapTuSanXuat.Size = 1, DropShadow.None, DropShadow.Semibold)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 0, 5)
                                    RadiusTopRight: =6
                                    Width: =Parent.Width - Parent.PaddingLeft * 2
                                  Children:
                                    - con_InnerNhapTuSanXuat:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Start
                                          BorderStyle: =BorderStyle.None
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          Width: |-
                                            =If(
                                                scrNhapTuSanXuat.Size = 1,
                                                Parent.Width,
                                                Max(
                                                    Parent.Width,
                                                    1300
                                                )
                                            )
                                        Children:
                                          - con_TableHeaderNhapTuSanXuat:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(250, 250, 250, 1)
                                                FillPortions: =0
                                                Height: =46
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =5
                                                PaddingLeft: =10
                                                PaddingRight: =10
                                                Visible: =scrNhapTuSanXuat.Size <> 1
                                              Children:
                                                - lbl_HeaderReceiptCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Mã phiếu nhập"
                                                      Width: =Parent.Width * 0.18
                                                      Wrap: =false
                                                - lbl_HeaderReceiptDate:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Ngày nhập"
                                                      Width: =Parent.Width * 0.15
                                                      Wrap: =false
                                                - lbl_HeaderStatusCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Trạng thái"
                                                      Width: =Parent.Width * 0.18
                                                      Wrap: =false
                                                - lbl_HeaderShift:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Ca"
                                                      Width: =Parent.Width * 0.1
                                                      Wrap: =false
                                                - lbl_HeaderLoaiSanPhamNhap:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Loại sản phẩm"
                                                      Width: =Parent.Width * 0.15
                                                      Wrap: =false
                                                - lbl_HeaderTongNhap:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Tổng nhập"
                                                      Width: =Parent.Width * 0.1
                                                      Wrap: =false
                                                - lbl_HeaderActionNhapTuSanXuat:
                                                    Control: ModernText
                                                    Properties:
                                                      FillPortions: =1
                                                      Font: =fxFontFamily
                                                      FontWeight: =fxFontWeightBold
                                                      Size: =fxFontSizeMD
                                                      Text: ="Thao tác"
                                                      Width: =100
                                                      Wrap: =false
                                          - gal_NhapTuSanXuat:
                                              Control: Gallery
                                              Variant: Vertical
                                              Properties:
                                                BorderStyle: =BorderStyle.None
                                                Height: =Parent.Height - con_TableHeaderNhapTuSanXuat.Height - lbl_TotalRowsNhapTuSanXuat.Height
                                                Items: |-
                                                  =// Chỉ lấy các cột đang hiển thị trên danh sách (nhanh hơn); sắp xếp trước rồi mới ShowColumns
                                                  ShowColumns(
                                                      SortByColumns(
                                                          Filter(
                                                              'QLK List Production Receipts',
                                                              PlantCode = varUserInPlant.PlantCode,
                                                              IsBlank(txt_SearchNhapTuSanXuatV2.Text) || StartsWith(ReceiptCode, txt_SearchNhapTuSanXuatV2.Text),
                                                              IsBlank(varUserInPlant.ProductCategoryCode) || ProductCategoryCode = varUserInPlant.ProductCategoryCode,
                                                              // Bộ lọc nâng cao trong popup Lọc
                                                              IsBlank(dp_FromNhapTuSanXuatV2.SelectedDate) || ReceiptDate >= dp_FromNhapTuSanXuatV2.SelectedDate,
                                                              IsBlank(dp_ToNhapTuSanXuatV2.SelectedDate) || ReceiptDate <= dp_ToNhapTuSanXuatV2.SelectedDate,
                                                              IsBlank(cbo_StatusWebNhapTuSanXuatV2.Selected) || StatusCode = cbo_StatusWebNhapTuSanXuatV2.Selected.StatusCode,
                                                              IsBlank(cbo_ShiftWebNhapTuSanXuatV2.Selected) || Shift = cbo_ShiftWebNhapTuSanXuatV2.Selected.ShiftNo,
                                                              IsBlank(cbo_FilterStatusNhapTuSanXuatV2.Selected) || StatusCode = cbo_FilterStatusNhapTuSanXuatV2.Selected.StatusCode,
                                                              IsBlank(cbo_FilterShiftNhapTuSanXuatV2.Selected) || Shift = cbo_FilterShiftNhapTuSanXuatV2.Selected.ShiftNo
                                                          ),
                                                          "Created",
                                                          SortOrder.Descending
                                                      ),
                                                      ID,
                                                      ReceiptCode,
                                                      ReceiptDate,
                                                      Shift,
                                                      StatusCode,
                                                      ProductCategoryCode,
                                                      TotalReceipt
                                                  )
                                                ShowScrollbar: =false
                                                TemplateSize: |-
                                                  =If(
                                                      scrNhapTuSanXuat.Size = 1,
                                                      200,
                                                      45
                                                  )
                                                Width: =Parent.Width
                                              Children:
                                                - con_RowDividerNhapTuSanXuat:
                                                    Control: GroupContainer
                                                    Variant: ManualLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(229, 231, 235, 1)
                                                      Height: =1
                                                      Visible: =scrNhapTuSanXuat.Size <> 1
                                                      Width: =Parent.Width - 10
                                                      Y: =gal_NhapTuSanXuat.TemplateHeight
                                                - con_RowMasterNhapTuSanXuat:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =RGBA(229, 231, 235, 1)
                                                      BorderStyle: =If(scrNhapTuSanXuat.Size = 1, BorderStyle.Solid, BorderStyle.None)
                                                      BorderThickness: =1
                                                      DropShadow: =If(scrNhapTuSanXuat.Size = 1, DropShadow.Light, DropShadow.None)
                                                      Fill: =If(scrNhapTuSanXuat.Size = 1, RGBA(255, 255, 255, 1), RGBA(0, 0, 0, 0))
                                                      Height: =If(scrNhapTuSanXuat.Size = 1, gal_NhapTuSanXuat.TemplateHeight - 8, gal_NhapTuSanXuat.TemplateHeight)
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: |-
                                                        =If(
                                                            scrNhapTuSanXuat.Size = 1,
                                                            LayoutDirection.Vertical,
                                                            LayoutDirection.Horizontal
                                                        )
                                                      LayoutGap: =If(scrNhapTuSanXuat.Size = 1, 5, 0)
                                                      PaddingBottom: =If(scrNhapTuSanXuat.Size = 1, 8, 0)
                                                      PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 8, 0)
                                                      PaddingRight: =If(scrNhapTuSanXuat.Size = 1, 8, 0)
                                                      PaddingTop: =If(scrNhapTuSanXuat.Size = 1, 8, 0)
                                                      RadiusBottomLeft: =If(scrNhapTuSanXuat.Size = 1, 10, 0)
                                                      RadiusBottomRight: =If(scrNhapTuSanXuat.Size = 1, 10, 0)
                                                      RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 10, 0)
                                                      RadiusTopRight: =If(scrNhapTuSanXuat.Size = 1, 10, 0)
                                                      Width: =Parent.Width - 10
                                                    Children:
                                                      - con_RowNhapTuSanXuat:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            BorderColor: =RGBA(229, 231, 235, 1)
                                                            DropShadow: =DropShadow.None
                                                            Fill: =RGBA(255, 255, 255, 1)
                                                            FillPortions: =0
                                                            Height: |-
                                                              =If(
                                                                  scrNhapTuSanXuat.Size = 1,
                                                                  gal_NhapTuSanXuat.TemplateHeight - 8 - 16 - 5 - con_MobileActionNhapTuSanXuat.Height,
                                                                  48
                                                              )
                                                            LayoutAlignItems: =If(scrNhapTuSanXuat.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                            LayoutDirection: =If(scrNhapTuSanXuat.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                            LayoutGap: =If(scrNhapTuSanXuat.Size = 1, 6, 5)
                                                            LayoutMinHeight: =10
                                                            PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 14, 5)
                                                            PaddingRight: =If(scrNhapTuSanXuat.Size = 1, 14, 5)
                                                            PaddingTop: =If(scrNhapTuSanXuat.Size = 1, 12, 5)
                                                            Width: |-
                                                              =If(
                                                                  scrNhapTuSanXuat.Size = 1,
                                                                  Parent.Width - Parent.PaddingLeft - Parent.PaddingRight,
                                                                  Parent.Width - Parent.PaddingRight * 2 - Parent.LayoutGap - 10
                                                              )
                                                          Children:
                                                            - con_CardHeadNhapTuSanXuat:
                                                                Control: GroupContainer
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  AlignInContainer: =AlignInContainer.SetByContainer
                                                                  DropShadow: =DropShadow.None
                                                                  FillPortions: =0
                                                                  Height: =114
                                                                  LayoutDirection: =LayoutDirection.Horizontal
                                                                  LayoutGap: =12
                                                                  LayoutMinHeight: =16
                                                                  LayoutMinWidth: =16
                                                                  Visible: =scrNhapTuSanXuat.Size = 1
                                                                  Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                                                Children:
                                                                  - con_CardIconNhapTuSanXuat:
                                                                      Control: GroupContainer
                                                                      Variant: AutoLayout
                                                                      Properties:
                                                                        AlignInContainer: =AlignInContainer.Start
                                                                        DropShadow: =DropShadow.None
                                                                        Fill: =RGBA(232, 245, 233, 1)
                                                                        FillPortions: =0
                                                                        Height: =52
                                                                        LayoutAlignItems: =LayoutAlignItems.Center
                                                                        LayoutDirection: =LayoutDirection.Horizontal
                                                                        LayoutJustifyContent: =LayoutJustifyContent.Center
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                        RadiusBottomLeft: =12
                                                                        RadiusBottomRight: =12
                                                                        RadiusTopLeft: =12
                                                                        RadiusTopRight: =12
                                                                        Width: =52
                                                                      Children:
                                                                        - btn_CardIconNhapTuSanXuat:
                                                                            Control: ModernButton
                                                                            Properties:
                                                                              Appearance: =ButtonAppearance.Transparent
                                                                              BasePaletteColor: =RGBA(45, 128, 40, 1)
                                                                              Color: =RGBA(45, 128, 40, 1)
                                                                              Height: =40
                                                                              Icon: ="BoxMultiple"
                                                                              Layout: =ButtonLayout.IconOnly
                                                                              LayoutMinHeight: =16
                                                                              LayoutMinWidth: =16
                                                                              Width: =40
                                                                  - con_CardInfoNhapTuSanXuat:
                                                                      Control: GroupContainer
                                                                      Variant: AutoLayout
                                                                      Properties:
                                                                        DropShadow: =DropShadow.None
                                                                        Height: =114
                                                                        LayoutAlignItems: =LayoutAlignItems.Stretch
                                                                        LayoutDirection: =LayoutDirection.Vertical
                                                                        LayoutGap: =4
                                                                        LayoutMinHeight: =16
                                                                        LayoutMinWidth: =16
                                                                      Children:
                                                                        - lbl_CardCodeNhapTuSanXuat:
                                                                            Control: ModernText
                                                                            Properties:
