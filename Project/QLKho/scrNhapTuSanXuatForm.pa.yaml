                                                                        Height: =30
                                                                        Icon: ="Delete"
                                                                        Layout: =ButtonLayout.IconOnly
                                                                        OnSelect: |-
                                                                          =If(
                                                                              Confirm(
                                                                                  "Bạn có chắc muốn xóa bản ghi này không?",
                                                                                  {
                                                                                      Title: "Xác nhận xóa",
                                                                                      Subtitle: "Hành động này không thể hoàn tác.",
                                                                                      ConfirmButton: "Xóa",
                                                                                      CancelButton: "Hủy"
                                                                                  }
                                                                              ),
                                                                              With(
                                                                                  // Giữ lại ID Sub Bagging trước khi xóa dòng
                                                                                  {_idSubBagging: ThisItem.IDSubBagging},
                                                                                  UpdateContext({varShowPopupProcessingNhapKho: true});
