Screens:
  scrNhapTuSanXuatForm:
    Properties:
      OnVisible: |-
        =Set(
            varSelectedWarehouseTab,
            LookUp(
                col_WarehouseFormTabs,
                Code = "GENERAL"
            )
        );
        Clear(col_SelectedHangBao);
        Clear(col_SelectedHangXa);
        Clear(col_SelectedBIGBAG);
    Children:
      - con_MainNhapTuSanXuatForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderNhapTuSanXuatForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - HeaderFormNhapTuSanXuat:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrNhapTuSanXuatForm.Size
            - con_BodyNhapTuSanXuatForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderNhapTuSanXuatForm.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_BodyMenuNhapTuSanXuatForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        Height: =con_BodyMainNhapTuSanXuatForm.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Visible: =scrNhapTuSanXuatForm.Size <> 1
                        Width: |-
                          =If(
                              varShowMenuUser,
                              240,
                              0
                          )
                      Children:
                        - NavSiderBarNhapTuSanXuatForm:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =Parent.Height - 10
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainNhapTuSanXuatForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: |-
                          =If(
                              !varShowMenuUser,
                              DropShadow.None,
                              DropShadow.Semibold
                          )
                        Fill: =RGBA(250, 250, 251, 1)
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                        RadiusTopRight: =5
                      Children:
                        - con_FormNhapTuSanXuatButton:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =45
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Width: =Parent.Width - 25
                              X: =40
                              Y: =40
                            Children:
                              - btn_BackNhapTuSanXuatForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Icon: ="ChevronLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Back()
                                    Width: =30
                              - btn_SaveNhapTuSanXuatForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Save"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =With(
                                          {
                                              // Phiếu cùng plant + ngày + ca + loại sản phẩm (nếu có)
                                              _dup: LookUp(
                                                  'QLK List Production Receipts',
                                                  PlantCode           = varUserInPlant.PlantCode &&
                                                  ReceiptDate         = dp_ReceiptDate.SelectedDate &&
                                                  Shift               = cmb_Shift.Selected.ShiftNo &&
                                                  ProductCategoryCode = cmb_ProductType.Selected.ProductCategoryCode
                                              )
                                          },
                                          If(
                                              IsBlank(dp_ReceiptDate.SelectedDate),
                                              Notify("Vui lòng chọn ngày nhập", NotificationType.Warning, 2000),

                                              IsBlank(cmb_Shift.Selected.ShiftNo),
                                              Notify("Vui lòng chọn ca", NotificationType.Warning, 2000),

                                              IsBlank(cmb_ProductType.Selected.ProductCategoryCode),
                                              Notify("Vui lòng chọn loại sản phẩm", NotificationType.Warning, 2000),

                                              // CHECK DUPLICATE: áp dụng cả khi tạo mới và khi sửa (bỏ qua chính phiếu đang sửa)
                                              !IsBlank(_dup.ID) && _dup.ID <> Coalesce(varProductionReceiptDetail.ID, 0),
                                              Notify("Phiếu nhập đã tồn tại cho ngày, ca và loại sản phẩm này", NotificationType.Warning, 2000),

                                              // Tất cả validate pass → thực hiện lưu (cả tạo mới lẫn cập nhật)
                                              Select(btn_PatchNhapTuSanXuat)
                                          )
                                      )
                                    Text: ="Lưu"
                                    Visible: |
                                      =(varProductionReceiptDetail.StatusCode = "DRAFT" || IsBlank(varProductionReceiptDetail.ID)) &&
                                      (varUserInPlant.Role = Index(col_RoleUser,15).RoleCode                                      || // SHIFT_LEADER  - Trưởng ca
                                      varUserInPlant.Role = Index(col_RoleUser,6).RoleCode                                        || // PROD_STAT     - Thống kê sản xuất
                                      varUserInPlant.Role = Index(col_RoleUser,12).RoleCode                                       || // PROD_ASST     - Trợ lý sản xuất
                                      varUserInPlant.Role = Index(col_RoleUser,9).RoleCode)                                          // VHSX_HO       - VHSX HO
                              - btn_SendNhapTuSanXuatForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Send"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |
                                      =With(
                                          {
                                              _count: Filter(
                                                      'QLK List Production Receipt Details',
                                                      ReceiptID = varProductionReceiptDetail.ID
                                                  )
                                          },
                                          If(
                                              CountRows(_count) > 0,
                                              UpdateContext({con_PopupConfirmSubmit: true}),
                                              Notify("Chưa có dữ liệu chi tiết, vui lòng nhập trước khi gửi duyệt.", NotificationType.Warning, 2000)
                                          )
                                      )
                                    Text: ="Gửi"
                                    Visible: |-
                                      =// Chỉ cho phép thao tác khi phiếu đang ở trạng thái nháp
                                      varProductionReceiptDetail.StatusCode = "DRAFT" && (varUserInPlant.Role = Index(col_RoleUser,15).RoleCode || varUserInPlant.Role = Index(col_RoleUser,6).RoleCode || varUserInPlant.Role = Index(col_RoleUser,12).RoleCode)
                              - btn_RefreshNhapTuSanXuatForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="ArrowClockwise"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Refresh('QLK List Production Receipts');
                                      Refresh('QLK List Production Receipt Details');
                                      Set(varProductionReceiptDetail,LookUp('QLK List Production Receipts',ID = varProductionReceiptDetail.ID));
                                    Text: ="Làm mới"
                                    Width: =120
                              - btn_PatchNhapTuSanXuat:
                                  Control: ModernButton
                                  Properties:
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =With(
                                          {
                                              // ── Thông tin đầu vào từ user / control ─────────────────────────
                                              vPlantCode:      varUserInPlant.PlantCode,
                                              vPlantName:      varUserInPlant.PlantName,
                                              vReceiptDate:    dp_ReceiptDate.SelectedDate,
                                              vReceiptDateKey: Text(dp_ReceiptDate.SelectedDate, "yyyymmdd"),
                                              vCategoryCode:   cmb_ProductType.Selected.ProductCategoryCode,

                                              // Chưa có ID → đang tạo mới; có ID → đang cập nhật
                                              vIsCreateMode:   IsBlank(varProductionReceiptDetail.ID)
                                          },
                                          If(
                                              vIsCreateMode,

                                              // ============================================================
                                              // TẠO MỚI PHIẾU NHẬP (đã kiểm tra trùng ở nút Lưu)
                                              // ============================================================
                                              With(
                                                  {
                                                      // Số thứ tự = số cuối của phiếu mới nhất (ID lớn nhất) cùng Plant + Loại sản phẩm + 1
                                                      // → không bị trùng khi có phiếu bị xóa hoặc số phiếu vượt giới hạn delegation
                                                      vLastCode: First(
                                                          SortByColumns(
                                                              Filter(
                                                                  'QLK List Production Receipts',
                                                                  PlantCode = vPlantCode,
                                                                  ProductCategoryCode = vCategoryCode
                                                              ),
                                                              "ID",
                                                              SortOrder.Descending
                                                          )
                                                      ).ReceiptCode
                                                  },
                                                  With(
                                                      {
                                                          // Mã phiếu: GR-yyyymmdd-<số thứ tự 7 chữ số>
                                                          vReceiptCode:
                                                              "GR-" & vReceiptDateKey & "-" &
                                                              Text(Coalesce(Value(Last(Split(vLastCode, "-")).Value), 0) + 1, "0000000")
                                                      },
                                                      IfError(
                                                          // Tạo phiếu và lưu bản ghi vừa tạo vào biến
                                                          Set(
                                                              varProductionReceiptDetail,
                                                              Patch(
                                                                  'QLK List Production Receipts',
                                                                  Defaults('QLK List Production Receipts'),
                                                                  {
                                                                      ReceiptCode:         vReceiptCode,
                                                                      ReceiptDate:         vReceiptDate,
                                                                      StatusCode:          cmb_StatusCode.Selected.StatusCode,
                                                                      Shift:               cmb_Shift.Selected.ShiftNo,
                                                                      ProductCategoryCode: vCategoryCode,
                                                                      PlantCode:           vPlantCode,
                                                                      PlantName:           vPlantName
                                                                  }
                                                              )
                                                          );

                                                          // Ghi audit log cho hành động tạo phiếu
                                                          Patch(
                                                              'QLK List Audit Log',
                                                              Defaults('QLK List Audit Log'),
                                                              {
                                                                  ActionBy:   varCurrentUser.FullName,
                                                                  ActionCode: Index(col_Action, 1).ActionCode,
                                                                  ReceiptID:  varProductionReceiptDetail.ID
                                                              }
                                                          );

                                                          // Thành công
                                                          Notify("Tạo phiếu nhập thành công: " & vReceiptCode, NotificationType.Success, 2000),

                                                          // Có lỗi ở bất kỳ bước nào ở trên
                                                          Notify("Không thể tạo phiếu nhập", NotificationType.Error, 2000)
                                                      )
                                                  )
                                              ),

                                              // ============================================================
                                              // CẬP NHẬT PHIẾU NHẬP (giữ nguyên mã phiếu)
                                              // ============================================================
                                              IfError(
                                                  Set(
                                                      varProductionReceiptDetail,
                                                      Patch(
                                                          'QLK List Production Receipts',
                                                          varProductionReceiptDetail,
                                                          {
                                                              ReceiptDate:         vReceiptDate,
                                                              StatusCode:          cmb_StatusCode.Selected.StatusCode,
                                                              Shift:               cmb_Shift.Selected.ShiftNo,
                                                              ProductCategoryCode: vCategoryCode,
                                                              PlantCode:           vPlantCode,
                                                              PlantName:           vPlantName
                                                          }
                                                      )
                                                  );
                                                  Notify("Cập nhật phiếu nhập thành công", NotificationType.Success, 2000),

                                                  Notify("Không thể cập nhật phiếu nhập", NotificationType.Error, 2000)
                                              )
                                          )
                                      )
                                    Visible: =false
                              - btn_ConfirmReceipt:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =UpdateContext({varShowPopupConfirmReceipt:true})
                                    Text: ="Xác nhận "
                                    Visible: |-
                                      =varProductionReceiptDetail.StatusCode = Index(col_WorkflowStatus, 20).StatusCode &&
                                      (varUserInPlant.Role = Index(col_RoleUser, 16).RoleCode || varUserInPlant.Role = Index(col_RoleUser, 1).RoleCode) &&
                                      With(
                                          {
                                              dataCheck: Filter(
                                                  'QLK List Production Receipt Details',
                                                  ReceiptID = varProductionReceiptDetail.ID
                                              )
                                          },
                                          Switch(
                                              varUserInPlant.Role,
                                              Index(col_RoleUser, 1).RoleCode,   // FG_WH - Thủ kho thành phẩm
                                              CountRows(
                                                  Filter(
                                                      dataCheck,
                                                      (ReceiptTypeCode = Index(col_ReceiptType, 2).ReceiptTypeCode || ReceiptTypeCode = "BIGBAG"),
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0,

                                              Index(col_RoleUser, 16).RoleCode,  // FG_STAFF - Nhân viên kho thành phẩm
                                              CountRows(
                                                  Filter(
                                                      dataCheck,
                                                      ReceiptTypeCode = Index(col_ReceiptType, 1).ReceiptTypeCode,
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0
                                          )
                                      )
                                    Width: =120
                              - btn_RejectReceipt:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="DismissCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =UpdateContext({varShowPopupRejectReceipt:true})
                                    Text: ="Từ chối"
                                    Visible: |-
                                      =varProductionReceiptDetail.StatusCode = Index(col_WorkflowStatus, 20).StatusCode &&
                                      (varUserInPlant.Role = Index(col_RoleUser, 16).RoleCode || varUserInPlant.Role = Index(col_RoleUser, 1).RoleCode) &&
                                      With(
                                          {
                                              dataCheck: Filter(
                                                  'QLK List Production Receipt Details',
                                                  ReceiptID = varProductionReceiptDetail.ID
                                              )
                                          },
                                          Switch(
                                              varUserInPlant.Role,
                                              Index(col_RoleUser, 1).RoleCode,   // FG_WH - Thủ kho thành phẩm
                                              CountRows(
                                                  Filter(
                                                      dataCheck,
                                                      (ReceiptTypeCode = Index(col_ReceiptType, 2).ReceiptTypeCode || ReceiptTypeCode = "BIGBAG"),
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0,

                                              Index(col_RoleUser, 16).RoleCode,  // FG_STAFF - Nhân viên kho thành phẩm
                                              CountRows(
                                                  Filter(
                                                      dataCheck,
                                                      ReceiptTypeCode = Index(col_ReceiptType, 1).ReceiptTypeCode,
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0
                                          )
                                      )
                                    Width: =120
                              - btn_DeleteNhapTuSanXuat_2:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Icon: ="Delete"
                                    OnSelect: |-
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xóa bản ghi này không?",
                                              {
                                                  Title: "Xác nhận xóa",
                                                  Subtitle: "Hành động này không thể hoàn tác.",
                                                  ConfirmButton: "Xóa",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          UpdateContext({varShowPopupProcessing: true});

                                          // Nạp toàn bộ chi tiết của phiếu + danh sách Sub Bagging cần mở lại cờ
                                          ClearCollect(
                                              col_DetailToDelete,
                                              Filter('QLK List Production Receipt Details', ReceiptID = varProductionReceiptDetail.ID)
                                          );
                                          ClearCollect(
                                              col_SubBaggingUpdate,
                                              ForAll(
                                                  Filter(col_DetailToDelete, !IsBlank(IDSubBagging)) As item,
                                                  {ID: item.IDSubBagging, IsSubBaggingLoaded: false}
                                              )
                                          );

                                          IfError(
                                              Remove('QLK List Production Receipt Details', col_DetailToDelete),
                                              Notify("Xóa chi tiết phiếu không thành công", NotificationType.Error, 2000),

                                              If(
                                                  !IsEmpty(col_SubBaggingUpdate),
                                                  Patch('QLSX_SubBagging', col_SubBaggingUpdate)
                                              ),
                                              Notify("Không cập nhật được Sub Bagging: " & FirstError.Message, NotificationType.Error, 3000),

                                              Remove('QLK List Production Receipts', varProductionReceiptDetail),
                                              Notify("Xóa phiếu không thành công", NotificationType.Error, 2000),

                                              Notify("Xóa thành công", NotificationType.Success, 2000);
                                              Navigate(scrNhapTuSanXuat, ScreenTransition.CoverRight)
                                          );

                                          Clear(col_DetailToDelete);
                                          Clear(col_SubBaggingUpdate);
                                          UpdateContext({varShowPopupProcessing: false})
                                      )
                                    Text: ="Xóa"
                                    Visible: |-
                                      =varProductionReceiptDetail.StatusCode = Index(col_WorkflowStatus,1).StatusCode &&
                                      (varUserInPlant.Role = Index(col_RoleUser,15).RoleCode || // SHIFT_LEADER  - Trưởng ca
                                      varUserInPlant.Role = Index(col_RoleUser,6).RoleCode   || // PROD_STAT     - Thống kê sản xuất
                                      varUserInPlant.Role = Index(col_RoleUser,12).RoleCode  || // PROD_ASST     - Trợ lý sản xuất
                                      varUserInPlant.Role = Index(col_RoleUser,8).RoleCode   || // PLANT_DIR     - Giám đốc nhà máy
                                      varUserInPlant.Role = Index(col_RoleUser,9).RoleCode)     // VHSX_HO       - VHSX HO
                                    Width: =100
                        - con_tabReceipt:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =45
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Width: =Parent.Width - 25
                            Children:
                              - tab_Receipt:
                                  Control: ModernTabList
                                  Properties:
                                    Default: =LookUp(col_WarehouseFormTabs,Code = varSelectedWarehouseTab.Code)
                                    Height: =Parent.Height - 10
                                    ItemDisplayText: =ThisItem.NameVI
                                    Items: |-
                                      =If(
                                          IsBlank(varProductionReceiptDetail.ID),
                                          Filter(col_WarehouseFormTabs, Code = "GENERAL"),   // Chỉ tab Thông tin chung khi tạo mới
                                          Filter(col_WarehouseFormTabs, SortOrder <> 2)       // Sửa record: hiện tất cả trừ tab SortOrder=2
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =Set(
                                          varSelectedWarehouseTab,
                                          LookUp(col_WarehouseFormTabs, Code = Self.Selected.Code)
                                      )
                                    TabSize: =TabSize.Small
                                    Width: =Parent.Width
                        - con_BodyNhapTuSanXuat_1:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =con_FormNhapTuSanXuatButton.Height + con_ThongTinNhapTuSanXuat.Height + con_ListHangBao.Height + con_ListHangXa.Height + con_ListBigbag.Height + Self.LayoutGap  + Self.PaddingTop + Self.PaddingBottom
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMaxHeight: =con_FormNhapTuSanXuatButton.Height + con_ThongTinNhapTuSanXuat.Height + con_ListHangBao.Height + con_ListHangXa.Height + con_ListBigbag.Height + con_ListNhapKhac.Height + Self.LayoutGap * 5 + Self.PaddingTop + Self.PaddingBottom
                              LayoutMinHeight: =Parent.Height
                              LayoutMinWidth: =16
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =2
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =varSelectedWarehouseTab.Code = Index(col_WarehouseFormTabs,1).Code
                              Width: =Parent.Width - 20
                            Children:
                              - con_ThongTinNhapTuSanXuat:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: |-
                                      =If(
                                          scrNhapTuSanXuatForm.Size = 1,
                                          505,
                                          250
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =5
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    Width: =Parent.Width - 5
                                  Children:
                                    - lbl_TitleThongTinNhapTuSanXuat:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Height: =40
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =fxFontSizeXL
                                          Text: ="Thông tin nhập từ sản xuất"
                                    - con_FormFieldsNhapTuSanXuat:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: |-
                                            =If(
                                                scrNhapTuSanXuatForm.Size = 1,
                                                400,
                                                135
                                            )
                                          LayoutGap: =If(scrNhapTuSanXuatForm.Size = 1,0,5)
                                          LayoutGridColumns: |-
                                            =If(
                                                scrNhapTuSanXuatForm.Size = 1,
                                                1,
                                                3
                                            )
                                          LayoutGridRows: |-
                                            =If(
