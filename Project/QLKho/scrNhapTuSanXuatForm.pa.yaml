      - con_PopupSendNhap:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =con_PopupConfirmSubmit
            Width: =Parent.Width
          Children:
            - DialogAlertSendNhap:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({con_PopupConfirmSubmit:false})
                  varConfirmDialogAction: |-
                    =// ============================================================
                    // 1. Đóng popup xác nhận gửi, hiện popup loading
                    // ============================================================
                    UpdateContext({con_PopupConfirmSubmit: false});
                    UpdateContext({varShowPopupProcessingNhapKho: true});


                    // ============================================================
                    // 2. Cập nhật trạng thái phiếu → "Đợi kho xác nhận"
                    // ============================================================
                    Set(
                        varProductionReceiptDetail,
                        Patch(
                            'QLK List Production Receipts',
                            If(
                                IsBlank(varProductionReceiptDetail.ID),
                                Defaults('QLK List Production Receipts'),
                                varProductionReceiptDetail
                            ),
                            {
                                StatusCode: Index(col_WorkflowStatus, 20).StatusCode // "Đợi kho xác nhận"
                            }
                        )
                    );


                    // ============================================================
                    // 3. Gửi thông báo cho kho
                    // ============================================================
                    'QLK|NotifyWarehouseReceiptConfirmation'.Run(
                        varProductionReceiptDetail.ReceiptCode,
                        varProductionReceiptDetail.ID,
                        varProductionReceiptDetail.PlantName,
                        "",
                        varProductionReceiptDetail.StatusCode,
                        Text(dp_ReceiptDate.SelectedDate, "yyyy-mm-dd"),
                        varUserInPlant.PlantCode,
                        LookUp(col_ProductCategories,ProductCategoryCode = varProductionReceiptDetail.ProductCategoryCode).ProductCategoryNameVI
                    );


                    // ============================================================
                    // 4. Ghi audit log hành động submit
                    // ============================================================
                    Patch(
                        'QLK List Audit Log',
                        Defaults('QLK List Audit Log'),
                        {
                            ActionBy: varCurrentUser.FullName,
                            ActionCode: Index(col_Action, 2).ActionCode, // Gửi kho xác nhận
                            ReceiptID: varProductionReceiptDetail.ID
                        }
                    );


                    // ============================================================
                    // 5. Ẩn loading sau khi xử lý xong
                    // ============================================================
                    UpdateContext({varShowPopupProcessingNhapKho: false});
                  varLabel: |-
                    ="Bạn có chắc chắn muốn gửi phiếu này không?
                    Sau khi gửi, dữ liệu sẽ chuyển sang trạng thái chờ duyệt."
                  varTitle: ="Xác nhận gửi phiếu"
      - con_PopupProcessingNhapKho:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowPopupProcessingNhapKho
            Width: =Parent.Width
          Children:
            - DialogProccessingNhapkho:
                Control: CanvasComponent
                ComponentName: DialogProccessing
                Properties:
                  Height: =App.Height
                  LayoutMinWidth: =Parent.Width
                  Width: =App.Width
      - con_PopupConfirmReceipt:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =varShowPopupConfirmReceipt
            Width: =Parent.Width
          Children:
            - DialogAlertConfirmReceipt:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowPopupConfirmReceipt:false})
                  varConfirmDialogAction: |-
                    =// ============================================================
                    // 1. Đóng popup xác nhận, hiện popup loading
                    // ============================================================
                    UpdateContext({varShowPopupConfirmReceipt: false});
                    UpdateContext({varShowPopupProcessingNhapKho: true});


                    // ============================================================
                    // 2. Xóa payload của lần xác nhận trước
                    // ============================================================
                    Clear(col_UpdateReceiptDetail);


                    // ============================================================
                    // 3. Xử lý xác nhận
                    //    Mọi lỗi ở các bước [1] - [4] đều được bắt bởi IfError
                    //    và hiển thị ở nhánh báo lỗi cuối cùng.
                    // ============================================================
                    IfError(

                        // ========================================================
                        // [1] Ghi audit log hành động xác nhận của kho
                        // ========================================================
                        Patch(
                            'QLK List Audit Log',
                            Defaults('QLK List Audit Log'),
                            {
                                ActionBy: varCurrentUser.FullName,
                                ActionCode: Index(col_Action, 12).ActionCode,
                                ReceiptID: varProductionReceiptDetail.ID
                            }
                        );

                        // ========================================================
                        // [2] Chuẩn bị payload cập nhật
                        //     - Lấy các dòng chi tiết của phiếu theo vai trò người dùng:
                        //         + Nhân viên kho thành phẩm (FG_STAFF) → loại phiếu Index 1
                        //         + Thủ kho thành phẩm (FG_WH)          → loại phiếu Index 2
                        //     - Chỉ giữ ID + ConfirmFromWarehouse = true để không
                        //       ghi đè các field khác của bản ghi
                        // ========================================================
                        ClearCollect(
                            col_UpdateReceiptDetail,
                            ForAll(
                                Switch(
                                    varUserInPlant.Role,

                                    // FG_STAFF - Nhân viên kho thành phẩm
                                    Index(col_RoleUser, 16).RoleCode,
                                    Filter(
                                        'QLK List Production Receipt Details',
                                        ReceiptID = varProductionReceiptDetail.ID,
                                        ReceiptTypeCode = Index(col_ReceiptType, 1).ReceiptTypeCode
                                    ),

                                    // FG_WH - Thủ kho thành phẩm
                                    Index(col_RoleUser, 1).RoleCode,
                                    Filter(
                                        'QLK List Production Receipt Details',
                                        ReceiptID = varProductionReceiptDetail.ID,
                                        (ReceiptTypeCode = Index(col_ReceiptType, 2).ReceiptTypeCode || ReceiptTypeCode = "BIGBAG")
                                    )
                                ),
                                {
                                    ID: ID,
                                    ConfirmFromWarehouse: true
                                }
                            )
                        );

                        // ========================================================
                        // [3] Ghi ConfirmFromWarehouse = true lên SharePoint
                        //     (Patch theo bảng, không Patch từng record thủ công)
                        // ========================================================
                        Patch(
                            'QLK List Production Receipt Details',
                            col_UpdateReceiptDetail
                        );
                        //Refresh('QLK List Production Receipt Details');

                        // ========================================================
                        // [4] Cập nhật trạng thái phiếu nhập và gửi thông báo
                        //     - _unconfirmedDetails: các dòng chi tiết CHƯA được kho xác nhận
                        //     - Không còn dòng nào chưa xác nhận → StatusCode = Index 5
                        //       ("Xác nhận nhập kho") và gửi thông báo
                        //     - Còn dòng chưa xác nhận → StatusCode = Index 20
                        //       (chưa gửi thông báo)
                        // ========================================================
                        With(
                            {
                                _unconfirmedDetails: Filter(
                                    'QLK List Production Receipt Details',
                                    ReceiptID = varProductionReceiptDetail.ID,
                                    ConfirmFromWarehouse = false
                                )
                            },

                            // [4.1] Cập nhật trạng thái phiếu nhập
                            Set(
                                varProductionReceiptDetail,
                                Patch(
                                    'QLK List Production Receipts',
                                    If(
                                        IsBlank(varProductionReceiptDetail.ID),
                                        Defaults('QLK List Production Receipts'),
                                        varProductionReceiptDetail
                                    ),
                                    {
                                        StatusCode: If(
                                            CountRows(_unconfirmedDetails) = 0,
                                            Index(col_WorkflowStatus, 5).StatusCode,
                                            Index(col_WorkflowStatus, 20).StatusCode
                                        )
                                    }
                                )
                            );

                            // [4.2] Gửi thông báo xác nhận nhập kho
                            //       (chỉ khi toàn bộ dòng chi tiết đã được xác nhận)
                            If(
                                CountRows(_unconfirmedDetails) = 0,
                                'QLK|NotifyWarehouseReceiptConfirmation'.Run(
                                    varProductionReceiptDetail.ReceiptCode,
                                    varProductionReceiptDetail.ID,
                                    varProductionReceiptDetail.PlantName,
                                    "",
                                    varProductionReceiptDetail.StatusCode,
                                    Text(dp_ReceiptDate.SelectedDate, "yyyy-mm-dd"),
                                    varUserInPlant.PlantCode,
                                    LookUp(col_ProductCategories, ProductCategoryCode = varProductionReceiptDetail.ProductCategoryCode).ProductCategoryNameVI
                                )
                            )
                        ),

                        // ========================================================
                        // Nhánh lỗi: thông báo nguyên nhân.
                        // Popup loading vẫn được ẩn ở bước 4 bên dưới.
                        // ========================================================
                        Notify(
                            "Xác nhận thất bại: " & FirstError.Message,
                            NotificationType.Error,
                            2000
                        )
                    );


                    // ============================================================
                    // 4. Ẩn loading sau khi hoàn tất (thành công hoặc lỗi)
                    // ============================================================
                    UpdateContext({varShowPopupProcessingNhapKho: false});
                  varLabel: ="Bạn có chắc chắn muốn xác nhận nhập kho phiếu này không?"
                  varTitle: ="Xác nhận nhập kho"
      - con_PopupRejectReceipt:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =varShowPopupRejectReceipt
            Width: =Parent.Width
          Children:
            - DialogAlertRejectReceipt:
                Control: CanvasComponent
                ComponentName: DialogAlertReject
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowPopupRejectReceipt:false})
                  varConfirmDialogAction: |-
                    =// ============================================================
                    // 1. Đóng popup xác nhận từ chối, hiện popup loading
                    // ============================================================
                    UpdateContext({varShowPopupRejectReceipt: false});
                    UpdateContext({varShowPopupProcessingNhapKho: true});


                    // ============================================================
                    // 2. Xử lý từ chối phiếu nhập
                    //    Lỗi ở bước [1] hoặc [2] được bắt bởi IfError và hiển thị
                    //    ở nhánh báo lỗi. Popup loading vẫn được ẩn ở bước 4.
                    // ============================================================
                    IfError(

                        // ========================================================
                        // [1] Ghi audit log hành động từ chối (kèm lý do)
                        // ========================================================
                        Patch(
                            'QLK List Audit Log',
                            Defaults('QLK List Audit Log'),
                            {
                                ActionBy: varCurrentUser.FullName,
                                ActionCode: Index(col_Action, 5).ActionCode, // Action 5 = Từ chối
                                ReceiptID: varProductionReceiptDetail.ID,
                                Comment: DialogAlertRejectReceipt.outComment
                            }
                        );

                        // ========================================================
                        // [2] Cập nhật StatusCode phiếu nhập → "Nháp"
                        // ========================================================
                        Set(
                            varProductionReceiptDetail,
                            Patch(
                                'QLK List Production Receipts',
                                If(
                                    IsBlank(varProductionReceiptDetail.ID),
                                    Defaults('QLK List Production Receipts'),
                                    varProductionReceiptDetail
                                ),
                                {
                                    StatusCode: Index(col_WorkflowStatus, 1).StatusCode
                                }
                            )
                        ),

                        // Nhánh lỗi: thông báo nguyên nhân
                        Notify(
                            "Từ chối thất bại: " & FirstError.Message,
                            NotificationType.Error,
                            2000
                        )
                    );


                    // ============================================================
                    // 3. Gửi thông báo cho kho
                    // ============================================================
                    'QLK|NotifyWarehouseReceiptConfirmation'.Run(
                        varProductionReceiptDetail.ReceiptCode,
                        varProductionReceiptDetail.ID,
                        varProductionReceiptDetail.PlantName,
                        "",
                        varProductionReceiptDetail.StatusCode,
                        Text(dp_ReceiptDate.SelectedDate, "yyyy-mm-dd"),
                        varUserInPlant.PlantCode,
                        LookUp(col_ProductCategories, ProductCategoryCode = varProductionReceiptDetail.ProductCategoryCode).ProductCategoryNameVI
                    );


                    // ============================================================
                    // 4. Ẩn loading sau khi hoàn tất
                    // ============================================================
                    UpdateContext({varShowPopupProcessingNhapKho: false});
                  varLabel: ="Vui lòng nhập lý do từ chối phiếu nhập kho này."
                  varTitle: ="Từ chối nhập kho"
