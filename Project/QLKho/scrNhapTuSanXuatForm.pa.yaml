                        - btn_SaveHangBaoForm:
                            Control: ModernButton
                            Properties:
                              Font: =fxFontFamily
                              Icon: ="Save"
                              OnSelect: |-
                                =With(
                                    {
                                        startDateTime: DateAdd(
                                            dp_HB_StartDate.SelectedDate,
                                            Value(cbx_HB_StartHour.Selected.Value) * 3600 +
                                            Value(cbx_HB_StartMinute.Selected.Value) * 60 +
                                            Value(cbx_HB_StartSecond.Selected.Value),
                                            TimeUnit.Seconds
                                        ),
                                        endDateTime: DateAdd(
                                            dp_HB_EndDate.SelectedDate,
                                            Value(cbx_HB_EndHour.Selected.Value) * 3600 +
                                            Value(cbx_HB_EndMinute.Selected.Value) * 60 +
                                            Value(cbx_HB_EndSecond.Selected.Value),
                                            TimeUnit.Seconds
                                        ),
                                        vIsNew: IsBlank(varHangBaoDetail.ID)
                                    },
                                    If(
                                        // ── Kiểm tra dữ liệu bắt buộc ──────────────────────────────────────
                                        IsBlank(Trim(txt_HB_FormSAPCode.Text)),
                                        Notify("Vui lòng nhập Mã SAP", NotificationType.Warning, 2000),

                                        Coalesce(num_HB_FormBaggingWeight.Value, 0) <= 0,
                                        Notify("Khối lượng đóng bao phải lớn hơn 0", NotificationType.Warning, 2000),

                                        IsBlank(dp_HB_StartDate.SelectedDate) || IsBlank(dp_HB_EndDate.SelectedDate),
                                        Notify("Vui lòng chọn ngày bắt đầu và ngày kết thúc", NotificationType.Warning, 2000),

                                        endDateTime < startDateTime,
                                        Notify("Thời gian kết thúc phải sau thời gian bắt đầu", NotificationType.Warning, 2000),

                                        // ── Hợp lệ → lưu ───────────────────────────────────────────────────
                                        UpdateContext({varShowPopupProcessingNhapKho: true});
                                        With(
                                            {
                                                _data: {
                                                    RunID:               txt_HB_FormRunID.Text,
                                                    SAPCode:             txt_HB_FormSAPCode.Text,
                                                    ProductCode:         txt_HB_FormProductCode.Text,
                                                    BagSize:             num_HB_FormBagSize.Value,
                                                    BaggingDate:         dp_HB_FormBaggingDate.SelectedDate,
                                                    BaggingShift:        num_HB_FormBaggingShift.Value,
                                                    ShiftName:           txt_HB_FormShiftName.Text,
                                                    Line:                txt_HB_FormLine.Text,
                                                    FromBin:             txt_HB_FormFromBin.Text,
                                                    StartTime:           startDateTime,
                                                    EndTime:             endDateTime,
                                                    TotalTime:           Round(DateDiff(startDateTime, endDateTime, TimeUnit.Seconds) / 3600, 2), // Đơn vị: giờ (0.5 = 30 phút)
                                                    FinishedBags:        num_HB_FormFinishedBags.Value,
                                                    BaggingWeight:       num_HB_FormBaggingWeight.Value,
                                                    Note:                txt_HB_FormNote.Text,
                                                    BaggingStaff:        txt_HB_FormBaggingStaff.Text,
                                                    ShiftSupervisor:     txt_HB_FormShiftSupervisor.Text,
                                                    ReceiptDate:         varProductionReceiptDetail.ReceiptDate,
                                                    ProductCategoryCode: varProductionReceiptDetail.ProductCategoryCode
                                                }
                                            },
                                            With(
                                                {
                                                    savedRecord: IfError(
                                                        If(
                                                            vIsNew,
                                                            // TẠO MỚI
                                                            Patch(
                                                                'QLK List Production Receipt Details',
                                                                Defaults('QLK List Production Receipt Details'),
                                                                {
                                                                    PlantCode:       varUserInPlant.PlantCode,
                                                                    PlantName:       varUserInPlant.PlantName,
                                                                    ReceiptID:       varProductionReceiptDetail.ID,
                                                                    ReceiptTypeCode: Index(col_ReceiptType, 1).ReceiptTypeCode
                                                                },
                                                                _data
                                                            ),
                                                            // CẬP NHẬT
                                                            Patch('QLK List Production Receipt Details', varHangBaoDetail, _data)
                                                        ),
                                                        Blank()
                                                    )
                                                },
                                                If(
                                                    IsBlank(savedRecord),
                                                    // Giữ form mở để người dùng không mất dữ liệu đã nhập
                                                    Notify(If(vIsNew, "Thêm không thành công", "Cập nhật không thành công"), NotificationType.Error, 2000),

                                                    // Thành công — refresh collection + cập nhật TotalReceipt
                                                    ClearCollect(
                                                        col_ProductionReceiptDetails,
                                                        Filter('QLK List Production Receipt Details', ReceiptID = varProductionReceiptDetail.ID)
                                                    );
                                                    Set(
                                                        varProductionReceiptDetail,
                                                        Patch(
                                                            'QLK List Production Receipts',
                                                            varProductionReceiptDetail,
                                                            {TotalReceipt: Sum(col_ProductionReceiptDetails, BaggingWeight)}
                                                        )
                                                    );
                                                    UpdateContext({varShowHangBaoForm: false});
                                                    Notify(If(vIsNew, "Thêm thành công", "Cập nhật thành công"), NotificationType.Success, 2000)
                                                )
                                            )
                                        );
                                        UpdateContext({varShowPopupProcessingNhapKho: false})
                                    )
                                )
                              Size: =fxFontSizeMD
