                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                      Children:
                        - btn_CancelBigbagForm:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              Icon: ="ChevronLeft"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Reset(txt_BB_ProductionCode);
                                Reset(txt_BB_SAPCode_1);
                                Reset(txt_BB_RunID);
                                Reset(txt_BB_FormulaVersion);
                                Reset(dp_BB_FormDateInput);
                                Reset(cbx_BB_FormShift);
                                Reset(dp_BB_StartDate);
                                Reset(cbx_BB_StartHour);
                                Reset(cbx_BB_StartMinute);
                                Reset(cbx_BB_StartSecond);
                                Reset(dp_BB_EndDate);
                                Reset(cbx_BB_EndHour);
                                Reset(cbx_BB_EndMinute);
                                Reset(cbx_BB_EndSecond);
                                Reset(num_BB_Quantity);
                                Reset(num_BB_Recycle);
                                Reset(num_BB_Rerun);
                                Reset(txt_BB_Staff);
                                Reset(txt_BB_ShiftSup);
                                UpdateContext({varShowBigbagForm: false})
                              Text: =
                              Width: =30
                        - btn_SaveBigbagForm:
                            Control: ModernButton
                            Properties:
                              Font: =fxFontFamily
                              Icon: ="Save"
                              OnSelect: |-
                                =With(
                                    {
                                        startDateTime: DateAdd(
                                            dp_BB_StartDate.SelectedDate,
                                            Value(cbx_BB_StartHour.Selected.Value) * 3600 +
                                            Value(cbx_BB_StartMinute.Selected.Value) * 60 +
                                            Value(cbx_BB_StartSecond.Selected.Value),
                                            TimeUnit.Seconds
                                        ),
                                        endDateTime: DateAdd(
                                            dp_BB_EndDate.SelectedDate,
                                            Value(cbx_BB_EndHour.Selected.Value) * 3600 +
                                            Value(cbx_BB_EndMinute.Selected.Value) * 60 +
                                            Value(cbx_BB_EndSecond.Selected.Value),
                                            TimeUnit.Seconds
                                        ),
                                        vIsNew: IsBlank(varBigbagDetail.ID)
                                    },
                                    If(
                                        // ── Kiểm tra dữ liệu bắt buộc ──────────────────────────────────────
                                        IsBlank(Trim(txt_BB_SAPCode_1.Text)),
                                        Notify("Vui lòng nhập Mã SAP", NotificationType.Warning, 2000),

                                        Coalesce(num_BB_Quantity.Value, 0) <= 0,
                                        Notify("Sản lượng phải lớn hơn 0", NotificationType.Warning, 2000),

                                        IsBlank(dp_BB_StartDate.SelectedDate) || IsBlank(dp_BB_EndDate.SelectedDate),
                                        Notify("Vui lòng chọn ngày bắt đầu và ngày kết thúc", NotificationType.Warning, 2000),

                                        endDateTime < startDateTime,
                                        Notify("Thời gian kết thúc phải sau thời gian bắt đầu", NotificationType.Warning, 2000),

                                        // ── Hợp lệ → lưu ───────────────────────────────────────────────────
                                        UpdateContext({varShowPopupProcessingNhapKho: true});
                                        With(
                                            {
                                                _data: {
                                                    ProductCode:         txt_BB_ProductionCode.Text,
                                                    SAPCode:             txt_BB_SAPCode_1.Text,
                                                    RunID:               txt_BB_RunID.Text,
                                                    FormulaVersion:      txt_BB_FormulaVersion.Text,
                                                    BaggingDate:         dp_BB_FormDateInput.SelectedDate,
                                                    StartTime:           startDateTime,
                                                    EndTime:             endDateTime,
                                                    TotalTime:           Round(DateDiff(startDateTime, endDateTime, TimeUnit.Seconds) / 3600, 2), // Đơn vị: giờ (0.5 = 30 phút)
                                                    BaggingWeight:       num_BB_Quantity.Value,
                                                    StartEndSetBack:     num_BB_Recycle.Value,
                                                    ReRun:               num_BB_Rerun.Value,
                                                    BaggingStaff:        txt_BB_Staff.Text,
                                                    ShiftSupervisor:     txt_BB_ShiftSup.Text,
                                                    ReceiptDate:         varProductionReceiptDetail.ReceiptDate,
                                                    ProductCategoryCode: varProductionReceiptDetail.ProductCategoryCode,
                                                    BaggingShift:        cbx_BB_FormShift.Selected.ShiftNo,
                                                    BagSize:             LookUp(
                                                                             'QLK List Master Data Production',
                                                                             PlantCode = varProductionReceiptDetail.PlantCode && SAPCode = txt_BB_SAPCode_1.Text
                                                                         ).BagSize
                                                }
                                            },
                                            With(
                                                {
                                                    savedRecord: IfError(
                                                        If(
                                                            vIsNew,
                                                            // TẠO MỚI
                                                            Patch(
                                                                'QLK List Production Receipt Details',
                                                                Defaults('QLK List Production Receipt Details'),
                                                                {
                                                                    PlantCode:       varUserInPlant.PlantCode,
                                                                    PlantName:       varUserInPlant.PlantName,
                                                                    ReceiptID:       varProductionReceiptDetail.ID,
                                                                    ReceiptTypeCode: "BIGBAG"
                                                                },
                                                                _data
                                                            ),
                                                            // CẬP NHẬT
                                                            Patch('QLK List Production Receipt Details', varBigbagDetail, _data)
                                                        ),
                                                        Blank()
                                                    )
                                                },
                                                If(
                                                    IsBlank(savedRecord),
                                                    // Giữ form mở để người dùng không mất dữ liệu đã nhập
                                                    Notify(If(vIsNew, "Thêm không thành công", "Cập nhật không thành công"), NotificationType.Error, 2000),

                                                    // Thành công — refresh collection + cập nhật TotalReceipt
                                                    ClearCollect(
                                                        col_ProductionReceiptDetails,
                                                        Filter('QLK List Production Receipt Details', ReceiptID = varProductionReceiptDetail.ID)
                                                    );
                                                    Set(
                                                        varProductionReceiptDetail,
                                                        Patch(
                                                            'QLK List Production Receipts',
                                                            varProductionReceiptDetail,
                                                            {TotalReceipt: Sum(col_ProductionReceiptDetails, BaggingWeight)}
                                                        )
                                                    );
                                                    UpdateContext({varShowBigbagForm: false});
                                                    Notify(If(vIsNew, "Thêm thành công", "Cập nhật thành công"), NotificationType.Success, 2000);
                                                    Reset(txt_BB_ProductionCode);
                                                    Reset(txt_BB_SAPCode_1);
                                                    Reset(txt_BB_RunID);
                                                    Reset(txt_BB_FormulaVersion);
                                                    Reset(dp_BB_FormDateInput);
                                                    Reset(cbx_BB_FormShift);
                                                    Reset(dp_BB_StartDate);
                                                    Reset(cbx_BB_StartHour);
                                                    Reset(cbx_BB_StartMinute);
                                                    Reset(cbx_BB_StartSecond);
                                                    Reset(dp_BB_EndDate);
                                                    Reset(cbx_BB_EndHour);
                                                    Reset(cbx_BB_EndMinute);
                                                    Reset(cbx_BB_EndSecond);
                                                    Reset(num_BB_Quantity);
                                                    Reset(num_BB_Recycle);
                                                    Reset(num_BB_Rerun);
                                                    Reset(txt_BB_Staff);
                                                    Reset(txt_BB_ShiftSup)
                                                )
                                            )
                                        );
                                        UpdateContext({varShowPopupProcessingNhapKho: false})
                                    )
                                )
                              Size: =fxFontSizeMD
                              Text: ="Lưu và đóng"
                              Visible: |-
                                =// Chỉ cho phép chỉnh sửa khi phiếu đang ở trạng thái DRAFT, các trạng thái khác thì khóa
                                If(
                                    varProductionReceiptDetail.StatusCode = "DRAFT"       &&
