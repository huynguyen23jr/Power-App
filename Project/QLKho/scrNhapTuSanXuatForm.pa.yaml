                        LayoutGap: =10
                        PaddingLeft: =10
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                      Children:
                        - btn_CancelHangXaForm:
                            Control: ModernButton
                            Properties:
                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              Icon: ="ChevronLeft"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Reset(txt_HX_ProductionCode);
                                Reset(txt_HX_SAPCode_1);
                                Reset(txt_HX_RunID);
                                Reset(txt_HX_FormulaVersion);
                                Reset(dp_HX_FormDateInput);
                                Reset(cbx_HX_FormShift);
                                Reset(txt_HX_FromBin);
                                Reset(txt_HX_ToBin);
                                Reset(dp_HX_StartDate);
                                Reset(cbx_HX_StartHour);
                                Reset(cbx_HX_StartMinute);
                                Reset(cbx_HX_StartSecond);
                                Reset(dp_HX_EndDate);
                                Reset(cbx_HX_EndHour);
                                Reset(cbx_HX_EndMinute);
                                Reset(cbx_HX_EndSecond);
                                Reset(num_HX_Quantity);
                                Reset(num_HX_Productivity);
                                Reset(num_HX_Recycle);
                                Reset(num_HX_Rerun);
                                Reset(txt_HX_Staff);
                                Reset(txt_HX_ShiftSup);
                                UpdateContext({varShowHangXaForm: false})
                              Text: =
                              Width: =30
                        - btn_SaveHangXaForm:
                            Control: ModernButton
                            Properties:
                              Font: =fxFontFamily
                              Icon: ="Save"
                              OnSelect: |-
                                =With(
                                    {
                                        startDateTime: DateAdd(
                                            dp_HX_StartDate.SelectedDate,
                                            Value(cbx_HX_StartHour.Selected.Value) * 3600 +
                                            Value(cbx_HX_StartMinute.Selected.Value) * 60 +
                                            Value(cbx_HX_StartSecond.Selected.Value),
                                            TimeUnit.Seconds
                                        ),
                                        endDateTime: DateAdd(
                                            dp_HX_EndDate.SelectedDate,
                                            Value(cbx_HX_EndHour.Selected.Value) * 3600 +
                                            Value(cbx_HX_EndMinute.Selected.Value) * 60 +
                                            Value(cbx_HX_EndSecond.Selected.Value),
                                            TimeUnit.Seconds
                                        ),
                                        vIsNew: IsBlank(varHangXaDetail.ID)
                                    },
                                    If(
                                        // ── Kiểm tra dữ liệu bắt buộc ──────────────────────────────────────
                                        IsBlank(Trim(txt_HX_SAPCode_1.Text)),
                                        Notify("Vui lòng nhập Mã SAP", NotificationType.Warning, 2000),

                                        Coalesce(num_HX_Quantity.Value, 0) <= 0,
                                        Notify("Sản lượng phải lớn hơn 0", NotificationType.Warning, 2000),

                                        IsBlank(dp_HX_StartDate.SelectedDate) || IsBlank(dp_HX_EndDate.SelectedDate),
                                        Notify("Vui lòng chọn ngày bắt đầu và ngày kết thúc", NotificationType.Warning, 2000),

                                        endDateTime < startDateTime,
                                        Notify("Thời gian kết thúc phải sau thời gian bắt đầu", NotificationType.Warning, 2000),

                                        // ── Hợp lệ → lưu ───────────────────────────────────────────────────
                                        UpdateContext({varShowPopupProcessingNhapKho: true});
                                        With(
                                            {
                                                _data: {
                                                    ProductCode:         txt_HX_ProductionCode.Text,
                                                    SAPCode:             txt_HX_SAPCode_1.Text,
                                                    RunID:               txt_HX_RunID.Text,
                                                    FormulaVersion:      txt_HX_FormulaVersion.Text,
                                                    BaggingDate:         dp_HX_FormDateInput.SelectedDate,
                                                    FromBin:             txt_HX_FromBin.Text,
                                                    Source:              txt_HX_ToBin.Text,
                                                    StartTime:           startDateTime,
                                                    EndTime:             endDateTime,
                                                    TotalTime:           Round(DateDiff(startDateTime, endDateTime, TimeUnit.Seconds) / 3600, 2), // Đơn vị: giờ (0.5 = 30 phút)
                                                    BaggingWeight:       num_HX_Quantity.Value,
                                                    Productivity:        num_HX_Productivity.Value,
                                                    StartEndSetBack:     num_HX_Recycle.Value,
                                                    ReRun:               num_HX_Rerun.Value,
                                                    BaggingStaff:        txt_HX_Staff.Text,
                                                    ShiftSupervisor:     txt_HX_ShiftSup.Text,
                                                    ReceiptDate:         varProductionReceiptDetail.ReceiptDate,
                                                    ProductCategoryCode: varProductionReceiptDetail.ProductCategoryCode,
                                                    BaggingShift:        cbx_HX_FormShift.Selected.ShiftNo,
                                                    BagSize:             LookUp(
                                                                             'QLK List Master Data Production',
                                                                             PlantCode = varProductionReceiptDetail.PlantCode && SAPCode = txt_HX_SAPCode_1.Text
                                                                         ).BagSize
                                                }
                                            },
                                            With(
                                                {
                                                    savedRecord: IfError(
                                                        If(
                                                            vIsNew,
                                                            // TẠO MỚI
                                                            Patch(
                                                                'QLK List Production Receipt Details',
                                                                Defaults('QLK List Production Receipt Details'),
                                                                {
                                                                    PlantCode:       varUserInPlant.PlantCode,
                                                                    PlantName:       varUserInPlant.PlantName,
                                                                    ReceiptID:       varProductionReceiptDetail.ID,
                                                                    ReceiptTypeCode: Index(col_ReceiptType, 2).ReceiptTypeCode
                                                                },
                                                                _data
                                                            ),
                                                            // CẬP NHẬT
