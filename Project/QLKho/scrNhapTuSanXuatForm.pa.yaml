                              Appearance: =ButtonAppearance.Outline
                              Font: =fxFontFamily
                              Icon: ="ChevronLeft"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Reset(cmb_XK_FormMovementType_1);
                                Reset(dp_NK_FormPostingDate);
                                Reset(txt_NK_FormSAPCode);
                                Reset(num_NK_FormWeight);
                                Reset(txt_NK_FormSLoc);
                                Reset(txt_NK_FormNote);
                                UpdateContext({varShowNhapKhacForm: false})
                              Text: =
                              Width: =30
                        - btn_SaveNhapKhacForm:
                            Control: ModernButton
                            Properties:
                              Font: =fxFontFamily
                              Icon: ="Save"
                              OnSelect: |-
                                =With(
                                    {vIsNew: IsBlank(varNhapKhacDetail.ID)},
                                    If(
                                        // ── Kiểm tra dữ liệu bắt buộc ──────────────────────────────────────
                                        IsBlank(cmb_XK_FormMovementType_1.Selected),
                                        Notify("Vui lòng chọn Movement type", NotificationType.Warning, 2000),

                                        IsBlank(Trim(txt_NK_FormSAPCode.Text)),
                                        Notify("Vui lòng nhập Mã SAP", NotificationType.Warning, 2000),

                                        Coalesce(num_NK_FormWeight.Value, 0) <= 0,
                                        Notify("Khối lượng phải lớn hơn 0", NotificationType.Warning, 2000),

                                        // ── Hợp lệ → lưu ───────────────────────────────────────────────────
                                        UpdateContext({varShowPopupProcessingNhapKho: true});
                                        With(
                                            {
                                                _data: {
                                                    ReceiptDate:         varProductionReceiptDetail.ReceiptDate,
                                                    ProductCategoryCode: varProductionReceiptDetail.ProductCategoryCode,
                                                    MovementType:        cmb_XK_FormMovementType_1.Selected.MovementType,
                                                    BaggingDate:         dp_NK_FormPostingDate.SelectedDate,
                                                    SAPCode:             txt_NK_FormSAPCode.Text,
                                                    BaggingWeight:       num_NK_FormWeight.Value,
                                                    SLoc:                txt_NK_FormSLoc.Text,
                                                    Note:                txt_NK_FormNote.Text,
                                                    // Quy cách bao theo mã SAP đang nhập trên form (kể cả khi sửa đổi mã)
                                                    BagSize:             LookUp(
                                                                             'QLK List Master Data Production',
                                                                             PlantCode = varProductionReceiptDetail.PlantCode && SAPCode = txt_NK_FormSAPCode.Text
                                                                         ).BagSize
                                                }
                                            },
                                            With(
                                                {
                                                    savedRecord: IfError(
                                                        If(
                                                            vIsNew,
                                                            // TẠO MỚI
                                                            Patch(
                                                                'QLK List Production Receipt Details',
                                                                Defaults('QLK List Production Receipt Details'),
                                                                {
                                                                    PlantCode:       varUserInPlant.PlantCode,
                                                                    PlantName:       varUserInPlant.PlantName,
                                                                    ReceiptID:       varProductionReceiptDetail.ID,
                                                                    ReceiptTypeCode: Index(col_ReceiptType, 3).ReceiptTypeCode
                                                                },
                                                                _data
                                                            ),
                                                            // CẬP NHẬT
                                                            Patch('QLK List Production Receipt Details', varNhapKhacDetail, _data)
                                                        ),
                                                        Blank()
                                                    )
                                                },
                                                If(
                                                    IsBlank(savedRecord),
                                                    // Giữ form mở để người dùng không mất dữ liệu đã nhập
                                                    Notify("Lưu không thành công", NotificationType.Error, 2000),

                                                    // Thành công — refresh collection + cập nhật TotalReceipt
                                                    ClearCollect(
                                                        col_ProductionReceiptDetails,
                                                        Filter('QLK List Production Receipt Details', ReceiptID = varProductionReceiptDetail.ID)
                                                    );
                                                    Set(
                                                        varProductionReceiptDetail,
                                                        Patch(
                                                            'QLK List Production Receipts',
                                                            varProductionReceiptDetail,
                                                            {TotalReceipt: Sum(col_ProductionReceiptDetails, BaggingWeight)}
                                                        )
                                                    );
                                                    UpdateContext({varShowNhapKhacForm: false});
                                                    Notify(If(vIsNew, "Thêm thành công", "Cập nhật thành công"), NotificationType.Success, 2000)
                                                )
                                            )
                                        );
                                        UpdateContext({varShowPopupProcessingNhapKho: false})
                                    )
                                )
                              Size: =fxFontSizeMD
                              Text: ="Lưu và đóng"
                              Visible: =varProductionReceiptDetail.StatusCode = "DRAFT"
                              Width: =140
