Screens:
  scrKiemKhoHangBao:
    Properties:
      OnVisible: |-
        =Set(varHasAutoNavigated,false);
        Set(varSelectedMenuId,51);
        varShowMenuUser && scrKiemKhoHangBao.Size <> 1;
        Clear(col_SelectedKiemKhoHangBao);
        Clear(updateKiemKhoHangBao)
    Children:
      - con_MainKiemKhoHangBao:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuKiemKhoHangBao:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrKiemKhoHangBao.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarKiemKhoHangBao:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainKiemKhoHangBao:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderKiemKhoHangBao:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderKiemKhoHangBao:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrKiemKhoHangBao.Size
                  - con_BodyKiemKhoHangBao:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderKiemKhoHangBao.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentKiemKhoHangBao:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrKiemKhoHangBao.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_FormButtonMobile_KiemKhoHangBao:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrKiemKhoHangBao.Size = 1
                                    Width: =Parent.Width - 10
                                  Children:
                                    - lbl_MobileActionPos_KiemKhoHangBao:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(4), Switch(Value, 1, btn_AddKiemKhoHangBao.Visible, 2, btn_RefreshKiemKhoHangBao.Visible, 3, btn_ExportKiemKhoHangBao.Visible, 4, btn_RefreshKiemKhoHangXa_2.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_KiemKhoHangBao:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_KiemKhoHangBao.Text), 0, CountRows(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_KiemKhoHangBao:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ","), 1), 1)).Value), 1, "Add", 2, "ArrowSync", 3, "ArrowDownload", 4, "CheckmarkCircle", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ","), 1), 1)).Value),
                                                1, Select(btn_AddKiemKhoHangBao),
                                                2, Select(btn_RefreshKiemKhoHangBao),
                                                3, Select(btn_ExportKiemKhoHangBao),
                                                4, Select(btn_RefreshKiemKhoHangXa_2)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ","), 1), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Xuất Excel", 4, "Xác nhận", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ","), 1), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Xuất Excel", 4, "Xác nhận", "")
                                          Visible: =Value(lbl_MobileActionCount_KiemKhoHangBao.Text) >= 1
                                    - btn_MobileAction2_KiemKhoHangBao:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ","), 2), 1)).Value), 1, "Add", 2, "ArrowSync", 3, "ArrowDownload", 4, "CheckmarkCircle", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ","), 2), 1)).Value),
                                                1, Select(btn_AddKiemKhoHangBao),
                                                2, Select(btn_RefreshKiemKhoHangBao),
                                                3, Select(btn_ExportKiemKhoHangBao),
                                                4, Select(btn_RefreshKiemKhoHangXa_2)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ","), 2), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Xuất Excel", 4, "Xác nhận", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangBao.Text, ","), 2), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Xuất Excel", 4, "Xác nhận", "")
                                          Visible: =Value(lbl_MobileActionCount_KiemKhoHangBao.Text) >= 2
                                    - btn_MobileMore_KiemKhoHangBao:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_KiemKhoHangBao: !varShowMoreActionsMobile_KiemKhoHangBao})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_KiemKhoHangBao.Text) >= 3
                                          Width: =40
                              - con_ActionHeaderKiemKhoHangBao:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =45
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    Visible: =scrKiemKhoHangBao.Size <> 1
                                  Children:
                                    - btn_AddKiemKhoHangBao:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =Set(
                                                varStockCountDetail,
                                                {}
                                            );

                                            Set(
                                                varStockCountType,
                                                "BAOQC"
                                            );
                                            Reset(cmb_ProductCode);
                                            Reset(num_PalletQty);
                                            Reset(num_OddBagQty);
                                            Reset(dp_ProductionDate);
                                            Reset(num_BrokenBagQty);
                                            Reset(num_OddBoxQty);
                                            Reset(num_OddKgQty);
                                            Reset(txt_Note_Bao);
                                            Reset(txt_LocationName_Bao);
                                            Reset(cmb_XaDensityCode);
                                            Reset(cmb_XaBinCode);
                                            Reset(num_Measure1);
                                            Reset(num_Measure2);
                                            Reset(num_Measure3);
                                            Reset(num_DustSteamQty);
                                            Reset(cmb_ProductCode_Bigbag);
                                            Reset(num_BigBagQty);
                                            Reset(num_BigBagWeight);
                                            Reset(num_NetBigBagWeight);
                                            Reset(cmb_ProductCategory);
                                            Reset(cmb_StockCountType);

                                            Navigate(
                                                scrKiemKhoForm,
                                                ScreenTransition.CoverRight
                                            );
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                          Visible: =(varUserInPlant.Role = "FG_STAFF" || varUserInPlant.Role = "FG_WH" || varUserInPlant.Role = "FG_SUP" || varUserInPlant.Role = "VHSX_HO")
                                    - btn_RefreshKiemKhoHangBao:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: =Refresh('QLK List Stock Count Details')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                                    - btn_ExportKiemKhoHangBao:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowDownload"
                                          OnSelect: |-
                                            =If(
                                                IsBlank(dp_FilterNgayKiemHangBao.SelectedDate),
                                                Notify("Vui lòng chọn ngày kiểm kê trước khi xuất Excel", NotificationType.Warning, 3000),
                                                UpdateContext({varShowPopupProcessing: true});
                                                With(
                                                    {
                                                        _result: 'QLK|ExportStockCountData'.Run(
                                                            If(varUserInPlant.Role = "VHSX_HO", "", varUserInPlant.PlantCode), // Mã plant (VHSX_HO xem tất cả)
                                                            "BAOQC", // Loại kiểm kê
                                                            If(IsBlank(dp_FilterNgayKiemHangBao.SelectedDate), "", Text(dp_FilterNgayKiemHangBao.SelectedDate, "yyyy-mm-dd")), // Ngày kiểm kê
                                                            If(IsBlank(cbo_FilterStatusKiemKho.Selected), "", cbo_FilterStatusKiemKho.Selected.StatusCode), // Trạng thái
                                                            If(IsBlank(cbo_FilterProductTypeNhapTuSanXuat_8.Selected), "", cbo_FilterProductTypeNhapTuSanXuat_8.Selected.ProductCategoryCode) // Nhóm hàng
                                                        )
                                                    },
                                                    If(
                                                        _result.status = "200",
                                                        Launch(_result.fileurl);
                                                        Notify("Đã xuất " & _result.rowcount & " dòng ra file Excel", NotificationType.Success, 2000),
                                                        Notify(_result.message, NotificationType.Error, 2000)
                                                    )
                                                );
                                                UpdateContext({varShowPopupProcessing: false})
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xuất Excel"
                                          Width: =140
                                    - btn_RefreshKiemKhoHangXa_2:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="CheckmarkCircle"
                                          OnSelect: |
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xác nhận kiểm kê " & CountRows(col_SelectedKiemKhoHangBao) & " bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận",
                                                        ConfirmButton: "Xác nhận",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),
                                                UpdateContext({varShowPopupProcessing: true});
                                                Clear(updateKiemKhoHangBao);
                                                ForAll(
                                                    col_SelectedKiemKhoHangBao As item,
                                                    Collect(
                                                        updateKiemKhoHangBao,
                                                        {
                                                            ID          : item.ID,
                                                            StatusCode  : "COUNT_CONFIRMED"
                                                        }
                                                    )
                                                );
                                                IfError(
                                                    Patch('QLK List Stock Count Details', updateKiemKhoHangBao),
                                                    Notify("Cập nhật thất bại", NotificationType.Error, 2000),
                                                    Notify("Cập nhật thành công", NotificationType.Success, 2000);
                                                    Clear(updateKiemKhoHangBao);
                                                    Clear(col_SelectedKiemKhoHangBao);
                                                );
                                                UpdateContext({varShowPopupProcessing: false})
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xác nhận"
                                          Visible: |-
                                            =CountRows(
                                                Filter(
                                                    col_SelectedKiemKhoHangBao,
                                                    StatusCode = "DRAFT"
                                                )
                                            ) > 0
                                          Width: =120
                              - lbl_TitleKiemKhoHangBao:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Kiểm kê hàng bao"
                              - con_FilterKiemKhoHangBao:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(scrKiemKhoHangBao.Size = 1, If(varShowFilterKKHB, 360, 96), 45)
                                    LayoutDirection: =If(scrKiemKhoHangBao.Size = 1 ,LayoutDirection.Vertical ,LayoutDirection.Horizontal)
                                    LayoutGap: =5
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - con_Row1:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          LayoutMinHeight: |
                                            =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =scrKiemKhoHangBao.Size <> 1
                                          Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                        Children:
                                          - lbl_FilterNgayHangBao:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ngày kiểm kê"
                                                Width: =100
                                                Wrap: =false
                                          - dp_FilterNgayKiemHangBao:
                                              Control: ModernDatePicker
                                              Properties:
                                                BasePaletteColor: =RGBA(8,222,8,1)
                                                DefaultDate: =Today()
                                                Font: =fxFontFamily
                                                FontWeight: =FontWeight.Normal
                                                Format: =DatePickerFormat.Short
                                                Size: =fxFontSizeMD
                                                Width: =160
                                          - txt_SearchKiemKhoHangBao:
                                              Control: ModernTextInput
                                              Properties:
                                                Font: =fxFontFamily
                                                Placeholder: ="Tìm theo mã SAP ..."
                                                Width: |-
                                                  =
                                                  If(scrKiemKhoHangBao.Size = 1 ,Parent.Width - dp_FilterNgayKiemHangBao.Width - lbl_FilterNgayHangBao.Width - 60 ,Parent.Width - dp_FilterNgayKiemHangBao.Width - lbl_FilterNgayHangBao.Width - 10)
                                    - con_Row2:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          LayoutMinHeight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =scrKiemKhoHangBao.Size <> 1
                                          Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                        Children:
                                          - cbo_FilterStatusKiemKho:
                                              Control: ModernCombobox
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightNormal
                                                InputTextPlaceholder: ="Tất cả trạng thái"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.StatusNameVI
                                                Items: =Filter(col_WorkflowStatus,StatusCode="DRAFT" || StatusCode="COUNT_CONFIRMED")
                                                SelectMultiple: =false
                                                Width: =160
                                          - cbo_FilterProductTypeNhapTuSanXuat_8:
                                              Control: ModernCombobox
                                              Properties:
                                                DefaultSelectedItems: =If(varUserInPlant.Role = "VHSX_HO", Blank(), LookUp(col_ProductCategories,ProductCategoryCode=varUserInPlant.ProductCategoryCode))
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightNormal
                                                InputTextPlaceholder: ="Tất cả nhóm hàng"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                Items: =col_ProductCategories
                                                SelectMultiple: =false
                                                Width: =Parent.Width - cbo_FilterStatusKiemKho.Width - Button1.Width - 10
                                          - Button1:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =ButtonAppearance.Transparent
                                                Icon: ="Eraser"
                                                OnSelect: |-
                                                  =Reset(cbo_FilterStatusKiemKho);
                                                  Reset(cbo_FilterProductTypeNhapTuSanXuat_8);
                                                  Reset(txt_SearchKiemKhoHangBao);
                                                Text: =
                                                Width: =50
                                    - con_FilterMobKKHB:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =If(varShowFilterKKHB, 344, 80)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Visible: =scrKiemKhoHangBao.Size = 1
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                        Children:
                                          - con_FilterHeadKKHB:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =56
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =10
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                              Children:
                                                - btn_FilterIconKKHB:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Icon: ="Filter"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext({varShowFilterKKHB: !varShowFilterKKHB})
                                                      Width: =32
                                                - con_FilterHeadTextKKHB:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =56
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutJustifyContent: =LayoutJustifyContent.Center
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - lbl_FilterTitleKKHB:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Height: =28
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeMD
                                                            Text: ="Bộ lọc" & If((If(!IsBlank(dp_FilterNgayMobKKHB.SelectedDate), 1, 0) + If(!IsBlank(txt_SearchMobKKHB.Text), 1, 0) + If(!IsBlank(cbo_StatusMobKKHB.Selected), 1, 0) + If(!IsBlank(cbo_CategoryMobKKHB.Selected), 1, 0)) > 0, " (" & (If(!IsBlank(dp_FilterNgayMobKKHB.SelectedDate), 1, 0) + If(!IsBlank(txt_SearchMobKKHB.Text), 1, 0) + If(!IsBlank(cbo_StatusMobKKHB.Selected), 1, 0) + If(!IsBlank(cbo_CategoryMobKKHB.Selected), 1, 0)) & ")", "")
                                                            Wrap: =false
                                                      - lbl_FilterSummaryKKHB:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =RGBA(107, 114, 128, 1)
                                                            Font: =fxFontFamily
                                                            Height: =22
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeXS
                                                            Text: |-
