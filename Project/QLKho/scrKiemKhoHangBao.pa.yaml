Screens:
  scrKiemKhoHangBao:
    Properties:
      OnVisible: |-
        =Set(varHasAutoNavigated,false);
        Set(varSelectedMenuId,51);
        varShowMenuUser && scrKiemKhoHangBao.Size <> 1;
        Clear(col_SelectedKiemKhoHangBao);
        Clear(updateKiemKhoHangBao)
    Children:
      - con_MainKiemKhoHangBao:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderKiemKhoHangBao:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderKiemKhoHangBao:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrKiemKhoHangBao.Size
            - con_BodyKiemKhoHangBao:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderKiemKhoHangBao.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_MenuKiemKhoHangBao:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =scrKiemKhoHangBao.Size <> 1
                        Width: =If(varShowMenuUser, 240, 0)
                      Children:
                        - cmp_NavSidebarKiemKhoHangBao:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_ContentKiemKhoHangBao:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: |-
                          =If(
                              scrKiemKhoHangBao.Size = 1,
                              DropShadow.Semibold,
                              DropShadow.None
                          )
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                        RadiusTopRight: =0
                      Children:
                        - con_ActionHeaderKiemKhoHangBao:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =45
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - btn_AddKiemKhoHangBao:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Add"
                                    OnSelect: |-
                                      =Set(
                                          varStockCountDetail,
                                          {}
                                      );

                                      Set(
                                          varStockCountType,
                                          Index(col_ProductTypes, 1).ProductTypeCode
                                      );
                                      Reset(cmb_ProductCode);
                                      Reset(num_PalletQty);
                                      Reset(num_OddBagQty);
                                      Reset(dp_ProductionDate);
                                      Reset(num_BrokenBagQty);
                                      Reset(num_OddBoxQty);
                                      Reset(num_OddKgQty);
                                      Reset(txt_Note_Bao);
                                      Reset(txt_LocationName_Bao);
                                      Reset(cmb_XaDensityCode);
                                      Reset(cmb_XaBinCode);
                                      Reset(num_Measure1);
                                      Reset(num_Measure2);
                                      Reset(num_Measure3);
                                      Reset(num_DustSteamQty);
                                      Reset(cmb_ProductCode_Bigbag);
                                      Reset(num_BigBagQty);
                                      Reset(num_BigBagWeight);
                                      Reset(num_NetBigBagWeight);
                                      Reset(cmb_ProductCategory);
                                      Reset(cmb_StockCountType);

                                      Navigate(
                                          scrKiemKhoForm,
                                          ScreenTransition.CoverRight
                                      );
                                    Size: =fxFontSizeMD
                                    Text: ="Thêm"
                                    Visible: =(varUserInPlant.Role = Index(col_RoleUser,16).RoleCode || varUserInPlant.Role = Index(col_RoleUser,1).RoleCode || varUserInPlant.Role = Index(col_RoleUser,9).RoleCode)
                              - btn_RefreshKiemKhoHangBao:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="ArrowSync"
                                    OnSelect: =Refresh('QLK List Stock Count Details')
                                    Size: =fxFontSizeMD
                                    Text: ="Làm mới"
                                    Width: =120
                              - btn_RefreshKiemKhoHangXa_2:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    OnSelect: |
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xác nhận kiểm kê " & CountRows(col_SelectedKiemKhoHangBao) & " bản ghi đã chọn không?",
                                              {
                                                  Title: "Xác nhận",
                                                  ConfirmButton: "Xác nhận",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          UpdateContext({varShowPopupProcessing: true});
                                          Clear(updateKiemKhoHangBao);
                                          ForAll(
                                              col_SelectedKiemKhoHangBao As item,
                                              Collect(
                                                  updateKiemKhoHangBao,
                                                  {
                                                      ID          : item.ID,
                                                      StatusCode  : "COUNT_CONFIRMED"
                                                  }
                                              )
                                          );
                                          IfError(
                                              Patch('QLK List Stock Count Details', updateKiemKhoHangBao),
                                              Notify("Cập nhật thất bại", NotificationType.Error, 2000),
                                              Notify("Cập nhật thành công", NotificationType.Success, 2000);
                                              Clear(updateKiemKhoHangBao);
                                              Clear(col_SelectedKiemKhoHangBao);
                                          );
                                          UpdateContext({varShowPopupProcessing: false})
                                      )
                                    Size: =fxFontSizeMD
                                    Text: ="Xác nhận"
                                    Visible: |-
                                      =CountRows(
                                          Filter(
                                              col_SelectedKiemKhoHangBao,
                                              StatusCode = Index(col_WorkflowStatus,1).StatusCode
                                          )
                                      ) > 0
                                    Width: =120
                        - lbl_TitleKiemKhoHangBao:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 128, 40, 1)
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightSemiBold
                              Height: =40
                              PaddingLeft: =10
                              Size: =fxFontSizeXL
                              Text: ="Kiểm kê hàng bao"
                        - con_FilterKiemKhoHangBao:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =If(scrKiemKhoHangBao.Size = 1 ,90 ,45)
                              LayoutDirection: =If(scrKiemKhoHangBao.Size = 1 ,LayoutDirection.Vertical ,LayoutDirection.Horizontal)
                              LayoutGap: =5
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - con_Row1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: |
                                      =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                  Children:
                                    - dp_FilterNgayKiemHangBao:
                                        Control: ModernDatePicker
                                        Properties:
                                          BasePaletteColor: =RGBA(8,222,8,1)
                                          DefaultDate: =Today()
                                          Font: =fxFontFamily
                                          FontWeight: =FontWeight.Normal
                                          Format: =DatePickerFormat.Short
                                          Size: =fxFontSizeMD
                                          Width: =160
                                    - txt_SearchKiemKhoHangBao:
                                        Control: ModernTextInput
                                        Properties:
                                          Font: =fxFontFamily
                                          Placeholder: ="Tìm kiếm ...."
                                          Width: |-
                                            =
                                            If(scrKiemKhoHangBao.Size = 1 ,Parent.Width - dp_FilterNgayKiemHangBao.Width - 60 ,Parent.Width - dp_FilterNgayKiemHangBao.Width - 10)
                              - con_Row2:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    LayoutMinHeight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                  Children:
                                    - cbo_FilterStatusKiemKho:
                                        Control: ModernCombobox
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.StatusNameVI
                                          Items: =Filter(col_WorkflowStatus,StatusCode="DRAFT" || StatusCode="COUNT_CONFIRMED")
                                          SelectMultiple: =false
                                          Width: =160
                                    - cbo_FilterProductTypeNhapTuSanXuat_8:
                                        Control: ModernCombobox
                                        Properties:
                                          DefaultSelectedItems: =LookUp(col_ProductCategories,ProductCategoryCode=varUserInPlant.ProductCategoryCode)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          InputTextPlaceholder: ="Tất cả"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                          Items: =col_ProductCategories
                                          SelectMultiple: =false
                                          Width: =Parent.Width - cbo_FilterStatusKiemKho.Width - Button1.Width - 10
                                    - Button1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Transparent
                                          Icon: ="Eraser"
                                          OnSelect: |-
                                            =Reset(cbo_FilterStatusKiemKho);
                                            Reset(cbo_FilterProductTypeNhapTuSanXuat_8);
                                            Reset(txt_SearchKiemKhoHangBao);
                                          Text: =
                                          Width: =50
                        - con_ListKiemKhoHangBao:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderStyle: =BorderStyle.None
                              DropShadow: =If(scrKiemKhoHangBao.Size = 1, DropShadow.None, DropShadow.Semibold)
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =If(scrKiemKhoHangBao.Size = 1, LayoutAlignItems.Stretch, LayoutAlignItems.Start)
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =If(scrKiemKhoHangBao.Size = 1, 0, 5)
                              RadiusTopRight: =6
                              Width: =Parent.Width - Parent.PaddingLeft * 2
                            Children:
                              - con_TableHeaderKiemKhoHangBao:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(250, 250, 250, 1)
                                    FillPortions: =0
                                    Height: =46
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    Visible: =scrKiemKhoHangBao.Size <> 1
                                    Width: =If(scrKiemKhoHangBao.Size = 1, Parent.Width, Max(Parent.Width, 1100))
                                  Children:
                                    - chk_KiemKhoHangBao_SelectAll:
                                        Control: ModernCheckbox
                                        Properties:
                                          Default: |-
                                            =CountRows(col_SelectedKiemKhoHangBao) = CountRows(gal_KiemKhoHangBao.AllItems) &&
                                            CountRows(gal_KiemKhoHangBao.AllItems) > 0
                                          DisplayMode: |
                                            =If(
                                                CountRows(
                                                    Filter(
                                                        gal_KiemKhoHangBao.AllItems,
                                                        StatusCode = Index(col_WorkflowStatus, 1).StatusCode
                                                    )
                                                ) > 0,
                                                DisplayMode.Edit,
                                                DisplayMode.Disabled
                                            )
                                          FontWeight: =""
                                          Label: =""
                                          OnCheck: =ClearCollect(col_SelectedKiemKhoHangBao, Filter(gal_KiemKhoHangBao.AllItems,StatusCode = Index(col_WorkflowStatus,1).StatusCode))
                                          OnUncheck: =Clear(col_SelectedKiemKhoHangBao)
                                          Width: =32
                                    - lbl_HeaderSAPCode:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Mã hàng"
                                          Width: =(Parent.Width - 200) * 0.0879
                                          Wrap: =false
                                    - lbl_HeaderStatusCodeKiemKho:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Trạng thái"
                                          Width: =(Parent.Width - 200) * 0.0879
                                          Wrap: =false
                                    - lbl_HeaderPalletQty:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Số pallet"
                                          Width: =(Parent.Width - 200) * 0.0769
                                          Wrap: =false
                                    - lbl_HeaderLooseBagQty:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Số bao lẻ"
                                          Width: =(Parent.Width - 200) * 0.0769
                                          Wrap: =false
                                    - lbl_HeaderProductionDate:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Ngày sản xuất"
                                          Width: =(Parent.Width - 200) * 0.0879
                                          Wrap: =false
                                    - lbl_HeaderStockCountDate:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Ngày kiểm kê"
                                          Width: =(Parent.Width - 200) * 0.0879
                                          Wrap: =false
                                    - lbl_HeaderTornBagQty:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Bao rách"
                                          Width: =(Parent.Width - 200) * 0.0769
                                          Wrap: =false
                                    - lbl_HeaderLooseBoxQty:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Thùng lẻ"
                                          Width: =(Parent.Width - 200) * 0.0769
                                          Wrap: =false
                                    - lbl_HeaderLooseKgQty:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Kg lẻ"
                                          Width: =(Parent.Width - 200) * 0.0769
                                          Wrap: =false
                                    - lbl_HeaderNote:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Ghi chú"
                                          Width: =(Parent.Width - 200) * 0.1099
                                          Wrap: =false
                                    - lbl_HeaderLocation:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Vị trí"
                                          Width: =(Parent.Width - 200) * 0.0879
                                          Wrap: =false
                                    - lbl_HeaderActualQty:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Số kg tồn (Kg)"
                                          Width: =(Parent.Width - 200) * 0.0659
                                          Wrap: =false
                                    - lbl_HeaderActionKiemKhoHangBao:
                                        Control: ModernText
                                        Properties:
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          PaddingTop: =0
                                          Size: =fxFontSizeMD
                                          Text: ="Thao tác"
                                          Width: =80
                                          Wrap: =false
                              - gal_KiemKhoHangBao:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    Height: =Parent.Height - con_TableHeaderKiemKhoHangBao.Height - lbl_TotalRowsKiemKhoHangBao.Height
                                    Items: |-
                                      =Switch(
                                          varRoleCurrentFirst.Role,
                                          Index(col_RoleUser, 16).RoleCode, // Nhân viên kho thành phẩm
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "BAOQC",
                                                  (IsBlank(txt_SearchKiemKhoHangBao.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangBao.Text)),
                                                  IsBlank(dp_FilterNgayKiemHangBao.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao.SelectedDate,
                                                  IsBlank(cbo_FilterStatusKiemKho.Selected) || StatusCode = cbo_FilterStatusKiemKho.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_8.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_8.Selected.ProductCategoryCode,
                                                  UserID = varUserInPlant.UserID
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          Index(col_RoleUser, 1).RoleCode, // Thủ kho thành phẩm
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "BAOQC",
                                                  (IsBlank(txt_SearchKiemKhoHangBao.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangBao.Text)),
                                                  IsBlank(dp_FilterNgayKiemHangBao.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao.SelectedDate,
                                                  IsBlank(cbo_FilterStatusKiemKho.Selected) || StatusCode = cbo_FilterStatusKiemKho.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_8.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_8.Selected.ProductCategoryCode,
                                                  UserID = varUserInPlant.UserID
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          Index(col_RoleUser, 9).RoleCode, // VHSX_HO
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "BAOQC",
                                                  (IsBlank(txt_SearchKiemKhoHangBao.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangBao.Text)),
                                                  IsBlank(cbo_FilterStatusKiemKho.Selected) || StatusCode = cbo_FilterStatusKiemKho.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_8.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_8.Selected.ProductCategoryCode,
                                                  IsBlank(dp_FilterNgayKiemHangBao.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao.SelectedDate
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          ),
                                          SortByColumns(
                                              Filter(
                                                  'QLK List Stock Count Details',
                                                  PlantCode      = varUserInPlant.PlantCode,
                                                  StockCountType = "BAOQC",
                                                  (IsBlank(txt_SearchKiemKhoHangBao.Text) ||  StartsWith(SAPCode, txt_SearchKiemKhoHangBao.Text)),
                                                  IsBlank(cbo_FilterStatusKiemKho.Selected) || StatusCode = cbo_FilterStatusKiemKho.Selected.StatusCode,
                                                  IsBlank(cbo_FilterProductTypeNhapTuSanXuat_8.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_8.Selected.ProductCategoryCode,
                                                  IsBlank(dp_FilterNgayKiemHangBao.SelectedDate) || StockCountDate = dp_FilterNgayKiemHangBao.SelectedDate
                                              ),
                                              "Created",
                                              SortOrder.Descending
                                          )
                                      )
                                    ShowScrollbar: =false
                                    TemplateSize: |-
                                      =If(
                                          scrKiemKhoHangBao.Size = 1,
                                          32 * 7.2 + 10,
                                          45
                                      )
                                    Width: =If(scrKiemKhoHangBao.Size = 1, Parent.Width, Max(Parent.Width, 1100))
                                  Children:
                                    - con_RowDividerKiemKhoHangBao:
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(229, 231, 235, 1)
                                          Height: =1
                                          Visible: =scrKiemKhoHangBao.Size <> 1
                                          Width: =Parent.Width - 10
                                          Y: =gal_KiemKhoHangBao.TemplateHeight
                                    - con_RowMasterKiemKhoHangBao:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =If(scrKiemKhoHangBao.Size = 1, DropShadow.Light, DropShadow.None)
                                          Height: =gal_KiemKhoHangBao.TemplateHeight
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: |-
                                            =If(
                                                scrKiemKhoHangBao.Size = 1,
                                                LayoutDirection.Vertical,
                                                LayoutDirection.Horizontal
                                            )
                                          LayoutGap: =If(scrKiemKhoHangBao.Size = 1, 5, 0)
                                          PaddingLeft: =5
                                          RadiusTopLeft: =If(scrKiemKhoHangBao.Size = 1, 4, 0)
                                          Width: =Parent.Width - 10
                                        Children:
                                          - chk_KiemKhoHangBao_SelectRow:
                                              Control: ModernCheckbox
                                              Properties:
                                                Default: =ThisItem.ID in col_SelectedKiemKhoHangBao.ID
                                                DisplayMode: |-
                                                  =// Chỉ cho phép chỉnh sửa khi phiếu đang ở trạng thái DRAFT, các trạng thái khác thì khóa
                                                  If(
                                                      ThisItem.StatusCode = "DRAFT" ,
                                                      DisplayMode.Edit,
