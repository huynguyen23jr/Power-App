Screens:
  scrXuatKho:
    Properties:
      OnVisible: =varShowMenuUser && scrXuatKho.Size <> 1
    Children:
      - con_MainXuatKho:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuXuatKho:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrXuatKho.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarXuatKho:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainXuatKho:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderXuatKho:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderXuatKho:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrXuatKho.Size
                  - con_BodyXuatKho:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderXuatKho.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentXuatKho:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrDanhMucBin.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_ActionHeaderXuatKho:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                  Children:
                                    - btn_AddXuatKho:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =Set(
                                                varGoodsIssue,
                                                {}
                                            );
                                            Navigate(
                                                scrXuatKhoForm,
                                                ScreenTransition.CoverRight
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                          Visible: |-
                                            =varUserInPlant.Role = "FG_WH" ||     // FG_WH         - Thủ kho thành phẩm
                                            varUserInPlant.Role = "FG_SUP" ||     // FG_SUP        - Giám sát thành phẩm
                                            varUserInPlant.Role = "VHSX_HO"        // VHSX_HO       - VHSX HO
                                    - btn_RefreshXuatKho:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: |-
                                            =Refresh('QLK List Issue Header');
                                            Refresh('QLK List Issue Detail')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                              - lbl_TitleXuatKho:
                                  Control: ModernText
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(45, 128, 40, 1)
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightSemiBold
                                    Height: =40
                                    PaddingLeft: =10
                                    Size: =fxFontSizeXL
                                    Text: ="Xuất kho"
                              - con_FilterXuatKhoV2:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    BorderColor: =RGBA(229, 231, 235, 1)
                                    BorderThickness: =If(scrXuatKho.Size = 1, 1, 0)
                                    DropShadow: =DropShadow.None
                                    Fill: =If(scrXuatKho.Size = 1, RGBA(248, 250, 252, 1), RGBA(0, 0, 0, 0))
                                    FillPortions: =0
                                    Height: =If(scrXuatKho.Size = 1, 60, 52)
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =If(scrXuatKho.Size = 1, 8, 10)
                                    PaddingBottom: =If(scrXuatKho.Size = 1, 8, 5)
                                    PaddingLeft: =If(scrXuatKho.Size = 1, 8, 5)
                                    PaddingRight: =If(scrXuatKho.Size = 1, 8, 5)
                                    PaddingTop: =If(scrXuatKho.Size = 1, 8, 5)
                                    RadiusBottomLeft: =If(scrXuatKho.Size = 1, 8, 5)
                                    RadiusBottomRight: =If(scrXuatKho.Size = 1, 8, 5)
                                    RadiusTopLeft: =If(scrXuatKho.Size = 1, 8, 5)
                                    RadiusTopRight: =If(scrXuatKho.Size = 1, 8, 5)
                                  Children:
                                    - txt_SearchXuatKhoV2:
                                        Control: ModernTextInput
                                        Properties:
                                          FillPortions: =If(scrXuatKho.Size = 1, 1, 3)
                                          Font: =fxFontFamily
                                          Height: =40
                                          LayoutMinWidth: =If(scrXuatKho.Size = 1, 16, 200)
                                          Placeholder: =If(scrXuatKho.Size = 1, "Tìm kiếm mã phiếu...", "Mã phiếu xuất...")
                                    - dp_FromXuatKhoV2:
                                        Control: ModernDatePicker
                                        Properties:
                                          DefaultDate: =Blank()
                                          FillPortions: =2
                                          Format: =DatePickerFormat.Short
                                          Height: =40
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =140
                                          Placeholder: ="Từ ngày"
                                          Visible: =scrXuatKho.Size <> 1
                                    - lbl_DateDashXuatKhoV2:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          Font: =fxFontFamily
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Text: ="-"
                                          Visible: =scrXuatKho.Size <> 1
                                          Width: =12
                                    - dp_ToXuatKhoV2:
                                        Control: ModernDatePicker
                                        Properties:
                                          DefaultDate: =Blank()
                                          FillPortions: =2
                                          Format: =DatePickerFormat.Short
                                          Height: =40
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =140
                                          Placeholder: ="Đến ngày"
                                          Visible: =scrXuatKho.Size <> 1
                                    - cbo_StatusWebXuatKhoV2:
                                        Control: ModernCombobox
                                        Properties:
                                          FillPortions: =2
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightNormal
                                          Height: =40
                                          InputTextPlaceholder: ="Trạng thái"
                                          IsSearchable: =false
                                          ItemDisplayText: =ThisItem.StatusNameVI
                                          Items: =col_WorkflowStatus
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =150
                                          SelectMultiple: =false
                                          Visible: =scrXuatKho.Size <> 1
                                    - btn_ClearFilterXuatKhoV2:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: ="Eraser"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Reset(txt_SearchXuatKhoV2);
                                            Reset(dp_FromXuatKhoV2);
                                            Reset(dp_ToXuatKhoV2);
                                            Reset(cbo_StatusWebXuatKhoV2)
                                          Text: ="Xóa lọc"
                                          Visible: =scrXuatKho.Size <> 1
                                          Width: =110
                                    - btn_FilterXuatKhoV2:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: ="Filter"
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varPopUpFilterXuatKho: true})
                                          Text: ="Bộ lọc" & If((If(!IsBlank(cbo_FilterStatusXuatKhoV2.Selected), 1, 0) + If(!IsBlank(dp_FromSheetXuatKhoV2.SelectedDate), 1, 0) + If(!IsBlank(dp_ToSheetXuatKhoV2.SelectedDate), 1, 0)) > 0, " (" & (If(!IsBlank(cbo_FilterStatusXuatKhoV2.Selected), 1, 0) + If(!IsBlank(dp_FromSheetXuatKhoV2.SelectedDate), 1, 0) + If(!IsBlank(dp_ToSheetXuatKhoV2.SelectedDate), 1, 0)) & ")", "")
                                          Visible: =scrXuatKho.Size = 1
                                          Width: =120
                              - con_ListXuatKho:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =If(scrXuatKho.Size = 1, DropShadow.None, DropShadow.Semibold)
                                    Fill: =RGBA(255, 255, 255, 1)
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutOverflowX: =LayoutOverflow.Scroll
                                    LayoutOverflowY: =LayoutOverflow.Scroll
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =If(scrXuatKho.Size = 1, 0, 5)
                                    RadiusTopRight: =6
                                    Width: =Parent.Width - Parent.PaddingLeft * 2
                                  Children:
                                    - con_TableHeaderXuatKho:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(250, 250, 250, 1)
                                          FillPortions: =0
                                          Height: =46
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Visible: =scrXuatKho.Size <> 1
                                        Children:
                                          - lbl_HeaderIssueNo:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Mã phiếu"
                                                Wrap: =false
                                          - lbl_HeaderIssueDate:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ngày xuất"
                                                Wrap: =false
                                          - lbl_HeaderStatusXuatKho:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Trạng thái"
                                                Wrap: =false
                                          - lbl_HeaderLoaiSanPham:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Loại sản phẩm"
                                                Wrap: =false
                                          - lbl_HeaderTotalWeight:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =2
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Tổng xuất"
                                                Wrap: =false
                                          - lbl_HeaderActionXuatKho:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Thao tác"
                                                Width: =72
                                                Wrap: =false
                                    - gal_XuatKho:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =Parent.Height - con_TableHeaderXuatKho.Height - lbl_TotalRowsXuatKho.Height
                                          Items: |-
                                            =// Chỉ lấy các cột đang hiển thị trên danh sách (nhanh hơn)
                                            ShowColumns(
                                                Switch(
                                                    varUserInPlant.Role,
                                                    "SHIFT_LEADER", // Trưởng ca
                                                    SortByColumns(
                                                        Filter(
                                                            'QLK List Issue Header',
                                                            PlantCode = varUserInPlant.PlantCode,
                                                            IsBlank(txt_SearchXuatKhoV2.Text) || StartsWith(IssueNo, txt_SearchXuatKhoV2.Text),
                                                            'Created By'.Email = varCurrentUser.G_Email,
                                                            IsBlank(dp_FromXuatKhoV2.SelectedDate) || IssueDate >= dp_FromXuatKhoV2.SelectedDate,
                                                            IsBlank(dp_ToXuatKhoV2.SelectedDate) || IssueDate <= dp_ToXuatKhoV2.SelectedDate,
                                                            IsBlank(cbo_StatusWebXuatKhoV2.Selected) || StatusCode = cbo_StatusWebXuatKhoV2.Selected.StatusCode,
                                                            IsBlank(cbo_FilterStatusXuatKhoV2.Selected) || StatusCode = cbo_FilterStatusXuatKhoV2.Selected.StatusCode,
                                                            IsBlank(dp_FromSheetXuatKhoV2.SelectedDate) || IssueDate >= dp_FromSheetXuatKhoV2.SelectedDate,
                                                            IsBlank(dp_ToSheetXuatKhoV2.SelectedDate) || IssueDate <= dp_ToSheetXuatKhoV2.SelectedDate,
                                                            IsBlank(varUserInPlant.ProductCategoryCode) || ProductCategoryCode = varUserInPlant.ProductCategoryCode
                                                        ),
                                                        "Created",
                                                        SortOrder.Descending
                                                    ),
                                                    "FG_WH", // Thủ kho thành phẩm
                                                    SortByColumns(
                                                        Filter(
                                                            'QLK List Issue Header',
                                                            PlantCode = varUserInPlant.PlantCode,
                                                            ProductCategoryCode = LookUp(col_ProductCategories, ID = 2).ProductCategoryCode,
                                                            IsBlank(txt_SearchXuatKhoV2.Text) || StartsWith(IssueNo, txt_SearchXuatKhoV2.Text),
                                                            'Created By'.Email = varCurrentUser.G_Email,
                                                            IsBlank(dp_FromXuatKhoV2.SelectedDate) || IssueDate >= dp_FromXuatKhoV2.SelectedDate,
                                                            IsBlank(dp_ToXuatKhoV2.SelectedDate) || IssueDate <= dp_ToXuatKhoV2.SelectedDate,
                                                            IsBlank(cbo_StatusWebXuatKhoV2.Selected) || StatusCode = cbo_StatusWebXuatKhoV2.Selected.StatusCode,
                                                            IsBlank(cbo_FilterStatusXuatKhoV2.Selected) || StatusCode = cbo_FilterStatusXuatKhoV2.Selected.StatusCode,
                                                            IsBlank(dp_FromSheetXuatKhoV2.SelectedDate) || IssueDate >= dp_FromSheetXuatKhoV2.SelectedDate,
                                                            IsBlank(dp_ToSheetXuatKhoV2.SelectedDate) || IssueDate <= dp_ToSheetXuatKhoV2.SelectedDate,
                                                            IsBlank(varUserInPlant.ProductCategoryCode) || ProductCategoryCode = varUserInPlant.ProductCategoryCode
                                                        ),
                                                        "Created",
                                                        SortOrder.Descending
                                                    ),
                                                    "RM_WH", // Thủ kho nguyên liệu
                                                    SortByColumns(
                                                        Filter(
                                                            'QLK List Issue Header',
                                                            PlantCode = varUserInPlant.PlantCode,
                                                            ProductCategoryCode = LookUp(col_ProductCategories, ID = 1).ProductCategoryCode,
                                                            IsBlank(txt_SearchXuatKhoV2.Text) || StartsWith(IssueNo, txt_SearchXuatKhoV2.Text),
                                                            'Created By'.Email = varCurrentUser.G_Email,
                                                            IsBlank(dp_FromXuatKhoV2.SelectedDate) || IssueDate >= dp_FromXuatKhoV2.SelectedDate,
                                                            IsBlank(dp_ToXuatKhoV2.SelectedDate) || IssueDate <= dp_ToXuatKhoV2.SelectedDate,
                                                            IsBlank(cbo_StatusWebXuatKhoV2.Selected) || StatusCode = cbo_StatusWebXuatKhoV2.Selected.StatusCode,
                                                            IsBlank(cbo_FilterStatusXuatKhoV2.Selected) || StatusCode = cbo_FilterStatusXuatKhoV2.Selected.StatusCode,
                                                            IsBlank(dp_FromSheetXuatKhoV2.SelectedDate) || IssueDate >= dp_FromSheetXuatKhoV2.SelectedDate,
                                                            IsBlank(dp_ToSheetXuatKhoV2.SelectedDate) || IssueDate <= dp_ToSheetXuatKhoV2.SelectedDate,
                                                            IsBlank(varUserInPlant.ProductCategoryCode) || ProductCategoryCode = varUserInPlant.ProductCategoryCode
                                                        ),
                                                        "Created",
                                                        SortOrder.Descending
                                                    ),
                                                    SortByColumns(
                                                        Filter(
                                                            'QLK List Issue Header',
                                                            PlantCode = varUserInPlant.PlantCode,
                                                            IsBlank(txt_SearchXuatKhoV2.Text) || StartsWith(IssueNo, txt_SearchXuatKhoV2.Text),
                                                            IsBlank(dp_FromXuatKhoV2.SelectedDate) || IssueDate >= dp_FromXuatKhoV2.SelectedDate,
                                                            IsBlank(dp_ToXuatKhoV2.SelectedDate) || IssueDate <= dp_ToXuatKhoV2.SelectedDate,
                                                            IsBlank(cbo_StatusWebXuatKhoV2.Selected) || StatusCode = cbo_StatusWebXuatKhoV2.Selected.StatusCode,
                                                            IsBlank(cbo_FilterStatusXuatKhoV2.Selected) || StatusCode = cbo_FilterStatusXuatKhoV2.Selected.StatusCode,
                                                            IsBlank(dp_FromSheetXuatKhoV2.SelectedDate) || IssueDate >= dp_FromSheetXuatKhoV2.SelectedDate,
                                                            IsBlank(dp_ToSheetXuatKhoV2.SelectedDate) || IssueDate <= dp_ToSheetXuatKhoV2.SelectedDate,
                                                            IsBlank(varUserInPlant.ProductCategoryCode) || ProductCategoryCode = varUserInPlant.ProductCategoryCode
                                                        ),
                                                        "Created",
                                                        SortOrder.Descending
                                                    )
                                                ),
                                                IssueNo,
                                                IssueDate,
                                                ProductCategoryCode,
                                                StatusCode,
                                                TotalIssueQuantity,
                                                ID
                                            )
                                          ShowScrollbar: =false
                                          TemplateSize: |-
                                            =If(
                                                scrXuatKho.Size = 1,
                                                200,
                                                45
                                            )
                                          Width: =Parent.Width
                                        Children:
                                          - con_RowDividerXuatKho:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(229, 231, 235, 1)
                                                Height: =1
                                                Visible: =scrXuatKho.Size <> 1
                                                Width: =gal_XuatKho.Width -10
                                                Y: =gal_XuatKho.TemplateHeight
                                          - con_RowMasterXuatKho:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                BorderColor: =RGBA(229, 231, 235, 1)
                                                BorderStyle: =If(scrXuatKho.Size = 1, BorderStyle.Solid, BorderStyle.None)
                                                BorderThickness: =If(scrXuatKho.Size = 1, 1, 0)
                                                DropShadow: =If(scrXuatKho.Size = 1, DropShadow.Light, DropShadow.None)
                                                Fill: =RGBA(255, 255, 255, 1)
                                                Height: =If(scrXuatKho.Size = 1, gal_XuatKho.TemplateHeight - 8, gal_XuatKho.TemplateHeight)
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: |-
                                                  =If(
                                                      scrXuatKho.Size = 1,
                                                      LayoutDirection.Vertical,
                                                      LayoutDirection.Horizontal
                                                  )
                                                LayoutGap: =If(scrXuatKho.Size = 1, 5, 0)
                                                PaddingBottom: =If(scrXuatKho.Size = 1, 8, 0)
                                                PaddingLeft: =If(scrXuatKho.Size = 1, 8, 0)
                                                PaddingRight: =If(scrXuatKho.Size = 1, 8, 0)
                                                PaddingTop: =If(scrXuatKho.Size = 1, 8, 0)
                                                RadiusBottomLeft: =If(scrXuatKho.Size = 1, 10, 0)
                                                RadiusBottomRight: =If(scrXuatKho.Size = 1, 10, 0)
                                                RadiusTopLeft: =If(scrXuatKho.Size = 1, 10, 0)
                                                RadiusTopRight: =If(scrXuatKho.Size = 1, 10, 0)
                                                Width: =Parent.Width - 10
                                              Children:
                                                - con_RowXuatKho:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(255, 255, 255, 0)
                                                      FillPortions: =0
                                                      Height: |-
                                                        =If(
                                                            scrXuatKho.Size = 1,
                                                            gal_XuatKho.TemplateHeight - 8 - 16 - 5 - con_MobileActionXuatKho.Height,
                                                            48
                                                        )
                                                      LayoutAlignItems: =If(scrXuatKho.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                      LayoutDirection: =If(scrXuatKho.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                      LayoutGap: =If(scrXuatKho.Size = 1, 6, 5)
                                                      LayoutMinHeight: =10
                                                      PaddingLeft: =If(scrXuatKho.Size = 1, 14, 5)
                                                      PaddingRight: =If(scrXuatKho.Size = 1, 14, 5)
                                                      PaddingTop: =If(scrXuatKho.Size = 1, 12, 5)
                                                      Width: |-
                                                        =If(
                                                            scrXuatKho.Size = 1,
                                                            Parent.Width - Parent.PaddingLeft - Parent.PaddingRight,
                                                            Parent.Width - Parent.PaddingRight * 2 - Parent.LayoutGap 
                                                        )
                                                    Children:
                                                      - con_CardHeadXuatKho:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            AlignInContainer: =AlignInContainer.SetByContainer
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =114
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            LayoutGap: =12
                                                            LayoutMinHeight: =16
                                                            LayoutMinWidth: =16
                                                            Visible: =scrXuatKho.Size = 1
                                                            Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                                          Children:
                                                            - con_CardIconXuatKho:
                                                                Control: GroupContainer
                                                                Variant: AutoLayout
                                                                Properties:
                                                                  AlignInContainer: =AlignInContainer.Start
                                                                  DropShadow: =DropShadow.None
                                                                  Fill: =RGBA(232, 245, 233, 1)
                                                                  FillPortions: =0
                                                                  Height: =52
                                                                  LayoutAlignItems: =LayoutAlignItems.Center
                                                                  LayoutDirection: =LayoutDirection.Horizontal
                                                                  LayoutJustifyContent: =LayoutJustifyContent.Center
                                                                  LayoutMinHeight: =16
                                                                  LayoutMinWidth: =16
                                                                  RadiusBottomLeft: =12
                                                                  RadiusBottomRight: =12
                                                                  RadiusTopLeft: =12
                                                                  RadiusTopRight: =12
                                                                  Width: =52
                                                                Children:
                                                                  - btn_CardIconXuatKho:
                                                                      Control: ModernButton
                                                                      Properties:
                                                                        Appearance: =ButtonAppearance.Transparent
