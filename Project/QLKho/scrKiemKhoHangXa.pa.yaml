Screens:
  scrKiemKhoHangXa:
    Properties:
      OnVisible: |-
        =varShowMenuUser && scrKiemKhoHangXa.Size <> 1;
        Clear(updateKiemKhoHangXa);
        Clear(col_SelectedKiemKhoHangXa);
    Children:
      - con_MainKiemKhoHangXa:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_MenuKiemKhoHangXa:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  Visible: =scrKiemKhoHangXa.Size <> 1
                  Width: =If(varShowMenuUser, 240, 64)
                Children:
                  - cmp_NavSidebarKiemKhoHangXa:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - con_SideRight_MainKiemKhoHangXa:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_HeaderKiemKhoHangXa:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =55
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - cmp_HeaderKiemKhoHangXa:
                            Control: CanvasComponent
                            ComponentName: Header
                            Properties:
                              Height: =App.Height
                              IDRecord: =100
                              Width: =Parent.Width
                              varSizeScreen: =scrKiemKhoHangXa.Size
                  - con_BodyKiemKhoHangXa:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        FillPortions: =0
                        Height: =Parent.Height - con_HeaderKiemKhoHangXa.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =If(!varShowMenuUser, 0, 5)
                        PaddingBottom: =If(!varShowMenuUser, 0, 5)
                        PaddingLeft: =If(!varShowMenuUser, 0, 5)
                        PaddingRight: =If(!varShowMenuUser, 0, 5)
                        PaddingTop: =If(!varShowMenuUser, 0, 5)
                      Children:
                        - con_ContentKiemKhoHangXa:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: |-
                                =If(
                                    scrKiemKhoHangXa.Size = 1,
                                    DropShadow.Semibold,
                                    DropShadow.None
                                )
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                              RadiusTopRight: =0
                            Children:
                              - con_FormButtonMobile_KiemKhoHangXa:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =56
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                    RadiusBottomLeft: =5
                                    RadiusBottomRight: =5
                                    RadiusTopLeft: =5
                                    RadiusTopRight: =5
                                    Visible: =scrKiemKhoHangXa.Size = 1
                                    Width: =Parent.Width - 10
                                  Children:
                                    - lbl_MobileActionPos_KiemKhoHangXa:
                                        Control: ModernText
                                        Properties:
                                          Text: =Concat(Filter(Sequence(4), Switch(Value, 1, btn_AddKiemKhoHangXa.Visible, 2, btn_RefreshKiemKhoHangXa.Visible, 3, btn_ExportKiemKhoHangXa.Visible, 4, btn_RefreshKiemKhoHangXa_1.Visible, false)), Value, ",")
                                          Visible: =false
                                    - lbl_MobileActionCount_KiemKhoHangXa:
                                        Control: ModernText
                                        Properties:
                                          Text: =If(IsBlank(lbl_MobileActionPos_KiemKhoHangXa.Text), 0, CountRows(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ",")))
                                          Visible: =false
                                    - btn_MobileAction1_KiemKhoHangXa:
                                        Control: ModernButton
                                        Properties:
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ","), 1), 1)).Value), 1, "Add", 2, "ArrowSync", 3, "ArrowDownload", 4, "CheckmarkCircle", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ","), 1), 1)).Value),
                                                1, Select(btn_AddKiemKhoHangXa),
                                                2, Select(btn_RefreshKiemKhoHangXa),
                                                3, Select(btn_ExportKiemKhoHangXa),
                                                4, Select(btn_RefreshKiemKhoHangXa_1)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ","), 1), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Xuất Excel", 4, "Xác nhận", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ","), 1), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Xuất Excel", 4, "Xác nhận", "")
                                          Visible: =Value(lbl_MobileActionCount_KiemKhoHangXa.Text) >= 1
                                    - btn_MobileAction2_KiemKhoHangXa:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          FillPortions: =1
                                          Font: =fxFontFamily
                                          Height: =40
                                          Icon: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ","), 2), 1)).Value), 1, "Add", 2, "ArrowSync", 3, "ArrowDownload", 4, "CheckmarkCircle", "Save")
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =Switch(
                                                Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ","), 2), 1)).Value),
                                                1, Select(btn_AddKiemKhoHangXa),
                                                2, Select(btn_RefreshKiemKhoHangXa),
                                                3, Select(btn_ExportKiemKhoHangXa),
                                                4, Select(btn_RefreshKiemKhoHangXa_1)
                                            )
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Text: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ","), 2), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Xuất Excel", 4, "Xác nhận", "")
                                          Tooltip: =Switch(Value(First(LastN(FirstN(Split(lbl_MobileActionPos_KiemKhoHangXa.Text, ","), 2), 1)).Value), 1, "Thêm", 2, "Làm mới", 3, "Xuất Excel", 4, "Xác nhận", "")
                                          Visible: =Value(lbl_MobileActionCount_KiemKhoHangXa.Text) >= 2
                                    - btn_MobileMore_KiemKhoHangXa:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Secondary
                                          Height: =40
                                          Icon: ="MoreHorizontal"
                                          Layout: =ButtonLayout.IconOnly
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          OnSelect: |-
                                            =UpdateContext({varShowMoreActionsMobile_KiemKhoHangXa: !varShowMoreActionsMobile_KiemKhoHangXa})
                                          RadiusBottomLeft: =8
                                          RadiusBottomRight: =8
                                          RadiusTopLeft: =8
                                          RadiusTopRight: =8
                                          Tooltip: ="Thêm thao tác"
                                          Visible: =Value(lbl_MobileActionCount_KiemKhoHangXa.Text) >= 3
                                          Width: =40
                              - con_ActionHeaderKiemKhoHangXa:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =40
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =10
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    Visible: =scrKiemKhoHangXa.Size <> 1
                                  Children:
                                    - btn_AddKiemKhoHangXa:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="Add"
                                          OnSelect: |-
                                            =Set(
                                                varStockCountDetail,
                                                {}
                                            );

                                            Set(
                                                varStockCountType,
                                                "XABIN"
                                            );
                                            Reset(cmb_ProductCode);
                                            Reset(num_PalletQty);
                                            Reset(num_OddBagQty);
                                            Reset(dp_ProductionDate);
                                            Reset(num_BrokenBagQty);
                                            Reset(num_OddBoxQty);
                                            Reset(num_OddKgQty);
                                            Reset(txt_Note_Bao);
                                            Reset(txt_LocationName_Bao);
                                            Reset(cmb_XaDensityCode);
                                            Reset(cmb_XaBinCode);
                                            Reset(num_Measure1);
                                            Reset(num_Measure2);
                                            Reset(num_Measure3);
                                            Reset(num_DustSteamQty);
                                            Reset(cmb_ProductCode_Bigbag);
                                            Reset(num_BigBagQty);
                                            Reset(num_BigBagWeight);
                                            Reset(num_NetBigBagWeight);
                                            Reset(cmb_ProductCategory);
                                            Reset(cmb_StockCountType);

                                            Navigate(
                                                scrKiemKhoForm,
                                                ScreenTransition.CoverRight
                                            );
                                          Size: =fxFontSizeMD
                                          Text: ="Thêm"
                                          Visible: =(varUserInPlant.Role = "FG_STAFF" || varUserInPlant.Role = "FG_WH" || varUserInPlant.Role = "FG_SUP" || varUserInPlant.Role = "VHSX_HO")
                                    - btn_RefreshKiemKhoHangXa:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowSync"
                                          OnSelect: =Refresh('QLK List Stock Count Details')
                                          Size: =fxFontSizeMD
                                          Text: ="Làm mới"
                                          Width: =120
                                    - btn_ExportKiemKhoHangXa:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="ArrowDownload"
                                          OnSelect: |-
                                            =If(
                                                IsBlank(dp_FilterNgayKiemHangBao_1.SelectedDate),
                                                Notify("Vui lòng chọn ngày kiểm kê trước khi xuất Excel", NotificationType.Warning, 3000),
                                                UpdateContext({varShowPopupProcessing: true});
                                                With(
                                                    {
                                                        _result: 'QLK|ExportStockCountData'.Run(
                                                            If(varUserInPlant.Role = "VHSX_HO", "", varUserInPlant.PlantCode), // Mã plant (VHSX_HO xem tất cả)
                                                            "XABIN", // Loại kiểm kê
                                                            If(IsBlank(dp_FilterNgayKiemHangBao_1.SelectedDate), "", Text(dp_FilterNgayKiemHangBao_1.SelectedDate, "yyyy-mm-dd")), // Ngày kiểm kê
                                                            If(IsBlank(cbo_FilterStatusKiemKho_1.Selected), "", cbo_FilterStatusKiemKho_1.Selected.StatusCode), // Trạng thái
                                                            If(IsBlank(cbo_FilterProductTypeNhapTuSanXuat_9.Selected), "", cbo_FilterProductTypeNhapTuSanXuat_9.Selected.ProductCategoryCode) // Nhóm hàng
                                                        )
                                                    },
                                                    If(
                                                        _result.status = "200",
                                                        Launch(_result.fileurl);
                                                        Notify("Đã xuất " & _result.rowcount & " dòng ra file Excel", NotificationType.Success, 2000),
                                                        Notify(_result.message, NotificationType.Error, 2000)
                                                    )
                                                );
                                                UpdateContext({varShowPopupProcessing: false})
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xuất Excel"
                                          Width: =140
                                    - btn_RefreshKiemKhoHangXa_1:
                                        Control: ModernButton
                                        Properties:
                                          Appearance: =ButtonAppearance.Outline
                                          BasePaletteColor: =RGBA(8, 222, 8, 1)
                                          Font: =fxFontFamily
                                          Icon: ="CheckmarkCircle"
                                          OnSelect: |
                                            =If(
                                                Confirm(
                                                    "Bạn có chắc muốn xác nhận kiểm kê " & CountRows(col_SelectedKiemKhoHangXa) & " bản ghi đã chọn không?",
                                                    {
                                                        Title: "Xác nhận",
                                                        ConfirmButton: "Xác nhận",
                                                        CancelButton: "Hủy"
                                                    }
                                                ),
                                                UpdateContext({varShowPopupProcessing: true});
                                                Clear(updateKiemKhoHangXa);
                                                ForAll(
                                                    col_SelectedKiemKhoHangXa As item,
                                                    Collect(
                                                        updateKiemKhoHangXa,
                                                        {
                                                            ID          : item.ID,
                                                            StatusCode  : "COUNT_CONFIRMED"
                                                        }
                                                    )
                                                );
                                                IfError(
                                                    Patch('QLK List Stock Count Details', updateKiemKhoHangXa),
                                                    Notify("Cập nhật thất bại", NotificationType.Error, 2000),
                                                    Notify("Cập nhật thành công", NotificationType.Success, 2000);
                                                    Clear(col_SelectedKiemKhoHangXa);
                                                    Clear(updateKiemKhoHangXa);
                                                );
                                                UpdateContext({varShowPopupProcessing: false});
                                            )
                                          Size: =fxFontSizeMD
                                          Text: ="Xác nhận"
                                          Visible: |-
                                            =CountRows(
                                                Filter(
                                                    col_SelectedKiemKhoHangXa,
                                                    StatusCode = "DRAFT"
                                                )
                                            ) > 0
                                          Width: =120
                              - con_FilterKiemKhoHangBao_1:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =If(scrKiemKhoHangXa.Size = 1, If(varShowFilterKKX, 360, 96), 45)
                                    LayoutDirection: =If(scrKiemKhoHangBao.Size = 1 ,LayoutDirection.Vertical ,LayoutDirection.Horizontal)
                                    LayoutGap: =5
                                    LayoutJustifyContent: =LayoutJustifyContent.Center
                                    PaddingBottom: =5
                                    PaddingLeft: =5
                                    PaddingRight: =5
                                    PaddingTop: =5
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - con_Row1_1:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          LayoutMinHeight: |
                                            =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =scrKiemKhoHangXa.Size <> 1
                                          Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                        Children:
                                          - lbl_FilterNgayHangXa:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ngày kiểm kê"
                                                Width: =100
                                                Wrap: =false
                                          - dp_FilterNgayKiemHangBao_1:
                                              Control: ModernDatePicker
                                              Properties:
                                                BasePaletteColor: =RGBA(8,222,8,1)
                                                DefaultDate: =Today()
                                                Font: =fxFontFamily
                                                FontWeight: =FontWeight.Normal
                                                Format: =DatePickerFormat.Short
                                                Size: =fxFontSizeMD
                                                Width: =160
                                          - txt_SearchKiemKhoHangXa:
                                              Control: ModernTextInput
                                              Properties:
                                                Font: =fxFontFamily
                                                Placeholder: ="Tìm theo mã SAP ..."
                                                Width: |-
                                                  =
                                                  If(scrKiemKhoHangBao.Size = 1 ,Parent.Width - dp_FilterNgayKiemHangBao_1.Width - lbl_FilterNgayHangXa.Width - 60 ,Parent.Width - dp_FilterNgayKiemHangBao_1.Width - lbl_FilterNgayHangXa.Width - 10)
                                    - con_Row2_1:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =40
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          LayoutMinHeight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Visible: =scrKiemKhoHangXa.Size <> 1
                                          Width: =If(scrKiemKhoHangBao.Size = 1 ,Parent.Width ,Parent.Width/2 - 10)
                                        Children:
                                          - cbo_FilterStatusKiemKho_1:
                                              Control: ModernCombobox
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightNormal
                                                InputTextPlaceholder: ="Tất cả trạng thái"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.StatusNameVI
                                                Items: =Filter(col_WorkflowStatus,StatusCode="DRAFT" || StatusCode="COUNT_CONFIRMED")
                                                SelectMultiple: =false
                                                Width: =160
                                          - cbo_FilterProductTypeNhapTuSanXuat_9:
                                              Control: ModernCombobox
                                              Properties:
                                                DefaultSelectedItems: =If(varUserInPlant.Role = "VHSX_HO", Blank(), LookUp(col_ProductCategories,ProductCategoryCode=varUserInPlant.ProductCategoryCode))
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightNormal
                                                InputTextPlaceholder: ="Tất cả nhóm hàng"
                                                IsSearchable: =false
                                                ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                                Items: =col_ProductCategories
                                                SelectMultiple: =false
                                                Width: =Parent.Width - cbo_FilterStatusKiemKho_1.Width - Button1_1.Width - 10
                                          - Button1_1:
                                              Control: ModernButton
                                              Properties:
                                                Appearance: =ButtonAppearance.Transparent
                                                Icon: ="Eraser"
                                                OnSelect: |-
                                                  =Reset(cbo_FilterStatusKiemKho_1);
                                                  Reset(cbo_FilterProductTypeNhapTuSanXuat_9);
                                                  Reset(txt_SearchKiemKhoHangXa);
                                                Text: =
                                                Width: =50
                                    - con_FilterMobKKX:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          AlignInContainer: =AlignInContainer.SetByContainer
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.Regular
                                          Fill: =RGBA(255, 255, 255, 1)
                                          FillPortions: =0
                                          Height: =If(varShowFilterKKX, 344, 80)
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =8
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =12
                                          PaddingLeft: =12
                                          PaddingRight: =12
                                          PaddingTop: =12
                                          RadiusBottomLeft: =12
                                          RadiusBottomRight: =12
                                          RadiusTopLeft: =12
                                          RadiusTopRight: =12
                                          Visible: =scrKiemKhoHangXa.Size = 1
                                          Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                                        Children:
                                          - con_FilterHeadKKX:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =56
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =10
                                                LayoutMinHeight: =16
                                                LayoutMinWidth: =16
                                              Children:
                                                - btn_FilterIconKKX:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Icon: ="Filter"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateContext({varShowFilterKKX: !varShowFilterKKX})
                                                      Width: =32
                                                - con_FilterHeadTextKKX:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      Height: =56
                                                      LayoutAlignItems: =LayoutAlignItems.Stretch
                                                      LayoutDirection: =LayoutDirection.Vertical
                                                      LayoutJustifyContent: =LayoutJustifyContent.Center
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                    Children:
                                                      - lbl_FilterTitleKKX:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightBold
                                                            Height: =28
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeMD
                                                            Text: ="Bộ lọc" & If((If(!IsBlank(dp_FilterNgayMobKKX.SelectedDate), 1, 0) + If(!IsBlank(txt_SearchMobKKX.Text), 1, 0) + If(!IsBlank(cbo_StatusMobKKX.Selected), 1, 0) + If(!IsBlank(cbo_CategoryMobKKX.Selected), 1, 0)) > 0, " (" & (If(!IsBlank(dp_FilterNgayMobKKX.SelectedDate), 1, 0) + If(!IsBlank(txt_SearchMobKKX.Text), 1, 0) + If(!IsBlank(cbo_StatusMobKKX.Selected), 1, 0) + If(!IsBlank(cbo_CategoryMobKKX.Selected), 1, 0)) & ")", "")
                                                            Wrap: =false
                                                      - lbl_FilterSummaryKKX:
                                                          Control: ModernText
                                                          Properties:
                                                            Color: =RGBA(107, 114, 128, 1)
                                                            Font: =fxFontFamily
                                                            Height: =22
                                                            LayoutMinHeight: =0
                                                            LayoutMinWidth: =0
                                                            PaddingBottom: =0
                                                            PaddingLeft: =0
                                                            PaddingTop: =0
                                                            Size: =fxFontSizeXS
                                                            Text: |-
                                                              ="Ngày: " & If(IsBlank(dp_FilterNgayMobKKX.SelectedDate), "-", Text(dp_FilterNgayMobKKX.SelectedDate, "mm/dd/yyyy")) & "  •  Mã SAP: " & If(IsBlank(txt_SearchMobKKX.Text), "-", txt_SearchMobKKX.Text) & "  •  Trạng thái: " & Coalesce(cbo_StatusMobKKX.Selected.StatusNameVI, "Tất cả") & "  •  Nhóm hàng: " & Coalesce(cbo_CategoryMobKKX.Selected.ProductCategoryNameVI, "Tất cả")
                                                            Wrap: =false
                                                - btn_FilterToggleKKX:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Color: =RGBA(17, 24, 39, 1)
                                                      Height: =36
                                                      Icon: =If(varShowFilterKKX, "ChevronUp", "ChevronDown")
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
