App:
  Properties:
    OnStart: "=// Get Infor User Loggin\nSet(\n    varCurrentUserLogin,\n    LookUp(\n        'QLSX List Employees',\n        G_Email = User().Email\n        //G_Email = \"phuong.ph1@greenfeed.com.vn\"\n    )\n);\n\nSet(varUserRole , LookUp('QLSX List Security Role',UserId = varCurrentUserLogin.UserId));\n\n// Nếu không tồn tại role => tạo role mặc định\nIf( IsBlank(varUserRole.ID), Patch( 'QLSX List Security Role', Defaults( 'QLSX List Security Role' ), { Title: varCurrentUserLogin.FullName, Email: varCurrentUserLogin.G_Email, UserId: varCurrentUserLogin.UserId })); \n\nSet(varCurrentPlant, First( SortByColumns(Filter('QLSX List User In BU', UserId = varCurrentUserLogin.UserId ) ,\"PlantName\",SortOrder.Ascending)) );\n\nSwitch(\n    varUserRole.Role.Value,\n    Index( Choices('QLSX List Security Role'.Role),1).Value, // HO Support\n    ClearCollect(\n        col_NavigationMenu,\n            {\n                Row: 1,\n                Title: \"Nhà máy\",\n                Image: Icon.Home,\n                NameScreen: BUScreen\n            },\n            {\n                Row: 2,\n                Title: \"Danh sách dữ liệu sản xuất\",\n                Image: Icon.Database,\n                NameScreen: MasterDataProductionScreen\n            },\n            {\n                    Row: 4,\n                    Title: \"Danh sách dữ liệu Die\",\n                    Image: Icon.Database,\n                    NameScreen: MasterDataDieScreen\n            }\n            ,\n            {\n                Row: 5,\n                Title: \"Danh sách dữ liệu Roll\",\n                Image: Icon.Database,\n                NameScreen: MasterDataRollScreen\n            },\n            {\n                Row: 6,\n                Title: \"Danh sách dữ liệu máy\",\n                Image: Icon.Database,\n                NameScreen: MasterDataMachineScreen\n            },\n            {\n                Row: 7,\n                Title: \"Danh sách chỉ tiêu\",\n                Image: Icon.Database,\n                NameScreen: MasterDataCriteriaScreen\n            },\n            {\n                Row: 8,\n                Title: \"Danh sách lý do\",\n                Image: Icon.Database,\n                NameScreen: MasterDataReasonScreen\n            },\n            {\n                Row: 3,\n                Title: \"Quản trị viên\",\n                Image: Icon.People,\n                NameScreen: AdminScreen\n            }\n\n    );,\n    Index( Choices('QLSX List Security Role'.Role),8).Value, // QA\n    ClearCollect(\n        col_NavigationMenu,\n           \n            {\n                Row: 7,\n                Title: \"Danh sách chỉ tiêu\",\n                Image: Icon.Database,\n                NameScreen: MasterDataCriteriaScreen\n            },\n            {\n                Row: 8,\n                Title: \"Danh sách lý do\",\n                Image: Icon.Database,\n                NameScreen: MasterDataReasonScreen\n            },\n            {\n                Row: 3,\n                Title: \"Quản trị viên\",\n                Image: Icon.People,\n                NameScreen: AdminScreen\n            }\n\n    );\n    ,\n    // Default\n    ClearCollect(\n    col_NavigationMenu,\n        {\n            Row: 1,\n            Title: \"Nhà máy\",\n            Image: Icon.Home,\n            NameScreen: BUScreen\n        },\n        {\n            Row: 2,\n            Title: \"Danh sách dữ liệu sản xuất\",\n            Image: Icon.Database,\n            NameScreen: MasterDataProductionScreen\n        },\n        {\n            Row: 4,\n            Title: \"Danh sách dữ liệu Die\",\n            Image: Icon.Database,\n            NameScreen: MasterDataDieScreen\n        }\n        ,\n        {\n            Row: 5,\n            Title: \"Danh sách dữ liệu Roll\",\n            Image: Icon.Database,\n            NameScreen: MasterDataRollScreen\n        },\n        {\n            Row: 6,\n            Title: \"Danh sách dữ liệu máy\",\n            Image: Icon.Database,\n            NameScreen: MasterDataMachineScreen\n        }        \n        /*{\n            Row: 7,\n            Title: \"Danh sách chỉ tiêu\",\n            Image: Icon.Database,\n            NameScreen: MasterDataCriteriaScreen\n        },\n        {\n            Row: 8,\n            Title: \"Danh sách lý do\",\n            Image: Icon.Database,\n            NameScreen: MasterDataReasonScreen\n        }*/\n    )\n);\n\nClearCollect(col_productGroup, \n    { Name: \"Gà con\", Value: \"Gà con\"}, \n    { Name: \"Gà đẻ\", Value: \"Gà đẻ\"}, \n    { Name: \"Gà thịt\", Value: \"Gà thịt\"}, \n    { Name: \"Vịt đẻ\", Value: \"Vịt đẻ\"}, \n    { Name: \"Heo nái\", Value: \"Heo nái\"}, \n    { Name: \"Heo thịt\", Value: \"Heo thịt\"}, \n    { Name: \"Bò\", Value: \"Bò\"} \n);\n\nClearCollect(col_feedType, \n    { Name: \"Mãnh\", Value: \"Mãnh\"}, \n    { Name: \"Viên\", Value: \"Viên\"}, \n    { Name: \"Bột\", Value: \"Bột\"} \n);\n\nClearCollect(col_pelletType, \n    { Name: \"2.5M\", Value: \"2.5M\" }, \n    { Name: \"4.0M\", Value: \"4.0M\"}, \n    { Name: \"2.5V\", Value: \"2.5V\"}, \n    { Name: \"4.0V\", Value: \"4.0V\"}, \n    { Name: \"Bột\", Value: \"Bột\"}, \n    { Name: \"3.2V\", Value: \"3.2V\"} \n);\n\nClearCollect(col_Species, \n    { Name: \"Cám gà\", Value: \"Cám gà\"}, \n    { Name: \"Cám vịt\", Value: \"Cám vịt\"}, \n    { Name: \"Cám heo\", Value: \"Cám heo\"}, \n    { Name: \"Cám bò\", Value: \"Cám bò\"} \n);\n\nClearCollect(col_ProductBrand, \n    { Name: \"Greenfeed\", Value: \"Greenfeed\"}, \n    { Name: \"Higain\", Value: \"Higain\"} \n);\n\nClearCollect(col_ProductType, \n    { Name: \"Xanh\", Value: \"Xanh\"}, \n    { Name: \"Đỏ\", Value: \"Đỏ\"}, \n    { Name: \"Vàng\", Value: \"Vàng\"} \n);\n\nClearCollect(col_productMix, \n    { Name: \"Gia cầm\", Value: \"Gia cầm\"}, \n    { Name: \"Gia súc\", Value: \"Gia súc\"} \n);\n\n\nClearCollect(col_yesNo, \n    { Name: \"Yes\", Value: true}, \n    { Name: \"No\", Value: false } \n);\n\nClearCollect(\n    col_YesNo_VN, \n    { Name: \"Có\", Value: true }, \n    { Name: \"Không\", Value: false }\n);\n\n\nClearCollect(\n    col_TabMenu,\n    { Row: 1, Title: \"Thông tin chung\" },\n    { Row: 2, Title: \"Ca\" }\n);\n\nClearCollect(col_ShiftRoles, \n    { Role: \"Trưởng ca / Shift Supervisor\" },\n    { Role: \"NV trộn / Mixer Staff\" },\n    { Role: \"NV ép viên / Pelleting Staff\" },\n    { Role: \"NV ra bao / Bagging Control Staff\" }\n);\n\n\nClearCollect(col_Shift, \n    { Name: \"Ca A\", Value: \"A\"}, \n    { Name: \"Ca B\", Value: \"B\"}, \n    { Name: \"Ca C\", Value: \"C\"} \n);\n\nClearCollect(\n    colCriteria,\n    { ID: 1, ChiTieu: \"Cảm quan (màu, mùi)\", Loai: \"Sensory\", DonVi: \"\", TrangThai: \"Đang sử dụng\" },\n    { ID: 2, ChiTieu: \"Chiều dài viên (%)\", Loai: \"Physical\", DonVi: \"%\", TrangThai: \"Đang sử dụng\" },\n    { ID: 3, ChiTieu: \"Tỷ lệ lọt sàng (%)\", Loai: \"Physical\", DonVi: \"%\", TrangThai: \"Đang sử dụng\" },\n    { ID: 4, ChiTieu: \"PDI\", Loai: \"Physical\", DonVi: \"%\", TrangThai: \"Đang sử dụng\" },\n    { ID: 5, ChiTieu: \"Độ cứng viên\", Loai: \"Physical\", DonVi: \"kg\", TrangThai: \"Đang sử dụng\" },\n    { ID: 6, ChiTieu: \"Độ ẩm\", Loai: \"Chemical\", DonVi: \"%\", TrangThai: \"Đang sử dụng\" }\n);\n"
