                        Height: =30
                        Size: =14
                        Text: ="Phạm vi áp dụng"
                        Width: =270
                        X: =25
                        Y: =185
                  - cbb_FormReasonScope:
                      Control: ModernCombobox
                      Properties:
                        AllowExternalSelectedItems: =false
                        BasePaletteColor: =RGBA(8, 222, 8, 1)
                        DefaultSelectedItems: |-
                          =If(
                              varReasonFormMode = "Edit",
                              Filter(
                                  Table(
                                      {Value: "Lý tính"},
                                      {Value: "Dinh dưỡng"},
                                      {Value: "Kết luận mẫu"},
                                      {Value: "Kết luận RunID"}
                                  ),
                                  Value in varRecordReasonDetail.Scope
                              ),
                              Blank()
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =""
                        InputTextPlaceholder: ="Chọn phạm vi áp dụng"
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.'Value'
                        Items: |-
                          =Table(
                              {Value: "Lý tính"},
                              {Value: "Dinh dưỡng"},
                              {Value: "Kết luận mẫu"},
                              {Value: "Kết luận RunID"}
                          )
                        Width: =570
                        X: =25
                        Y: =220
                  - lbl_FormReasonStatus:
                      Control: Label
                      Properties:
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        Size: =14
                        Text: ="Trạng thái"
                        Width: =270
                        X: =25
                        Y: =285
                  - cbb_FormReasonStatus:
                      Control: ModernCombobox
                      Properties:
                        AllowExternalSelectedItems: =false
                        DefaultSelectedItems: |-
                          =Table(
                              {
                                  Value: Coalesce(
                                      varRecordReasonDetail.Status,
                                      "Đang dùng"
                                  )
                              }
                          )
                        Font: =Font.'Segoe UI'
                        FontWeight: =""
                        InputTextPlaceholder: ="Chọn trạng thái"
                        IsSearchable: =false
                        ItemDisplayText: =ThisItem.'Value'
                        Items: |-
                          =Table(
                              {Value: "Đang dùng"},
                              {Value: "Ngừng dùng"}
                          )
                        SelectMultiple: =false
                        Width: =270
                        X: =25
                        Y: =320
                  - rec_ReasonFormFooterDivider:
                      Control: Rectangle
                      Properties:
                        Fill: =RGBA(220, 224, 222, 1)
                        Height: =1
                        Width: =570
                        X: =25
                        Y: =425
                  - con_ReasonFormActions:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        PaddingBottom: =5
                        PaddingLeft: =310
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =570
                        X: =25
                        Y: =435
                      Children:
                        - btn_CancelReasonForm:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Outline
                              Font: =Font.'Segoe UI'
                              FontWeight: =""
                              Icon: ="DismissCircle"
                              OnSelect: |-
                                =Set(varShowReasonForm, false);
                                Set(varRecordReasonDetail, {})
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =14
                              Text: ="Hủy bỏ"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =120
                        - btn_SaveReasonForm:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =RGBA(96, 170, 85, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =""
                              Icon: ="Save"
                              OnSelect: |-
                                =With(
                                    {
                                        scopeText: Concat(
                                            cbb_FormReasonScope.SelectedItems,
                                            Value,
                                            ", "
                                        )
                                    },
                                    If(
                                        IsBlank(Trim(txt_FormReasonCode.Text)),
                                        Notify(
                                            "Vui lòng nhập mã lý do.",
                                            NotificationType.Error
                                        ),
                                        IsBlank(Trim(txt_FormReasonName.Text)),
                                        Notify(
                                            "Vui lòng nhập tên lý do.",
                                            NotificationType.Error
                                        ),
                                        IsEmpty(cbb_FormReasonScope.SelectedItems),
                                        Notify(
                                            "Vui lòng chọn phạm vi áp dụng.",
                                            NotificationType.Error
                                        ),
                                        IsBlank(cbb_FormReasonStatus.Selected.Value),
                                        Notify(
                                            "Vui lòng chọn trạng thái.",
                                            NotificationType.Error
                                        ),
                                        varReasonFormMode = "New" &&
                                        !IsBlank(
                                            LookUp(
                                                colMasterDataReason,
                                                Lower(ReasonCode) =
                                                Lower(Trim(txt_FormReasonCode.Text))
                                            )
                                        ),
                                        Notify(
                                            "Mã lý do đã tồn tại.",
                                            NotificationType.Error
                                        ),
                                        If(
                                            varReasonFormMode = "New",
                                            Collect(
                                                colMasterDataReason,
                                                {
                                                    ID: Coalesce(
                                                        Max(colMasterDataReason, ID),
                                                        0
                                                    ) + 1,
                                                    ReasonCode: Upper(
                                                        Trim(txt_FormReasonCode.Text)
                                                    ),
                                                    ReasonName: Trim(
                                                        txt_FormReasonName.Text
                                                    ),
                                                    Scope: scopeText,
                                                    Status: cbb_FormReasonStatus.Selected.Value
                                                }
                                            ),
                                            UpdateIf(
                                                colMasterDataReason,
                                                ID = varRecordReasonDetail.ID,
                                                {
                                                    ReasonCode: Upper(
                                                        Trim(txt_FormReasonCode.Text)
                                                    ),
                                                    ReasonName: Trim(
                                                        txt_FormReasonName.Text
                                                    ),
                                                    Scope: scopeText,
                                                    Status: cbb_FormReasonStatus.Selected.Value
                                                }
                                            )
                                        );
                                        Notify(
                                            If(
                                                varReasonFormMode = "New",
                                                "Đã tạo lý do mới.",
                                                "Đã cập nhật lý do."
                                            ),
                                            NotificationType.Success
                                        );
                                        Set(varShowReasonForm, false);
                                        Set(varRecordReasonDetail, {})
                                    )
                                )
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =14
                              Text: ="Lưu"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =120
