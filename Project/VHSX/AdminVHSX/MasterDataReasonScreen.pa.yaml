                        - btn_SaveReasonForm:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              BasePaletteColor: =RGBA(96, 170, 85, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =""
                              Icon: ="Save"
                              OnSelect: |-
                                =If(
                                    IsBlank(Trim(txt_FormReasonCode.Text)),
                                    Notify(
                                        "Vui lòng nhập mã lý do.",
                                        NotificationType.Error
                                    ),
                                    IsBlank(Trim(txt_FormReasonName.Text)),
                                    Notify(
                                        "Vui lòng nhập tên lý do.",
                                        NotificationType.Error
                                    ),
                                    If(
                                        varReasonFormMode = "New",
                                        Patch(
                                            'QLSX List Reason Master',
                                            Defaults('QLSX List Reason Master'),
                                            {
                                                PlantCode: varCurrentPlant.PlantCode,
                                                PlantName: varCurrentPlant.PlantName,
                                                ReasonCode: Upper(Trim(txt_FormReasonCode.Text)),
                                                Title: Trim(txt_FormReasonName.Text),
                                                ApplyPhysical: tgl_FormApplyPhysical.Checked,
                                                ApplyNutrition: tgl_FormApplyNutrition.Checked,
                                                ApplySample: tgl_FormApplySample.Checked,
                                                ApplyRunID: tgl_FormApplyRunID.Checked,
                                                IsActive: tgl_FormIsActive.Checked
                                            }
                                        ),
                                        Patch(
                                            'QLSX List Reason Master',
                                            varRecordReasonDetail,
                                            {
                                                PlantCode: varCurrentPlant.PlantCode,
                                                PlantName: varCurrentPlant.PlantName,
                                                ReasonCode: Upper(Trim(txt_FormReasonCode.Text)),
                                                Title: Trim(txt_FormReasonName.Text),
                                                ApplyPhysical: tgl_FormApplyPhysical.Checked,
                                                ApplyNutrition: tgl_FormApplyNutrition.Checked,
                                                ApplySample: tgl_FormApplySample.Checked,
                                                ApplyRunID: tgl_FormApplyRunID.Checked,
                                                IsActive: tgl_FormIsActive.Checked
                                            }
                                        )
                                    );
