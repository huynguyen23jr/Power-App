                              Width: =100
                              X: =299
                              Y: =7
                        - btn_SaveMasterDataProduction_1:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Transparent
                              Font: =Font.'Segoe UI'
                              FontSize: =16
                              Height: =40
                              Icon: ="Save"
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: "=Set(varSaveMasterDataProduction,true);\r\nIf(\r\n    txtInput_SAPCode.ValidationState = \"None\" &&\r\n    txtInput_ProductCode.ValidationState = \"None\" &&\r\n    txtInput_BtpCode.ValidationState = \"None\" &&\r\n    txtInput_PremixCode.ValidationState = \"None\" &&\r\n    txtInput_PackageCode.ValidationState = \"None\" &&\r\n    cbb_bu.ValidationState = \"None\" &&\r\n    cbb_ProductBrand.ValidationState = \"None\" \r\n    ,\r\n     With(\r\n        {\r\n             _masterDataProduction : Filter('QLSX List Master Data Production',PlantCode = cbb_bu.Selected.PlantCode ,SAPcode = txtInput_SAPCode.Value)\r\n        }\r\n        ,\r\n        If(\r\n            CountRows(Filter(_masterDataProduction, ID <> varRecordDetail.ID)) > 0,\r\n            Notify(\"Dữ liệu đã tồn tại trong hệ thống.\",NotificationType.Information,2000),\r\n            Select(btn_PatchMasterDataProduction);\r\n            Navigate(MasterDataProductionScreen,ScreenTransition.UnCoverRight)\r\n        )\r\n    );\r\n \r\n    ,\r\n    Notify(\"Bạn cần nhập dữ liệu.\",NotificationType.Error,2000)\r\n)"
                              Text: ="Lưu và đóng"
                              Width: =150
                              X: =299
                              Y: =7
                        - btn_Duplicate:
                            Control: Button
