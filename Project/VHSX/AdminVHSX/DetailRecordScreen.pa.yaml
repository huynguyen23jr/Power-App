                              FontSize: =16
                              Height: =40
                              Icon: ="Copy"
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |
                                =Set(varLoading,true);
                                If(
                                    !IsBlank(varRecordDetail.ID),
                                    Set(
                                        varDuplicatedRequest,
                                        Patch(
                                            'QLSX List Master Data Production'
                                            ,
                                            Defaults('QLSX List Master Data Production'),
                                            {
                                                PlantCode: varRecordDetail.PlantCode,
                                                PlantName: varRecordDetail.PlantName,
                                                //SAPcode: varRecordDetail.SAPcode,
                                                ProductionCode: varRecordDetail.ProductionCode,
                                                ShortCode: varRecordDetail.ShortCode,
                                                SemiProductCode: varRecordDetail.SemiProductCode,
                                                PremixCode: varRecordDetail.PremixCode,
                                                EmtyBagCode: varRecordDetail.EmtyBagCode,
                                                BatchSize: varRecordDetail.BatchSize,
                                                FeedType: varRecordDetail.FeedType,
                                                DieSize: varRecordDetail.DieSize,
                                                PelletType: varRecordDetail.PelletType,
                                                BagSize: varRecordDetail.BagSize,
                                                ProductType: varRecordDetail.ProductType,
                                                Protein: varRecordDetail.Protein,
                                                ProductMix: varRecordDetail.ProductMix,
                                                Species: varRecordDetail.Species,
                                                ProductGroup: varRecordDetail.ProductGroup,
                                                Description: varRecordDetail.Description,
                                                ProductBrand: varRecordDetail.ProductBrand,
                                                CustomizeFeed: varRecordDetail.CustomizeFeed,
                                                InternalExternalCustomer: varRecordDetail.InternalExternalCustomer,
                                                P1: varRecordDetail.P1,
                                                P2: varRecordDetail.P2,
                                                P3: varRecordDetail.P3,
                                                P4: varRecordDetail.P4,
                                                Note: varRecordDetail.Note                 
                                            }
                                        )
                                    );
                                    Set(varRecordDetail, varDuplicatedRequest);
                                    Notify("Duplicated data successed.",NotificationType.Success,3000);
                                    ,
                                    Notify("Duplicated data failed.",NotificationType.Error,3000);
                                );
                                Set(varLoading,false);
                              Text: ="Duplicate"
                              Visible: =!IsBlank(varRecordDetail.ID)
                              Width: =130
                              X: =299
                              Y: =7
                  - btn_PatchMasterDataProduction:
                      Control: Button
                      Properties:
                        Height: =54
                        OnSelect: |-
                          =If(
                                  IsBlank(varRecordDetail.ID)
                                  ,//create request
                                  Set(varRecordDetail,
                                          Patch(
                                          'QLSX List Master Data Production',
                                          Defaults('QLSX List Master Data Production'),
                                          {
                                              SAPcode: txtInput_SAPCode.Value,
                                              ProductionCode: txtInput_ProductCode.Value,
                                              SemiProductCode: txtInput_BtpCode.Text,
                                              PremixCode: txtInput_PremixCode.Value,
                                              EmtyBagCode: txtInput_PackageCode.Value,
                                              ProductBrand: cbb_ProductBrand.Selected,
                                              FeedType: ccb_FeedType.Selected,
                                              PelletType: cbb_PelletType.Selected,
                                              Protein: Value(numInput_Protein.Value),
                                              BagSize: Value(numInput_PackageSize.Value),
                                              BatchSize: Value(numInput_MixBatch.Value),
                                              ProductGroup: cbb_ProductGroup.Selected,
                                              Species: ccb_SpeciesGroup.Selected,
                                              ProductMix: cbb_ProductMix.Selected,
                                              ProductType: cbb_ProductType.Selected,
                                              DieSize: Value(numInput_DieSize.Value),
                                              CustomizeFeed: { Value: cbb_MedicatedMix.Selected.Value },
                                              P1: Value(numInput_NS_Machine1.Value),
                                              P2: Value(numInput_NS_Machine2.Value),
                                              P3: Value(numInput_NS_Machine3.Value),
                                              P4: Value(numInput_NS_Machine4.Value),
                                              InternalExternalCustomer:txtInput_InternalExternalCustomer.Value,
                                              Note: txtInput_Note.Value,
                                              MoistureCTTK: numInput_MixBatch_1.Value,
                                              PlantCode: cbb_bu.Selected.PlantCode,
                                              PlantName: cbb_bu.Selected.PlantName
                                          }
                                      )       
                                  );
                                  ,
                                  Set(
                                      varRecordDetail,
                                      Patch(
                                          'QLSX List Master Data Production',
                                          varRecordDetail,
                                          {
                                              SAPcode: txtInput_SAPCode.Value,
                                              ProductionCode: txtInput_ProductCode.Value,
                                              SemiProductCode: txtInput_BtpCode.Text,
                                              PremixCode: txtInput_PremixCode.Value,
                                              EmtyBagCode: txtInput_PackageCode.Value,
                                              ProductBrand: cbb_ProductBrand.Selected,
                                              FeedType: ccb_FeedType.Selected,
                                              PelletType: cbb_PelletType.Selected,
                                              Protein: Value(numInput_Protein.Value),
                                              BagSize: Value(numInput_PackageSize.Value),
                                              BatchSize: Value(numInput_MixBatch.Value),
                                              ProductGroup: cbb_ProductGroup.Selected,
                                              Species: ccb_SpeciesGroup.Selected,
                                              ProductMix: cbb_ProductMix.Selected,
                                              ProductType: cbb_ProductType.Selected,
                                              DieSize: Value(numInput_DieSize.Value),
                                              CustomizeFeed: { Value: cbb_MedicatedMix.Selected.Value },
                                              P1: Value(numInput_NS_Machine1.Value),
                                              P2: Value(numInput_NS_Machine2.Value),
                                              P3: Value(numInput_NS_Machine3.Value),
                                              P4: Value(numInput_NS_Machine4.Value),
                                              InternalExternalCustomer:txtInput_InternalExternalCustomer.Value,
                                              Note: txtInput_Note.Value,
                                              MoistureCTTK: numInput_MixBatch_1.Value,
                                              PlantCode: cbb_bu.Selected.PlantCode,
                                              PlantName: cbb_bu.Selected.PlantName
                                          }
                                      )
                                  );
                              );
                          Notify("Lưu thành công.", NotificationType.Success, 2000);
