                                =Set(varRecordDetail,{});
                                Set(varSaveMasterDataProduction,false);

                                Reset(cbb_MedicatedMix);

                                Reset(cbb_ProductType);
                                Reset(cbb_ProductGroup);
                                Reset(cbb_ProductMix);
                                Reset(cbb_PelletType);
