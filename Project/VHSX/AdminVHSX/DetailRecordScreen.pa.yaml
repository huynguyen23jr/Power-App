                              Font: =Font.'Segoe UI'
                              FontSize: =16
                              Height: =40
                              Icon: ="Save"
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |
                                =Set(varSaveMasterDataProduction, true);

                                If(
                                    txtInput_SAPCode.ValidationState     = "None" &&
                                    txtInput_ProductCode.ValidationState = "None" &&
                                    txtInput_BtpCode.ValidationState     = "None" &&
                                    txtInput_PremixCode.ValidationState  = "None" &&
                                    //txtInput_PackageCode.ValidationState = "None" &&
                                    cbb_bu.ValidationState               = "None" &&
                                    cbb_ProductBrand.ValidationState     = "None"
                                    ,
                                    With(
                                        {
                                            _masterDataProduction: Filter(
                                                'QLSX List Master Data Production',
                                                PlantCode = cbb_bu.Selected.PlantCode,
                                                SAPcode   = txtInput_SAPCode.Value
                                            )
                                        },
                                        If(
                                            CountRows(Filter(_masterDataProduction, ID <> varRecordDetail.ID)) > 0,
                                            Notify("Dữ liệu đã tồn tại trong hệ thống.", NotificationType.Information, 2000),
                                            Select(btn_PatchMasterDataProduction)
                                        )
                                    ),
                                    Notify("Bạn cần nhập dữ liệu.", NotificationType.Error, 2000)
                                )
