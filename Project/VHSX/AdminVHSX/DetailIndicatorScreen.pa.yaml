Screens:
  DetailIndicatorScreen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varIndicatorSave, false);
        Set(varIndicatorSaved, false);
        Set(varShowOptionForm, false);
        Set(varOptionFormMode, "New");
        Set(varSelectedIndicatorOption, {});
        If(
            IsEmpty(colIndicatorOptions),
            ClearCollect(
                colIndicatorOptions,
                {ID: 1, IndicatorID: 1, OptionName: "Đánh giá chung", PropertyCode: "P01-PHYS", PropertyName: "QGLT_PHYS", IsDefault: true},
                {ID: 2, IndicatorID: 2, OptionName: "< 5 mm", PropertyCode: "P09A-PHYS", PropertyName: "PEL_LEN_A", IsDefault: true},
                {ID: 3, IndicatorID: 2, OptionName: "> 8 mm", PropertyCode: "P09B-PHYS", PropertyName: "PEL_LEN_B", IsDefault: true},
                {ID: 4, IndicatorID: 2, OptionName: "4-12 mm", PropertyCode: "P09C-PHYS", PropertyName: "PEL_LEN_C", IsDefault: false}
            )
        );
        If(
            IsBlank(varIndicatorSelected.ID),
            RemoveIf(colIndicatorOptions, IndicatorID = 0)
        );
        Reset(txt_IndicatorName);
        Reset(cbb_InputMethod);
        Reset(cbb_ResultType);
        Reset(txt_IndicatorUnit);
        Reset(cbb_DecimalPlaces);
        Reset(chk_Livestock);
        Reset(chk_Poultry);
        Reset(chk_Aqua);
        Reset(chk_MultipleOption);
        Reset(chk_RequiredResult);
        Reset(chk_RequiredNote);
        Reset(chk_ExportBMQC);
        Reset(chk_IsActive)
    Children:
      - con_FormIndicatorDetail:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =768
            Width: =1366
          Children:
            - con_buttonDetailIndicator:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =54
                  Width: =Parent.Width - 40
                  X: =20
                  Y: =20
                Children:
                  - con_Actions_Indicator:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =54
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =5
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =2
                        PaddingTop: =5
                        Width: =1222
                      Children:
                        - btn_BackHome_Indicator:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =""
                              Height: =40
                              Icon: ="ArrowLeft"
                              OnSelect: =Back(ScreenTransition.Fade)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =16
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =50
                        - btn_SaveIndicator:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =""
                              Height: =40
                              Icon: ="Save"
                              OnSelect: =Select(btn_PatchIndicator)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =16
                              Text: ="Lưu"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =100
                        - btn_SaveCloseIndicator:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =""
                              Height: =40
                              Icon: ="Save"
                              OnSelect: |-
                                =Select(btn_PatchIndicator);
                                If(varIndicatorSaved, Back(ScreenTransition.Fade))
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =16
                              Text: ="Lưu và đóng"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =150
                        - btn_RefreshIndicator:
                            Control: ModernButton
                            Properties:
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Font: =Font.'Segoe UI'
                              FontWeight: =""
                              Height: =40
                              Icon: ="ArrowSync"
                              OnSelect: |-
                                =Set(
                                    varIndicatorSelected,
                                    If(
                                        IsBlank(varIndicatorSelected.ID),
                                        {},
                                        LookUp('QLSX List Criteria Master', ID = varIndicatorSelected.ID)
                                    )
                                );
                                Set(varIndicatorSave, false);
                                If(
                                    IsBlank(varIndicatorSelected.ID),
                                    RemoveIf(colIndicatorOptions, IndicatorID = 0)
                                );
                                Reset(txt_IndicatorName);
                                Reset(cbb_InputMethod);
                                Reset(cbb_ResultType);
                                Reset(txt_IndicatorUnit);
                                Reset(cbb_DecimalPlaces);
                                Reset(chk_Livestock);
                                Reset(chk_Poultry);
                                Reset(chk_Aqua);
                                Reset(chk_MultipleOption);
                                Reset(chk_RequiredResult);
                                Reset(chk_RequiredNote);
                                Reset(chk_ExportBMQC);
                                Reset(chk_IsActive)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Size: =16
                              Text: ="Làm mới"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =150
                  - btn_PatchIndicator:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Center
                        FontWeight: =""
                        Height: =54
                        OnSelect: |-
                          =Set(varIndicatorSave, true);
                          Set(varIndicatorSaved, false);
                          If(
                              IsBlank(Trim(txt_IndicatorName.Text)),
                              Notify("Vui lòng nhập tên chỉ tiêu.", NotificationType.Error),
                              !(chk_Livestock.Checked || chk_Poultry.Checked || chk_Aqua.Checked),
                              Notify("Vui lòng chọn ít nhất một loại áp dụng.", NotificationType.Error),
                              If(
                                  IsBlank(varIndicatorSelected.ID),
                                  With(
                                      {
                                          wNewRecord: Patch(
                                              'QLSX List Criteria Master',
                                              Defaults('QLSX List Criteria Master'),
                                              {
                                                  Title: Trim(txt_IndicatorName.Text),
                                                  ApplyLivestock: chk_Livestock.Checked,
                                                  ApplyPoultry: chk_Poultry.Checked,
                                                  ApplyAqua: chk_Aqua.Checked,
                                                  InputModeCode: {Value: cbb_InputMethod.Selected.Value},
                                                  ResultTypeCode: {Value: cbb_ResultType.Selected.Value},
                                                  Unit: Trim(txt_IndicatorUnit.Text),
                                                  DecimalPlaces: {Value: cbb_DecimalPlaces.Selected.Value},
                                                  AllowMultiOption: chk_MultipleOption.Checked,
                                                  IsResultRequired: chk_RequiredResult.Checked,
                                                  IsNoteRequired: chk_RequiredNote.Checked,
                                                  ExportToBMQC: chk_ExportBMQC.Checked,
                                                  IsActive: chk_IsActive.Checked
                                              }
                                          )
                                      },
                                      UpdateIf(colIndicatorOptions, IndicatorID = 0, {IndicatorID: wNewRecord.ID});
                                      Set(varIndicatorSelected, wNewRecord)
                                  ),
                                  Patch(
                                      'QLSX List Criteria Master',
                                      varIndicatorSelected,
                                      {
                                          Title: Trim(txt_IndicatorName.Text),
                                          ApplyLivestock: chk_Livestock.Checked,
                                          ApplyPoultry: chk_Poultry.Checked,
                                          ApplyAqua: chk_Aqua.Checked,
                                          InputModeCode: {Value: cbb_InputMethod.Selected.Value},
                                          ResultTypeCode: {Value: cbb_ResultType.Selected.Value},
                                          Unit: Trim(txt_IndicatorUnit.Text),
                                          DecimalPlaces: {Value: cbb_DecimalPlaces.Selected.Value},
                                          AllowMultiOption: chk_MultipleOption.Checked,
                                          IsResultRequired: chk_RequiredResult.Checked,
                                          IsNoteRequired: chk_RequiredNote.Checked,
                                          ExportToBMQC: chk_ExportBMQC.Checked,
                                          IsActive: chk_IsActive.Checked
                                      }
                                  );
                                  Set(varIndicatorSelected, LookUp('QLSX List Criteria Master', ID = varIndicatorSelected.ID))
                              );
                              Notify("Lưu thành công.", NotificationType.Success, 2000);
                              Set(varIndicatorSaved, true)
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="patch"
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =false
                        Width: =104
                        X: =1222
            - con_DetailHeaderIndicator:
