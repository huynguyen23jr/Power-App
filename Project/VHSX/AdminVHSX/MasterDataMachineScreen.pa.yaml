lData.P4,\n                Note : GalData.Note\n            }\n        )\n    );\n    Set(\n        _JsonFile,\n        JSON(col_exportData)\n    );\n    //Launch(\n    //    ExportDataMasterDataProduction.Run(\n    //        _JsonFile,\n    //        \"MasterDataProduction\"\n    //    ).sharepointfile_link\n    //);\n    \n);\nSet(varLoading,false);"
