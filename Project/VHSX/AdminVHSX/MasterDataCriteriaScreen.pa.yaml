Screens:
  MasterDataCriteriaScreen:
    Properties:
      Fill: =RGBA(241, 241, 241, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =If(
            IsEmpty(colMasterCriteria),
            ClearCollect(
                colMasterCriteria,
                {ID: 1, CriteriaName: "Cảm quan (màu, mùi)", ApplicableType: "Gia súc • Gia cầm • Nhai lại • Aqua", ResultType: "Đạt / Không đạt", InputMethod: "Chọn option rồi nhập kết quả", Unit: "", DecimalPlaces: 0, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                {ID: 2, CriteriaName: "Chiều dài viên (%)", ApplicableType: "Gia cầm", ResultType: "Số", InputMethod: "Chọn option rồi nhập kết quả", Unit: "%", DecimalPlaces: 2, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                {ID: 3, CriteriaName: "Tỷ lệ lọt sàng (%)", ApplicableType: "Gia súc • Gia cầm", ResultType: "Số", InputMethod: "Nhập kết quả", Unit: "%", DecimalPlaces: 2, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                {ID: 4, CriteriaName: "PDI", ApplicableType: "Gia súc • Gia cầm", ResultType: "Số", InputMethod: "Nhập kết quả", Unit: "%", DecimalPlaces: 2, RequiredResult: true, IsActive: false, Status: "Ngừng sử dụng"},
                {ID: 5, CriteriaName: "Độ ẩm", ApplicableType: "Gia súc • Gia cầm • Nhai lại • Aqua", ResultType: "Số", InputMethod: "Nhập kết quả", Unit: "%", DecimalPlaces: 2, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                {ID: 6, CriteriaName: "Độ cứng viên", ApplicableType: "Gia súc • Gia cầm • Aqua", ResultType: "Số", InputMethod: "Nhập kết quả", Unit: "kgf", DecimalPlaces: 1, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                {ID: 7, CriteriaName: "Tạp chất", ApplicableType: "Gia súc • Gia cầm • Nhai lại • Aqua", ResultType: "Đạt / Không đạt", InputMethod: "Nhập kết quả", Unit: "", DecimalPlaces: 0, RequiredResult: false, IsActive: true, Status: "Đang sử dụng"}
            )
        )
    Children:
      - con_MainMasterDataCriteria:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(241, 241, 241, 1)
            Height: =768
            Width: =1366
          Children:
            - con_HeaderMasterDataCriteria:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(96, 170, 85, 1)
                  Height: =72
                  Width: =1366
                Children:
                  - Header_MasterDataCriteria:
                      Control: Header
                      Properties:
                        BasePaletteColor: =RGBA(96, 170, 85, 1)
                        Font: =Font.'Open Sans'
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =72
                        IsLogoVisible: =false
                        LogoTooltip: =""
                        OnSelectLogo: =
                        Style: ='Header.Style'.Primary
                        Title: ="Dashboard VHSX - Admin"
                        TitleFontSize: =25
                        Width: =1366
            - con_RightMasterDataCriteriaScreen:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =696
                  Width: =1105
                  X: =261
                  Y: =72
                Children:
                  - con_HomeToolbarCriteria:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.Regular
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =54
                        Width: =1068
                        X: =21
                        Y: =21
                      Children:
                        - con_HomeToolbarCriteriaAutoLayout:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =54
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingBottom: =5
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =5
                              Width: =1068
                            Children:
                              - btn_CreateMasterDataCriteria:
                                  Control: ModernButton
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =""
                                    Height: =40
                                    Icon: ="Add"
                                    OnSelect: |-
                                      =Set(varIndicatorSelected, {});
                                      Navigate(DetailIndicatorScreen, ScreenTransition.CoverRight)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =14
                                    Text: ="Tạo mới"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =140
                              - btn_RefreshMasterDataCriteria:
                                  Control: ModernButton
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =""
                                    Height: =40
                                    Icon: ="ArrowSync"
                                    OnSelect: |-
                                      =Reset(txtInput_FilterMasterDataCriteria);
                                      Reset(cbb_FilterCriteriaApplicable);
                                      Reset(cbb_FilterCriteriaStatus);
                                      Notify("Đã làm mới danh sách.", NotificationType.Success)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =14
                                    Text: ="Làm mới"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =140
                              - btn_ImportMasterDataCriteria:
                                  Control: ModernButton
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =""
                                    Height: =40
                                    Icon: ="Print"
                                    OnSelect: =Notify("Chức năng Import cần cấu hình Power Automate flow nhận file Excel.", NotificationType.Information)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =14
                                    Text: ="Import"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Visible: =false
                                    Width: =130
                              - btn_TemplateMasterDataCriteria:
                                  Control: ModernButton
                                  Properties:
                                    Align: =Align.Center
                                    Appearance: =ButtonAppearance.Transparent
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =""
                                    Height: =40
                                    Icon: ="DocumentBulletList"
                                    OnSelect: =Notify("Chưa có đường dẫn file Template cho chỉ tiêu.", NotificationType.Information)
                                    PaddingBottom: =5
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =5
                                    RadiusBottomLeft: =4
                                    RadiusBottomRight: =4
                                    RadiusTopLeft: =4
                                    RadiusTopRight: =4
                                    Size: =14
                                    Text: ="Template"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Visible: =false
                                    Width: =140
                  - con_MasterDataCriteriaCard:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.Regular
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =582
                        Width: =1068
                        X: =21
                        Y: =100
                      Children:
                        - con_MasterDataCriteriaTitleBar:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =70
                              Width: =1068
                            Children:
                              - lbl_MasterDataCriteriaTitle:
                                  Control: Label
                                  Properties:
                                    Color: =RGBA(38, 38, 38, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =44
                                    Size: =14
                                    Text: ="Danh sách chỉ tiêu"
                                    Width: =400
                                    X: =20
                                    Y: =10
                              - txtInput_FilterMasterDataCriteria:
                                  Control: ModernTextInput
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =""
                                    MaxLength: =-1
                                    Placeholder: ="Tìm theo tên chỉ tiêu"
                                    Width: =230
                                    X: =450
                                    Y: =14
                              - cbb_FilterCriteriaApplicable:
                                  Control: ModernCombobox
                                  Properties:
                                    AllowExternalSelectedItems: =false
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =""
                                    InputTextPlaceholder: ="Loại áp dụng"
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.'Value'
                                    Items: |-
                                      =Table({Value: "Gia súc"}, {Value: "Gia cầm"}, {Value: "Nhai lại"}, {Value: "Aqua"})
                                    SelectMultiple: =false
                                    Width: =170
                                    X: =690
                                    Y: =14
                              - cbb_FilterCriteriaStatus:
                                  Control: ModernCombobox
                                  Properties:
                                    AllowExternalSelectedItems: =false
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =""
                                    InputTextPlaceholder: ="Trạng thái"
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.'Value'
                                    Items: |-
                                      =Table({Value: "Đang sử dụng"}, {Value: "Ngừng sử dụng"})
                                    SelectMultiple: =false
                                    Width: =170
                                    X: =870
                                    Y: =14
                        - con_MasterDataCriteriaGrid:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =512
                              Width: =Parent.Width
                              Y: =70
                            Children:
                              - con_CriteriaHeaderRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =45
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =5
                                    PaddingLeft: =24
                                    PaddingRight: =24
                                    Width: =1068
                                  Children:
                                    - txt_HeaderCriteriaName:
                                        Control: ModernText
                                        Properties:
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =14
                                          Text: ="Tên chỉ tiêu"
                                          Width: =160
                                    - txt_HeaderCriteriaResult:
                                        Control: ModernText
                                        Properties:
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =14
                                          Text: ="Kiểu kết quả thực tế"
                                          Width: =100
                                    - txt_HeaderCriteriaUnit:
                                        Control: ModernText
                                        Properties:
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =14
                                          Text: ="Đơn vị"
                                          Width: =55
                                    - txt_HeaderCriteriaDecimal:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =14
                                          Text: ="Số chữ số thập phân"
                                          Width: =80
                                    - txt_HeaderCriteriaRequired:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =14
                                          Text: ="Bắt buộc nhập KQ"
                                          Width: =85
                                    - txt_HeaderCriteriaStatus:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =14
                                          Text: ="Trạng thái"
                                          Width: =110
                                    - txt_HeaderCriteriaAction:
                                        Control: ModernText
                                        Properties:
                                          Align: =Align.Center
                                          FillPortions: =1
                                          Font: =Font.'Segoe UI'
                                          FontWeight: =FontWeight.Semibold
                                          LayoutMinWidth: =96
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          Size: =14
                                          Text: ="Thao tác"
                                          Width: =90
                              - rec_CriteriaHeaderDivider:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =RGBA(220, 224, 222, 1)
                                    Height: =1
                                    Width: =1020
                                    X: =24
                                    Y: =con_CriteriaHeaderRow.Height-2
                              - gal_MasterDataCriteria:
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Default: ={}
                                    DelayItemLoading: =false
                                    Height: =428
                                    Items: |-
                                      =SortByColumns(
                                          Filter(
                                              If(
                                                  IsEmpty(colMasterCriteria),
                                                  Table(
                                                      {ID: 1, CriteriaName: "Cảm quan (màu, mùi)", ApplicableType: "Gia súc • Gia cầm • Nhai lại • Aqua", ResultType: "Đạt / Không đạt", InputMethod: "Chọn option rồi nhập kết quả", Unit: "", DecimalPlaces: 0, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                                                      {ID: 2, CriteriaName: "Chiều dài viên (%)", ApplicableType: "Gia cầm", ResultType: "Số", InputMethod: "Chọn option rồi nhập kết quả", Unit: "%", DecimalPlaces: 2, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                                                      {ID: 3, CriteriaName: "Tỷ lệ lọt sàng (%)", ApplicableType: "Gia súc • Gia cầm", ResultType: "Số", InputMethod: "Nhập kết quả", Unit: "%", DecimalPlaces: 2, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                                                      {ID: 4, CriteriaName: "PDI", ApplicableType: "Gia súc • Gia cầm", ResultType: "Số", InputMethod: "Nhập kết quả", Unit: "%", DecimalPlaces: 2, RequiredResult: true, IsActive: false, Status: "Ngừng sử dụng"},
                                                      {ID: 5, CriteriaName: "Độ ẩm", ApplicableType: "Gia súc • Gia cầm • Nhai lại • Aqua", ResultType: "Số", InputMethod: "Nhập kết quả", Unit: "%", DecimalPlaces: 2, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                                                      {ID: 6, CriteriaName: "Độ cứng viên", ApplicableType: "Gia súc • Gia cầm • Aqua", ResultType: "Số", InputMethod: "Nhập kết quả", Unit: "kgf", DecimalPlaces: 1, RequiredResult: true, IsActive: true, Status: "Đang sử dụng"},
                                                      {ID: 7, CriteriaName: "Tạp chất", ApplicableType: "Gia súc • Gia cầm • Nhai lại • Aqua", ResultType: "Đạt / Không đạt", InputMethod: "Nhập kết quả", Unit: "", DecimalPlaces: 0, RequiredResult: false, IsActive: true, Status: "Đang sử dụng"}
                                                  ),
                                                  colMasterCriteria
                                              ),
                                              (IsBlank(txtInput_FilterMasterDataCriteria.Text) || Lower(txtInput_FilterMasterDataCriteria.Text) in Lower(CriteriaName)) &&
                                              (IsBlank(cbb_FilterCriteriaApplicable.Selected.Value) || cbb_FilterCriteriaApplicable.Selected.Value in ApplicableType) &&
                                              (IsBlank(cbb_FilterCriteriaStatus.Selected.Value) || Status = cbb_FilterCriteriaStatus.Selected.Value)
                                          ),
                                          "ID",
                                          SortOrder.Ascending
                                      )
                                    LoadingSpinner: =LoadingSpinner.None
                                    TemplateFill: =RGBA(255, 255, 255, 1)
                                    TemplatePadding: =0
                                    TemplateSize: =45
                                    Width: =1068
                                    Y: =45
                                  Children:
                                    - con_CriteriaDataRow:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(255, 255, 255, 1)
                                          Height: =45
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =6
                                          PaddingLeft: =24
                                          PaddingRight: =24
                                          Width: =Parent.TemplateWidth
                                        Children:
                                          - txt_ValueCriteriaName:
                                              Control: ModernText
                                              Properties:
                                                Font: =Font.'Segoe UI'
                                                FontWeight: =FontWeight.Semibold
                                                LayoutMinWidth: =96
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =13
                                                Text: =ThisItem.CriteriaName
                                                Width: =txt_HeaderCriteriaName.Width
                                          - txt_ValueResultType:
                                              Control: ModernText
                                              Properties:
                                                Font: =Font.'Segoe UI'
                                                LayoutMinWidth: =96
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =13
                                                Text: =ThisItem.ResultType
                                                Width: =txt_HeaderCriteriaResult.Width
                                          - txt_ValueUnit:
                                              Control: ModernText
                                              Properties:
                                                Font: =Font.'Segoe UI'
                                                LayoutMinWidth: =96
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =13
                                                Text: =Coalesce(ThisItem.Unit, "")
                                                Width: =txt_HeaderCriteriaUnit.Width
                                          - txt_ValueDecimal:
                                              Control: ModernText
                                              Properties:
                                                Align: =Align.Center
                                                Font: =Font.'Segoe UI'
                                                LayoutMinWidth: =96
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =13
                                                Text: =ThisItem.DecimalPlaces
                                                Width: =txt_HeaderCriteriaDecimal.Width
                                          - txt_ValueRequired:
                                              Control: ModernText
                                              Properties:
                                                Align: =Align.Center
                                                Font: =Font.'Segoe UI'
                                                LayoutMinWidth: =96
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                                Size: =13
                                                Text: =If(ThisItem.RequiredResult, "Có", "Không")
                                                Width: =txt_HeaderCriteriaRequired.Width
                                          - con_StatusBadgeIndicator_1:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.SetByContainer
                                                DropShadow: =DropShadow.None
                                                Fill: =If(Coalesce(ThisItem.IsActive, true), RGBA(230, 245, 237, 1), RGBA(239, 243, 241, 1))
                                                FillPortions: =0
                                                Height: =28
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutJustifyContent: =LayoutJustifyContent.Center
                                                LayoutMinHeight: =30
                                                RadiusBottomLeft: =8
                                                RadiusBottomRight: =8
                                                RadiusTopLeft: =8
                                                RadiusTopRight: =8
                                                Width: =txt_HeaderCriteriaStatus.Width
                                                X: =1170
                                                Y: =28
                                              Children:
                                                - txt_StatusBadgeIndicator_1:
                                                    Control: ModernText
                                                    Properties:
                                                      Align: =Align.Center
                                                      Color: =If(Coalesce(ThisItem.IsActive, true), RGBA(20, 111, 75, 1), RGBA(79, 91, 86, 1))
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      Height: =28
                                                      LayoutMinWidth: =96
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Size: =12
                                                      Text: =If(Coalesce(ThisItem.IsActive, true), "Đang sử dụng", "Ngừng sử dụng")
                                                      Width: =Parent.Width
                                          - con_CriteriaRowActions:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.SetByContainer
                                                DropShadow: =DropShadow.None
                                                FillPortions: =0
                                                Height: =40
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =5
                                                LayoutJustifyContent: =LayoutJustifyContent.Center
                                                LayoutMinHeight: |+
                                                  =0
                                                Width: =txt_HeaderCriteriaAction.Width
                                              Children:
                                                - btn_EditCriteria:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Icon: ="Edit"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =Set(varIndicatorSelected, ThisItem);
                                                        Navigate(DetailIndicatorScreen, ScreenTransition.CoverRight)
                                                      Width: =40
                                                - btn_ToggleCriteria:
                                                    Control: ModernButton
                                                    Properties:
                                                      Appearance: =ButtonAppearance.Transparent
                                                      Icon: ="DismissCircle"
                                                      Layout: =ButtonLayout.IconOnly
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: |-
                                                        =UpdateIf(
                                                            colMasterCriteria,
                                                            ID = ThisItem.ID,
                                                            {
                                                                IsActive: !ThisItem.IsActive,
                                                                Status: If(ThisItem.IsActive, "Ngừng sử dụng", "Đang sử dụng")
                                                            }
                                                        );
                                                        Notify(
                                                            If(ThisItem.IsActive, "Đã ngừng sử dụng chỉ tiêu.", "Đã kích hoạt lại chỉ tiêu."),
                                                            NotificationType.Success
