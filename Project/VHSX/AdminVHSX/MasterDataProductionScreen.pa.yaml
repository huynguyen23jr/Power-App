                  - btn_UploadPopUpImportMasterDataProduction:
                      Control: Button
                      Properties:
                        BasePaletteColor: =RGBA(8, 222, 8, 1)
                        Icon: ="Print"
                        OnSelect: |
                          =If(
                              IsEmpty(att_FileMasterDataProduction.Attachments) || IsBlank(cbb_PlantSelected_1.Selected.PlantCode),
                              Notify("Vui lòng chọn file và nhà máy trước khi upload.", NotificationType.Error, 2000),

                              // Check file extension (.xlsx or .xls)
                              Not(
                                  EndsWith(
                                      Lower(First(att_FileMasterDataProduction.Attachments).Name),
                                      ".xlsx"
                                  ) ||
                                  EndsWith(
                                      Lower(First(att_FileMasterDataProduction.Attachments).Name),
                                      ".xls"
                                  )
                              ),
                              Notify("Chỉ hỗ trợ file Excel (.xlsx, .xls).", NotificationType.Error, 2000),

                              Set(varLoadingMasterDataProduction, true);
                              Set(varShowUploadFile, false);
                              Set(varPopupDataExits,false);
                              Set(varDataExist,Blank());
                              Set(varRunSucess, false);
                              Set(varResult,
                                  UploadFileExcelMasterDataProduction.Run(
                                      cbb_PlantSelected_1.Selected.PlantCode,
                                      cbb_PlantSelected_1.Selected.PlantName,
                                      {
                                          file: {
                                              contentBytes: First(att_FileMasterDataProduction.Attachments).Value,
                                              name: First(att_FileMasterDataProduction.Attachments).Name
                                          }
                                      }
                                  )
                              );
                              Set(
                                  varRunSucess,
                                  varResult.issuccess
                              );
                             Set(
                              varDataExist,
                                      Split(varResult.data, ";")
                                  );
                              Set(varPopupDataExits,If(IsBlank(varResult.data),false,true));
                              Refresh('QLSX List Master Data Production')
                          )
                        Text: ="Upload"
