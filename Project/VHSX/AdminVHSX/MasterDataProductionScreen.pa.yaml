                                    LayoutMaxWidth: =
                                    OnSelect: "=Set(varLoading,true);\r\nWith(\r\n    {\r\n        wRowsGallery:  \r\n                    Filter(\r\n                        'QLSX List Master Data Production',\r\n                        StartsWith(SAPcode, txtInput_filterMasterDataProduction.Value) ||\r\n                        StartsWith(ProductionCode, txtInput_filterMasterDataProduction.Value) ||\r\n                        StartsWith(SemiProductCode, txtInput_filterMasterDataProduction.Value) ||\r\n                        StartsWith(PremixCode, txtInput_filterMasterDataProduction.Value) ||\r\n                        StartsWith(EmtyBagCode, txtInput_filterMasterDataProduction.Value),\r\n                        IsBlank(cbb_BuFilterMasterDataProduction.Selected.PlantName) ||  PlantName = cbb_BuFilterMasterDataProduction.Selected.PlantName\r\n                    )\r\n    },\r\n    Clear(col_exportData);\r\n    ForAll(\r\n        wRowsGallery As GalData,\r\n        Collect(\r\n            col_exportData,\r\n            {\r\n                SAPcode : GalData.SAPcode,\r\n                ProductionCode : GalData.ProductionCode,\r\n                SemiProductCode : GalData.SemiProductCode,\r\n                PremixCode : GalData.PremixCode,\r\n                EmtyBagCode : GalData.EmtyBagCode,\r\n                BatchSize : GalData.BatchSize,\r\n                FeedType : GalData.FeedType,\r\n                DieSize : GalData.DieSize,\r\n                PelletType : GalData.PelletType,\r\n                BagSize : GalData.BagSize,\r\n                ProductType : GalData.ProductType,\r\n                Protein : GalData.Protein,\r\n                ProductMix : GalData.ProductMix,\r\n                Species : GalData.Species,\r\n                ProductGroup : GalData.ProductGroup,\r\n                ProductBrand : GalData.ProductBrand,\r\n                InternalCustomer : GalData.InternalExternalCustomer,\r\n                P1 : GalData.P1,\r\n                P2 : GalData.P2,\r\n                P3 : GalData.P3,\r\n                P4 : GalData.P4,\r\n                Note : GalData.Note\r\n            }\r\n        )\r\n    );\r\n    Set(\r\n        _JsonFile,\r\n        JSON(col_exportData)\r\n    );\r\n    //Launch(\r\n    //    ExportDataMasterDataProduction.Run(\r\n    //        _JsonFile,\r\n    //        \"MasterDataProduction\"\r\n    //    ).sharepointfile_link\r\n    //);\r\n    \r\n);\r\nSet(varLoading,false);"
                                    Text: ="Export"
                                    Visible: =false
                                    Width: =150
                                    X: =299
                                    Y: =7
