                  - Container13_3:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingLeft: =10
                        PaddingRight: =10
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - Button7_2:
                            Control: ModernButton
                            Properties:
                              Icon: ="CheckmarkCircle"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |
                                =If(
                                    IsBlank(Combobox1_2.Selected),
                                    Notify("Vui lòng chọn Loại sản phẩm", NotificationType.Warning, 2000),

                                    IsBlank(Combobox1_3.Selected),
                                    Notify("Vui lòng chọn SLoc", NotificationType.Warning, 2000),

                                    // Else: đủ điều kiện, gọi flow
                                    UpdateContext({varShowPopupGetIssueData: false});
                                    UpdateContext({varShowPopupProcessing: true});
                                    With(
                                        {
                                            _result: 'QLK|GetWarehouseIssueData'.Run(
                                                varUserInPlant.PlantCode,                              // Mã plant
                                                Text(DatePicker2_1.SelectedDate, "yyyymmdd"),          // Ngày nhập (chuỗi hiển thị)
                                                varIssueTypeCode,
                                                varGoodsIssue.ID,
                                                varGoodsIssue.ProductCategoryCode,
                                                Combobox1_3.Selected.SLoc,
                                                varUserInPlant.PlantName,
                                                Coalesce(varGoodsIssue.TotalIssueQuantity, 0)
                                            )
                                        },
                                        If(
                                            _result.status = "OK",
                                            Notify(_result.message, NotificationType.Success, 2000);
                                            UpdateContext({varShowPopupProcessing: false});
                                            Refresh('QLK List Issue Detail');
                                            Refresh('QLK List Issue Header');
                                            Set(varGoodsIssue, LookUp('QLK List Issue Header', ID = varGoodsIssue.ID)),
                                            Notify(_result.message, NotificationType.Error, 2000);
                                            UpdateContext({varShowPopupProcessing: false})
                                        )
                                    );
                                )
                              Text: ="Đồng bộ"
                              Width: =110
