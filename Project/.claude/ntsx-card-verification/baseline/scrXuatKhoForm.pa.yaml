                    );
                    'QLK|SendIssueConfirmationNotification'.Run(varGoodsIssue.IssueNo, varGoodsIssue.ID, varGoodsIssue.PlantName, varGoodsIssue.StatusCode,Text(varGoodsIssue.IssueDate,"dd-MM-yyyy"));

                    // Ẩn loading sau khi hoàn tất (dù thành công hay lỗi)
                    UpdateContext({varShowPopupProcessing: false});
                  varLabel: ="Vui lòng nhập lý do từ chối phiếu xuất kho này."
                  varTitle: ="Từ chối xuất kho"
