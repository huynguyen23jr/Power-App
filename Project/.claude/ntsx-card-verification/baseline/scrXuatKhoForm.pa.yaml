Screens:
  scrXuatKhoForm:
    Properties:
      OnVisible: |-
        =Set(
            varSelectedWarehouseTab,
            LookUp(
                col_WarehouseFormTabs,
                Code = "GENERAL"
            )
        );
        Clear(col_SelectedXuatDaiLy);
        Clear(col_SelectedXuatNoiBo);
        Clear(col_SelectedXuatKhac)
    Children:
      - con_MainXuatKhoForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderXuatKhoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - HeaderFormXuatKho:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrXuatKhoForm.Size
            - con_BodyXuatKhoForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderXuatKhoForm.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_BodyMenuXuatKhoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        Height: =con_BodyMainXuatKhoForm.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Visible: =scrXuatKhoForm.Size <> 1
                        Width: |-
                          =If(
                              varShowMenuUser,
                              240,
                              0
                          )
                      Children:
                        - NavSiderBarXuatKhoForm:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height - 10
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainXuatKhoForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                        Fill: =RGBA(250, 250, 251, 1)
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =10
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =10
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                        RadiusTopRight: =5
                      Children:
                        - con_FormXuatKhoButton:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =45
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Width: =Parent.Width - 25
                              X: =40
                              Y: =40
                            Children:
                              - btn_BackXuatKhoForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Icon: ="ChevronLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =Back()
                                    Width: =30
                              - btn_SaveXuatKhoForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Save"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |+
                                      =If(
                                          IsBlank(cmb_ProductTypeXuatKho.Selected),
                                          Notify("Vui lòng chọn Loại sản phẩm", NotificationType.Warning, 2000),
                                          IsBlank(dp_IssueDate.SelectedDate),
                                          Notify("Vui lòng chọn Ngày xuất", NotificationType.Warning, 2000),
                                          Select(btn_PatchXuatKho)
                                      )
                                    Text: ="Lưu"
                                    Visible: =varGoodsIssue.StatusCode = "DRAFT" || IsBlank(varGoodsIssue.ID)
                              - btn_SendXuatKho:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Send"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |+
                                      =With(
                                          {
                                              _data: Filter(
                                                  'QLK List Issue Detail',
                                                  IssueHeaderId = varGoodsIssue.ID
                                              )
                                          },
                                          If(
                                              CountRows(_data) > 0,
                                              UpdateContext({con_PopupConfirmSubmit: true}),
                                              Notify("Chưa có dữ liệu chi tiết, vui lòng nhập trước khi gửi duyệt.", NotificationType.Warning, 2000)
                                          )
                                      )
                                    Text: ="Gửi"
                                    Visible: |-
                                      =varGoodsIssue.StatusCode = "DRAFT" 
                                      && (
                                          varUserInPlant.Role = Index(col_RoleUser,1).RoleCode ||     // FG_WH         - Thủ kho thành phẩm
                                          varUserInPlant.Role = Index(col_RoleUser,8).RoleCode        // VHSX_HO       - VHSX HO
                                      )
                              - btn_RefreshXuatKhoForm:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="ArrowClockwise"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Refresh('QLK List Issue Header');
                                      Refresh('QLK List Issue Detail');
                                      Set(varGoodsIssue,LookUp('QLK List Issue Header',ID = varGoodsIssue.ID));
                                    Text: ="Làm mới"
                                    Visible: =!IsBlank(varGoodsIssue.ID)
                                    Width: =120
                              - btn_PatchXuatKho:
                                  Control: ModernButton
                                  Properties:
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: "=IfError(\n    With(\n        {\n            vPlantCode:         varUserInPlant.PlantCode,\n            vPlantName:         varUserInPlant.PlantName,\n            vIssueDate:         dp_IssueDate.SelectedDate,\n            vIssuecProductType: cmb_ProductTypeXuatKho.Selected.ProductCategoryCode,\n            vIssueDateKey:      Text(dp_IssueDate.SelectedDate, \"yyyymmdd\"),\n            vIsNew:             IsBlank(varGoodsIssue.ID)\n        },\n        If(\n            vIsNew,\n\n            // Tạo mới — kiểm tra trùng trước\n            ClearCollect(\n                col_CheckDuplicate,\n                Filter(\n                    'QLK List Issue Header',\n                    PlantCode           = vPlantCode,\n                    ProductCategoryCode = vIssuecProductType,\n                    IssueDate           = vIssueDate\n                )\n            );\n            ClearCollect(\n                col_IssuesByPlantDate,\n                Filter(\n                    'QLK List Issue Header',\n                    PlantCode           = vPlantCode\n                )\n            );\n            If(\n                CountRows(col_CheckDuplicate) > 0,\n                Notify(\"Phiếu xuất ngày \" & Text(vIssueDate, \"dd/mm/yyyy\") & \" đã tồn tại.\", NotificationType.Warning,2000),\n                \n                With(\n                    {\n                        vIssueNo: \"ISS-\" & vIssueDateKey & \"-\" & Text(CountRows(col_IssuesByPlantDate) + 1, \"0000000\")\n                    },\n                    Set(\n                        varGoodsIssue,\n                        Patch(\n                            'QLK List Issue Header',\n                            Defaults('QLK List Issue Header'),\n                            {\n                                IssueNo:             vIssueNo,\n                                IssueDate:           vIssueDate,\n                                StatusCode:          cmb_StatusXuatKho.Selected.StatusCode,\n                                ProductCategoryCode: vIssuecProductType,\n                                PlantCode:           vPlantCode,\n                                PlantName:           vPlantName\n                            }\n                        )\n                    );\n                    Patch(\n                        'QLK List Audit Log',\n                        Defaults('QLK List Audit Log'),\n                        {\n                            ActionBy:      varCurrentUser.FullName,\n                            ActionCode:    Index(col_Action, 1).ActionCode,\n                            IDIssueHeader: varGoodsIssue.ID\n                        }\n                    );\n                    Notify(\"Thêm thành công\", NotificationType.Success,2000)\n                )\n            ),\n\n            // Cập nhật — giữ nguyên IssueNo\n            Set(\n                varGoodsIssue,\n                Patch(\n                    'QLK List Issue Header',\n                    varGoodsIssue,\n                    {\n                        IssueDate:           vIssueDate,\n                        StatusCode:          cmb_StatusXuatKho.Selected.StatusCode,\n                        ProductCategoryCode: vIssuecProductType,\n                        PlantCode:           vPlantCode,\n                        PlantName:           vPlantName\n                    }\n                )\n            );\n            Notify(\"Cập nhật thành công\", NotificationType.Success,2000)\n        )\n    ),\n    Notify(\"Không thể lưu phiếu xuất\", NotificationType.Error,2000)\n)\n"
                                    Visible: =false
                              - btn_RefreshXuatKhoForm_1:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="CheckmarkCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =UpdateContext({varShowPopupConfirmIssue:true})
                                    Text: ="Xác nhận "
                                    Visible: |+
                                      =varGoodsIssue.StatusCode = Index(col_WorkflowStatus,20).StatusCode 
                                      && (varUserInPlant.Role = Index(col_RoleUser,1).RoleCode || varUserInPlant.Role = Index(col_RoleUser,2).RoleCode || varUserInPlant.Role = Index(col_RoleUser,15).RoleCode || varUserInPlant.Role = Index(col_RoleUser,6).RoleCode)
                                      && With(
                                          {
                                              _filterData: Filter(
                                                  'QLK List Issue Detail',
                                                  IssueHeaderId = varGoodsIssue.ID
                                              )
                                          },
                                          Switch(
                                              varUserInPlant.Role,
                                              Index(col_RoleUser, 2).RoleCode,   // FG_SUP        - Giám sát thành phẩm
                                              CountRows(
                                                  Filter(
                                                      _filterData,
                                                      IssueTypeCode = Index(col_IssueType, 1).IssueTypeCode || IssueTypeCode = Index(col_IssueType, 2).IssueTypeCode,
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0,
                                              Index(col_RoleUser, 15).RoleCode,   // SHIFT_LEADER  - Trưởng ca
                                              CountRows(
                                                  Filter(
                                                      _filterData,
                                                      IssueTypeCode = Index(col_IssueType, 3).IssueTypeCode,
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0,
                                              Index(col_RoleUser, 6).RoleCode,   // PROD_STAT     - Thống kê sản xuất
                                              CountRows(
                                                  Filter(
                                                      _filterData,
                                                      IssueTypeCode = Index(col_IssueType, 3).IssueTypeCode,
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0
                                          )
                                      )
                                    Width: =120
                              - btn_RefreshXuatKhoForm_2:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="DismissCircle"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: =UpdateContext({varShowPopupRejectIssue:true})
                                    Text: ="Từ chối"
                                    Visible: |+
                                      =varGoodsIssue.StatusCode = Index(col_WorkflowStatus,20).StatusCode 
                                      && (varUserInPlant.Role = Index(col_RoleUser,1).RoleCode || varUserInPlant.Role = Index(col_RoleUser,2).RoleCode || varUserInPlant.Role = Index(col_RoleUser,15).RoleCode || varUserInPlant.Role = Index(col_RoleUser,6).RoleCode)
                                      && With(
                                          {
                                              _filterData: Filter(
                                                  'QLK List Issue Detail',
                                                  IssueHeaderId = varGoodsIssue.ID
                                              )
                                          },
                                          Switch(
                                              varUserInPlant.Role,
                                              Index(col_RoleUser, 2).RoleCode,   // FG_SUP        - Giám sát thành phẩm
                                              CountRows(
                                                  Filter(
                                                      _filterData,
                                                      IssueTypeCode = Index(col_IssueType, 1).IssueTypeCode || IssueTypeCode = Index(col_IssueType, 2).IssueTypeCode,
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0,
                                              Index(col_RoleUser, 15).RoleCode,   // SHIFT_LEADER  - Trưởng ca
                                              CountRows(
                                                  Filter(
                                                      _filterData,
                                                      IssueTypeCode = Index(col_IssueType, 3).IssueTypeCode,
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0,
                                              Index(col_RoleUser, 6).RoleCode,   // PROD_STAT     - Thống kê sản xuất
                                              CountRows(
                                                  Filter(
                                                      _filterData,
                                                      IssueTypeCode = Index(col_IssueType, 3).IssueTypeCode,
                                                      !ConfirmFromWarehouse
                                                  )
                                              ) > 0
                                          )
                                      )
                                    Width: =120
                              - btn_DeleteNhapTuSanXuat_3:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Icon: ="Delete"
                                    OnSelect: |
                                      =If(
                                          Confirm(
                                              "Bạn có chắc muốn xóa bản ghi này không?",
                                              {
                                                  Title: "Xác nhận xóa",
                                                  Subtitle: "Hành động này không thể hoàn tác.",
                                                  ConfirmButton: "Xóa",
                                                  CancelButton: "Hủy"
                                              }
                                          ),
                                          UpdateContext({varShowPopupProcessing: true});
                                          IfError(
                                              Clear(col_IssueDetailToDelete);
                                              ClearCollect(
                                                  col_IssueDetailToDelete,
                                                  Filter('QLK List Issue Detail', IssueHeaderId = varGoodsIssue.ID)
                                              );
                                              Remove('QLK List Issue Detail', col_IssueDetailToDelete);
                                              Remove('QLK List Issue Header', varGoodsIssue),
                                              UpdateContext({varShowPopupProcessing: false});
                                              Notify("Xóa không thành công", NotificationType.Error,2000);
                                              ,
                                              UpdateContext({varShowPopupProcessing: false});
                                              Navigate(scrXuatKho, ScreenTransition.CoverRight);
                                              Notify("Đã xoá thành công", NotificationType.Success,2000);
                                          )
                                      )
                                    Text: ="Xóa"
                                    Visible: =varGoodsIssue.StatusCode = Index(col_WorkflowStatus,1).StatusCode
                                    Width: =100
                        - con_tabIssue:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.Regular
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =45
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Width: =Parent.Width - 25
                            Children:
                              - tab_Receipt_1:
                                  Control: ModernTabList
                                  Properties:
                                    Default: =LookUp(col_WarehouseFormTabs,Code = varSelectedWarehouseTab.Code)
                                    Height: =Parent.Height - 10
                                    ItemDisplayText: =ThisItem.NameVI
                                    Items: |-
                                      =If(
                                          IsBlank(varGoodsIssue.ID),
                                          Filter(col_WarehouseFormTabs, Code = "GENERAL"),   // Chỉ tab Thông tin chung khi tạo mới
                                          Filter(col_WarehouseFormTabs, SortOrder <> 2)       // Sửa record: hiện tất cả trừ tab SortOrder=2
                                      )
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnChange: |-
                                      =Set(
                                          varSelectedWarehouseTab,
                                          LookUp(col_WarehouseFormTabs, Code = Self.Selected.Code)
                                      )
                                    TabSize: =TabSize.Small
                                    Width: =Parent.Width
                        - con_BodyXuatKho_1:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =con_ThongTinXuatKho.Height + con_ListXuatDaiLy.Height + con_ListXuatNoiBo.Height + con_ListXuatKhac.Height + Self.LayoutGap * 3 + Self.PaddingTop + Self.PaddingBottom +10
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMaxHeight: =con_ThongTinXuatKho.Height + con_ListXuatDaiLy.Height + con_ListXuatNoiBo.Height + con_ListXuatKhac.Height + Self.LayoutGap * 3 + Self.PaddingTop + Self.PaddingBottom
                              LayoutMinHeight: =Parent.Height
                              LayoutMinWidth: =16
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =1
                              PaddingLeft: =1
                              PaddingRight: =1
                              PaddingTop: =1
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =varSelectedWarehouseTab.Code = "GENERAL"
                              Width: =Parent.Width - 20
                            Children:
                              - con_ThongTinXuatKho:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.SetByContainer
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: |-
                                      =If(
                                          scrXuatKhoForm.Size = 1,
                                          430,
                                          270
                                      )
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    PaddingBottom: =10
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =10
                                    Width: =Parent.Width - 10
                                  Children:
                                    - lbl_TitleThongTinXuatKho:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Height: =40
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          Size: =fxFontSizeXL
                                          Text: ="Thông tin xuất kho"
                                    - con_FormFieldsXuatKho:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutGap: =If(scrXuatKhoForm.Size = 1,0,10)
                                          LayoutGridColumns: |-
                                            =If(
                                                scrXuatKhoForm.Size = 1,
                                                1,
                                                2
                                            )
                                          LayoutGridRows: |-
                                            =If(
                                                scrXuatKhoForm.Size = 1,
                                                4,
                                                2
                                            )
                                          LayoutMinHeight: =16
                                          LayoutMinWidth: =16
                                          PaddingBottom: =10
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          PaddingTop: =10
                                        Children:
                                          - con_FieldIssueNo:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                              Children:
                                                - lbl_IssueNo_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Mã phiếu xuất"
                                                - txtInput_IssueNo:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      Default: =varGoodsIssue.IssueNo
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =Parent.Width - 10
                                                      Placeholder: ="Mã phiếu xuất"
                                                      Size: =fxFontSizeMD
                                          - con_FieldStatusXuatKho:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                              Children:
                                                - lbl_StatusXuatKho_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Trạng thái *"
                                                - cmb_StatusXuatKho:
                                                    Control: ModernCombobox
                                                    Properties:
                                                      AccessibleLabel: =
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Appearance: =Appearance.Outline
                                                      DefaultSelectedItems: |-
                                                        =If(
                                                            IsBlank(varGoodsIssue.ID),
                                                            LookUp(
                                                                col_WorkflowStatus,
                                                                StatusCode = "DRAFT"
                                                            ),
                                                            LookUp(
                                                                col_WorkflowStatus,
                                                                StatusCode = varGoodsIssue.StatusCode
                                                            )
                                                        )
                                                      DisplayMode: =DisplayMode.Disabled
                                                      Font: =fxFontFamily
                                                      InputTextPlaceholder: ="Chọn trạng thái"
                                                      IsSearchable: =false
                                                      ItemDisplayText: =ThisItem.StatusNameVI
                                                      Items: =col_WorkflowStatus
                                                      LayoutMinWidth: =Parent.Width - 10
                                                      SelectMultiple: =false
                                                      Size: =fxFontSizeMD
                                          - con_FieldIssueDate:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                              Children:
                                                - lbl_IssueDate_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Ngày xuất *"
                                                - dp_IssueDate:
                                                    Control: ModernDatePicker
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Start
                                                      DefaultDate: |-
                                                        =If(
                                                            IsBlank(varGoodsIssue.IssueDate),
                                                            Today(),
                                                            varGoodsIssue.IssueDate
                                                        )
                                                      DisplayMode: |-
                                                        =// Chỉ cho phép thao tác khi phiếu đang ở trạng thái nháp
                                                        If(
                                                            (varGoodsIssue.StatusCode = "DRAFT" || IsBlank(varGoodsIssue.ID)) && 
                                                            (varUserInPlant.Role = Index(col_RoleUser,9).RoleCode || varUserInPlant.Role = Index(col_RoleUser,1).RoleCode),     // VHSX_HO       - VHSX HO // FG_WH         - Thủ kho thành phẩm)
                                                            DisplayMode.Edit,
                                                            DisplayMode.Disabled
                                                        )
                                                      Font: =fxFontFamily
                                                      Format: =DatePickerFormat.Short
                                                      LayoutMinWidth: =Parent.Width - 10
                                                      Size: =fxFontSizeMD
                                                      Width: =Parent.Width
                                          - con_FieldProductTypeXuatKho:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                LayoutDirection: =LayoutDirection.Vertical
                                              Children:
                                                - lbl_ProductTypeXuatKho_Form:
                                                    Control: ModernText
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Stretch
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Loại sản phẩm *"
                                                - cmb_ProductTypeXuatKho:
