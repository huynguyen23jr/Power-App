      - con_PopupConfirmIssue:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =varShowPopupConfirmIssue
            Width: =Parent.Width
          Children:
            - DialogAlertConfirmIssue:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({varShowPopupConfirmIssue:false})
                  varConfirmDialogAction: |
                    =// ── Đóng popup xác nhận, hiện loading ───────────────────────────────────────
                    UpdateContext({varShowPopupConfirmIssue: false});
                    UpdateContext({varShowPopupProcessing: true});
                    Clear(col_UpdateIssueDetail);

                    IfError(
                        // ── [1] Ghi audit log hành động xác nhận kho ─────────────────────────────
                        Patch(
                            'QLK List Audit Log',
                            Defaults('QLK List Audit Log'),
                            {
                                ActionBy:      varCurrentUser.FullName,
                                ActionCode:    Index(col_Action, 12).ActionCode,
                                IDIssueHeader: varGoodsIssue.ID
                            }
                        );

                        // ── [2] Chuẩn bị payload bulk update ─────────────────────────────────────
                        // Chỉ gửi ID + ConfirmFromWarehouse, tránh ghi đè các field không liên quan
                        ClearCollect(
                            col_UpdateIssueDetail,
                            ForAll(
                                Filter(
                                    'QLK List Issue Detail',
                                    IssueHeaderId        = varGoodsIssue.ID,
                                    ConfirmFromWarehouse = false
                                ),
                                {
                                    ID:                   ID,
                                    ConfirmFromWarehouse: true
                                }
                            )
                        );

                        // ── [3] Bulk update lên SharePoint (1 call duy nhất) ─────────────────────
                        Patch(
                            'QLK List Issue Detail',
                            col_UpdateIssueDetail
                        );

                        Set(
                            varGoodsIssue,
                            Patch(
                                'QLK List Issue Header',
                                varGoodsIssue,
                                {
                                    StatusCode: Index(col_WorkflowStatus, 8).StatusCode
                                }
                            )
                        ),

                        // Lỗi: thông báo và vẫn ẩn loading bên dưới
                        Notify("Xác nhận thất bại: " & FirstError.Message, NotificationType.Error, 2000)
                    );

                    // ── Ẩn loading sau khi hoàn tất (dù thành công hay lỗi) ─────────────────────

                    // Gửi mail thông báo
                    'QLK|SendIssueConfirmationNotification'.Run(varGoodsIssue.IssueNo, varGoodsIssue.ID, varGoodsIssue.PlantName, varGoodsIssue.StatusCode,Text(varGoodsIssue.IssueDate,"dd-MM-yyyy"));

                    UpdateContext({varShowPopupProcessing: false});
                  varLabel: ="Bạn có chắc chắn muốn xác nhận xuất kho phiếu này không?"
                  varTitle: ="Xác nhận xuất kho"
