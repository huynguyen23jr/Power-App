                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =Reset(cmb_XK_FormMovementType);
                                Reset(dp_XK_FormPostingDate);
                                Reset(cmb_XK_FormSAPCode);
                                Reset(num_XK_FormQuantity);
                                Reset(txt_XK_FormSLoc);
                                Reset(txt_XK_FormNote);
                                UpdateContext({varShowXuatKhoForm: false})
                              Text: =
                              Width: =30
                        - btn_SaveXuatKhoDetail:
                            Control: ModernButton
                            Properties:
                              Font: =fxFontFamily
                              Icon: ="Save"
                              OnSelect: |
                                =UpdateContext({varShowXuatKhoForm: false});
                                // Hiện loading TRƯỚC khi bắt đầu gọi mạng
                                UpdateContext({varShowPopupProcessing: true});

                                With(
                                    {vIsNew: IsBlank(varIssueDetail.ID)},
                                    With(
                                        {
                                            savedRecord: IfError(
                                                Patch(
                                                    'QLK List Issue Detail',
                                                    If(vIsNew, Defaults('QLK List Issue Detail'), varIssueDetail),
                                                    {
                                                        IssueHeaderId:       varGoodsIssue.ID,
                                                        IssueTypeCode:       varIssueTypeCode,
                                                        PlantCode:           varGoodsIssue.PlantCode,
                                                        PlantName:           varGoodsIssue.PlantName,
                                                        MovementType:        cmb_XK_FormMovementType.Selected.MovementType,
                                                        PostingDate:         dp_XK_FormPostingDate.SelectedDate,
                                                        SAPCode:             cmb_XK_FormSAPCode.Selected.SAPCode,
                                                        Quantity:            num_XK_FormQuantity.Value,
                                                        SLoc:                txt_XK_FormSLoc.Text,
                                                        Note:                txt_XK_FormNote.Text,
                                                        ProductCategoryCode: varGoodsIssue.ProductCategoryCode,
                                                        BagSize :           LookUp('QLK List Master Data Production',PlantCode = varProductionReceiptDetail.PlantCode && SAPCode = cmb_XK_FormSAPCode.Selected.SAPCode).BagSize
                                                    }
                                                ),
                                                Blank()
                                            )
                                        },
                                        If(
                                            IsBlank(savedRecord),
                                            Notify("Lỗi lưu không thành công", NotificationType.Error,2000),

                                            // Fetch lại để đảm bảo data đúng
                                            ClearCollect(
                                                col_IssueDetails,
                                                Filter('QLK List Issue Detail', IssueHeaderId = varGoodsIssue.ID)
                                            );

                                            // Tính lại TotalIssueQuantity
                                            Set(
                                                varGoodsIssue,
                                                Patch(
                                                    'QLK List Issue Header',
                                                    varGoodsIssue,
                                                    {TotalIssueQuantity: Sum(col_IssueDetails, Quantity)}
                                                )
                                            );

                                            Notify(
                                                If(vIsNew, "Thêm thành công", "Cập nhật thành công"),
                                                NotificationType.Success
                                                ,2000
                                            );
                                            Reset(cmb_XK_FormMovementType);
                                            Reset(dp_XK_FormPostingDate);
                                            Reset(cmb_XK_FormSAPCode);
                                            Reset(num_XK_FormQuantity);
                                            Reset(txt_XK_FormSLoc);
                                            Reset(txt_XK_FormNote)
                                        )
                                    )
                                );

                                // Ẩn loading sau khi hoàn tất
                                UpdateContext({varShowPopupProcessing: false})
                              Size: =fxFontSizeMD
                              Text: ="Lưu và đóng"
                              Visible: |-
                                =varGoodsIssue.StatusCode = Index(col_WorkflowStatus, 1).StatusCode &&
                                If(
                                    varIssueTypeCode = Index(col_IssueType, 3).IssueTypeCode &&
                                        (varUserInPlant.Role = Index(col_RoleUser, 15).RoleCode || varUserInPlant.Role = Index(col_RoleUser, 6).RoleCode || varUserInPlant.Role = Index(col_RoleUser, 9).RoleCode),
