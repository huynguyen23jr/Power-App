      - con_PopupSendXuatKho:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            Visible: =con_PopupConfirmSubmit
            Width: =Parent.Width
          Children:
            - DialogAlertSendXuatKho:
                Control: CanvasComponent
                ComponentName: DialogAlert
                Properties:
                  Height: =App.Height
                  Width: =App.Width
                  varCloseDialogAction: =UpdateContext({con_PopupConfirmSubmit:false})
                  varConfirmDialogAction: |-
                    =// Đóng popup xác nhận gửi, hiện loading
                    UpdateContext({con_PopupConfirmSubmit: false});
                    UpdateContext({varShowPopupProcessing: true});

                    IfError(
                        // ── [1] Ghi audit log hành động gửi phiếu xuất ───────────────────────────
                        Patch(
                            'QLK List Audit Log',
                            Defaults('QLK List Audit Log'),
                            {
                                ActionBy:      varCurrentUser.FullName,
                                ActionCode:    Index(col_Action, 2).ActionCode,   // Action 2 = Gửi duyệt
                                IDIssueHeader: varGoodsIssue.ID
                            }
                        );

                        // ── [2] Cập nhật StatusCode phiếu xuất → trạng thái thứ 8 ───────────────
                        Set(
                            varGoodsIssue,
                            Patch(
                                'QLK List Issue Header',
                                varGoodsIssue,
                                {StatusCode: Index(col_WorkflowStatus, 20).StatusCode}
                            )
                        ),

                        // Lỗi: thông báo, loading vẫn được ẩn bên dưới
                        Notify("Gửi phiếu thất bại: " & FirstError.Message, NotificationType.Error,2000)
                    );

                    // Gửi mail thông báo
                    'QLK|SendIssueConfirmationNotification'.Run(varGoodsIssue.IssueNo,varGoodsIssue.ID,varGoodsIssue.PlantName,varGoodsIssue.StatusCode,Text(varGoodsIssue.IssueDate,"dd-MM-yyyy"));

                    // Ẩn loading sau khi hoàn tất (dù thành công hay lỗi)
                    UpdateContext({varShowPopupProcessing: false});
                  varLabel: |-
                    ="Bạn có chắc chắn muốn gửi phiếu này không?
                    Sau khi gửi, dữ liệu sẽ chuyển sang trạng thái chờ duyệt."
                  varTitle: ="Xác nhận gửi phiếu"
