Screens:
  scrDanhMucDensityForm:
    Children:
      - con_MainDanhMucDensityForm:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderDanhMucDensityForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderDanhMucDensityForm:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrDanhMucDensityForm.Size
            - con_BodyDanhMucDensityForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderDanhMucDensityForm.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  PaddingBottom: =5
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_MenuDanhMucDensityForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        Height: =con_BodyMainDanhMucDensityForm.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =scrDanhMucDensityForm.Size <> 1
                        Width: =If(varShowMenuUser, 240, 0)
                      Children:
                        - cmp_NavSidebarDanhMucDensityForm:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_BodyMainDanhMucDensityForm:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(250, 250, 251, 1)
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                      Children:
                        - conDanhMucDensityForm_ActionBar:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =RGBA(255, 255, 255, 1)
                              FillPortions: =0
                              Height: =52
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              PaddingBottom: =8
                              PaddingLeft: =8
                              PaddingRight: =8
                              PaddingTop: =8
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                            Children:
                              - btnDanhMucDensityForm_Back:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Icon: ="ChevronLeft"
                                    Layout: =ButtonLayout.IconOnly
                                    OnSelect: =Back()
                                    Width: =36
                              - btnDanhMucDensityForm_Save:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="Save"
                                    OnSelect: |-
                                      =IfError(
                                          Patch(
                                              'QLK List Density',
                                              If(
                                                  IsBlank(varDensityDetail),
                                                  Defaults('QLK List Density'),
                                                  varDensityDetail
                                              ),
                                              {
                                                  CodeSAP: Trim(txtDanhMucDensityForm_CodeSAP.Text),
                                                  ShortCode: Trim(txtDanhMucDensityForm_ShortCode.Text),
                                                  Density: txtDanhMucDensityForm_Density.Value
                                              }
                                          ),
                                          Notify("Không thể lưu dữ liệu.", NotificationType.Error,2000),
                                          Notify("Đã lưu thành công.", NotificationType.Success,2000)
                                      )
                                    Text: ="Lưu"
                              - btnDanhMucDensityForm_Refresh:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    Font: =fxFontFamily
                                    Icon: ="ArrowClockwise"
                                    OnSelect: =Refresh('QLK List Density')
                                    Text: ="Làm mới"
                                    Width: =120
                        - conDanhMucDensityForm_Content:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =12
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - conDanhMucDensityForm_SectionInfo:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.Regular
                                    Fill: =RGBA(255, 255, 255, 1)
                                    FillPortions: =0
                                    Height: =If(scrDanhMucDensityForm.Size = 1, 320, 230)
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =10
                                    PaddingBottom: =12
                                    PaddingLeft: =12
                                    PaddingRight: =12
                                    PaddingTop: =12
                                    RadiusBottomLeft: =8
                                    RadiusBottomRight: =8
                                    RadiusTopLeft: =8
                                    RadiusTopRight: =8
                                  Children:
                                    - lblDanhMucDensityForm_SectionInfo:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =RGBA(45, 128, 40, 1)
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeLG
                                          Text: ="1. Thông tin Density"
                                    - conDanhMucDensityForm_GridInfo:
                                        Control: GroupContainer
                                        Variant: GridLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutGap: =15
                                          LayoutGridColumns: =If(scrDanhMucDensityForm.Size = 1, 1, 2)
                                          LayoutGridRows: =If(scrDanhMucDensityForm.Size = 1, 3, 2)
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                        Children:
                                          - conDanhMucDensityForm_FieldCodeSAP:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblDanhMucDensityForm_CodeSAP:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Code SAP *"
                                                - txtDanhMucDensityForm_CodeSAP:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      Default: =varDensityDetail.CodeSAP
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =Parent.Width
                                                      Placeholder: ="Nhập Code SAP"
                                                      Size: =fxFontSizeMD
                                          - conDanhMucDensityForm_FieldShortCode:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblDanhMucDensityForm_ShortCode:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Code rút gọn *"
                                                - txtDanhMucDensityForm_ShortCode:
                                                    Control: ModernTextInput
                                                    Properties:
                                                      Default: =varDensityDetail.ShortCode
                                                      Font: =fxFontFamily
                                                      LayoutMinWidth: =Parent.Width
                                                      Placeholder: ="Nhập Code rút gọn"
                                                      Size: =fxFontSizeMD
                                          - conDanhMucDensityForm_FieldDensity:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Height: =76
                                                LayoutAlignItems: =LayoutAlignItems.Stretch
                                                LayoutDirection: =LayoutDirection.Vertical
                                                LayoutGap: =4
                                              Children:
                                                - lblDanhMucDensityForm_Density:
                                                    Control: ModernText
                                                    Properties:
                                                      Font: =fxFontFamily
                                                      Size: =fxFontSizeMD
                                                      Text: ="Khối lượng riêng *"
                                                - txtDanhMucDensityForm_Density:
                                                    Control: ModernNumberInput
                                                    Properties:
                                                      Default: =varDensityDetail.Density
                                                      LayoutMinWidth: =Parent.Width
                                                      Min: =0
      - con_MainBodyMenuDanhMucDensityFormMobile:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.5)
            Height: =Parent.Height - 55
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varShowMenuUser && scrDanhMucDensityForm.Size = 1
            Width: =Parent.Width
            Y: =55
          Children:
            - con_BodyMenuDanhMucDensityFormMobile:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingBottom: =5
                  PaddingRight: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =scrDanhMucDensityForm.Size = 1
                  Width: =Parent.Width * 0.7
                Children:
                  - cmp_NavSidebarDanhMucDensityFormMobile:
                      Control: CanvasComponent
                      ComponentName: NavSiderBar
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =Parent.Height
                        SidebarWidth: =Parent.Width
                        Width: =Parent.Width
            - btn_DanhMucDensityFormMenuOverlay:
                Control: ModernButton
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Appearance: =ButtonAppearance.Transparent
                  FillPortions: =1
                  Layout: =ButtonLayout.TextOnly
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |-
                    =Set(
                        varShowMenuUser,
                        false
                    )
                  Text: =""
