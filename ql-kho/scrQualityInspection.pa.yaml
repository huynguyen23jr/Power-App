Screens:
  scrQualityInspection:
    Properties:
      Fill: =RGBA(245, 248, 246, 1)
      OnVisible: |-
        =With(
            {q: varSelectedQC},
            ClearCollect(
                colQIRun,
                If(
                    IsBlank(q),
                    {
                        RunID: "QI-20261026-001",
                        Species: "Gia súc",
                        ProductCode: "9104V100",
                        ProductName: "Thức ăn hỗn hợp gia súc",
                        Plant: "Đồng Nai",
                        Shift: "Ca 1",
                        ProductionDate: Date(2026, 10, 26),
                        RecipeNo: "CT-9104",
                        RecipeVersion: "V3",
                        MixWeight: 50,
                        PelletWeight: 48.5,
                        PackWeight: 48
                    },
                    {
                        RunID: q.RunID,
                        Species: "",
                        ProductCode: q.ProductCode,
                        ProductName: q.ProductName,
                        Plant: q.Plant,
                        Shift: "",
                        ProductionDate: Date(Year(q.CreatedAt), Month(q.CreatedAt), Day(q.CreatedAt)),
                        RecipeNo: "",
                        RecipeVersion: "",
                        MixWeight: If(false, 0),
                        PelletWeight: If(false, 0),
                        PackWeight: If(false, 0)
                    }
                )
            )
        );
        If(
            IsEmpty(Filter(colQISamples, RunID = First(colQIRun).RunID)),
            With(
                {
                    baseId: Coalesce(Max(colQISamples, SampleID), 0),
                    cnt: If(IsBlank(varSelectedQC), 7, Max(1, Coalesce(varSelectedQC.SampleCount, 1))),
                    stg: Coalesce(varSelectedQC.Stage, "Thành phẩm"),
                    created: Coalesce(varSelectedQC.CreatedAt, DateTime(2026, 10, 26, 7, 30, 0))
                },
                Collect(
                    colQISamples,
                    ForAll(
                        Sequence(cnt) As s,
                        {
                            SampleID: baseId + s.Value,
                            RunID: First(colQIRun).RunID,
                            SampleCode: "M" & Text(s.Value, "00"),
                            Stage: stg,
                            CreatedAt: created,
                            SampledAt: If(false, Now()),
                            Sampler: "",
                            Note: "",
                            PhysicalResult: "",
                            PhysicalReason: "",
                            NutritionResult: "Chờ kết quả",
                            ConclusionResult: "Chưa kết luận",
                            Status: "Chưa nhập"
                        }
                    )
                )
            )
        );
        If(
            IsEmpty(colQICriteria),
            ClearCollect(
                colQICriteria,
                {CriterionID: 1, CriterionName: "Cảm quan", InputType: "Choice", Unit: "", HasOption: false, Required: true, SortOrder: 1},
                {CriterionID: 2, CriterionName: "Chiều dài viên", InputType: "Number", Unit: "mm", HasOption: true, Required: true, SortOrder: 2},
                {CriterionID: 3, CriterionName: "PDI", InputType: "Number", Unit: "%", HasOption: false, Required: true, SortOrder: 3},
                {CriterionID: 4, CriterionName: "Độ ẩm", InputType: "Number", Unit: "%", HasOption: true, Required: true, SortOrder: 4},
                {CriterionID: 5, CriterionName: "Nhiệt độ ra bao", InputType: "Number", Unit: "°C", HasOption: false, Required: true, SortOrder: 5},
                {CriterionID: 6, CriterionName: "Ghi chú chung", InputType: "Text", Unit: "", HasOption: false, Required: false, SortOrder: 6}
            )
        );
        If(
            IsEmpty(colQIOptions),
            ClearCollect(
                colQIOptions,
                {CriterionID: 2, OptionValue: "Khuôn 2.5 mm"},
                {CriterionID: 2, OptionValue: "Khuôn 3.0 mm"},
                {CriterionID: 2, OptionValue: "Khuôn 4.0 mm"},
                {CriterionID: 4, OptionValue: "Tủ sấy"},
                {CriterionID: 4, OptionValue: "Máy đo nhanh"}
            )
        );
        If(
            IsEmpty(colQIResults),
            ClearCollect(
                colQIResults,
                {SampleID: 0, CriterionID: 0, OptionValue: "", NumericValue: 0, ChoiceValue: "", TextValue: "", Note: ""}
            );
            Clear(colQIResults)
        );
        UpdateContext(
            {
                locSelectedSampleID: If(
                    IsBlank(LookUp(colQISamples, SampleID = locSelectedSampleID && RunID = First(colQIRun).RunID)),
                    First(SortByColumns(Filter(colQISamples, RunID = First(colQIRun).RunID), "SampleID")).SampleID,
                    locSelectedSampleID
                ),
                locGeneralOpen: false,
                locSamplePickerOpen: false,
                locAddSampleOpen: false,
                locXMLOpen: false
            }
        )
    Children:
      - conQIRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(245, 248, 246, 1)
            Height: =Parent.Height
