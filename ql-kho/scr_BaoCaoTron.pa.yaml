                                              Properties:
                                                Align: =Align.Center
                                                Color: =ColorValue("#52658B")
                                                Font: =Font.'Segoe UI'
                                                Height: =32
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                Size: =9
                                                Text: |-
                                                  ="/ " & Max(1, RoundUp(CountRows(Filter(
                                                          colBaoCaoTronMock,
                                                          (IsBlank(txt_Search.Text) || txt_Search.Text in RunID || txt_Search.Text in MaBTP),
                                                          (dd_Status.Selected.Value = "Tất cả" || TrangThai = dd_Status.Selected.Value),
                                                          (dd_Factory.Selected.Value = "Tất cả" || NhaMay = dd_Factory.Selected.Value)
                                                      )) / locPageSize, 0))
                                                Width: =44
