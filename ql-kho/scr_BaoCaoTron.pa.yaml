Screens:
  scr_BaoCaoTron:
    Properties:
      Fill: =ColorValue("#F6F9F8")
      OnVisible: |-
        =// ===== UI STATE =====
        UpdateContext({
            locReportTab: "TRON",
            locShowMenu: false,
            locShowMore: false,
            locPage: 1,
            locPageSize: 10
        });
        ClearCollect(colTron_Selected, {ID: 0});
        Clear(colTron_Selected);

        // ===== MOCK DATA – BẮT ĐẦU (xóa khối này khi nối dữ liệu thật) =====
        UpdateContext({locMockUser: {Name: "Nguyễn Văn A", Dept: "QA Department"}});
        ClearCollect(
            colBaoCaoTronMock,
            ForAll(
                Sequence(128) As s,
                With(
                    {
                        st: Index(
                            ["Hoàn thành", "Đang thực hiện", "Hoàn thành", "Đã tạo lệnh",
                             "Đang thực hiện", "Đã tạo lệnh", "Hoàn thành", "Đang thực hiện",
                             "Hoàn thành", "Hoàn thành", "Đã tạo lệnh", "Hoàn thành",
                             "Hoàn thành", "Đã tạo lệnh", "Hoàn thành", "Hoàn thành"],
                            Mod(s.Value - 1, 16) + 1
                        ).Value,
                        kh: Index([50000, 30000, 70000, 25000, 100000, 45000, 80000, 20000], Mod(s.Value - 1, 8) + 1).Value
                    },
                    With(
                        {dt: Switch(st, "Hoàn thành", kh, "Đang thực hiện", RoundDown(kh * 0.4 / 1000, 0) * 1000, 0)},
                        {
                            ID: s.Value,
                            RunID: "RN" & Text(DateAdd(Date(2024, 4, 1), RoundDown((s.Value - 1) / 2, 0), TimeUnit.Days), "yyyymmdd") & "-" & Text(Mod(s.Value - 1, 2) + 1, "000"),
                            FormulaVersion: Index(["V1.0", "V1.0", "V1.1", "V1.0", "V1.2", "V1.0", "V1.1", "V1.0"], Mod(s.Value - 1, 8) + 1).Value,
                            MaBTP: "BTP" & Text(s.Value, "000"),
                            KhoiLuongKeHoach: kh,
                            KhoiLuongDaTron: dt,
                            SoMeDaTron: RoundUp(dt / 10000, 0),
                            TrangThai: st,
                            NhaMay: Index(["Nhà máy Bình Dương", "Nhà máy Long An", "Nhà máy Đồng Nai"], Mod(s.Value - 1, 3) + 1).Value,
                            NgayBatDau: DateAdd(Date(2024, 4, 1), RoundDown((s.Value - 1) / 2, 0), TimeUnit.Days)
                        }
                    )
                )
            )
        )
        // ===== MOCK DATA – KẾT THÚC =====
    Children:
      - MainContainer:
          Control: GroupContainer
          Variant: AutoLayout
