ComponentDefinitions:
  DialogProccessing:
    DefinitionType: CanvasComponent
    Properties:
      Height: =App.Height
      Width: =App.Width
    Children:
      - con_OverlayLoading:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(0, 0, 0, 0.25)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: =Parent.Width
          Children:
            - con_LoadingBox:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.Regular
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =Parent.Height/5
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =20
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =20
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: |-
                    =Switch(
                        App.ActiveScreen.Size,
                        1, App.ActiveScreen.Width * 0.6,
                        App.ActiveScreen.Width / 5
                    )
                Children:
                  - spn_Loading:
                      Control: Spinner
                      Properties:
                        Height: =50
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Width: =50
                  - lbl_LoadingText:
                      Control: ModernText
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Stretch
                        Font: =Font.'Segoe UI'
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =14
                        Text: ="Đang xử lý .."
