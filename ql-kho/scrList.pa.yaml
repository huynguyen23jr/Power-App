                  Color: =RGBA(104, 122, 114, 1)
                  Font: =Font.'Segoe UI'
                  Height: =If(scrList.Width < 768, 20, 22)
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =If(scrList.Width < 768, 9, 10)
                  Text: =If(scrList.Width < 768, "Theo dõi chất lượng thành phẩm", "Quản lý và theo dõi kết quả kiểm tra chất lượng thành phẩm")
