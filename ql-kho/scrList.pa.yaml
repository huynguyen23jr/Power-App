                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =conKpiTotal.Height
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =conKpiTotal.Width
