                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(223, 231, 226, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =Parent.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =8
                  RadiusTopLeft: =0
                  RadiusTopRight: =8
                  Visible: =scrList.Width >= 768
                  Width: =If(scrList.Width >= 1200, 230, If(scrList.Width >= 768, 64, 0))
