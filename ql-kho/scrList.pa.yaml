                        Align: =Align.Center
                        Color: =RGBA(22, 115, 72, 1)
                        Fill: =RGBA(227, 243, 235, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =If(scrList.Width < 768, 24, 44)
                        Size: =If(scrList.Width < 768, 12, 14)
                        Text: =If(scrList.Width < 768, "✓", "")
