                  Wrap: =false
                  X: =lblPageTitle.X
                  Y: =If(scrList.Width < 768, 98, 126)
            - btnCreateQC:
                Control: ModernButton
                Properties:
                  BasePaletteColor: =RGBA(0, 107, 79, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  Height: =44
                  OnSelect: =Set(varShowCreate, true)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Text: ="+ Tạo hồ sơ QC"
                  Width: =If(scrList.Width >= 768, 172, Parent.Width - 32)
                  X: =If(scrList.Width >= 768, Parent.Width - 192, 16)
                  Y: =If(scrList.Width >= 768, 84, 126)
            - conKpiTotal:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(223, 231, 226, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =If(scrList.Width < 768, 76, 104)
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =If(scrList.Width >= 1200, (scrList.Width - 286) / 4, If(scrList.Width >= 768, (scrList.Width - 116) / 2, (scrList.Width - 44) / 2))
