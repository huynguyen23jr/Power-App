                  - lblBrand:
                      Control: Label
                      Properties:
                        Color: =RGBA(0, 107, 79, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =34
                        Size: =If(scrList.Width >= 1200, 19.5, 14)
                        Text: ="VHSX"
                        Width: =Parent.Width - 24
                        X: =If(scrList.Width >= 1200, 20, 8)
                        Y: =18
                  - lblNavQC:
                      Control: Label
                      Properties:
                        Color: =RGBA(0, 107, 79, 1)
                        Fill: =RGBA(225, 241, 234, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =46
                        PaddingLeft: =If(scrList.Width >= 1200, 44, 0)
                        PaddingRight: =8
                        Size: =10.5
                        Text: =If(scrList.Width >= 1200, "Hồ sơ QC", "")
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =88
                  - btnNavReport:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Left
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =RGBA(0, 107, 79, 1)
                        Color: =RGBA(104, 122, 114, 1)
                        FontWeight: =FontWeight.Normal
                        Height: =46
                        OnSelect: =Notify("Báo cáo là chức năng minh họa.", NotificationType.Information)
                        PaddingLeft: =If(scrList.Width >= 1200, 44, 0)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =If(scrList.Width >= 1200, "Báo cáo", "")
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =142
                  - btnNavHistory:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Left
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =RGBA(0, 107, 79, 1)
                        Color: =RGBA(104, 122, 114, 1)
                        FontWeight: =FontWeight.Normal
                        Height: =46
                        OnSelect: =Notify("Lịch sử XML là chức năng minh họa.", NotificationType.Information)
                        PaddingLeft: =If(scrList.Width >= 1200, 44, 0)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: =If(scrList.Width >= 1200, "Lịch sử XML", "")
                        Width: =Parent.Width - 24
                        X: =12
                        Y: =196
                  - lblBrandSub:
                      Control: Label
                      Properties:
                        Color: =RGBA(104, 122, 114, 1)
                        Font: =Font.'Segoe UI'
                        Height: =18
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =9
                        Text: ="QA thành phẩm"
                        Visible: =scrList.Width >= 1200
                        Width: =Parent.Width - 24
                        X: =20
                        Y: =52
                  - btnNavMaster:
                      Control: ModernButton
                      Properties:
                        Align: =Align.Left
                        Appearance: =ButtonAppearance.Subtle
                        BasePaletteColor: =RGBA(0, 107, 79, 1)
                        Color: =RGBA(104, 122, 114, 1)
                        FontWeight: =FontWeight.Normal
                        Height: =46
                        OnSelect: =Notify("Master Data là chức năng minh họa.", NotificationType.Information)
                        PaddingLeft: =If(scrList.Width >= 1200, 44, 0)
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
