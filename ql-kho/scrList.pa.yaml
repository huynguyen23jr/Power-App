                        Color: =RGBA(196, 60, 53, 1)
                        Height: =24
                        Icon: =Icon.Warning
                        Visible: =scrList.Width >= 768
                        Width: =24
                        X: =26
                        Y: =26
                  - lblKpiFailPercent:
