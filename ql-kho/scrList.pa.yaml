                        Color: =RGBA(0, 107, 79, 1)
                        Fill: =RGBA(225, 241, 234, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =If(scrList.Width < 768, 24, 44)
                        Size: =If(scrList.Width < 768, 12, 14)
                        Text: =If(scrList.Width < 768, "▤", "")
                        Width: =If(scrList.Width < 768, 24, 44)
                        X: =If(scrList.Width < 768, Parent.Width - 38, 16)
                        Y: =If(scrList.Width < 768, 34, 16)
