                      Control: Classic/Icon
                      Properties:
                        Color: =RGBA(0, 107, 79, 1)
                        Height: =20
                        Icon: =Icon.DetailList
                        Width: =20
                        X: =If(scrList.Width >= 1200, 26, 22)
                        Y: =101
                  - icoNavReport:
