                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Text: ="Lưu hồ sơ"
                        Width: =100
                        X: =Parent.Width - 120
                        Y: =Parent.Height - 56
