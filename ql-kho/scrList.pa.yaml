                        Align: =Align.Right
                        Color: =RGBA(104, 122, 114, 1)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9
