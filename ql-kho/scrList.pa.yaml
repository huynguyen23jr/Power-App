                Properties:
                  Color: =RGBA(22, 51, 45, 1)
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Bold
                  Height: =If(scrList.Width < 768, 30, 40)
                  Size: =If(scrList.Width < 768, 15, 20)
                  Text: ="Hồ sơ QC sản xuất"
