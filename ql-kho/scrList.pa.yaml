                        Color: =RGBA(104, 122, 114, 1)
                        Height: =20
                        Icon: =Icon.Database
                        OnSelect: =Select(btnNavMaster)
                        Width: =20
                        X: =If(scrList.Width >= 1200, 26, 22)
                        Y: =263
