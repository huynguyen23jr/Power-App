                        X: =If(scrList.Width < 768, Parent.Width - 38, 16)
                        Y: =If(scrList.Width < 768, 34, 16)
                  - lblKpiPendingCaption:
                      Control: Label
                      Properties:
                        Color: =RGBA(104, 122, 114, 1)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(scrList.Width < 768, 9, 9.75)
                        Text: ="Đạt yêu cầu"
                        Width: =Parent.Width - If(scrList.Width < 768, 24, 88)
                        Wrap: =false
                        X: =If(scrList.Width < 768, 12, 72)
                        Y: =If(scrList.Width < 768, 8, 18)
                  - lblKpiPendingValue:
                      Control: Label
                      Properties:
                        Color: =RGBA(22, 115, 72, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =If(scrList.Width < 768, 36, 40)
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(scrList.Width < 768, 15, 21)
                        Text: =Text(CountIf(colQCDemo, Result = "Đạt"))
                        Width: =Parent.Width - If(scrList.Width < 768, 60, 148)
                        X: =If(scrList.Width < 768, 12, 72)
                        Y: =If(scrList.Width < 768, 28, 38)
                  - lblKpiPendingTrack:
                      Control: Label
                      Properties:
                        Fill: =RGBA(237, 241, 238, 1)
                        Height: =4
                        Text: =""
                        Width: =Parent.Width - If(scrList.Width < 768, 24, 32)
                        X: =If(scrList.Width < 768, 12, 16)
                        Y: =Parent.Height - If(scrList.Width < 768, 12, 14)
                  - lblKpiPendingBar:
                      Control: Label
                      Properties:
                        Fill: =RGBA(22, 115, 72, 1)
                        Height: =4
                        Text: =""
                        Width: =If(CountRows(colQCDemo) = 0, 0, (Parent.Width - If(scrList.Width < 768, 24, 32)) * CountIf(colQCDemo, Result = "Đạt") / CountRows(colQCDemo))
                        X: =If(scrList.Width < 768, 12, 16)
                        Y: =Parent.Height - If(scrList.Width < 768, 12, 14)
                  - icoKpiPending:
                      Control: Classic/Icon
                      Properties:
                        Color: =RGBA(22, 115, 72, 1)
                        Height: =24
                        Icon: =Icon.Check
                        Visible: =scrList.Width >= 768
                        Width: =24
                        X: =26
                        Y: =26
                  - lblKpiPendingPercent:
                      Control: Label
                      Properties:
                        Align: =Align.Right
                        Color: =RGBA(104, 122, 114, 1)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9
                        Text: =If(CountRows(colQCDemo) = 0, "0%", Text(CountIf(colQCDemo, Result = "Đạt") / CountRows(colQCDemo) * 100, "0.#") & "%")
                        Visible: =scrList.Width >= 768
                        Width: =64
                        X: =Parent.Width - 80
                        Y: =48
            - conKpiFail:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(223, 231, 226, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =conKpiTotal.Height
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  Width: =conKpiTotal.Width
                  X: =If(scrList.Width >= 1200, conKpiPending.X + conKpiPending.Width + 12, conKpiTotal.X)
                  Y: =If(scrList.Width >= 1200, conKpiTotal.Y, conKpiTotal.Y + conKpiTotal.Height + 12)
                Children:
                  - lblKpiFailIcon:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(196, 60, 53, 1)
                        Fill: =RGBA(252, 235, 236, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =If(scrList.Width < 768, 24, 44)
                        Size: =If(scrList.Width < 768, 12, 14)
                        Text: =If(scrList.Width < 768, "!", "")
                        Width: =If(scrList.Width < 768, 24, 44)
                        X: =If(scrList.Width < 768, Parent.Width - 38, 16)
                        Y: =If(scrList.Width < 768, 34, 16)
                  - lblKpiFailCaption:
                      Control: Label
                      Properties:
                        Color: =RGBA(104, 122, 114, 1)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(scrList.Width < 768, 9, 9.75)
                        Text: ="Không đạt"
                        Width: =Parent.Width - If(scrList.Width < 768, 24, 88)
                        Wrap: =false
                        X: =If(scrList.Width < 768, 12, 72)
                        Y: =If(scrList.Width < 768, 8, 18)
                  - lblKpiFailValue:
                      Control: Label
                      Properties:
                        Color: =RGBA(196, 60, 53, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =If(scrList.Width < 768, 36, 40)
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(scrList.Width < 768, 15, 21)
                        Text: =Text(CountIf(colQCDemo, Result = "Không đạt"))
                        Width: =Parent.Width - If(scrList.Width < 768, 60, 148)
                        X: =If(scrList.Width < 768, 12, 72)
                        Y: =If(scrList.Width < 768, 28, 38)
