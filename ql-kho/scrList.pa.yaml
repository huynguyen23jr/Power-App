                  - btnSaveCreate:
                      Control: ModernButton
                      Properties:
                        BasePaletteColor: =RGBA(0, 107, 79, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Height: =40
                        OnSelect: |-
                          =If(
                            IsBlank(Trim(txtCreateProductCode.Value)) ||
                            IsBlank(Trim(txtCreateProductName.Value)) ||
                            IsBlank(Trim(txtCreateSampleCount.Value)) ||
                            !IsNumeric(txtCreateSampleCount.Value) ||
                            Value(txtCreateSampleCount.Value) < 1,
                            Notify("Vui lòng nhập đủ thông tin hợp lệ.", NotificationType.Error),
                            With(
                              {
                                newRunId: "QC-" & Upper(Substitute(Text(GUID()), "-", "")),
                                newStatus: If(ddCreateResult.Selected.Value = "Chờ kiểm tra", "Chờ kiểm tra", If(ddCreateResult.Selected.Value = "Không đạt", "Xử lý", "Hoàn thành"))
                              },
                              Collect(
                                colQCDemo,
                                {
                                  ID: GUID(),
                                  RunID: newRunId,
                                  ProductCode: Trim(txtCreateProductCode.Value),
                                  ProductName: Trim(txtCreateProductName.Value),
                                  Plant: ddCreatePlant.Selected.Value,
                                  Stage: ddCreateStage.Selected.Value,
                                  SampleCount: Value(txtCreateSampleCount.Value),
                                  Result: ddCreateResult.Selected.Value,
                                  Status: newStatus,
                                  CreatedAt: Now()
                                }
                              );
                              Notify("Đã tạo hồ sơ QC demo.", NotificationType.Success);
                              Set(varShowCreate, false);
                              Reset(txtCreateProductCode);
                              Reset(txtCreateProductName);
                              Reset(txtCreateSampleCount)
                            )
                          )
