                        Color: =RGBA(104, 122, 114, 1)
                        Font: =Font.'Segoe UI'
                        Height: =20
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =If(scrList.Width < 768, 9, 9.75)
                        Text: ="Tổng hồ sơ QC"
                        Width: =Parent.Width - If(scrList.Width < 768, 24, 88)
