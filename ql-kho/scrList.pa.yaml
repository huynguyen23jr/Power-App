                      Properties:
                        Color: =RGBA(104, 122, 114, 1)
                        Height: =20
                        Icon: =Icon.TrendingUpwards
                        OnSelect: =Select(btnNavReport)
                        Width: =20
                        X: =If(scrList.Width >= 1200, 26, 22)
                        Y: =155
                  - icoNavHistory:
                      Control: Classic/Icon
                      Properties:
                        Color: =RGBA(104, 122, 114, 1)
                        Height: =20
