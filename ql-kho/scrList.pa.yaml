                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  BorderColor: =RGBA(223, 231, 226, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =If(scrList.Width < 768, 56, 60)
                  Width: =scrList.Width - Self.X
                  X: =If(scrList.Width >= 1200, 230, If(scrList.Width >= 768, 64, 0))
                Children:
                  - lblAppTitle:
                      Control: Label
                      Properties:
                        Color: =RGBA(22, 51, 45, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
                        Size: =If(scrList.Width < 768, 12, 15)
                        Text: ="VHSX · QA thành phẩm"
                        Width: =Parent.Width - Self.X - 72
                        Wrap: =false
                        X: =If(scrList.Width < 768, 16, 24)
                        Y: =If(scrList.Width < 768, 10, 12)
                  - lblAvatar:
                      Control: Label
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(0, 107, 79, 1)
                        Fill: =RGBA(225, 241, 234, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =36
