                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =9.5
                        Text: ="HN"
                        Width: =36
                        X: =Parent.Width - 52
                        Y: =If(scrList.Width < 768, 10, 12)
