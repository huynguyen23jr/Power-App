Screens:
  scrNhapTuSanXuat:
    Properties:
      OnVisible: =varShowMenuUser && scrNhapTuSanXuat.Size <> 1
    Children:
      - con_MainNhapTuSanXuat:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_HeaderNhapTuSanXuat:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - cmp_HeaderNhapTuSanXuat:
                      Control: CanvasComponent
                      ComponentName: Header
                      Properties:
                        Height: =App.Height
                        IDRecord: =100
                        Width: =App.Width - Parent.PaddingLeft * 2 - 5
                        varSizeScreen: =scrNhapTuSanXuat.Size
            - con_BodyNhapTuSanXuat:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =If(!varShowMenuUser, DropShadow.None, DropShadow.Semibold)
                  FillPortions: =0
                  Height: =Parent.Height - con_HeaderNhapTuSanXuat.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =If(!varShowMenuUser, 0, 5)
                  PaddingBottom: =If(!varShowMenuUser, 0, 5)
                  PaddingLeft: =If(!varShowMenuUser, 0, 5)
                  PaddingRight: =If(!varShowMenuUser, 0, 5)
                  PaddingTop: =If(!varShowMenuUser, 0, 5)
                Children:
                  - con_MenuNhapTuSanXuat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        Visible: =scrNhapTuSanXuat.Size <> 1
                        Width: =If(varShowMenuUser, 240, 0)
                      Children:
                        - cmp_NavSidebarNhapTuSanXuat:
                            Control: CanvasComponent
                            ComponentName: NavSiderBar
                            Properties:
                              Height: =Parent.Height
                              SidebarWidth: =Parent.Width
                              Width: =Parent.Width
                  - con_ContentNhapTuSanXuat:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: |-
                          =If(
                              scrDanhMucBin.Size = 1,
                              DropShadow.Semibold,
                              DropShadow.None
                          )
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =5
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =If(!varShowMenuUser, 0, 5)
                        RadiusTopRight: =0
                      Children:
                        - con_ActionHeaderNhapTuSanXuat:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                            Children:
                              - btn_AddNhapTuSanXuat:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Add"
                                    OnSelect: |-
                                      =Set(
                                          varProductionReceiptDetail,
                                          {}
                                      );
                                      Reset(dp_ReceiptDate);
                                      Reset(cmb_Shift);
                                      Reset(cmb_ProductType);
                                      Navigate(
                                          scrNhapTuSanXuatForm,
                                          ScreenTransition.CoverRight
                                      )
                                    Size: =fxFontSizeMD
                                    Text: ="Thêm"
                                    Visible: |+
                                      =varUserInPlant.Role = Index(col_RoleUser,15).RoleCode || // SHIFT_LEADER  - Trưởng ca
                                      varUserInPlant.Role = Index(col_RoleUser,6).RoleCode  || // PROD_STAT     - Thống kê sản xuất
                                      varUserInPlant.Role = Index(col_RoleUser,12).RoleCode || // PROD_ASST     - Trợ lý sản xuất
                                      varUserInPlant.Role = Index(col_RoleUser,9).RoleCode     // VHSX_HO       - VHSX HO
                              - btn_RefreshNhapTuSanXuat:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="ArrowSync"
                                    OnSelect: |+
                                      =Refresh('QLK List Production Receipts');
                                      Refresh('QLK List Production Receipt Details');
                                    Size: =fxFontSizeMD
                                    Text: ="Làm mới"
                                    Width: =120
                        - lbl_TitleNhapTuSanXuat:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(45, 128, 40, 1)
                              Font: =fxFontFamily
                              FontWeight: =fxFontWeightSemiBold
                              Height: =40
                              PaddingLeft: =10
                              Size: =fxFontSizeXL
                              Text: ="Nhập từ sản xuất"
                        - con_FilterNhapTuSanXuat:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =42
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =5
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                            Children:
                              - txt_SearchNhapTuSanXuat:
                                  Control: ModernTextInput
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    FillPortions: =1
                                    Font: =fxFontFamily
                                    LayoutMinWidth: =16
                                    Placeholder: ="Tìm kiếm ...."
                              - DatePicker1:
                                  Control: ModernDatePicker
                                  Properties:
                                    DefaultDate: =Today()
                                    Format: =DatePickerFormat.Short
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Placeholder: ="Chọn ngày ..."
                                    Width: =140
                              - cbo_FilterProductTypeNhapTuSanXuat_2:
                                  Control: ModernCombobox
                                  Properties:
                                    DefaultSelectedItems: =LookUp(col_ProductCategories, ProductCategoryCode = varUserInPlant.ProductCategoryCode)
                                    FillPortions: =
                                    Font: =fxFontFamily
                                    FontWeight: =fxFontWeightNormal
                                    InputTextPlaceholder: ="Tất cả"
                                    IsSearchable: =false
                                    ItemDisplayText: =ThisItem.ProductCategoryNameVI
                                    Items: =col_ProductCategories
                                    SelectMultiple: =false
                                    Width: =140
                              - btn_FilterNhapTuSanXuat:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Outline
                                    BasePaletteColor: =RGBA(8, 222, 8, 1)
                                    Font: =fxFontFamily
                                    Icon: ="Filter"
                                    OnSelect: |-
                                      =UpdateContext({varPopUpFilterNhapTuSanXuat: true})
                                    Text: ="Bộ lọc"
                                    Visible: =false
                              - Button5:
                                  Control: ModernButton
                                  Properties:
                                    Appearance: =ButtonAppearance.Transparent
                                    Icon: ="Eraser"
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    OnSelect: |-
                                      =Reset(cbo_FilterProductTypeNhapTuSanXuat_2);
                                      Reset(txt_SearchNhapTuSanXuat);
                                      Reset(DatePicker1)
                                    Text: =
                                    Width: =30
                        - con_ListNhapTuSanXuat:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderStyle: =BorderStyle.None
                              DropShadow: =If(scrNhapTuSanXuat.Size = 1, DropShadow.None, DropShadow.Semibold)
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutOverflowX: =LayoutOverflow.Scroll
                              LayoutOverflowY: =LayoutOverflow.Scroll
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 0, 5)
                              RadiusTopRight: =6
                              Width: =Parent.Width - Parent.PaddingLeft * 2
                            Children:
                              - con_InnerNhapTuSanXuat:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Width: |-
                                      =If(
                                          scrNhapTuSanXuat.Size = 1,
                                          Parent.Width,
                                          Max(
                                              Parent.Width,
                                              1300
                                          )
                                      )
                                  Children:
                                    - con_TableHeaderNhapTuSanXuat:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(250, 250, 250, 1)
                                          FillPortions: =0
                                          Height: =46
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =5
                                          PaddingLeft: =10
                                          PaddingRight: =10
                                          Visible: =scrNhapTuSanXuat.Size <> 1
                                        Children:
                                          - lbl_HeaderReceiptCode:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Mã phiếu nhập"
                                                Width: =Parent.Width * 0.18
                                                Wrap: =false
                                          - lbl_HeaderReceiptDate:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ngày nhập"
                                                Width: =Parent.Width * 0.15
                                                Wrap: =false
                                          - lbl_HeaderStatusCode:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Trạng thái"
                                                Width: =Parent.Width * 0.18
                                                Wrap: =false
                                          - lbl_HeaderShift:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Ca"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_HeaderLoaiSanPhamNhap:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Loại sản phẩm"
                                                Width: =Parent.Width * 0.15
                                                Wrap: =false
                                          - lbl_HeaderTongNhap:
                                              Control: ModernText
                                              Properties:
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Tổng nhập"
                                                Width: =Parent.Width * 0.1
                                                Wrap: =false
                                          - lbl_HeaderActionNhapTuSanXuat:
                                              Control: ModernText
                                              Properties:
                                                FillPortions: =1
                                                Font: =fxFontFamily
                                                FontWeight: =fxFontWeightBold
                                                Size: =fxFontSizeMD
                                                Text: ="Thao tác"
                                                Width: =100
                                                Wrap: =false
                                    - gal_NhapTuSanXuat:
                                        Control: Gallery
                                        Variant: Vertical
                                        Properties:
                                          BorderStyle: =BorderStyle.None
                                          Height: =Parent.Height - con_TableHeaderNhapTuSanXuat.Height - lbl_TotalRowsNhapTuSanXuat.Height
                                          Items: |-
                                            =SortByColumns(
                                                    Filter(
                                                        'QLK List Production Receipts',
                                                        PlantCode = varUserInPlant.PlantCode,
                                                        IsBlank(txt_SearchNhapTuSanXuat.Text) || StartsWith(ReceiptCode, txt_SearchNhapTuSanXuat.Text),
                                                        IsBlank(DatePicker1.SelectedDate) ||  ReceiptDate >= DatePicker1.SelectedDate,
                                                        IsBlank(cbo_FilterProductTypeNhapTuSanXuat_2.Selected) || ProductCategoryCode = cbo_FilterProductTypeNhapTuSanXuat_2.Selected.ProductCategoryCode
                                                    ),
                                                    "Created",
                                                    SortOrder.Descending
                                                )
                                          ShowScrollbar: =false
                                          TemplateSize: |-
                                            =If(
                                                scrNhapTuSanXuat.Size = 1,
                                                lbl_ReceiptCode.Height * 7.5,
                                                45
                                            )
                                          Width: =Parent.Width
                                        Children:
                                          - con_RowDividerNhapTuSanXuat:
                                              Control: GroupContainer
                                              Variant: ManualLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =RGBA(229, 231, 235, 1)
                                                Height: =1
                                                Visible: =scrNhapTuSanXuat.Size <> 1
                                                Width: =Parent.Width - 10
                                                Y: =gal_NhapTuSanXuat.TemplateHeight
                                          - con_RowMasterNhapTuSanXuat:
                                              Control: GroupContainer
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =If(scrNhapTuSanXuat.Size = 1, DropShadow.Light, DropShadow.None)
                                                Height: =gal_NhapTuSanXuat.TemplateHeight
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: |-
                                                  =If(
                                                      scrNhapTuSanXuat.Size = 1,
                                                      LayoutDirection.Vertical,
                                                      LayoutDirection.Horizontal
                                                  )
                                                LayoutGap: =If(scrNhapTuSanXuat.Size = 1, 5, 0)
                                                RadiusTopLeft: =If(scrNhapTuSanXuat.Size = 1, 4, 0)
                                                Width: =Parent.Width - 10
                                              Children:
                                                - con_RowNhapTuSanXuat:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      BorderColor: =RGBA(229, 231, 235, 1)
                                                      DropShadow: =DropShadow.None
                                                      Fill: =RGBA(255, 255, 255, 1)
                                                      FillPortions: =0
                                                      Height: |-
                                                        =If(
                                                            scrNhapTuSanXuat.Size = 1,
                                                            gal_NhapTuSanXuat.TemplateHeight - con_MobileActionNhapTuSanXuat.Height - 5,
                                                            48
                                                        )
                                                      LayoutAlignItems: =If(scrNhapTuSanXuat.Size = 1, LayoutAlignItems.Start, LayoutAlignItems.Center)
                                                      LayoutDirection: =If(scrNhapTuSanXuat.Size = 1, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                                                      LayoutGap: =If(scrNhapTuSanXuat.Size = 1, 4, 5)
                                                      LayoutMinHeight: =10
                                                      PaddingLeft: =If(scrNhapTuSanXuat.Size = 1, 10, 5)
                                                      PaddingRight: =If(scrNhapTuSanXuat.Size = 1, 10, 5)
                                                      PaddingTop: =If(scrNhapTuSanXuat.Size = 1, 10, 5)
                                                      Width: |-
                                                        =If(
                                                            scrNhapTuSanXuat.Size = 1,
                                                            Parent.Width / 1.2,
                                                            Parent.Width - Parent.PaddingRight * 2 - Parent.LayoutGap - 10
                                                        )
                                                    Children:
                                                      - lbl_ReceiptCode:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            FontWeight: =fxFontWeightSemiBold
                                                            Height: =30
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =If(
                                                                  scrNhapTuSanXuat.Size = 1,
                                                                  "Mã phiếu nhập : " & ThisItem.ReceiptCode,
                                                                  ThisItem.ReceiptCode
                                                              )
                                                            Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderReceiptCode.Width)
                                                            Wrap: =false
                                                      - lbl_ReceiptDate:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =30
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =If(
                                                                  scrNhapTuSanXuat.Size = 1,
                                                                  "Mã phiếu nhập : " & Text(ThisItem.ReceiptDate, "dd/mm/yyyy"),
                                                                  Text(ThisItem.ReceiptDate, "dd/mm/yyyy")
                                                              )
                                                            Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderReceiptDate.Width)
                                                            Wrap: =false
                                                      - lbl_StatusCode:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =30
                                                            Size: =fxFontSizeMD
                                                            Text: |
                                                              =With(
                                                                  {
                                                                      statusItem: LookUp(
                                                                          col_WorkflowStatus,
                                                                          StatusCode = ThisItem.StatusCode
                                                                      )
                                                                  },
                                                                  If(
                                                                      scrNhapTuSanXuat.Size = 1,
                                                                      "Trạng thái : ",
                                                                      ""
                                                                  ) &
                                                                  Coalesce(
                                                                      If(
                                                                          _defaultLanguage.Code = "EN",
                                                                          statusItem.StatusNameEN,
                                                                          statusItem.StatusNameVI
                                                                      ),
                                                                      ThisItem.StatusCode
                                                                  )
                                                              )
                                                            Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderStatusCode.Width)
                                                            Wrap: =false
                                                      - lbl_Shift:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =30
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =If(
                                                                  scrNhapTuSanXuat.Size = 1,
                                                                  "Ca : " & ThisItem.Shift,
                                                                  ThisItem.Shift
                                                              )
                                                            Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderShift.Width)
                                                            Wrap: =false
                                                      - lbl_LoaiSanPhamNhap_Row:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =30
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =With(
                                                                  {_cat: LookUp(col_ProductCategories, ProductCategoryCode = ThisItem.ProductCategoryCode)},
                                                                  If(
                                                                      scrNhapTuSanXuat.Size = 1,
                                                                      "Loại sản phẩm: " & _cat.ProductCategoryNameVI,
                                                                      _cat.ProductCategoryNameVI
                                                                  )
                                                              )
                                                            Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderLoaiSanPhamNhap.Width)
                                                            Wrap: =false
                                                      - lbl_TongNhap:
                                                          Control: ModernText
                                                          Properties:
                                                            Font: =fxFontFamily
                                                            Height: =30
                                                            Size: =fxFontSizeMD
                                                            Text: |-
                                                              =If(
                                                                  scrNhapTuSanXuat.Size = 1,
                                                                  "Tổng nhập: " & Text(Coalesce(ThisItem.TotalReceipt,0), "[$-vi-VN]#.##0##"),
                                                                  Text(Coalesce(ThisItem.TotalReceipt,0), "[$-vi-VN]#.##0##")
                                                              )
                                                            Width: =If(scrNhapTuSanXuat.Size = 1, Parent.Width - 20, lbl_HeaderTongNhap.Width)
                                                            Wrap: =false
                                                      - con_ActionNhapTuSanXuat:
                                                          Control: GroupContainer
                                                          Variant: AutoLayout
                                                          Properties:
                                                            DropShadow: =DropShadow.None
                                                            FillPortions: =0
                                                            Height: =32
                                                            LayoutAlignItems: =LayoutAlignItems.Center
                                                            LayoutDirection: =LayoutDirection.Horizontal
                                                            LayoutMinHeight: =Parent.Height -10
                                                            Visible: =scrNhapTuSanXuat.Size <> 1
                                                            Width: =100
                                                          Children:
                                                            - btn_ViewNhapTuSanXuat:
                                                                Control: ModernButton
                                                                Properties:
                                                                  Appearance: =ButtonAppearance.Transparent
                                                                  Icon: ="Eye"
                                                                  Layout: =ButtonLayout.IconOnly
                                                                  OnSelect: |
                                                                    =// Lưu phiếu được chọn
                                                                    Set(varProductionReceiptDetail, ThisItem);


                                                                    // Chuyển sang màn hình form chi tiết phiếu nhập
                                                                    Navigate(scrNhapTuSanXuatForm, ScreenTransition.CoverRight)
                                                                  Width: =32
                                                            - btn_DeleteNhapTuSanXuat:
                                                                Control: ModernButton
                                                                Properties:
                                                                  Appearance: =ButtonAppearance.Transparent
                                                                  Icon: ="Delete"
                                                                  Layout: =ButtonLayout.IconOnly
                                                                  OnSelect: |-
                                                                    =If(
                                                                        Confirm(
                                                                            "Bạn có chắc muốn xóa bản ghi này không?",
                                                                            {
                                                                                Title: "Xác nhận xóa",
                                                                                Subtitle: "Hành động này không thể hoàn tác.",
                                                                                ConfirmButton: "Xóa",
                                                                                CancelButton: "Hủy"
                                                                            }
                                                                        ),
                                                                        UpdateContext({varShowPopupProcessing:true});
                                                                        IfError(
                                                                            Clear(col_DetailToDelete);
                                                                            ClearCollect(
                                                                                col_DetailToDelete,
                                                                                Filter(
                                                                                    'QLK List Production Receipt Details',
                                                                                    ReceiptID = ThisItem.ID
                                                                                )
                                                                            );
                                                                            Remove('QLK List Production Receipt Details', col_DetailToDelete);
                                                                            Remove('QLK List Production Receipts', ThisItem);
                                                                            ,
                                                                            UpdateContext({varShowPopupProcessing:false});
                                                                            Notify("Xóa không thành công", NotificationType.Error,2000);
                                                                            ,
                                                                            UpdateContext({varShowPopupProcessing:false});
                                                                            Notify("Xóa thành công", NotificationType.Success,2000)
                                                                        )
                                                                    )
                                                                  Visible: |-
                                                                    =ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode &&
                                                                    //ThisItem.'Created By'.Email = varCurrentUser.G_Email         &&
                                                                    (varUserInPlant.Role = Index(col_RoleUser,15).RoleCode       || // SHIFT_LEADER  - Trưởng ca
                                                                    varUserInPlant.Role = Index(col_RoleUser,6).RoleCode         || // PROD_STAT     - Thống kê sản xuất
                                                                    varUserInPlant.Role = Index(col_RoleUser,12).RoleCode        || // PROD_ASST     - Trợ lý sản xuất
                                                                    varUserInPlant.Role = Index(col_RoleUser,9).RoleCode)            // VHSX_HO       - VHSX HO
                                                                  Width: =32
                                                - con_MobileActionNhapTuSanXuat:
                                                    Control: GroupContainer
                                                    Variant: AutoLayout
                                                    Properties:
                                                      DropShadow: =DropShadow.None
                                                      FillPortions: =0
                                                      Height: =40
                                                      LayoutAlignItems: =LayoutAlignItems.Center
                                                      LayoutDirection: =LayoutDirection.Horizontal
                                                      LayoutGap: =5
                                                      PaddingLeft: =5
                                                      Visible: =scrNhapTuSanXuat.Size = 1
                                                      Width: =Parent.Width - con_RowNhapTuSanXuat.Width - 5
                                                    Children:
                                                      - btn_MobileOpenNhapTuSanXuat:
                                                          Control: ModernButton
                                                          Properties:
                                                            Icon: ="Eye"
                                                            OnSelect: |
                                                              =// Lưu phiếu được chọn
                                                              Set(varProductionReceiptDetail, ThisItem);


                                                              // Chuyển sang màn hình form chi tiết phiếu nhập
                                                              Navigate(scrNhapTuSanXuatForm, ScreenTransition.CoverRight)
                                                            Text: ="Xem chi tiết"
                                                            Width: |-
                                                              =If(ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode,Parent.Width/2 - 10,Parent.Width - 10
                                                              )
                                                      - btn_DeleteNhapTuSanXuat_1:
                                                          Control: ModernButton
                                                          Properties:
                                                            Appearance: =ButtonAppearance.Outline
                                                            Icon: ="Delete"
                                                            OnSelect: |-
                                                              =If(
                                                                  Confirm(
                                                                      "Bạn có chắc muốn xóa bản ghi này không?",
                                                                      {
                                                                          Title: "Xác nhận xóa",
                                                                          Subtitle: "Hành động này không thể hoàn tác.",
                                                                          ConfirmButton: "Xóa",
                                                                          CancelButton: "Hủy"
                                                                      }
                                                                  ),
                                                                  UpdateContext({varShowPopupProcessing:true});
                                                                  IfError(
                                                                      Clear(col_DetailToDelete);
                                                                      ClearCollect(
                                                                          col_DetailToDelete,
                                                                          Filter(
                                                                              'QLK List Production Receipt Details',
                                                                              ReceiptID = ThisItem.ID
                                                                          )
                                                                      );
                                                                      Remove('QLK List Production Receipt Details', col_DetailToDelete);
                                                                      Remove('QLK List Production Receipts', ThisItem);
                                                                      ,
                                                                      UpdateContext({varShowPopupProcessing:false});
                                                                      Notify("Xóa không thành công", NotificationType.Error,2000);
                                                                      ,
                                                                      UpdateContext({varShowPopupProcessing:false});
                                                                      Notify("Xóa thành công", NotificationType.Success,2000)
                                                                  )
                                                              )
                                                            Text: ="Xóa"
                                                            Visible: |-
                                                              =ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode &&
                                                              //ThisItem.'Created By'.Email = varCurrentUser.G_Email         &&
                                                              (varUserInPlant.Role = Index(col_RoleUser,15).RoleCode       || // SHIFT_LEADER  - Trưởng ca
                                                              varUserInPlant.Role = Index(col_RoleUser,6).RoleCode         || // PROD_STAT     - Thống kê sản xuất
                                                              varUserInPlant.Role = Index(col_RoleUser,12).RoleCode        || // PROD_ASST     - Trợ lý sản xuất
                                                              varUserInPlant.Role = Index(col_RoleUser,9).RoleCode)            // VHSX_HO       - VHSX HO
                                                            Width: =If(ThisItem.StatusCode = Index(col_WorkflowStatus,1).StatusCode,Parent.Width/2 - 10,Parent.Width - 10)
                                    - lbl_TotalRowsNhapTuSanXuat:
                                        Control: ModernText
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Font: =fxFontFamily
                                          FontWeight: =fxFontWeightBold
                                          Size: =fxFontSizeMD
                                          Text: ="Hiển thị " & CountRows(gal_NhapTuSanXuat.AllItems) & " dòng"
